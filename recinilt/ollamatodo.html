<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern To-Do List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4a6cf7, #6a79f6);
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        .header h1 {
            font-weight: 600;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
        }
        
        .input-area {
            padding: 20px;
            display: flex;
            border-bottom: 1px solid #eee;
        }
        
        .input-area input {
            flex: 1;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px 0 0 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .input-area input:focus {
            border-color: #6a79f6;
        }
        
        .input-area button {
            background: #6a79f6;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: background 0.3s;
        }
        
        .input-area button:hover {
            background: #5a68d8;
        }
        
        .filters {
            display: flex;
            justify-content: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .filters button {
            background: none;
            border: none;
            padding: 8px 15px;
            margin: 0 5px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .filters button.active {
            background: #6a79f6;
            color: white;
        }
        
        .tasks {
            padding: 0 20px 20px 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .task {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
            animation: fadeIn 0.4s;
        }
        
        .task:last-child {
            border-bottom: none;
        }
        
        .task input[type="checkbox"] {
            margin-right: 15px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .task-text {
            flex: 1;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .completed .task-text {
            text-decoration: line-through;
            color: #a0a0a0;
        }
        
        .task-actions {
            display: flex;
            gap: 10px;
        }
        
        .task-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #a0a0a0;
            transition: color 0.3s;
        }
        
        .task-actions button.edit:hover {
            color: #4a6cf7;
        }
        
        .task-actions button.delete:hover {
            color: #ff5c5c;
        }
        
        .empty-state {
            text-align: center;
            padding: 30px 0;
            color: #a0a0a0;
        }
        
        .empty-state i {
            font-size: 50px;
            margin-bottom: 15px;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(10px);
            }
        }
        
        .footer {
            padding: 15px 20px;
            text-align: center;
            color: #a0a0a0;
            font-size: 14px;
            border-top: 1px solid #eee;
        }
        
        @media (max-width: 500px) {
            .container {
                border-radius: 12px;
            }
            .header {
                padding: 20px;
            }
            .input-area {
                flex-direction: column;
            }
            .input-area input {
                border-radius: 8px;
                margin-bottom: 10px;
            }
            .input-area button {
                border-radius: 8px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-tasks"></i> Yapılacaklar Listesi</h1>
            <p>Görevlerinizi ekleyin ve yönetin</p>
        </div>

        <div class="input-area">
            <input type="text" id="taskInput" placeholder="Yeni görev ekle...">
            <button id="addTaskBtn"><i class="fas fa-plus"></i> Ekle</button>
        </div>

        <div class="filters">
            <button class="active" data-filter="all">Tümü</button>
            <button data-filter="active">Aktif</button>
            <button data-filter="completed">Tamamlanan</button>
        </div>

        <div class="tasks" id="tasksContainer">
            <!-- Görevler buraya dinamik olarak eklenecek -->
            <div class="empty-state" id="emptyState">
                <i class="fas fa-clipboard-list"></i>
                <p>Henüz görev eklenmemiş</p>
            </div>
        </div>

        <div class="footer">
            <p>Toplam: <span id="totalTasks">0</span> görev - Tamamlanan: <span id="completedTasks">0</span> görev</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const taskInput = document.getElementById('taskInput');
            const addTaskBtn = document.getElementById('addTaskBtn');
            const tasksContainer = document.getElementById('tasksContainer');
            const emptyState = document.getElementById('emptyState');
            const totalTasksSpan = document.getElementById('totalTasks');
            const completedTasksSpan = document.getElementById('completedTasks');
            const filterButtons = document.querySelectorAll('.filters button');

            let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
            let currentFilter = 'all';

            // Sayfa yüklendiğinde görevleri göster
            renderTasks();
            updateTaskCount();

            // Görev ekleme işlevi
            addTaskBtn.addEventListener('click', addTask);
            taskInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addTask();
                }
            });

            // Filtre butonlarına tıklama
            filterButtons.forEach(button => {
                button.addEventListener('click', function() {
                    // Aktif sınıfını güncelle
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');

                    // Filtreyi uygula
                    currentFilter = this.getAttribute('data-filter');
                    renderTasks();
                });
            });

            function addTask() {
                const taskText = taskInput.value.trim();
                if (taskText === '') return;

                const newTask = {
                    id: Date.now(),
                    text: taskText,
                    completed: false,
                    timestamp: new Date().toISOString()
                };

                tasks.push(newTask);
                saveTasks();
                renderTasks();
                updateTaskCount();

                // Input'u temizle ve odakla
                taskInput.value = '';
                taskInput.focus();
            }

            function renderTasks() {
                // Filtrelenmiş görevleri al
                let filteredTasks = tasks;
                if (currentFilter === 'active') {
                    filteredTasks = tasks.filter(task => !task.completed);
                } else if (currentFilter === 'completed') {
                    filteredTasks = tasks.filter(task => task.completed);
                }

                // Görevleri temizle
                tasksContainer.innerHTML = '';

                // Boş durumu göster veya gizle
                if (filteredTasks.length === 0) {
                    tasksContainer.appendChild(emptyState);
                    emptyState.style.display = 'block';
                } else {
                    emptyState.style.display = 'none';

                    // Her görevi ekrana ekle
                    filteredTasks.forEach(task => {
                        const taskElement = document.createElement('div');
                        taskElement.className = `task ${task.completed ? 'completed' : ''}`;
                        taskElement.setAttribute('data-id', task.id);

                        taskElement.innerHTML = `
                            <input type="checkbox" ${task.completed ? 'checked' : ''}>
                            <span class="task-text">${task.text}</span>
                            <div class="task-actions">
                                <button class="edit"><i class="fas fa-edit"></i></button>
                                <button class="delete"><i class="fas fa-trash"></i></button>
                            </div>
                        `;

                        tasksContainer.appendChild(taskElement);

                        // Checkbox değişikliği
                        const checkbox = taskElement.querySelector('input[type="checkbox"]');
                        checkbox.addEventListener('change', function() {
                            toggleTaskCompleted(task.id);
                        });

                        // Düzenle butonu
                        const editBtn = taskElement.querySelector('.edit');
                        editBtn.addEventListener('click', function() {
                            editTask(task.id);
                        });

                        // Sil butonu
                        const deleteBtn = taskElement.querySelector('.delete');
                        deleteBtn.addEventListener('click', function() {
                            deleteTask(task.id);
                        });
                    });
                }
            }

            function toggleTaskCompleted(id) {
                tasks = tasks.map(task => {
                    if (task.id === id) {
                        return {...task,
                            completed: !task.completed
                        };
                    }
                    return task;
                });

                saveTasks();
                renderTasks();
                updateTaskCount();
            }

            function editTask(id) {
                const task = tasks.find(task => task.id === id);
                const newText = prompt('Görevi düzenle:', task.text);

                if (newText !== null && newText.trim() !== '') {
                    tasks = tasks.map(task => {
                        if (task.id === id) {
                            return {...task,
                                text: newText.trim()
                            };
                        }
                        return task;
                    });

                    saveTasks();
                    renderTasks();
                }
            }

            function deleteTask(id) {
                if (confirm('Bu görevi silmek istediğinize emin misiniz?')) {
                    tasks = tasks.filter(task => task.id !== id);
                    saveTasks();
                    renderTasks();
                    updateTaskCount();
                }
            }

            function saveTasks() {
                localStorage.setItem('tasks', JSON.stringify(tasks));
            }

            function updateTaskCount() {
                totalTasksSpan.textContent = tasks.length;
                const completedCount = tasks.filter(task => task.completed).length;
                completedTasksSpan.textContent = completedCount;
            }
        });
    </script>
</body>

</html>
