<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hayat Simülasyonu - Kader ve İrade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.8em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
            line-height: 1.6;
        }

        .setup-screen, .game-screen {
            display: none;
        }

        .setup-screen.active, .game-screen.active {
            display: block;
        }

        .selection-box {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            border: 2px solid #dee2e6;
        }

        .selection-box h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .destiny-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
        }

        .option-card {
            background: white;
            border: 3px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .option-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .option-card.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8efff 100%);
            transform: scale(1.05);
        }

        .option-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .option-card p {
            color: #666;
            font-size: 0.9em;
            line-height: 1.5;
        }

        .option-card .emoji {
            font-size: 2.5em;
            margin-bottom: 10px;
            display: block;
        }

        .start-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 60px;
            font-size: 1.3em;
            border-radius: 30px;
            cursor: pointer;
            display: block;
            margin: 30px auto;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .start-btn:hover:not(:disabled) {
            transform: scale(1.08);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.5);
        }

        .start-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Timeline Özellikleri */
        .journey-timeline {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border: 3px solid #2196f3;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .timeline-title {
            font-size: 1.5em;
            color: #1565c0;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .timeline-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .timeline-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            border: 2px solid #e0e0e0;
        }

        .timeline-card.user-card {
            border-color: #ff9800;
            background: linear-gradient(135deg, #fff8f0 0%, #ffe8d5 100%);
        }

        .timeline-card-header {
            font-weight: bold;
            color: #667eea;
            font-size: 1.2em;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e0e0e0;
        }

        .timeline-card.user-card .timeline-card-header {
            color: #ff9800;
        }

        .timeline-item {
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .timeline-item:last-child {
            border-bottom: none;
        }

        .timeline-label {
            font-weight: 600;
            color: #555;
            font-size: 0.9em;
        }

        .timeline-value {
            color: #333;
            font-size: 0.95em;
            margin-top: 3px;
        }

        .timeline-score {
            background: #4caf50;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
        }

        .choice-panel {
            background: linear-gradient(135deg, #fff 0%, #f8f9fa 100%);
            border: 3px solid #667eea;
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .choice-panel h2 {
            color: #667eea;
            margin-bottom: 25px;
            font-size: 2em;
            text-align: center;
        }

        .choice-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .choice-btn {
            background: white;
            border: 3px solid #e0e0e0;
            padding: 18px 25px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.05em;
            font-weight: 600;
            color: #333;
        }

        .choice-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: translateY(-3px);
        }

        .choice-btn.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .parameter-group {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .parameter-label {
            font-size: 1.2em;
            color: #333;
            font-weight: 600;
            margin-bottom: 15px;
            display: block;
        }

        .info-text {
            text-align: center;
            font-size: 1.2em;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 10px;
            margin: 20px 0;
            color: #2e7d32;
        }

        .destiny-indicator {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.8em;
            margin-left: 8px;
            font-weight: bold;
        }

        .destiny-indicator.kader {
            background: #ff9800;
            color: white;
        }

        .destiny-indicator.irade {
            background: #4caf50;
            color: white;
        }

        .final-results {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 15px;
            padding: 40px;
            margin-top: 30px;
        }

        .final-results h2 {
            color: #667eea;
            font-size: 2.5em;
            text-align: center;
            margin-bottom: 40px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }

        .result-card {
            background: white;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s ease;
            scroll-margin-top: 20px;
        }

        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        }

        .result-card.user-result {
            border-color: #ff9800;
            background: linear-gradient(135deg, #fff8f0 0%, #ffe8d5 100%);
        }

        .result-character {
            font-size: 1.6em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }

        .user-result .result-character {
            color: #ff9800;
        }

        .result-section {
            margin-bottom: 20px;
        }

        .result-section-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .result-item {
            padding: 8px 0;
            color: #666;
            line-height: 1.6;
        }

        .result-highlight {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
        }

        .restart-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.2em;
            border-radius: 30px;
            cursor: pointer;
            display: block;
            margin: 40px auto 0;
            transition: all 0.3s ease;
        }

        .restart-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.5);
        }

        /* Mobil Uyumluluk */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.8em;
            }

            .subtitle {
                font-size: 0.95em;
            }

            .character-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .destiny-grid {
                grid-template-columns: 1fr;
            }

            .timeline-grid {
                grid-template-columns: 1fr;
            }

            .choice-options {
                grid-template-columns: 1fr;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 Hayat Simülasyonu: Kader ve İrade</h1>
        <p class="subtitle">
            8 kişinin hayat yolculuğunu keşfedin. İki kritik irade noktasında kararlar verin.<br>
            Hayat bazen sizin kontrolünüzde, bazen kaderin elinde...
        </p>

        <!-- Kurulum Ekranı -->
        <div class="setup-screen active">
            <div class="selection-box">
                <h2>👤 Karakterinizi Seçin</h2>
                <div class="character-grid" id="characterGrid"></div>
            </div>

            <div class="selection-box">
                <h2>🎲 Kader Tipinizi Seçin</h2>
                <div class="destiny-grid" id="destinyGrid"></div>
            </div>

            <button class="start-btn" id="startBtn" disabled>🚀 Simülasyonu Başlat</button>
        </div>

        <!-- Oyun Ekranı -->
        <div class="game-screen">
            <div id="timelineDisplay"></div>
            <div id="choicePanel"></div>
            <div id="finalResults"></div>
        </div>
    </div>

    <script>
        // === TEMEL VERİLER ===
        const characters = ['Ahmet', 'Zeynep', 'Mehmet', 'Ayşe', 'Mustafa', 'Fatma', 'Ali', 'Elif'];
        const professions = ['Kronik Hasta', 'Hırsız', 'Çöpçü', 'Manav', 'Polis', 'Müzisyen', 'Mühendis', 'Doktor'];
        
        const destinyTypes = {
            1: { 
                name: 'Kader → İrade', 
                desc: 'Bölüm 1: Kader, Bölüm 2: İrade',
                icon: '🎯',
                part1: false,
                part2: true
            },
            2: { 
                name: 'İrade → Kader', 
                desc: 'Bölüm 1: İrade, Bölüm 2: Kader',
                icon: '🔄',
                part1: true,
                part2: false
            },
            3: { 
                name: 'Tam Özgürlük', 
                desc: 'Her iki bölümde de İrade',
                icon: '🦅',
                part1: true,
                part2: true
            },
            4: { 
                name: 'Tam Kader', 
                desc: 'Her iki bölümde de Kader',
                icon: '⚡',
                part1: false,
                part2: false
            }
        };

        // === OYUN DEĞİŞKENLERİ ===
        let selectedCharacter = null;
        let selectedDestiny = null;
        let gameData = {};

        // === KURULUM ===
        const characterEmojis = ['👨', '👩', '👨‍💼', '👩‍💼', '👨‍🎓', '👩‍🎓', '👨‍🏫', '👩‍🏫'];
        
        characters.forEach((char, idx) => {
            const card = document.createElement('div');
            card.className = 'option-card';
            card.innerHTML = `
                <span class="emoji">${characterEmojis[idx]}</span>
                <h3>${char}</h3>
            `;
            card.onclick = () => selectCharacter(char);
            document.getElementById('characterGrid').appendChild(card);
        });

        Object.keys(destinyTypes).forEach(type => {
            const dt = destinyTypes[type];
            const card = document.createElement('div');
            card.className = 'option-card';
            card.innerHTML = `
                <span class="emoji">${dt.icon}</span>
                <h3>${dt.name}</h3>
                <p>${dt.desc}</p>
            `;
            card.onclick = () => selectDestiny(type);
            document.getElementById('destinyGrid').appendChild(card);
        });

        function selectCharacter(char) {
            selectedCharacter = char;
            document.querySelectorAll('#characterGrid .option-card').forEach(card => {
                card.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');
            checkStart();
        }

        function selectDestiny(type) {
            selectedDestiny = parseInt(type);
            document.querySelectorAll('#destinyGrid .option-card').forEach(card => {
                card.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');
            checkStart();
        }

        function checkStart() {
            document.getElementById('startBtn').disabled = !(selectedCharacter && selectedDestiny);
        }

        document.getElementById('startBtn').onclick = startGame;

        // === OYUN BAŞLATMA ===
        function startGame() {
            characters.forEach(char => {
                let destinyType;
                if (char === selectedCharacter) {
                    destinyType = selectedDestiny;
                } else {
                    destinyType = Math.floor(Math.random() * 4) + 1;
                }
                
                gameData[char] = {
                    destinyType: destinyType,
                    isUser: char === selectedCharacter,
                    score: 0,
                    birth: {},
                    childhood: {},
                    will1: {},
                    education: {},
                    educationLevel: '',
                    will2: {},
                    career: {},
                    family: {},
                    profession: '',
                    marriageStatus: '',
                    childrenCount: 0,
                    happiness: '',
                    luxuryAccess: ''
                };
            });

            document.querySelector('.setup-screen').classList.remove('active');
            document.querySelector('.game-screen').classList.add('active');

            startPhase1();
        }

        // === TIMELINE GÖSTERME ===
        function showTimeline(title, showOnlyUser = false) {
            let timelineHtml = '';
            
            if (showOnlyUser) {
                // Sadece kullanıcının kartını göster
                const userData = gameData[selectedCharacter];
                timelineHtml = `
                    <div class="journey-timeline">
                        <div class="timeline-title">${title}</div>
                        <div class="timeline-grid" style="grid-template-columns: 1fr; max-width: 600px; margin: 0 auto;">
                            <div class="timeline-card user-card">
                                <div class="timeline-card-header">
                                    ⭐ ${selectedCharacter}
                                    <br><small>${destinyTypes[userData.destinyType].icon} ${destinyTypes[userData.destinyType].name}</small>
                                </div>
                                ${getTimelineContent(selectedCharacter)}
                                <div class="timeline-score">Skor: ${userData.score}</div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                // Tüm kartları göster
                timelineHtml = `
                    <div class="journey-timeline">
                        <div class="timeline-title">${title}</div>
                        <div class="timeline-grid">
                            ${characters.map(char => {
                                const data = gameData[char];
                                return `
                                    <div class="timeline-card ${data.isUser ? 'user-card' : ''}">
                                        <div class="timeline-card-header">
                                            ${data.isUser ? '⭐ ' : ''}${char}
                                            <br><small>${destinyTypes[data.destinyType].icon} ${destinyTypes[data.destinyType].name}</small>
                                        </div>
                                        ${getTimelineContent(char)}
                                        <div class="timeline-score">Skor: ${data.score}</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }
            
            document.getElementById('timelineDisplay').innerHTML = timelineHtml;
            
            // Smooth scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function getTimelineContent(char) {
            const data = gameData[char];
            let html = '';
            
            // Doğum
            if (Object.keys(data.birth).length > 0) {
                html += '<div class="timeline-item"><div class="timeline-label">📍 Doğum</div><div class="timeline-value">';
                html += Object.entries(data.birth).slice(0, 3).map(([k, v]) => `${v}`).join(', ');
                html += '</div></div>';
            }
            
            // Çocukluk
            if (Object.keys(data.childhood).length > 0) {
                html += '<div class="timeline-item"><div class="timeline-label">👶 Çocukluk</div><div class="timeline-value">';
                html += Object.entries(data.childhood).slice(0, 2).map(([k, v]) => `${v}`).join(', ');
                html += '</div></div>';
            }
            
            // İrade 1
            if (Object.keys(data.will1).length > 0) {
                html += '<div class="timeline-item"><div class="timeline-label">✋ İrade Noktası 1</div><div class="timeline-value">';
                html += Object.entries(data.will1).slice(0, 2).map(([k, v]) => `${v}`).join(', ');
                html += '</div></div>';
            }
            
            // Eğitim
            if (data.educationLevel) {
                html += '<div class="timeline-item"><div class="timeline-label">🎓 Eğitim</div><div class="timeline-value">';
                html += data.educationLevel;
                html += '</div></div>';
            }
            
            // İrade 2
            if (Object.keys(data.will2).length > 0) {
                html += '<div class="timeline-item"><div class="timeline-label">✋ İrade Noktası 2</div><div class="timeline-value">';
                html += Object.entries(data.will2).slice(0, 2).map(([k, v]) => `${v}`).join(', ');
                html += '</div></div>';
            }
            
            return html;
        }

        // === BÖLÜM 1: EĞİTİM DÖNEMİ ===
        function startPhase1() {
            // 1. Doğum
            characters.forEach(char => {
                processBirth(char);
            });

            setTimeout(() => {
                // 2. Çocukluk
                characters.forEach(char => {
                    processChildhood(char);
                });

                setTimeout(() => {
                    // 3. İrade Noktası 1
                    processWillPoint1();
                }, 1000);
            }, 1000);
        }

        function processBirth(char) {
            const data = gameData[char];
            const rand = Math.random;
            
            data.birth = {
                'Aile Durumu': rand() < 0.15 ? 'Zengin Aile' : (rand() < 0.5 ? 'Orta Halli Aile' : 'Fakir Aile'),
                'IQ Seviyesi': rand() < 0.2 ? 'Yüksek IQ' : (rand() < 0.6 ? 'Orta IQ' : 'Düşük IQ'),
                'Kardeş Sayısı': rand() < 0.2 ? 'Tek Çocuk' : (rand() < 0.5 ? '1 Kardeş' : (rand() < 0.8 ? '2 Kardeş' : '3+ Kardeş')),
                'Sağlık Durumu': rand() < 0.15 ? 'Zayıf Sağlık' : (rand() < 0.8 ? 'Normal Sağlık' : 'Güçlü Sağlık'),
                'Anne-Baba Eğitimi': rand() < 0.25 ? 'Üniversite Mezunu' : (rand() < 0.6 ? 'Lise Mezunu' : 'İlkokul Mezunu')
            };
            
            if (data.birth['Kardeş Sayısı'] !== 'Tek Çocuk') {
                data.birth['Doğum Sırası'] = rand() < 0.4 ? 'İlk Çocuk' : (rand() < 0.7 ? 'Ortanca Çocuk' : 'En Küçük Çocuk');
            }
            
            calculateScore(char, 'birth');
        }

        function processChildhood(char) {
            const data = gameData[char];
            const score = data.score;
            const rand = Math.random;
            
            data.childhood = {
                'Aile İlgisi': score > 60 ? (rand() < 0.6 ? 'Yüksek İlgi' : 'Normal İlgi') : (rand() < 0.4 ? 'Az İlgi' : 'Normal İlgi'),
                'Kişilik': score > 70 ? ['Normal', 'Sosyal', 'Hiperaktif'][Math.floor(rand() * 3)] : ['Utangaç', 'Normal', 'Sosyal'][Math.floor(rand() * 3)],
                'Oyun Türü': ['Bireysel', 'Grup Oyunları', 'Spor', 'Sanat'][Math.floor(rand() * 4)],
                'Beslenme': score > 50 ? (rand() < 0.6 ? 'İyi' : 'Normal') : (rand() < 0.5 ? 'Kötü' : 'Normal'),
                'Okuma Alışkanlığı': score > 65 ? (rand() < 0.5 ? 'Çok Okur' : 'Az Okur') : (rand() < 0.3 ? 'Çok Okur' : 'Hiç Okumaz')
            };
            
            calculateScore(char, 'childhood');
        }

        function processWillPoint1() {
            const data = gameData[selectedCharacter];
            const canChoose = destinyTypes[data.destinyType].part1;
            
            if (canChoose) {
                // Kullanıcı seçim yapacak - sadece kendi kartını göster
                showTimeline('📍 Bölüm 1: Eğitim Dönemi - Sizin Durumunuz', true);
                setTimeout(() => showWillPoint1Choice(), 500);
            } else {
                // Kader - tüm kartları göster
                showTimeline('📍 Bölüm 1: Eğitim Dönemi', false);
                characters.forEach(char => {
                    processWill1Auto(char);
                });
                setTimeout(() => continueToEducation(), 1500);
            }
        }

        function showWillPoint1Choice() {
            const panel = document.getElementById('choicePanel');
            panel.innerHTML = `
                <div class="choice-panel">
                    <h2>✋ İrade Noktası 1: İlkokul Sonu</h2>
                    <p class="info-text">Kendi kontrolünüzde olan faktörleri seçin</p>
                    
                    <div class="parameter-group">
                        <label class="parameter-label">Çalışma Alışkanlığı</label>
                        <div class="choice-options">
                            <button class="choice-btn" onclick="selectWill1('study', 'Hiç Çalışmadı')">Hiç Çalışmadı</button>
                            <button class="choice-btn" onclick="selectWill1('study', 'Az Çalıştı')">Az Çalıştı</button>
                            <button class="choice-btn" onclick="selectWill1('study', 'Orta Çalıştı')">Orta Çalıştı</button>

            const data = gameData[char];

            let eduLevel;
            if (score < 150) {
                eduLevel = rand() < 0.6 ? 'Üniversiteye Giremedi' : 'Açık Öğretim';
            } else if (score < 250) {
                eduLevel = rand() < 0.4 ? 'Meslek Okulu' : (rand() < 0.7 ? 'Devlet Üniversitesi' : 'Açık Öğretim');
            } else if (score < 350) {
                eduLevel = rand() < 0.6 ? 'Devlet Üniversitesi' : 'İyi Devlet Üniversitesi';
            } else {
                eduLevel = rand() < 0.3 ? 'Yurtdışı Üniversite' : (rand() < 0.6 ? 'Özel Üniversite' : 'İyi Devlet Üniversitesi');
            }
            
            data.educationLevel = eduLevel;
            
            if (eduLevel !== 'Üniversiteye Giremedi') {
                data.education = {
                    'Eğitim Seviyesi': eduLevel,
                    'Bölüm': getRandomDepartment(score),
                    'Akademik Performans': score > 300 ? (rand() < 0.6 ? 'Çok İyi' : 'İyi') : (score > 200 ? 'İyi' : (score > 100 ? 'Orta' : 'Zayıf'))

                data.education = {

                };

            const rand = Math.random();

            } else if (score > 250) {
                return rand < 0.5 ? 'Mühendislik' : (rand < 0.75 ? 'İşletme' : 'Eğitim');

        function calculateScore(char, phase) {
            const data = gameData[char];
            let scoreIncrease = 0;
            
            if (phase === 'birth') {
                if (data.birth['Aile Durumu'] === 'Zengin Aile') scoreIncrease += 40;
                else if (data.birth['Aile Durumu'] === 'Orta Halli Aile') scoreIncrease += 20;
                
                if (data.birth['IQ Seviyesi'] === 'Yüksek IQ') scoreIncrease += 50;
                else if (data.birth['IQ Seviyesi'] === 'Orta IQ') scoreIncrease += 25;
                else scoreIncrease -= 10;
                
                if (data.birth['Sağlık Durumu'] === 'Zayıf Sağlık') scoreIncrease -= 30;
                else if (data.birth['Sağlık Durumu'] === 'Güçlü Sağlık') scoreIncrease += 15;
                
                if (data.birth['Anne-Baba Eğitimi'] === 'Üniversite Mezunu') scoreIncrease += 30;
                else if (data.birth['Anne-Baba Eğitimi'] === 'Lise Mezunu') scoreIncrease += 15;
                
                if (data.birth['Kardeş Sayısı'] === 'Tek Çocuk') scoreIncrease += 12;
                if (data.birth['Doğum Sırası'] === 'İlk Çocuk') scoreIncrease += 8;
                
            } else if (phase === 'childhood') {
                if (data.childhood['Aile İlgisi'] === 'Yüksek İlgi') scoreIncrease += 25;
                else if (data.childhood['Aile İlgisi'] === 'Az İlgi') scoreIncrease -= 15;
                
                if (data.childhood['Okuma Alışkanlığı'] === 'Çok Okur') scoreIncrease += 30;
                else if (data.childhood['Okuma Alışkanlığı'] === 'Hiç Okumaz') scoreIncrease -= 20;
                
                if (data.childhood['Beslenme'] === 'İyi') scoreIncrease += 15;
                else if (data.childhood['Beslenme'] === 'Kötü') scoreIncrease -= 20;
                
                if (data.childhood['Kişilik'] === 'Sosyal') scoreIncrease += 12;
                else if (data.childhood['Kişilik'] === 'Utangaç') scoreIncrease -= 8;
                
            } else if (phase === 'will1') {
                if (data.will1['study'] === 'Çok Çalıştı') scoreIncrease += 50;
                else if (data.will1['study'] === 'Orta Çalıştı') scoreIncrease += 25;
                else if (data.will1['study'] === 'Az Çalıştı') scoreIncrease += 5;
                else scoreIncrease -= 20;
                
                if (data.will1['social'] !== 'Yok') scoreIncrease += 15;
                
                if (data.will1['friends'] === 'Popüler') scoreIncrease += 20;
                else if (data.will1['friends'] === 'Normal') scoreIncrease += 10;
                else if (data.will1['friends'] === 'İzole') scoreIncrease -= 15;
                
                if (data.will1['responsibility'] === 'Yüksek') scoreIncrease += 25;
                else if (data.will1['responsibility'] === 'Normal') scoreIncrease += 10;
                
                if (data.will1['goals'] === 'Uzun Vadeli') scoreIncrease += 30;
                else if (data.will1['goals'] === 'Kısa Vadeli') scoreIncrease += 15;
                
            } else if (phase === 'education') {
                if (data.educationLevel === 'Yurtdışı Üniversite') scoreIncrease += 80;
                else if (data.educationLevel === 'Özel Üniversite') scoreIncrease += 50;
                else if (data.educationLevel === 'İyi Devlet Üniversitesi') scoreIncrease += 60;
                else if (data.educationLevel === 'Devlet Üniversitesi') scoreIncrease += 35;
                else if (data.educationLevel === 'Meslek Okulu') scoreIncrease += 15;
                else if (data.educationLevel === 'Açık Öğretim') scoreIncrease += 8;
                else scoreIncrease -= 30;
                
                if (data.education['Bölüm'] === 'Tıp') scoreIncrease += 60;
                else if (data.education['Bölüm'] === 'Mühendislik') scoreIncrease += 50;
                else if (data.education['Bölüm'] === 'Hukuk') scoreIncrease += 45;
                else if (data.education['Bölüm'] === 'İşletme') scoreIncrease += 35;
                
                if (data.education['Akademik Performans'] === 'Çok İyi') scoreIncrease += 40;
                else if (data.education['Akademik Performans'] === 'İyi') scoreIncrease += 25;
                else if (data.education['Akademik Performans'] === 'Orta') scoreIncrease += 10;
                
            } else if (phase === 'will2') {
                if (data.will2['jobSearch'] === 'Aktif Aradı') scoreIncrease += 40;
                else if (data.will2['jobSearch'] === 'Az Aradı') scoreIncrease += 15;
                
                if (data.will2['entrepreneurship'] === 'Evet') scoreIncrease += 30;
                
                if (data.will2['extraEdu'] === 'Yüksek Lisans') scoreIncrease += 35;
                else if (data.will2['extraEdu'] === 'Kurs/Sertifika') scoreIncrease += 20;
                
                if (data.will2['relocation'] === 'Ayrıldı') scoreIncrease += 15;
            }
            
            data.score += scoreIncrease;
        }

        function assignProfessions() {
            const randomIndex = Math.floor(Math.random() * characters.length);
            gameData[characters[randomIndex]].profession = 'Kronik Hasta';
            
            const remaining = characters.filter((_, idx) => idx !== randomIndex);
            remaining.sort((a, b) => gameData[b].score - gameData[a].score);
            
            const remainingProfessions = professions.filter(p => p !== 'Kronik Hasta');
            remaining.forEach((char, idx) => {
                gameData[char].profession = remainingProfessions[idx];
            });
        }

        function formatWill1Key(key) {
            const map = {
                'study': 'Çalışma Alışkanlığı',
                'social': 'Sosyal Aktivite',
                'friends': 'Arkadaş İlişkileri',
                'responsibility': 'Sorumluluk',
                'goals': 'Hedef Belirleme'
