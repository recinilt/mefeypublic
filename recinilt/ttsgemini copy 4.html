<!DOCTYPE html>
<html lang="tr">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobil Uyumlu Profesyonel Okuyucu</title>
    <style>
        :root {
            --bg-color: #11111b;
            --container-bg: #1e1e2e;
            --text-color: #cdd6f4;
            --accent-color: #89b4fa;
            --highlight-bg: rgba(137, 180, 250, 0.4);
            --highlight-color: #fff;
            --btn-bg: #313244;
            --stop-color: #f38ba8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--container-bg);
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        h1 {
            margin: 0;
            color: var(--accent-color);
            font-size: 1.5rem;
            text-align: center;
        }

        .text-wrapper {
            position: relative;
            width: 100%;
            height: 300px;
        }

        textarea {
            width: 100%;
            height: 100%;
            background-color: #181825;
            color: #fff;
            border: 2px solid #313244;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.2rem;
            line-height: 1.6;
            resize: none;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        textarea:focus { border-color: var(--accent-color); }

        #read-display {
            display: none;
            width: 100%;
            height: 100%;
            background-color: #181825;
            color: #a6adc8;
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.2rem;
            line-height: 1.6;
            box-sizing: border-box;
            overflow-y: auto;
            white-space: pre-wrap;
            scroll-behavior: smooth;
        }

        .highlight {
            background-color: var(--highlight-bg);
            color: var(--highlight-color);
            border-radius: 4px;
            padding: 2px 0;
            font-weight: bold;
        }

        /* Aktif cümle vurgusu (daha hafif) */
        .sentence-active {
            color: #fff;
        }

        .controls-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .voice-section { width: 100%; }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: var(--btn-bg);
            color: white;
            border: 1px solid transparent;
            font-size: 1rem;
            appearance: none;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .speed-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--btn-bg);
            padding: 5px;
            border-radius: 12px;
        }

        button {
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            touch-action: manipulation;
        }

        button:active { transform: scale(0.96); }

        .btn-play { background-color: var(--accent-color); color: #11111b; }
        .btn-stop { background-color: var(--stop-color); color: #11111b; }
        
        .btn-speed {
            background-color: transparent;
            color: var(--accent-color);
            font-size: 1.5rem;
            width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .current-speed-label {
            font-family: monospace;
            font-size: 1.1rem;
            color: #fff;
        }

        .speed-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: var(--accent-color);
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 2rem;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            transition: opacity 0.3s;
            backdrop-filter: blur(5px);
        }

        .info {
            text-align: center;
            font-size: 0.8rem;
            color: #6c7086;
            margin-top: 5px;
        }

        @media (min-width: 600px) {
            .controls-wrapper {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
            }
            .voice-section { flex: 100%; }
            .action-buttons { flex: 1; }
            .speed-controls { flex: 0 0 160px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Uzun Metin Okuyucu</h1>
        
        <div class="text-wrapper">
            <textarea id="text-input" placeholder="Metnini buraya yapıştır...">Merhaba! Artık çok uzun metinleri bile sorunsuz okuyabilirim. Metni cümlelere bölerek yönetiyorum, bu sayede mobilde ses kesilmez ve hız değiştirdiğinde cümlenin başından devam ederim.</textarea>
            <div id="read-display"></div>
        </div>
        
        <div class="controls-wrapper">
            <div class="voice-section">
                <select id="voice-select">
                    <option value="">Sesler yükleniyor...</option>
                </select>
            </div>

            <div class="action-buttons">
                <button id="play-btn" class="btn-play">▶ Oku</button>
                <button id="stop-btn" class="btn-stop">■ Durdur</button>
            </div>

            <div class="speed-controls">
                <button id="slow-down-btn" class="btn-speed">−</button>
                <span id="speed-display-static" class="current-speed-label">1.0x</span>
                <button id="speed-up-btn" class="btn-speed">+</button>
            </div>
        </div>

        <div class="info">
            Klavye: <b>Boşluk</b> (Durdur), <b>↑</b> (Hızlan), <b>↓</b> (Yavaşla)
        </div>
    </div>

    <div id="speed-overlay" class="speed-overlay">1.0x</div>

    <script>
        const synth = window.speechSynthesis;
        const textInput = document.getElementById('text-input');
        const readDisplay = document.getElementById('read-display');
        const voiceSelect = document.getElementById('voice-select');
        const playBtn = document.getElementById('play-btn');
        const stopBtn = document.getElementById('stop-btn');
        const speedUpBtn = document.getElementById('speed-up-btn');
        const slowDownBtn = document.getElementById('slow-down-btn');
        const speedOverlay = document.getElementById('speed-overlay');
        const speedDisplayStatic = document.getElementById('speed-display-static');

        let savedRate = localStorage.getItem('tts_speed');
        let currentRate = savedRate ? parseFloat(savedRate) : 1.0;
        speedDisplayStatic.textContent = currentRate.toFixed(1) + "x";

        let voices = [];
        let isSpeaking = false;
        let isPaused = false;
        let isManualStop = false; // Kullanıcı mı durdurdu yoksa cümle mi bitti?
        
        // CHUNKING SİSTEMİ DEĞİŞKENLERİ
        let textChunks = []; // Cümle cümle parçalanmış metin
        let currentChunkIndex = 0; // Hangi cümledeyiz
        
        // 1. SESLERİ YÜKLE
        function populateVoices() {
            voices = synth.getVoices();
            if(voices.length === 0) return;
            voiceSelect.innerHTML = '';

            voices.sort((a, b) => {
                const aName = a.name.toLowerCase();
                const bName = b.name.toLowerCase();
                const aLang = a.lang.toLowerCase();
                const bLang = b.lang.toLowerCase();
                
                const aIsGoogleTr = aName.includes('google') && aLang.includes('tr');
                const bIsGoogleTr = bName.includes('google') && bLang.includes('tr');
                
                if (aIsGoogleTr && !bIsGoogleTr) return -1;
                if (!aIsGoogleTr && bIsGoogleTr) return 1;
                if (aLang.includes('tr') && !bLang.includes('tr')) return -1;
                if (!aLang.includes('tr') && bLang.includes('tr')) return 1;
                return 0;
            });

            voices.forEach((voice) => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`; 
                option.setAttribute('data-name', voice.name);
                option.setAttribute('data-lang', voice.lang);
                voiceSelect.appendChild(option);
            });
        }
        populateVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }

        // 2. METNİ PARÇALA VE GÖRÜNTÜ OLUŞTUR
        function processText(text) {
            // Basit cümle bölme: Nokta, Ünlem, Soru İşareti veya satır sonu
            // Regex açıklaması: ([^.!?\n]+[.!?\n]+) -> Cümle sonuna kadar al, ayıracı da dahil et
            // Bu regex tam mükemmel değil ama TTS için yeterli.
            
            // Daha sağlam bir regex:
            const rawChunks = text.match(/[^.!?\n]+[.!?\n]+|[^.!?\n]+$/g);
            
            textChunks = [];
            readDisplay.innerHTML = '';
            
            if (!rawChunks) return;

            let globalCharIndex = 0;

            rawChunks.forEach((chunkText, index) => {
                const cleanText = chunkText.trim();
                if(cleanText.length === 0) return;

                // Veri yapısına ekle
                textChunks.push({
                    text: cleanText,
                    start: globalCharIndex,
                    originalIndex: index
                });

                // Ekrana ekle (Span içinde Span)
                // Dış span: Cümle, İç spanlar: Kelimeler (Vurgu için)
                const sentenceSpan = document.createElement('div');
                sentenceSpan.className = 'sentence-block';
                sentenceSpan.style.display = 'inline'; // Akış bozulmasın
                sentenceSpan.id = `chunk-${index}`;
                
                // Kelimeleri parçala
                const words = chunkText.split(/(\s+)/);
                words.forEach(word => {
                    const wordSpan = document.createElement('span');
                    wordSpan.textContent = word;
                    if(word.trim().length > 0) {
                        wordSpan.className = 'word';
                    }
                    sentenceSpan.appendChild(wordSpan);
                });

                readDisplay.appendChild(sentenceSpan);
                globalCharIndex += chunkText.length;
            });
            
            textInput.style.display = 'none';
            readDisplay.style.display = 'block';
        }

        function highlightChunk(index) {
            // Önceki vurguları temizle
            document.querySelectorAll('.sentence-active').forEach(el => el.classList.remove('sentence-active'));
            document.querySelectorAll('.highlight').forEach(el => el.classList.remove('highlight'));

            const sentenceEl = document.getElementById(`chunk-${index}`);
            if (sentenceEl) {
                sentenceEl.classList.add('sentence-active');
                sentenceEl.scrollIntoView({ behavior: "smooth", block: "center" });
                
                // Cümlenin tamamını hafifçe vurgula (Mobil takip için daha iyi)
                // Kelime kelime vurgu mobilde bazen senkron sorunu yaşatır, cümle bazlı daha stabil.
                sentenceEl.querySelectorAll('.word').forEach(w => w.classList.add('highlight'));
            }
        }

        function resetView() {
            textInput.style.display = 'block';
            readDisplay.style.display = 'none';
            playBtn.textContent = "▶ Oku";
            currentChunkIndex = 0;
            isSpeaking = false;
            isPaused = false;
        }

        // 3. PARÇA OKUMA MANTIĞI (En Kritik Kısım)
        function playCurrentChunk() {
            if (currentChunkIndex >= textChunks.length) {
                resetView();
                return;
            }

            // Önceki her şeyi iptal et (temiz sayfa)
            synth.cancel();

            const chunkData = textChunks[currentChunkIndex];
            const utterance = new SpeechSynthesisUtterance(chunkData.text);
            
            // GC Önlemi
            window.currentUtterance = utterance;

            // Ses Ayarları
            let selectedLang = 'tr-TR';
            if (voiceSelect.selectedOptions.length > 0) {
                const name = voiceSelect.selectedOptions[0].getAttribute('data-name');
                const lang = voiceSelect.selectedOptions[0].getAttribute('data-lang');
                const voice = voices.find(v => v.name === name);
                if (voice) {
                    utterance.voice = voice;
                    selectedLang = voice.lang;
                } else if (lang) selectedLang = lang;
            }
            utterance.lang = selectedLang;
            utterance.rate = currentRate;

            // Görsel Vurgu
            highlightChunk(currentChunkIndex);

            // Olaylar
            utterance.onend = () => {
                if (isManualStop) return; // Eğer kullanıcı durdurduysa sonrakine geçme
                
                // Bir sonraki cümleye geç
                currentChunkIndex++;
                playCurrentChunk(); 
            };

            utterance.onerror = (e) => {
                if (e.error === 'interrupted' || e.error === 'canceled') return;
                console.error("Hata:", e);
                // Hata olsa bile devam etmeye çalış
                if (!isManualStop) {
                    currentChunkIndex++;
                    playCurrentChunk();
                }
            };

            synth.speak(utterance);
        }

        // 4. KONTROLLER
        function startReading() {
            const text = textInput.value;
            if (!text.trim()) return;

            // Eğer hiç başlamamışsak (veya resetlenmişse), metni işle
            if (!isSpeaking && !isPaused) {
                processText(text);
                currentChunkIndex = 0;
            }
            
            isManualStop = false;
            isSpeaking = true;
            isPaused = false;
            playBtn.textContent = "⏸ Duraklat";
            
            playCurrentChunk();
        }

        function togglePlay() {
            if (voices.length === 0) populateVoices();

            if (isSpeaking && !isPaused) {
                // DURAKLATMA: Aslında "Durdur ve index'i sakla" yapıyoruz (Mobilde en güvenli yol)
                isManualStop = true;
                synth.cancel();
                isPaused = true;
                playBtn.textContent = "▶ Devam Et";
            } else {
                // DEVAM ETME
                isManualStop = false;
                isPaused = false;
                isSpeaking = true;
                playBtn.textContent = "⏸ Duraklat";
                playCurrentChunk(); // Kaldığı chunk index'inden devam eder
            }
        }

        function stopSpeech() {
            isManualStop = true;
            synth.cancel();
            resetView();
        }

        function changeSpeed(amount) {
            currentRate = Math.max(0.5, Math.min(3.0, currentRate + amount));
            currentRate = Math.round(currentRate * 10) / 10;
            localStorage.setItem('tts_speed', currentRate);

            // Görsel
            speedDisplayStatic.textContent = currentRate.toFixed(1) + "x";
            speedOverlay.innerText = `${currentRate.toFixed(1)}x`;
            speedOverlay.style.opacity = '1';
            setTimeout(() => { speedOverlay.style.opacity = '0'; }, 800);

            // Eğer okuyorsa, durdur ve yeni hızla AYNI cümleden devam et
            if (isSpeaking && !isPaused) {
                isManualStop = true; // onend tetiklenip index artmasın diye
                synth.cancel();
                
                // Kısa bir gecikme ile yeniden başlat (Browser'ın kendine gelmesi için)
                setTimeout(() => {
                    isManualStop = false;
                    playCurrentChunk();
                }, 50);
            }
        }

        // Event Listeners
        playBtn.addEventListener('click', () => {
            if(!isSpeaking && !isPaused) startReading();
            else togglePlay();
        });
        
        stopBtn.addEventListener('click', stopSpeech);
        speedUpBtn.addEventListener('click', () => changeSpeed(0.1));
        slowDownBtn.addEventListener('click', () => changeSpeed(-0.1));

        document.addEventListener('keydown', (e) => {
            if (document.activeElement === textInput) return;
            if (e.code === 'Space') { e.preventDefault(); 
                if(!isSpeaking && !isPaused) startReading(); else togglePlay(); 
            }
            else if (e.code === 'ArrowUp') { e.preventDefault(); changeSpeed(0.1); }
            else if (e.code === 'ArrowDown') { e.preventDefault(); changeSpeed(-0.1); }
        });
    </script>
</body>
</html>
