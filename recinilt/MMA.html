<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMA İçerik Merkezi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-grid {
            display: grid;
            gap: 20px;
            margin-top: 20px;
        }

        .nav-item {
            position: relative;
            overflow: hidden;
        }

        .nav-link {
            display: block;
            padding: 20px 25px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .nav-link:hover::before {
            left: 0;
        }

        .nav-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .nav-link:active {
            transform: translateY(0);
        }

        .jargon {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        .jargon::before {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .layer1 {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        .layer1::before {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
        }

        .layer2 {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        .layer2::before {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .character {
            background: linear-gradient(135deg, #d299c2 0%, #fef9d7 100%);
        }

        .character::before {
            background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
        }

        .icon {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                margin: 10px;
            }

            h1 {
                font-size: 1.8rem;
                margin-bottom: 25px;
            }

            .nav-link {
                padding: 18px 20px;
                font-size: 1rem;
            }

            .nav-grid {
                gap: 15px;
            }
        }

        @media (max-width: 320px) {
            .container {
                padding: 25px 15px;
            }

            h1 {
                font-size: 1.6rem;
            }

            .nav-link {
                padding: 15px 18px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MMA İçerik Merkezi</h1>
        <div class="nav-grid">
            <div class="nav-item">
                <a href="mmaJargonTranscriptleri.html" class="nav-link jargon">
                    <span class="icon">📝</span>
                    Jargon Transcriptleri
                </a>
            </div>
            <div class="nav-item">
                <a href="mmaBirinciKatmanMakaleleri.html" class="nav-link layer1">
                    <span class="icon">📚</span>
                    1. Katman Makaleleri
                </a>
            </div>
            <div class="nav-item">
                <a href="mmaikincikatmanmakaleleri.html" class="nav-link layer2">
                    <span class="icon">📖</span>
                    2. Katman Makaleleri
                </a>
            </div>
            <div class="nav-item">
                <a href="karakter-benlik-tanimlamalarim4.html" class="nav-link character">
                    <span class="icon">👤</span>
                    Karakter Benlik Tanımlamaları
                </a>
            </div>
        </div>
    </div>
</body>
</html>
