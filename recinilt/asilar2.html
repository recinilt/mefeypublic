        // Accordion'ları oluştur
        function createAccordions() {
            const container = document.getElementById('accordion-container');
            
            accordionData.forEach((item, index) => {
                // Accordion wrapper oluştur
                const accordionDiv = document.createElement('div');
                accordionDiv.className = 'accordion';
                
                // Header oluştur
                const header = document.createElement('button');
                header.className = 'accordion-header';
                header.textContent = item.title;
                header.setAttribute('data-target', `content${index}`);
                
                // Content oluştur
                const content = document.createElement('div');
                content.className = 'accordion-content';
                content.id = `content${index}`;
                content.innerHTML = item.content;
                
                // Elemanları birleştir
                accordionDiv.appendChild(header);
                accordionDiv.appendChild(content);
                container.appendChild(accordionDiv);
            });
        }

        // Accordion tıklama olaylarını ayarla
        function setupAccordionEvents() {
            const headers = document.querySelectorAll('.accordion-header');
            
            headers.forEach(header => {
                header.addEventListener('click', () => {
                    const targetId = header.getAttribute('data-target');
                    const targetContent = document.getElementById(targetId);

                    // Tüm açık içerikleri kapat
                    document.querySelectorAll('.accordion-content').forEach(content => {
                        if (content !== targetContent) {
                            content.style.display = 'none';
                        }
                    });

                    // Mevcut içeriği aç/kapat
                    if (targetContent.style.display === 'block') {
                        targetContent.style.display = 'none';
                    } else {
                        targetContent.style.display = 'block';
                    }
                });
            });
        }

        // Sayfa yüklendiğinde çalıştır
        document.addEventListener('DOMContentLoaded', () => {
            createAccordions();
            setupAccordionEvents();
        });
    </script>
