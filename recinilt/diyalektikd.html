<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotebookLM Video Analiz Yöneticisi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #13131a;
            --bg-tertiary: #1a1a24;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --border: #2d2d3a;
            --shadow: rgba(0, 0, 0, 0.5);
            
            /* Light theme */
            --light-bg-primary: #ffffff;
            --light-bg-secondary: #f8f9fa;
            --light-bg-tertiary: #e9ecef;
            --light-accent: #4f46e5;
            --light-accent-hover: #4338ca;
            --light-text-primary: #1f2937;
            --light-text-secondary: #6b7280;
            --light-border: #e5e7eb;
            --light-shadow: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: all 0.3s ease;
            padding: 20px;
        }

        body.light-theme {
            background: var(--light-bg-primary);
            color: var(--light-text-primary);
            --bg-primary: var(--light-bg-primary);
            --bg-secondary: var(--light-bg-secondary);
            --bg-tertiary: var(--light-bg-tertiary);
            --accent: var(--light-accent);
            --accent-hover: var(--light-accent-hover);
            --text-primary: var(--light-text-primary);
            --text-secondary: var(--light-text-secondary);
            --border: var(--light-border);
            --shadow: var(--light-shadow);
        }

        /* Şifre Ekranı */
        .password-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .password-box {
            background: var(--bg-secondary);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px var(--shadow);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .password-box h1 {
            font-size: 1.8em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .password-box p {
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .password-input {
            width: 100%;
            padding: 15px;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1em;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .password-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .password-btn {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .password-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .password-error {
            color: #ef4444;
            margin-top: 15px;
            display: none;
        }

        /* Header */
        .header {
            max-width: 1400px;
            margin: 0 auto 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            font-size: 2em;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .theme-toggle, .notes-toggle {
            padding: 10px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .theme-toggle:hover, .notes-toggle:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent);
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Video Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .video-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .video-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px var(--shadow);
        }

        .video-card h3 {
            font-size: 1.2em;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .video-card p {
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .file-count {
            display: inline-block;
            background: var(--bg-tertiary);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            color: var(--text-secondary);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            max-width: 1200px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            padding: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            color: white;
            font-size: 1.5em;
        }

        .close-modal {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-modal:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 25px;
            overflow-y: auto;
            flex: 1;
        }

        /* Files Grid */
        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .file-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .file-item:hover {
            border-color: var(--accent);
            transform: translateX(5px);
        }

        .file-icon {
            font-size: 2em;
        }

        .file-info h4 {
            font-size: 0.95em;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .file-info p {
            font-size: 0.8em;
            color: var(--text-secondary);
        }

        /* File Viewer Modal */
        .file-viewer {
            background: var(--bg-primary);
            padding: 30px;
            border-radius: 15px;
            max-width: 100%;
            max-height: 80vh;
            overflow: auto;
        }

        .file-viewer video,
        .file-viewer audio {
            width: 100%;
            max-width: 100%;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .file-viewer img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .file-viewer iframe {
            width: 100%;
            height: 80vh;
            border: none;
            border-radius: 10px;
        }

        .file-viewer table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .file-viewer th,
        .file-viewer td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .file-viewer th {
            background: var(--bg-tertiary);
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        /* Floating Notes Panel */
        .notes-panel {
            position: fixed;
            top: 80px;
            right: 20px;
            width: 350px;
            max-height: calc(100vh - 100px);
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 15px;
            box-shadow: 0 10px 40px var(--shadow);
            z-index: 999;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .notes-panel.active {
            display: flex;
        }

        .notes-panel.minimized {
            height: auto;
            max-height: none;
        }

        .notes-panel.minimized .notes-body {
            display: none;
        }

        .notes-header {
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            user-select: none;
        }

        .notes-header h3 {
            color: white;
            font-size: 1.1em;
        }

        .notes-controls {
            display: flex;
            gap: 5px;
        }

        .notes-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .notes-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .notes-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .note-form {
            margin-bottom: 20px;
        }

        .note-input {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            margin-bottom: 10px;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        .note-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .note-timestamp {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .note-timestamp input {
            flex: 1;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9em;
        }

        .note-save {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .note-save:hover {
            background: var(--accent-hover);
        }

        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .note-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            position: relative;
        }

        .note-time {
            font-size: 0.8em;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .note-text {
            color: var(--text-primary);
            line-height: 1.6;
            font-size: 0.9em;
            white-space: pre-wrap;
        }

        .note-delete {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(239, 68, 68, 0.2);
            border: none;
            color: #ef4444;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.3s ease;
        }

        .note-delete:hover {
            background: #ef4444;
            color: white;
        }

        .note-search {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            margin-bottom: 15px;
        }

        .note-search:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5em;
            }

            .video-grid {
                grid-template-columns: 1fr;
            }

            .notes-panel {
                width: calc(100% - 40px);
                right: 20px;
                left: 20px;
            }

            .modal-content {
                max-width: 100%;
            }

            .files-grid {
                grid-template-columns: 1fr;
            }

            .file-viewer {
                padding: 15px;
            }

            .password-box {
                padding: 30px 20px;
            }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-hover);
        }
    </style>
</head>
<body>
    <!-- Şifre Ekranı -->
    <div class="password-screen" id="passwordScreen">
        <div class="password-box">
            <h1>🔒 Giriş</h1>
            <p>Devam etmek için şifre gerekli</p>
            <input type="password" class="password-input" id="passwordInput" placeholder="Şifre girin">
            <button class="password-btn" onclick="checkPassword()">Giriş Yap</button>
            <p class="password-error" id="passwordError">❌ Hatalı şifre!</p>
        </div>
    </div>

    <!-- Ana İçerik -->
    <div id="mainContent" style="display: none;">
        <!-- Header -->
        <div class="header">
            <h1>📚 NotebookLM Video Analiz</h1>
            <div class="header-controls">
                <button class="theme-toggle" onclick="toggleTheme()">🌙 Tema</button>
                <button class="notes-toggle" onclick="toggleNotes()">📝 Notlarım</button>
            </div>
        </div>

        <!-- Container -->
        <div class="container">
            <!-- Video Grid -->
            <div class="video-grid" id="videoGrid"></div>
        </div>

        <!-- Video Modal -->
        <div class="modal" id="videoModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle"></h2>
                    <button class="close-modal" onclick="closeModal()">×</button>
                </div>
                <div class="modal-body" id="modalBody"></div>
            </div>
        </div>

        <!-- File Viewer Modal -->
        <div class="modal" id="fileModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="fileModalTitle"></h2>
                    <button class="close-modal" onclick="closeFileModal()">×</button>
                </div>
                <div class="modal-body">
                    <div class="file-viewer" id="fileViewer"></div>
                </div>
            </div>
        </div>

        <!-- Floating Notes Panel -->
        <div class="notes-panel" id="notesPanel">
            <div class="notes-header" id="notesHeader">
                <h3>📝 Notlarım</h3>
                <div class="notes-controls">
                    <button class="notes-btn" onclick="minimizeNotes()" title="Küçült">−</button>
                    <button class="notes-btn" onclick="closeNotes()" title="Kapat">×</button>
                </div>
            </div>
            <div class="notes-body">
                <div class="note-form">
                    <div class="note-timestamp">
                        <input type="text" id="noteTimestamp" placeholder="Zaman (örn: 3:45)" />
                        <button onclick="captureCurrentTime()" style="padding: 8px 12px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; color: var(--text-primary);" title="Mevcut videodan zamanı yakala">⏱️</button>
                    </div>
                    <textarea class="note-input" id="noteInput" placeholder="Not ekle..."></textarea>
                    <button class="note-save" onclick="saveNote()">💾 Kaydet</button>
                </div>
                <input type="text" class="note-search" id="noteSearch" placeholder="🔍 Notlarda ara..." oninput="filterNotes()">
                <div class="notes-list" id="notesList"></div>
            </div>
        </div>
    </div>

    <script src="github.js"></script>
    <script>
        // ====================================
        // GITHUB AYARLARI - BURAYA GİRİN!
        // ====================================
        // GitHub ayarları
        //let kullaniciAdi = "recinilt";
        //let repository = "diyalektikdergah";
        //let token = "...";
        //let passwordFile = "sifre.json";

        // GitHub ayarları
        //let kullaniciAdi = "recinilt";
        //let repoAdi = "diyalektikdergah";
        //let token = "your api key here";
        //let dosyaAdi = "sifre.json";

        // Video Verileri
        const videos = {
            v03: {
                title: "Character Self to Unity",
                description: "Ben Kimim: Karakter, Benlik ve İlahi İsimler analizi",
                files: {
                    'Aynadaki_İlahi.mp4': { type: 'video', icon: '🎥' },
                    'Ben_Kimim__Karakter_Benlik_ve_İlahi_İsimler.m4a': { type: 'audio', icon: '🎵' },
                    'Character_Self_to_Unity.pdf': { type: 'pdf', icon: '📄' },
                    'flashcards.csv': { type: 'csv', icon: '🃏' },
                    'NotebookLMMindMap.png': { type: 'image', icon: '🖼️' },
                    'unnamed.png': { type: 'image', icon: '🖼️' },
                    'v03.pdf': { type: 'pdf', icon: '📄' }
                }
            }
            // Yeni videolar buraya eklenecek
        };

        // Global değişkenler
        let notes = [];
        let currentMediaElement = null;
        let isDragging = false;
        let currentX;
        let currentY;
        let initialX;
        let initialY;
        let xOffset = 0;
        let yOffset = 0;

        // Şifre kontrolü - DOĞRU YÖNTEM
        async function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            const errorElement = document.getElementById('passwordError');
            
            try {
                // GitHub API kullanarak şifre dosyasını çek
                const response = await fetch(
                    `https://api.github.com/repos/${kullaniciAdi}/${repository}/contents/${passwordFile}`,
                    {
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    }
                );
                
                if (!response.ok) {
                    throw new Error('Şifre dosyası bulunamadı veya erişim hatası');
                }
                
                const data = await response.json();
                
                // Base64 decode et
                const content = atob(data.content);
                const passwordData = JSON.parse(content);
                
                if (input === passwordData.sifre) {
                    document.getElementById('passwordScreen').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                    loadNotes();
                    renderVideos();
                } else {
                    errorElement.textContent = '❌ Hatalı şifre!';
                    errorElement.style.display = 'block';
                    setTimeout(() => {
                        errorElement.style.display = 'none';
                    }, 3000);
                }
            } catch (error) {
                console.error('Şifre kontrolü hatası:', error);
                errorElement.textContent = '❌ GitHub bağlantı hatası: ' + error.message;
                errorElement.style.display = 'block';
            }
        }

        // Enter tuşu ile şifre girişi
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('passwordInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    checkPassword();
                }
            });
        });

        // Video kartlarını render et
        function renderVideos() {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';

            Object.keys(videos).forEach(videoId => {
                const video = videos[videoId];
                const fileCount = Object.keys(video.files).length;

                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <h3>${video.title}</h3>
                    <p>${video.description}</p>
                    <span class="file-count">📁 ${fileCount} dosya</span>
                `;
                card.onclick = () => openVideo(videoId);
                grid.appendChild(card);
            });
        }

        // Video modalını aç
        function openVideo(videoId) {
            const video = videos[videoId];
            document.getElementById('modalTitle').textContent = video.title;
            
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = '';

            const filesGrid = document.createElement('div');
            filesGrid.className = 'files-grid';

            Object.keys(video.files).forEach(fileName => {
                const file = video.files[fileName];
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <div class="file-icon">${file.icon}</div>
                    <div class="file-info">
                        <h4>${fileName}</h4>
                        <p>${file.type.toUpperCase()}</p>
                    </div>
                `;
                fileItem.onclick = () => openFile(videoId, fileName, file.type);
                filesGrid.appendChild(fileItem);
            });

            modalBody.appendChild(filesGrid);
            document.getElementById('videoModal').classList.add('active');
        }

        // Dosya görüntüleyicisini aç - DOĞRU YÖNTEM
        async function openFile(videoId, fileName, fileType) {
            document.getElementById('fileModalTitle').textContent = fileName;
            const viewer = document.getElementById('fileViewer');
            viewer.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">Yükleniyor...</p>';

            try {
                // GitHub API ile dosyayı çek
                const response = await fetch(
                    `https://api.github.com/repos/${kullaniciAdi}/${repository}/contents/${videoId}/${fileName}`,
                    {
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error('Dosya bulunamadı');
                }

                const data = await response.json();
                
                // Raw içerik URL'ini kullan
                const fileUrl = data.download_url;
                
                viewer.innerHTML = '';

                if (fileType === 'video') {
                    const video = document.createElement('video');
                    video.controls = true;
                    video.src = fileUrl;
                    video.style.maxWidth = '100%';
                    viewer.appendChild(video);
                    currentMediaElement = video;
                    
                } else if (fileType === 'audio') {
                    const audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = fileUrl;
                    audio.style.width = '100%';
                    viewer.appendChild(audio);
                    currentMediaElement = audio;
                    
                } else if (fileType === 'pdf') {
                    const iframe = document.createElement('iframe');
                    iframe.src = fileUrl;
                    iframe.style.width = '100%';
                    iframe.style.height = '80vh';
                    viewer.appendChild(iframe);
                    
                } else if (fileType === 'image') {
                    const img = document.createElement('img');
                    img.src = fileUrl;
                    img.style.maxWidth = '100%';
                    viewer.appendChild(img);
                    
                } else if (fileType === 'csv') {
                    const csvResponse = await fetch(fileUrl);
                    const csvText = await csvResponse.text();
                    const table = csvToTable(csvText);
                    viewer.appendChild(table);
                }

                document.getElementById('fileModal').classList.add('active');
            } catch (error) {
                console.error('Dosya yükleme hatası:', error);
                viewer.innerHTML = '<p style="color: #ef4444;">❌ Dosya yüklenemedi: ' + error.message + '</p>';
                document.getElementById('fileModal').classList.add('active');
            }
        }

        // CSV'yi tabloya dönüştür
        function csvToTable(csv) {
            const lines = csv.split('\n').filter(line => line.trim());
            const table = document.createElement('table');
            
            lines.forEach((line, index) => {
                const row = table.insertRow();
                const cells = line.split(',');
                
                cells.forEach(cell => {
                    const cellElement = index === 0 ? document.createElement('th') : row.insertCell();
                    cellElement.textContent = cell.trim();
                    if (index === 0) row.appendChild(cellElement);
                });
            });
            
            return table;
        }

        // Modal kapatma
        function closeModal() {
            document.getElementById('videoModal').classList.remove('active');
        }

        function closeFileModal() {
            if (currentMediaElement) {
                currentMediaElement.pause();
                currentMediaElement = null;
            }
            document.getElementById('fileModal').classList.remove('active');
        }

        // X tuşu ile modal kapatma
        document.addEventListener('keydown', (e) => {
            if (e.key === 'x' || e.key === 'X') {
                if (document.getElementById('fileModal').classList.contains('active')) {
                    closeFileModal();
                } else if (document.getElementById('videoModal').classList.contains('active')) {
                    closeModal();
                }
            }
        });

        // Tema değiştirme
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        }

        // Tema yükle
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
        }

        // Not paneli
        function toggleNotes() {
            const panel = document.getElementById('notesPanel');
            panel.classList.toggle('active');
        }

        function minimizeNotes() {
            document.getElementById('notesPanel').classList.toggle('minimized');
        }

        function closeNotes() {
            document.getElementById('notesPanel').classList.remove('active');
        }

        // Mevcut video zamanını yakala
        function captureCurrentTime() {
            if (currentMediaElement && !currentMediaElement.paused) {
                const time = currentMediaElement.currentTime;
                const minutes = Math.floor(time / 60);
                const seconds = Math.floor(time % 60);
                document.getElementById('noteTimestamp').value = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            }
        }

        // Not kaydetme
        function saveNote() {
            const text = document.getElementById('noteInput').value.trim();
            const timestamp = document.getElementById('noteTimestamp').value.trim();
            
            if (!text) return;

            const note = {
                id: Date.now(),
                text: text,
                timestamp: timestamp || '',
                date: new Date().toLocaleString('tr-TR')
            };

            notes.unshift(note);
            localStorage.setItem('notebooklm-notes', JSON.stringify(notes));
            
            document.getElementById('noteInput').value = '';
            document.getElementById('noteTimestamp').value = '';
            renderNotes();
        }

        // Notları render et
        function renderNotes() {
            const notesList = document.getElementById('notesList');
            const searchTerm = document.getElementById('noteSearch').value.toLowerCase();
            
            const filteredNotes = notes.filter(note => 
                note.text.toLowerCase().includes(searchTerm) ||
                note.timestamp.toLowerCase().includes(searchTerm)
            );

            notesList.innerHTML = filteredNotes.map(note => `
                <div class="note-item">
                    ${note.timestamp ? `<div class="note-time">⏱️ ${note.timestamp}</div>` : ''}
                    <div class="note-text">${note.text}</div>
                    <div style="font-size: 0.75em; color: var(--text-secondary); margin-top: 8px;">${note.date}</div>
                    <button class="note-delete" onclick="deleteNote(${note.id})">×</button>
                </div>
            `).join('');
        }

        // Not silme
        function deleteNote(id) {
            if (confirm('Bu notu silmek istediğinize emin misiniz?')) {
                notes = notes.filter(note => note.id !== id);
                localStorage.setItem('notebooklm-notes', JSON.stringify(notes));
                renderNotes();
            }
        }

        // Notları filtreleme
        function filterNotes() {
            renderNotes();
        }

        // Notları yükle
        function loadNotes() {
            const saved = localStorage.getItem('notebooklm-notes');
            if (saved) {
                notes = JSON.parse(saved);
                renderNotes();
            }
        }

        // Not panelini sürüklenebilir yap
        const notesHeader = document.getElementById('notesHeader');
        const notesPanel = document.getElementById('notesPanel');

        notesHeader.addEventListener('mousedown', dragStart);
        notesHeader.addEventListener('touchstart', dragStart);

        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag);

        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('touchend', dragEnd);

        function dragStart(e) {
            if (e.type === 'touchstart') {
                initialX = e.touches[0].clientX - xOffset;
                initialY = e.touches[0].clientY - yOffset;
            } else {
                initialX = e.clientX - xOffset;
                initialY = e.clientY - yOffset;
            }

            if (e.target === notesHeader || notesHeader.contains(e.target)) {
                isDragging = true;
            }
        }

        function drag(e) {
            if (isDragging) {
                e.preventDefault();

                if (e.type === 'touchmove') {
                    currentX = e.touches[0].clientX - initialX;
                    currentY = e.touches[0].clientY - initialY;
                } else {
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                }

                xOffset = currentX;
                yOffset = currentY;

                setTranslate(currentX, currentY, notesPanel);
            }
        }

        function dragEnd() {
            initialX = currentX;
            initialY = currentY;
            isDragging = false;
        }

        function setTranslate(xPos, yPos, el) {
            el.style.transform = `translate(${xPos}px, ${yPos}px)`;
        }
    </script>
</body>
</html>
