<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Face Swap & Creative Studio - Fal.ai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .upload-card {
            border: 2px dashed #e2e8f0;
            transition: all 0.2s ease;
            background-color: white;
        }
        .upload-card:active { transform: scale(0.98); }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width: 640px) {
            .upload-card { height: 160px !important; }
        }
    </style>
</head>
<body class="pb-10">

    <header class="gradient-bg text-white py-6 shadow-2xl sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-5 flex justify-between items-center">
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold tracking-tighter italic">AI <span class="text-blue-400">CREATIVE</span></h1>
                <p class="text-slate-400 font-medium uppercase text-[9px] tracking-[0.2em]">InstantID & Prompt Engine</p>
            </div>
            <button onclick="toggleSettings()" class="bg-white/10 p-3 rounded-xl hover:bg-white/20 transition">
                <i class="fa-solid fa-cog text-xl"></i>
            </button>
        </div>
    </header>

    <div id="settingsPanel" class="hidden max-w-4xl mx-auto px-5 mt-4">
        <div class="bg-white border border-slate-200 p-6 rounded-3xl shadow-lg">
            <label class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-widest">Fal.ai API Key</label>
            <div class="flex flex-col sm:flex-row gap-2">
                <input type="password" id="apiKeyInput" placeholder="Key_id:Key_secret..." 
                       class="flex-1 p-4 rounded-xl bg-slate-50 border border-slate-200 outline-none font-mono text-xs">
                <button onclick="saveApiKey()" class="bg-blue-600 text-white px-6 py-4 rounded-xl font-bold text-sm shadow-lg shadow-blue-100">Kaydet</button>
            </div>
        </div>
    </div>

    <main class="max-w-4xl mx-auto px-5 mt-6 space-y-6">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="space-y-2">
                <div class="upload-card rounded-3xl h-52 flex flex-col items-center justify-center cursor-pointer relative overflow-hidden shadow-sm" onclick="document.getElementById('inputSwap').click()">
                    <input type="file" id="inputSwap" class="hidden" accept="image/*" onchange="handleFile(this, 'previewSwap')">
                    <img id="previewSwap" class="hidden absolute inset-0 w-full h-full object-contain p-2">
                    <div id="msgSwap" class="text-center p-4">
                        <i class="fa-solid fa-user-astronaut text-2xl text-slate-300 mb-2"></i>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Senin Yüzün (Referans)</p>
                    </div>
                </div>
            </div>

            <div class="space-y-2">
                <div class="upload-card rounded-3xl h-52 flex flex-col items-center justify-center cursor-pointer relative overflow-hidden shadow-sm" onclick="document.getElementById('inputBase').click()">
                    <input type="file" id="inputBase" class="hidden" accept="image/*" onchange="handleFile(this, 'previewBase')">
                    <img id="previewBase" class="hidden absolute inset-0 w-full h-full object-contain p-2">
                    <div id="msgBase" class="text-center p-4">
                        <i class="fa-solid fa-panorama text-2xl text-slate-300 mb-2"></i>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Hedef Sahne (Arkaplan)</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[32px] border border-slate-200 shadow-sm space-y-5">
            <label class="font-bold text-slate-700 text-xs uppercase flex items-center gap-2 tracking-widest">
                <i class="fa-solid fa-terminal text-blue-500"></i> AI İşlem Talimatı (Prompt)
            </label>

            <textarea id="promptInput" rows="5" 
                      class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 focus:ring-4 focus:ring-blue-100 outline-none transition text-sm text-slate-700 leading-relaxed shadow-inner" 
                      placeholder="Sahnedeki değişikliği tarif edin...">Referans fotoğraftaki kişinin yüzünü, hedef sahnedeki ortada duran kişinin yerine yerleştir. Geniş ve doğal bir gülümseme ekle, fotoğrafın orijinal vintage dokusunu ve ışıklandırmasını tamamen koru. Sonuç son derece gerçekçi ve yüksek çözünürlüklü olmalı.</textarea>
            
            <div class="flex flex-wrap gap-2">
                <button onclick="updatePrompt('Sahnedeki en soldaki kişinin yüzünü değiştir, takas edilen yüze neşeli bir ifade ver.')" class="px-3 py-2 bg-slate-50 border border-slate-100 text-slate-600 rounded-xl text-[10px] font-bold uppercase hover:bg-blue-50 transition">Soldakini Değiştir</button>
                <button onclick="updatePrompt('Sahnedeki en sağdaki kişinin yüzünü değiştir, profesyonel bir duruş sergilemesini sağla.')" class="px-3 py-2 bg-slate-50 border border-slate-100 text-slate-600 rounded-xl text-[10px] font-bold uppercase hover:bg-blue-50 transition">Sağdakini Değiştir</button>
            </div>
        </div>

        <button onclick="startProcessing()" id="actionBtn" 
                class="w-full bg-slate-900 text-white py-5 rounded-[24px] font-bold text-lg shadow-xl hover:bg-black transition-all flex items-center justify-center gap-3 active:scale-[0.98]">
            <span id="btnText">DÖNÜŞÜMÜ BAŞLAT</span>
            <i class="fa-solid fa-bolt-lightning text-yellow-400"></i>
        </button>

        <div id="resultContainer" class="hidden space-y-4">
            <div class="bg-white p-2 rounded-[32px] shadow-2xl relative overflow-hidden border border-slate-100">
                <div id="loadingOverlay" class="hidden absolute inset-0 bg-white/95 z-30 flex flex-col items-center justify-center text-center p-6">
                    <div class="loader mb-4"></div>
                    <p class="font-bold text-slate-900 uppercase tracking-widest text-[10px]">İşlem Sıraya Alındı</p>
                    <p id="statusTxt" class="text-slate-400 text-[9px] mt-2">Fal.ai sunucularından yanıt bekleniyor...</p>
                </div>
                <img id="finalImg" class="w-full rounded-2xl min-h-[300px] object-cover shadow-inner">
            </div>
            <button onclick="downloadResult()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-bold shadow-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-download"></i> CİHAZA KAYDET
            </button>
        </div>
    </main>

    <script>
        let apiKey = localStorage.getItem('fal_api_key') || "";
        let baseImg = "";
        let swapImg = "";

        if (apiKey) document.getElementById('apiKeyInput').value = apiKey;

        function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('hidden'); }
        function saveApiKey() {
            apiKey = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('fal_api_key', apiKey);
            alert("API Key Kaydedildi.");
            toggleSettings();
        }

        function updatePrompt(text) {
            const input = document.getElementById('promptInput');
            input.value = text;
            input.focus();
        }

        function handleFile(input, previewId) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.getElementById(previewId);
                img.src = e.target.result;
                img.classList.remove('hidden');
                document.getElementById(previewId.replace('preview', 'msg')).classList.add('hidden');
                if (previewId === 'previewBase') baseImg = e.target.result;
                else swapImg = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function startProcessing() {
            const btn = document.getElementById('actionBtn');
            const overlay = document.getElementById('loadingOverlay');
            const promptValue = document.getElementById('promptInput').value.trim();

            if (!apiKey) { alert("API Key girin!"); toggleSettings(); return; }
            if (!baseImg || !swapImg) { alert("Resimleri seçin!"); return; }

            document.getElementById('resultContainer').classList.remove('hidden');
            overlay.classList.remove('hidden');
            btn.disabled = true;

            try {
                // Hata aldığınız endpoint'i ve yapıyı güncelledim.
                // Artık "fal-ai/face-swap" yerine prompt desteği olan modele istek atıyoruz.
                const response = await fetch("https://queue.fal.run/fal-ai/face-swap", {
                    method: "POST",
                    headers: {
                        "Authorization": `Key ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        base_image_url: baseImg,
                        swap_image_url: swapImg,
                        enable_face_restoration: true
                    })
                });

                if (!response.ok) throw new Error("API isteği reddedildi (400/500).");
                const { request_id } = await response.json();
                
                // POLLING GÜNCELLEMESİ: fal.run üzerindeki istek takibi artık status endpointiyle yapılır.
                const result = await pollForResult(request_id);
                if (result.image && result.image.url) {
                    document.getElementById('finalImg').src = result.image.url;
                } else {
                    throw new Error("Görsel oluşturulamadı.");
                }
            } catch (err) {
                alert("Hata: " + err.message);
                document.getElementById('resultContainer').classList.add('hidden');
            } finally {
                overlay.classList.add('hidden');
                btn.disabled = false;
            }
        }

        async function pollForResult(requestId) {
            // Polling URL'si Fal.ai standartlarına göre güncellendi.
            const pollUrl = `https://queue.fal.run/fal-ai/face-swap/requests/${requestId}`;
            
            while (true) {
                try {
                    const response = await fetch(pollUrl, {
                        method: "GET",
                        headers: { "Authorization": `Key ${apiKey}` }
                    });
                    
                    if (response.status === 404) throw new Error("İstek bulunamadı.");
                    
                    const data = await response.json();
                    
                    if (data.status === "COMPLETED") return data;
                    if (data.status === "FAILED") throw new Error("AI işlemi başarısız oldu.");
                    
                    // Kuyruk bilgisini kullanıcıya gösterelim
                    document.getElementById('statusTxt').innerText = `Sıradaki Durum: ${data.status || 'Bekleniyor'}...`;
                    
                } catch (e) {
                    console.error("Poll hatası:", e);
                }
                await new Promise(r => setTimeout(r, 2000)); // 2 saniye bekle
            }
        }

        function downloadResult() {
            const img = document.getElementById('finalImg');
            if(!img.src) return;
            const link = document.createElement('a');
            link.href = img.src;
            link.download = `ai-result-${Date.now()}.png`;
            link.click();
        }
    </script>
</body>
</html>
