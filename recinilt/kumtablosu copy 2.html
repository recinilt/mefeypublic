<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Kum Tablosu | Moving Sand Art Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #08080c;
            --frame-wood: #1a1512;
            --gold-accent: #c9a962;
            --text-muted: #6b6b7b;
        }

        body {
            min-height: 100vh;
            background: var(--bg-deep);
            background-image: 
                radial-gradient(ellipse at 20% 30%, rgba(30, 25, 40, 0.5) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(25, 35, 45, 0.4) 0%, transparent 50%);
            font-family: 'Cormorant Garamond', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
        }

        .title-section {
            text-align: center;
            margin-bottom: 10px;
        }

        .title {
            font-size: clamp(1.1rem, 2.5vw, 1.6rem);
            font-weight: 300;
            color: #e8e4df;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .subtitle {
            font-family: 'Space Mono', monospace;
            font-size: 0.5rem;
            color: var(--gold-accent);
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        .frame-container {
            position: relative;
            perspective: 1000px;
        }

        .frame {
            position: relative;
            background: linear-gradient(145deg, var(--frame-wood), #0d0b09);
            border-radius: 6px;
            padding: 10px;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.6),
                0 0 1px rgba(201, 169, 98, 0.2),
                inset 0 1px 0 rgba(45, 37, 32, 0.5);
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .frame.rectangle { width: min(580px, 92vw); height: min(400px, 62vw); }
        .frame.circle { width: min(420px, 85vw); height: min(420px, 85vw); border-radius: 50%; padding: 15px; }
        .frame.oval { width: min(520px, 90vw); height: min(360px, 58vw); border-radius: 50%; padding: 12px; }
        .frame.square { width: min(400px, 80vw); height: min(400px, 80vw); }

        .frame.flipping { transform: rotateX(180deg); }

        .frame::before {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px solid rgba(201, 169, 98, 0.12);
            border-radius: inherit;
            pointer-events: none;
        }

        .glass-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: inherit;
            overflow: hidden;
            box-shadow: 
                inset 0 0 30px rgba(0,0,0,0.5),
                inset 0 0 60px rgba(0,15,30,0.3);
        }

        .glass-reflection {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                130deg,
                rgba(255,255,255,0.03) 0%,
                transparent 35%,
                transparent 65%,
                rgba(255,255,255,0.015) 100%
            );
            pointer-events: none;
            z-index: 100;
            border-radius: inherit;
        }

        /* LED Glow Effect */
        .led-glow {
            position: absolute;
            inset: -3px;
            border-radius: inherit;
            pointer-events: none;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .led-glow.active {
            opacity: 1;
        }

        #sandCanvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: inherit;
        }

        /* Background image layer */
        .bg-image {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.3;
            pointer-events: none;
            border-radius: inherit;
        }

        .controls {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            font-family: 'Space Mono', monospace;
            font-size: 0.42rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 6px 10px;
            background: transparent;
            border: 1px solid rgba(201, 169, 98, 0.25);
            color: var(--gold-accent);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            border-color: var(--gold-accent);
            box-shadow: 0 0 12px rgba(201, 169, 98, 0.15);
            background: rgba(201, 169, 98, 0.05);
        }

        .btn.primary { background: rgba(201, 169, 98, 0.08); }
        .btn.active { background: rgba(201, 169, 98, 0.2); border-color: var(--gold-accent); }

        .settings-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
            max-width: 650px;
        }

        .settings-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .setting-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .setting-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.38rem;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .slider-control {
            -webkit-appearance: none;
            width: 45px;
            height: 2px;
            background: rgba(201, 169, 98, 0.2);
            border-radius: 2px;
            outline: none;
        }

        .slider-control::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 8px;
            height: 8px;
            background: var(--gold-accent);
            border-radius: 50%;
            cursor: pointer;
        }

        select.theme-select {
            font-family: 'Space Mono', monospace;
            font-size: 0.38rem;
            padding: 3px 6px;
            background: rgba(20, 20, 25, 0.9);
            border: 1px solid rgba(201, 169, 98, 0.3);
            color: var(--gold-accent);
            border-radius: 3px;
            cursor: pointer;
        }

        .color-legend {
            display: flex;
            gap: 2px;
            align-items: center;
        }

        .color-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.3);
            cursor: help;
        }

        .stats {
            font-family: 'Space Mono', monospace;
            font-size: 0.4rem;
            color: rgba(201, 169, 98, 0.5);
            margin-top: 6px;
            letter-spacing: 0.05em;
            text-align: center;
        }

        .progress-bar {
            width: 100px;
            height: 3px;
            background: rgba(201, 169, 98, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 4px;
        }

        .progress-fill {
            height: 100%;
            background: var(--gold-accent);
            transition: width 0.3s;
        }

        /* Collapsible sections */
        .section-toggle {
            font-family: 'Space Mono', monospace;
            font-size: 0.4rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
            border: 1px solid rgba(201, 169, 98, 0.15);
            border-radius: 3px;
            margin: 4px;
            transition: all 0.3s;
        }

        .section-toggle:hover {
            border-color: rgba(201, 169, 98, 0.4);
            color: var(--gold-accent);
        }

        .collapsible {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .collapsible.open {
            max-height: 200px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes glitter {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @keyframes aurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>
    <div class="title-section">
        <h1 class="title">Moving Sand Art</h1>
        <p class="subtitle" id="themeTitle">Ocean Pacific</p>
    </div>

    <div class="frame-container">
        <div class="frame rectangle" id="frame">
            <div class="led-glow" id="ledGlow"></div>
            <div class="glass-container" id="glassContainer">
                <div class="bg-image" id="bgImage"></div>
                <canvas id="sandCanvas"></canvas>
                <div class="glass-reflection"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn primary" onclick="flipFrame()">↻ Çevir</button>
        <button class="btn" onclick="resetSand()">Sıfırla</button>
        <button class="btn" id="pauseBtn" onclick="togglePause()">Duraklat</button>
        <button class="btn" onclick="shakeSand()">Salla</button>
        <button class="btn" id="rotateBtn" onclick="toggleAutoRotate()">360°</button>
        <button class="btn" id="soundBtn" onclick="toggleSound()">🔇</button>
        <button class="btn" onclick="takeScreenshot()">📷</button>
    </div>

    <!-- Tema & Şekil -->
    <div class="settings-row">
        <div class="setting-group">
            <span class="setting-label">Tema:</span>
            <select class="theme-select" id="themeSelect" onchange="setTheme(this.value)">
                <option value="ocean">Ocean Pacific</option>
                <option value="aurora">Aurora Borealis</option>
                <option value="sunset">Sunset</option>
                <option value="arctic">Arctic Ice</option>
                <option value="desert">Desert</option>
                <option value="volcanic">Volcanic</option>
            </select>
        </div>
        <div class="setting-group">
            <span class="setting-label">Şekil:</span>
            <select class="theme-select" onchange="setShape(this.value)">
                <option value="rectangle">Dikdörtgen</option>
                <option value="circle">Daire</option>
                <option value="oval">Oval</option>
                <option value="square">Kare</option>
            </select>
        </div>
        <div class="setting-group">
            <span class="setting-label">Arka Plan:</span>
            <select class="theme-select" onchange="setBackground(this.value)">
                <option value="none">Yok</option>
                <option value="aurora">Aurora</option>
                <option value="sunset">Gün Batımı</option>
                <option value="stars">Yıldızlar</option>
                <option value="mountains">Dağlar</option>
            </select>
        </div>
    </div>

    <!-- Kum Ayarları -->
    <div class="settings-row">
        <div class="setting-group">
            <span class="setting-label">Kum%:</span>
            <input type="range" class="slider-control" min="5" max="45" value="22" onchange="setSandPercent(this.value)">
            <span class="setting-label" id="sandPercentLabel">22%</span>
        </div>
        <div class="setting-group">
            <span class="setting-label">Boyut:</span>
            <input type="range" class="slider-control" min="0.5" max="2.5" step="0.1" value="1.0" onchange="setSandSize(this.value)">
            <span class="setting-label" id="sandSizeLabel">1.0</span>
        </div>
        <div class="setting-group">
            <span class="setting-label">Hız:</span>
            <input type="range" class="slider-control" min="0.1" max="1.5" step="0.05" value="0.5" onchange="setSpeed(this.value)">
            <span class="setting-label" id="speedLabel">0.5x</span>
        </div>
        <div class="setting-group">
            <span class="setting-label">Glitter:</span>
            <input type="range" class="slider-control" min="0" max="30" value="10" onchange="setGlitter(this.value)">
            <span class="setting-label" id="glitterLabel">10%</span>
        </div>
    </div>

    <!-- Hava & Işık Ayarları -->
    <div class="settings-row">
        <div class="setting-group">
            <span class="setting-label">Hava:</span>
            <input type="range" class="slider-control" min="0" max="10" value="5" onchange="setAirBubbles(this.value)">
            <span class="setting-label" id="airCountLabel">5</span>
        </div>
        <div class="setting-group">
            <span class="setting-label">H.Hız:</span>
            <input type="range" class="slider-control" min="0.005" max="0.2" step="0.005" value="0.025" onchange="setAirSpeed(this.value)">
            <span class="setting-label" id="airSpeedLabel">0.025</span>
        </div>
        <div class="setting-group">
            <span class="setting-label">H.Boy:</span>
            <input type="range" class="slider-control" min="10" max="35" value="16" onchange="setAirSize(this.value)">
            <span class="setting-label" id="airSizeLabel">16</span>
        </div>
        <div class="setting-group">
            <span class="setting-label">LED:</span>
            <input type="range" class="slider-control" min="0" max="100" value="0" onchange="setLED(this.value)">
            <span class="setting-label" id="ledLabel">0%</span>
        </div>
    </div>

    <!-- Fizik Ayarları -->
    <div class="settings-row">
        <div class="setting-group">
            <span class="setting-label">Viskoz:</span>
            <input type="range" class="slider-control" min="0.95" max="0.999" step="0.001" value="0.992" onchange="setViscosity(this.value)">
            <span class="setting-label" id="viscosityLabel">0.992</span>
        </div>
        <div class="setting-group">
            <span class="setting-label">Sürtün:</span>
            <input type="range" class="slider-control" min="0.01" max="0.15" step="0.01" value="0.06" onchange="setFriction(this.value)">
            <span class="setting-label" id="frictionLabel">0.06</span>
        </div>
        <div class="setting-group">
            <span class="setting-label">Eğim:</span>
            <input type="range" class="slider-control" min="-30" max="30" value="0" onchange="setTilt(this.value)">
            <span class="setting-label" id="tiltLabel">0°</span>
        </div>
        <div class="setting-group">
            <span class="setting-label">Renkler:</span>
            <div class="color-legend" id="colorLegend"></div>
        </div>
    </div>

    <div class="stats" id="stats">Kum: 0 | FPS: 0</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
    <div class="stats" id="flowTime">Tahmini Süre: --</div>

    <script>
        // ============ CANVAS & TEMEL DEĞİŞKENLER ============
        const canvas = document.getElementById('sandCanvas');
        const ctx = canvas.getContext('2d');
        const frame = document.getElementById('frame');
        const glassContainer = document.getElementById('glassContainer');
        const ledGlow = document.getElementById('ledGlow');
        const bgImage = document.getElementById('bgImage');
        
        let width, height;
        let particles = [];
        let glitterParticles = [];
        let airBubbles = [];
        
        // Temel parametreler
        let baseGravity = 0.011;
        let speedMultiplier = 0.5;
        let airSpeedMultiplier = 0.025;
        let airBaseSize = 16;
        let sandBaseSize = 1.0;
        let sandFillPercent = 22;
        let airBubbleCount = 5;
        let glitterPercent = 10;
        let viscosityBase = 0.992;
        let frictionCoeff = 0.06;
        let tiltAngle = 0;
        let ledIntensity = 0;
        
        // Durum değişkenleri
        let isPaused = false;
        let visualFlipped = false;
        let autoRotate = false;
        let rotationAngle = 0;
        let soundEnabled = false;
        let currentShape = 'rectangle';
        let currentTheme = 'ocean';
        let currentBackground = 'none';
        
        // Zaman & performans
        let lastTime = 0;
        let frameCount = 0;
        let fps = 0;
        let lastFpsUpdate = 0;
        let flowStartTime = 0;
        let totalSandFallen = 0;
        
        const SPACING_MULTIPLIER = 3.0;
        const gapWidthRatio = 0.09;

        // ============ RENK TEMALARI ============
        const colorThemes = {
            ocean: {
                name: 'Ocean Pacific',
                colors: [
                    { color: '#0a1520', name: 'Lacivert', density: 1.00, distribution: 0.20 },
                    { color: '#1a3555', name: 'Mavi', density: 0.82, distribution: 0.20 },
                    { color: '#c9a962', name: 'Altın', density: 0.64, distribution: 0.20 },
                    { color: '#e8d5b0', name: 'Krem', density: 0.46, distribution: 0.20 },
                    { color: '#ffffff', name: 'Beyaz', density: 0.28, distribution: 0.20 }
                ],
                glitter: '#ffd700',
                led: 'rgba(30, 100, 180, 0.6)',
                bg: 'linear-gradient(180deg, #0a1420 0%, #0c1825 50%, #0e1c2a 100%)'
            },
            aurora: {
                name: 'Aurora Borealis',
                colors: [
                    { color: '#1a2a3a', name: 'Gece', density: 1.00, distribution: 0.18 },
                    { color: '#2d5a5a', name: 'Turkuaz', density: 0.85, distribution: 0.22 },
                    { color: '#4a9090', name: 'Aqua', density: 0.68, distribution: 0.22 },
                    { color: '#7ec8a3', name: 'Yeşil', density: 0.50, distribution: 0.20 },
                    { color: '#e8f4f0', name: 'Buz', density: 0.32, distribution: 0.18 }
                ],
                glitter: '#00ffaa',
                led: 'rgba(0, 255, 150, 0.5)',
                bg: 'linear-gradient(180deg, #0a1a1a 0%, #0d2525 50%, #102828 100%)'
            },
            sunset: {
                name: 'Sunset',
                colors: [
                    { color: '#2a1a15', name: 'Kahve', density: 1.00, distribution: 0.18 },
                    { color: '#8b4513', name: 'Toprak', density: 0.82, distribution: 0.20 },
                    { color: '#cd853f', name: 'Peru', density: 0.64, distribution: 0.22 },
                    { color: '#daa520', name: 'Altın', density: 0.46, distribution: 0.22 },
                    { color: '#ffe4b5', name: 'Krem', density: 0.28, distribution: 0.18 }
                ],
                glitter: '#ff6600',
                led: 'rgba(255, 120, 50, 0.5)',
                bg: 'linear-gradient(180deg, #1a1210 0%, #251815 50%, #2a1a15 100%)'
            },
            arctic: {
                name: 'Arctic Ice',
                colors: [
                    { color: '#1a2535', name: 'Derin', density: 1.00, distribution: 0.15 },
                    { color: '#3a5a7a', name: 'Buz Mavi', density: 0.80, distribution: 0.22 },
                    { color: '#6a9ac0', name: 'Gökyüzü', density: 0.60, distribution: 0.25 },
                    { color: '#a0c8e8', name: 'Açık Mavi', density: 0.40, distribution: 0.20 },
                    { color: '#e8f4ff', name: 'Kar', density: 0.22, distribution: 0.18 }
                ],
                glitter: '#c0e8ff',
                led: 'rgba(150, 200, 255, 0.6)',
                bg: 'linear-gradient(180deg, #101820 0%, #152535 50%, #1a2a40 100%)'
            },
            desert: {
                name: 'Desert',
                colors: [
                    { color: '#3a2010', name: 'Koyu Kum', density: 1.00, distribution: 0.18 },
                    { color: '#8b5a2b', name: 'Kahverengi', density: 0.80, distribution: 0.22 },
                    { color: '#d2a060', name: 'Kum', density: 0.60, distribution: 0.25 },
                    { color: '#e8c088', name: 'Açık Kum', density: 0.40, distribution: 0.20 },
                    { color: '#f5e0c0', name: 'Bej', density: 0.25, distribution: 0.15 }
                ],
                glitter: '#ffcc00',
                led: 'rgba(255, 180, 80, 0.5)',
                bg: 'linear-gradient(180deg, #1a1508 0%, #252010 50%, #302818 100%)'
            },
            volcanic: {
                name: 'Volcanic',
                colors: [
                    { color: '#0a0505', name: 'Obsidyen', density: 1.00, distribution: 0.22 },
                    { color: '#2a1515', name: 'Kül', density: 0.82, distribution: 0.20 },
                    { color: '#5a2020', name: 'Magma', density: 0.62, distribution: 0.20 },
                    { color: '#a03030', name: 'Lav', density: 0.42, distribution: 0.20 },
                    { color: '#ff6040', name: 'Ateş', density: 0.25, distribution: 0.18 }
                ],
                glitter: '#ff4400',
                led: 'rgba(255, 60, 20, 0.6)',
                bg: 'linear-gradient(180deg, #0a0505 0%, #150808 50%, #1a0a0a 100%)'
            }
        };

        let sandColors = colorThemes.ocean.colors;

        // ============ SES SİSTEMİ ============
        let audioContext = null;
        let ambientOsc = null;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playAmbient() {
            if (!audioContext || !soundEnabled) return;
            
            // Yumuşak ambient ses
            ambientOsc = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            ambientOsc.type = 'sine';
            ambientOsc.frequency.setValueAtTime(80, audioContext.currentTime);
            gainNode.gain.setValueAtTime(0.02, audioContext.currentTime);
            
            ambientOsc.connect(gainNode);
            gainNode.connect(audioContext.destination);
            ambientOsc.start();
        }

        function stopAmbient() {
            if (ambientOsc) {
                ambientOsc.stop();
                ambientOsc = null;
            }
        }

        function playDropSound() {
            if (!audioContext || !soundEnabled) return;
            
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(200 + Math.random() * 100, audioContext.currentTime);
            gain.gain.setValueAtTime(0.01, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1);
            
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + 0.1);
        }

        // ============ YARDIMCI FONKSİYONLAR ============
        function initColorLegend() {
            const legend = document.getElementById('colorLegend');
            legend.innerHTML = '';
            sandColors.forEach((c) => {
                const dot = document.createElement('div');
                dot.className = 'color-dot';
                dot.style.background = c.color;
                dot.title = `${c.name}: ${c.density.toFixed(2)}`;
                legend.appendChild(dot);
            });
        }

        function resize() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            width = rect.width;
            height = rect.height;
            
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            
            ctx.scale(dpr, dpr);
            createAirBubbles();
        }

        function calculateParticleCount(fillPercent) {
            const totalArea = width * height;
            const targetFillArea = totalArea * (fillPercent / 100);
            const effectiveParticleArea = Math.PI * sandBaseSize * sandBaseSize * SPACING_MULTIPLIER * SPACING_MULTIPLIER;
            return Math.floor(targetFillArea / effectiveParticleArea);
        }

        function getTrianglePoints() {
            const gapWidth = width * gapWidthRatio;
            const gapCenter = width * 0.5;
            const gapLeft = gapCenter - gapWidth / 2;
            const gapRight = gapCenter + gapWidth / 2;
            
            return {
                left: [
                    { x: 0, y: 0 },
                    { x: 0, y: height },
                    { x: gapLeft, y: height * 0.5 }
                ],
                right: [
                    { x: width, y: 0 },
                    { x: width, y: height },
                    { x: gapRight, y: height * 0.5 }
                ],
                gapLeft, gapRight, gapCenter, gapWidth
            };
        }

        function createAirBubbles() {
            airBubbles = [];
            const { gapCenter, gapWidth } = getTrianglePoints();
            
            for (let i = 0; i < airBubbleCount; i++) {
                const radius = airBaseSize * 0.7 + Math.random() * airBaseSize * 0.6;
                airBubbles.push({
                    x: gapCenter + (Math.random() - 0.5) * (gapWidth - radius * 2) * 0.8,
                    y: height * 0.2 + Math.random() * height * 0.6,
                    radius: radius,
                    wobble: Math.random() * Math.PI * 2,
                    wobbleSpeed: 0.004 + Math.random() * 0.006,
                    vy: 0
                });
            }
        }

        function getColorIndex() {
            const random = Math.random();
            let cumulative = 0;
            for (let i = 0; i < sandColors.length; i++) {
                cumulative += sandColors[i].distribution;
                if (random <= cumulative) return i;
            }
            return sandColors.length - 1;
        }

        function isInsideTriangle(px, py, points) {
            const [p1, p2, p3] = points;
            const sign = (px, py, x1, y1, x2, y2) => 
                (px - x2) * (y1 - y2) - (x1 - x2) * (py - y2);
            
            const d1 = sign(px, py, p1.x, p1.y, p2.x, p2.y);
            const d2 = sign(px, py, p2.x, p2.y, p3.x, p3.y);
            const d3 = sign(px, py, p3.x, p3.y, p1.x, p1.y);
            
            return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
        }

        function closestPointOnSegment(px, py, p1, p2) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const len2 = dx * dx + dy * dy;
            if (len2 === 0) return { x: p1.x, y: p1.y };
            let t = Math.max(0, Math.min(1, ((px - p1.x) * dx + (py - p1.y) * dy) / len2));
            return { x: p1.x + t * dx, y: p1.y + t * dy };
        }

        // ============ PARTICLE SINIFI ============
        class Particle {
            constructor(x, y, isGlitter = false) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.radius = sandBaseSize * (0.85 + Math.random() * 0.3);
                this.colorIndex = getColorIndex();
                this.color = sandColors[this.colorIndex].color;
                this.density = sandColors[this.colorIndex].density;
                this.collisionRadius = this.radius * SPACING_MULTIPLIER / 2;
                
                // Glitter özellikleri
                this.isGlitter = isGlitter;
                this.glitterPhase = Math.random() * Math.PI * 2;
                this.glitterSpeed = 0.05 + Math.random() * 0.1;
            }

            update() {
                // Eğim etkisi
                const tiltRad = tiltAngle * Math.PI / 180;
                const gravityX = Math.sin(tiltRad) * baseGravity * 0.5;
                const gravityY = Math.cos(tiltRad) * baseGravity;
                
                // Yerçekimi (yoğunluğa göre - Stokes)
                const effectiveGravityY = gravityY * this.density * speedMultiplier;
                const effectiveGravityX = gravityX * this.density * speedMultiplier;
                
                this.vy += effectiveGravityY;
                this.vx += effectiveGravityX;
                
                // Rastgele hareket
                this.vx += (Math.random() - 0.5) * 0.001 * speedMultiplier;
                
                // Viskozite
                const viscosity = viscosityBase - (1 - this.density) * 0.008;
                this.vx *= viscosity;
                this.vy *= viscosity;
                
                // Max hız
                const maxSpeed = 0.6 * speedMultiplier * (0.5 + this.density * 0.5);
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > maxSpeed) {
                    this.vx = (this.vx / speed) * maxSpeed;
                    this.vy = (this.vy / speed) * maxSpeed;
                }
                
                this.x += this.vx;
                this.y += this.vy;
                
                this.handleObstacleCollisions();
                this.handleBubbleInteraction();
                
                // Kenarlar
                if (this.x < this.collisionRadius) {
                    this.x = this.collisionRadius;
                    this.vx *= -0.15;
                }
                if (this.x > width - this.collisionRadius) {
                    this.x = width - this.collisionRadius;
                    this.vx *= -0.15;
                }
                if (this.y > height - this.collisionRadius) {
                    this.y = height - this.collisionRadius;
                    this.vy *= -0.08;
                    this.vx *= 0.6;
                    if (Math.abs(this.vy) > 0.1) playDropSound();
                }
                if (this.y < this.collisionRadius) {
                    this.y = this.collisionRadius;
                    this.vy *= -0.15;
                }
                
                // Glitter animasyonu
                if (this.isGlitter) {
                    this.glitterPhase += this.glitterSpeed;
                }
            }

            handleObstacleCollisions() {
                const tri = getTrianglePoints();
                if (isInsideTriangle(this.x, this.y, tri.left)) {
                    this.pushOutOfTriangle(tri.left);
                }
                if (isInsideTriangle(this.x, this.y, tri.right)) {
                    this.pushOutOfTriangle(tri.right);
                }
            }

            pushOutOfTriangle(points) {
                let minDist = Infinity;
                let closestPoint = null;
                let normalX = 0, normalY = 0;
                
                for (let i = 0; i < 3; i++) {
                    const p1 = points[i];
                    const p2 = points[(i + 1) % 3];
                    const closest = closestPointOnSegment(this.x, this.y, p1, p2);
                    const dx = this.x - closest.x;
                    const dy = this.y - closest.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < minDist) {
                        minDist = dist;
                        closestPoint = closest;
                        const edgeDx = p2.x - p1.x;
                        const edgeDy = p2.y - p1.y;
                        const len = Math.sqrt(edgeDx * edgeDx + edgeDy * edgeDy);
                        normalX = -edgeDy / len;
                        normalY = edgeDx / len;
                    }
                }
                
                const centerX = (points[0].x + points[1].x + points[2].x) / 3;
                const centerY = (points[0].y + points[1].y + points[2].y) / 3;
                if (normalX * (centerX - closestPoint.x) + normalY * (centerY - closestPoint.y) > 0) {
                    normalX = -normalX;
                    normalY = -normalY;
                }
                
                this.x = closestPoint.x + normalX * (this.collisionRadius + 0.5);
                this.y = closestPoint.y + normalY * (this.collisionRadius + 0.5);
                
                const dotProduct = this.vx * normalX + this.vy * normalY;
                this.vx -= 1.8 * dotProduct * normalX;
                this.vy -= 1.8 * dotProduct * normalY;
                this.vx *= 0.4;
                this.vy *= 0.4;
            }

            handleBubbleInteraction() {
                for (const bubble of airBubbles) {
                    const dx = this.x - bubble.x;
                    const dy = this.y - bubble.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = bubble.radius + this.collisionRadius + 2;
                    
                    if (dist < minDist && dist > 0) {
                        const overlap = minDist - dist;
                        const nx = dx / dist;
                        const ny = dy / dist;
                        
                        this.x += nx * overlap * 0.95;
                        this.y += ny * overlap * 0.5;
                        this.vx += nx * 0.015;
                        this.vy *= 0.75 + this.density * 0.15;
                    }
                }
            }

            getDrawCoords() {
                if (visualFlipped) {
                    return { x: this.x, y: height - this.y };
                }
                return { x: this.x, y: this.y };
            }

            draw() {
                const coords = this.getDrawCoords();
                ctx.beginPath();
                ctx.arc(coords.x, coords.y, this.radius, 0, Math.PI * 2);
                
                if (this.isGlitter) {
                    const glitterAlpha = 0.5 + 0.5 * Math.sin(this.glitterPhase);
                    ctx.fillStyle = colorThemes[currentTheme].glitter;
                    ctx.globalAlpha = glitterAlpha;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    
                    // Parlama efekti
                    if (glitterAlpha > 0.8) {
                        ctx.beginPath();
                        ctx.arc(coords.x, coords.y, this.radius * 1.5, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${(glitterAlpha - 0.8) * 0.5})`;
                        ctx.fill();
                    }
                } else {
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
            }
        }

        // ============ PARÇACIK OLUŞTURMA ============
        function initParticles() {
            particles = [];
            
            const { gapLeft, gapRight, gapWidth } = getTrianglePoints();
            const numParticles = calculateParticleCount(sandFillPercent);
            const numGlitter = Math.floor(numParticles * glitterPercent / 100);
            
            for (let i = 0; i < numParticles; i++) {
                let x, y;
                let attempts = 0;
                
                do {
                    const rand = Math.random();
                    if (rand < 0.75) {
                        x = gapLeft + Math.random() * gapWidth;
                    } else if (rand < 0.875) {
                        x = 3 + Math.random() * 12;
                    } else {
                        x = width - 15 + Math.random() * 12;
                    }
                    y = height * 0.55 + Math.random() * height * 0.43;
                    attempts++;
                } while (
                    (isInsideTriangle(x, y, getTrianglePoints().left) || 
                     isInsideTriangle(x, y, getTrianglePoints().right)) && 
                    attempts < 100
                );
                
                if (attempts < 100) {
                    const isGlitter = i < numGlitter;
                    particles.push(new Particle(x, y, isGlitter));
                }
            }
            
            flowStartTime = Date.now();
            totalSandFallen = 0;
            updateStats();
        }

        // ============ ÇİZİM FONKSİYONLARI ============
        function drawBackground() {
            // Tema arka planı
            const theme = colorThemes[currentTheme];
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            
            if (visualFlipped) {
                gradient.addColorStop(0, theme.bg.includes('#') ? '#0e1c2a' : '#0a1420');
                gradient.addColorStop(1, theme.bg.includes('#') ? '#0a1420' : '#0e1c2a');
            } else {
                gradient.addColorStop(0, '#0a1420');
                gradient.addColorStop(1, '#0e1c2a');
            }
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            
            // Animasyonlu arka plan
            if (currentBackground !== 'none') {
                drawAnimatedBackground();
            }
        }

        function drawAnimatedBackground() {
            const time = Date.now() * 0.001;
            ctx.globalAlpha = 0.15;
            
            if (currentBackground === 'aurora') {
                // Aurora efekti
                for (let i = 0; i < 3; i++) {
                    const gradient = ctx.createLinearGradient(0, 0, width, height * 0.5);
                    gradient.addColorStop(0, 'transparent');
                    gradient.addColorStop(0.3 + Math.sin(time + i) * 0.2, `hsla(${120 + i * 30 + time * 10}, 70%, 50%, 0.3)`);
                    gradient.addColorStop(0.7, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, width, height * 0.6);
                }
            } else if (currentBackground === 'sunset') {
                const gradient = ctx.createLinearGradient(0, 0, 0, height * 0.7);
                gradient.addColorStop(0, `hsla(${20 + Math.sin(time * 0.5) * 10}, 80%, 50%, 0.3)`);
                gradient.addColorStop(0.5, `hsla(${40 + Math.sin(time * 0.3) * 10}, 70%, 40%, 0.2)`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);
            } else if (currentBackground === 'stars') {
                for (let i = 0; i < 30; i++) {
                    const x = (i * 73) % width;
                    const y = (i * 47) % (height * 0.6);
                    const twinkle = 0.3 + 0.7 * Math.sin(time * 2 + i);
                    ctx.beginPath();
                    ctx.arc(x, y, 1, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${twinkle * 0.5})`;
                    ctx.fill();
                }
            } else if (currentBackground === 'mountains') {
                ctx.fillStyle = 'rgba(30, 40, 50, 0.3)';
                ctx.beginPath();
                ctx.moveTo(0, height * 0.5);
                for (let x = 0; x <= width; x += 20) {
                    const y = height * 0.3 + Math.sin(x * 0.02 + time * 0.2) * 30 + Math.sin(x * 0.05) * 20;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(width, height);
                ctx.lineTo(0, height);
                ctx.fill();
            }
            
            ctx.globalAlpha = 1;
        }

        function drawObstacles() {
            const tri = getTrianglePoints();
            const gradient = ctx.createLinearGradient(0, 0, width, 0);
            gradient.addColorStop(0, '#080c12');
            gradient.addColorStop(0.5, '#0b1018');
            gradient.addColorStop(1, '#080c12');
            
            ctx.fillStyle = gradient;
            
            const drawTriangle = (points) => {
                ctx.beginPath();
                const transformedPoints = points.map(p => 
                    visualFlipped ? { x: p.x, y: height - p.y } : p
                );
                ctx.moveTo(transformedPoints[0].x, transformedPoints[0].y);
                transformedPoints.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = 'rgba(60, 80, 100, 0.2)';
                ctx.lineWidth = 1;
                ctx.stroke();
            };
            
            drawTriangle(tri.left);
            drawTriangle(tri.right);
        }

        function drawAirBubbles() {
            const { gapLeft, gapRight } = getTrianglePoints();
            
            for (const bubble of airBubbles) {
                bubble.wobble += bubble.wobbleSpeed;
                const wobbleX = Math.sin(bubble.wobble) * 2;
                const wobbleY = Math.cos(bubble.wobble * 0.7) * 1.5;
                
                // Yükselme
                const targetY = bubble.radius + 15;
                bubble.vy += (targetY - bubble.y) * 0.00005 * airSpeedMultiplier;
                bubble.vy *= 0.995;
                bubble.y += bubble.vy;
                
                // Sınırlar
                bubble.y = Math.max(bubble.radius + 8, Math.min(height - bubble.radius - 8, bubble.y));
                bubble.x = Math.max(gapLeft + bubble.radius + 3, Math.min(gapRight - bubble.radius - 3, bubble.x));
                
                let drawX = bubble.x + wobbleX;
                let drawY = visualFlipped ? height - (bubble.y + wobbleY) : bubble.y + wobbleY;
                
                // Kabarcık çizimi
                const bubbleGradient = ctx.createRadialGradient(
                    drawX - bubble.radius * 0.25, drawY - bubble.radius * 0.25, 0,
                    drawX, drawY, bubble.radius
                );
                bubbleGradient.addColorStop(0, 'rgba(140, 180, 220, 0.12)');
                bubbleGradient.addColorStop(0.5, 'rgba(90, 130, 170, 0.06)');
                bubbleGradient.addColorStop(1, 'rgba(50, 90, 130, 0.02)');
                
                ctx.beginPath();
                ctx.arc(drawX, drawY, bubble.radius, 0, Math.PI * 2);
                ctx.fillStyle = bubbleGradient;
                ctx.fill();
                ctx.strokeStyle = 'rgba(120, 160, 200, 0.15)';
                ctx.lineWidth = 0.5;
                ctx.stroke();
                
                // Yansıma
                ctx.beginPath();
                ctx.arc(drawX - bubble.radius * 0.3, drawY - bubble.radius * 0.3, bubble.radius * 0.12, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.fill();
            }
        }

        // ============ ÇARPIŞMA YÖNETİMİ ============
        function handleParticleCollisions() {
            const cellSize = sandBaseSize * SPACING_MULTIPLIER;
            const grid = new Map();
            
            for (const p of particles) {
                const key = Math.floor(p.x / cellSize) + ',' + Math.floor(p.y / cellSize);
                if (!grid.has(key)) grid.set(key, []);
                grid.get(key).push(p);
            }
            
            for (const [key, cell] of grid) {
                const [cx, cy] = key.split(',').map(Number);
                
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        const neighborCell = grid.get((cx + dx) + ',' + (cy + dy));
                        if (!neighborCell) continue;
                        
                        for (const p1 of cell) {
                            for (const p2 of neighborCell) {
                                if (p1 === p2) continue;
                                
                                const ddx = p2.x - p1.x;
                                const ddy = p2.y - p1.y;
                                const dist = Math.sqrt(ddx * ddx + ddy * ddy);
                                const minDist = p1.collisionRadius + p2.collisionRadius;
                                
                                if (dist < minDist && dist > 0.01) {
                                    const overlap = minDist - dist;
                                    const nx = ddx / dist;
                                    const ny = ddy / dist;
                                    
                                    p1.x -= nx * overlap * 0.5;
                                    p1.y -= ny * overlap * 0.5;
                                    p2.x += nx * overlap * 0.5;
                                    p2.y += ny * overlap * 0.5;
                                    
                                    const relVelDot = (p1.vx - p2.vx) * nx + (p1.vy - p2.vy) * ny;
                                    if (relVelDot > 0) {
                                        const impulse = relVelDot * frictionCoeff;
                                        p1.vx -= impulse * nx;
                                        p1.vy -= impulse * ny;
                                        p2.vx += impulse * nx;
                                        p2.vy += impulse * ny;
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }

        // ============ GÜNCELLEME & STATS ============
        function updateStats() {
            // Akış süresi hesaplama
            const elapsed = (Date.now() - flowStartTime) / 1000;
            const sandAtBottom = particles.filter(p => p.y > height * 0.8).length;
            const progress = (sandAtBottom / particles.length) * 100;
            
            document.getElementById('progressFill').style.width = progress + '%';
            
            let estimatedTime = '--';
            if (progress > 5 && progress < 95) {
                const remainingPercent = 100 - progress;
                const rate = progress / elapsed;
                const remaining = remainingPercent / rate;
                if (remaining < 3600) {
                    const mins = Math.floor(remaining / 60);
                    const secs = Math.floor(remaining % 60);
                    estimatedTime = `${mins}:${secs.toString().padStart(2, '0')}`;
                }
            } else if (progress >= 95) {
                estimatedTime = 'Tamamlandı';
            }
            
            document.getElementById('flowTime').textContent = `Tahmini: ${estimatedTime}`;
            document.getElementById('stats').innerHTML = 
                `Kum: ${particles.length.toLocaleString()} | Glitter: ${Math.floor(particles.length * glitterPercent / 100)} | FPS: ${fps}`;
        }

        // ============ ANA DÖNGÜ ============
        function update(timestamp) {
            if (!lastTime) lastTime = timestamp;
            lastTime = timestamp;
            
            frameCount++;
            if (timestamp - lastFpsUpdate > 1000) {
                fps = frameCount;
                frameCount = 0;
                lastFpsUpdate = timestamp;
                updateStats();
            }

            // Otomatik döndürme
            if (autoRotate) {
                rotationAngle += 0.3;
                frame.style.transform = `rotate(${rotationAngle}deg)`;
            }

            if (!isPaused) {
                for (const p of particles) {
                    p.update();
                }
                
                for (let i = 0; i < 4; i++) {
                    handleParticleCollisions();
                }
            }

            drawBackground();
            drawObstacles();
            drawAirBubbles();
            
            // Parçacıkları sırala ve çiz
            const sortedParticles = [...particles].sort((a, b) => {
                const ay = visualFlipped ? height - a.y : a.y;
                const by = visualFlipped ? height - b.y : b.y;
                return ay - by;
            });
            
            for (const p of sortedParticles) {
                p.draw();
            }

            requestAnimationFrame(update);
        }

        // ============ KONTROL FONKSİYONLARI ============
        function flipFrame() {
            frame.classList.add('flipping');
            
            setTimeout(() => {
                visualFlipped = !visualFlipped;
                flowStartTime = Date.now();
                
                for (const p of particles) {
                    p.y = height - p.y;
                    p.vy = -p.vy * 0.2;
                    p.vx *= 0.4;
                }
                
                for (const bubble of airBubbles) {
                    bubble.y = height - bubble.y;
                    bubble.vy = 0;
                }
            }, 400);
            
            setTimeout(() => frame.classList.remove('flipping'), 800);
        }

        function resetSand() {
            visualFlipped = false;
            frame.style.transform = '';
            rotationAngle = 0;
            initParticles();
            createAirBubbles();
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pauseBtn').textContent = isPaused ? 'Devam' : 'Duraklat';
            document.getElementById('pauseBtn').classList.toggle('active', isPaused);
        }

        function shakeSand() {
            for (const p of particles) {
                p.vx += (Math.random() - 0.5) * 0.8;
                p.vy += (Math.random() - 0.5) * 0.8;
            }
            for (const bubble of airBubbles) {
                bubble.vy += (Math.random() - 0.5) * 0.3;
                bubble.x += (Math.random() - 0.5) * 4;
            }
        }

        function toggleAutoRotate() {
            autoRotate = !autoRotate;
            document.getElementById('rotateBtn').classList.toggle('active', autoRotate);
            if (!autoRotate) {
                frame.style.transform = '';
                rotationAngle = 0;
            }
        }

        function toggleSound() {
            initAudio();
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
            document.getElementById('soundBtn').classList.toggle('active', soundEnabled);
            
            if (soundEnabled) {
                playAmbient();
            } else {
                stopAmbient();
            }
        }

        function takeScreenshot() {
            const link = document.createElement('a');
            link.download = `sand-art-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        // ============ AYAR FONKSİYONLARI ============
        function setTheme(theme) {
            currentTheme = theme;
            sandColors = colorThemes[theme].colors;
            document.getElementById('themeTitle').textContent = colorThemes[theme].name;
            
            // LED rengi güncelle
            ledGlow.style.boxShadow = `0 0 ${ledIntensity}px ${ledIntensity/2}px ${colorThemes[theme].led}`;
            
            initColorLegend();
            resetSand();
        }

        function setShape(shape) {
            currentShape = shape;
            frame.className = 'frame ' + shape;
            setTimeout(() => {
                resize();
                resetSand();
            }, 100);
        }

        function setBackground(bg) {
            currentBackground = bg;
        }

        function setSandPercent(value) {
            sandFillPercent = parseInt(value);
            document.getElementById('sandPercentLabel').textContent = value + '%';
            resetSand();
        }

        function setSandSize(value) {
            sandBaseSize = parseFloat(value);
            document.getElementById('sandSizeLabel').textContent = value;
            resetSand();
        }

        function setSpeed(value) {

            document.getElementById('speedLabel').textContent = value + 'x';
        }

            document.getElementById('glitterLabel').textContent = value + '%';
            resetSand();
        }

            airBubbleCount = parseInt(count);
            document.getElementById('airCountLabel').textContent = count;
            createAirBubbles();
        }

            } else {

            }
        }

        function setViscosity(value) {
            viscosityBase = parseFloat(value);
            document.getElementById('viscosityLabel').textContent = value;
        }

        function setFriction(value) {
            frictionCoeff = parseFloat(value);
            document.getElementById('frictionLabel').textContent = value;
        }

        function setTilt(value) {
            tiltAngle = parseInt(value);
            document.getElementById('tiltLabel').textContent = value + '°';
        }

        // ============ BAŞLATMA ============
        window.addEventListener('resize', () => {
            resize();
            resetSand();
        });

        // Tıklama etkileşimi
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            let clickX = e.clientX - rect.left;
            let clickY = e.clientY - rect.top;
            
            if (visualFlipped) clickY = height - clickY;
            
            for (const p of particles) {
                const dx = p.x - clickX;
                const dy = p.y - clickY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 40) {
                    const force = (40 - dist) / 40 * 0.7;
                    p.vx += (dx / dist) * force;
                    p.vy += (dy / dist) * force;
                }
            }
        });

        // Sürükleme etkileşimi
        let isDragging = false;
        let lastDragX, lastDragY;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastDragX = e.clientX;
            lastDragY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const rect = canvas.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            let mouseY = e.clientY - rect.top;
            
            if (visualFlipped) mouseY = height - mouseY;
            
            const dragForceX = (e.clientX - lastDragX) * 0.02;
            const dragForceY = (e.clientY - lastDragY) * 0.02;
            
            for (const p of particles) {
                const dx = p.x - mouseX;
                const dy = p.y - mouseY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 50) {
                    p.vx += dragForceX * (1 - dist / 50);
                    p.vy += dragForceY * (1 - dist / 50);
                }
            }
            
            lastDragX = e.clientX;
            lastDragY = e.clientY;
        });

        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mouseleave', () => isDragging = false);

        // Cihaz eğimi (mobil)
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if (e.gamma !== null) {
                    tiltAngle = Math.max(-30, Math.min(30, e.gamma));
                }
            });
        }

        // Başlat
        initColorLegend();
        resize();
        initParticles();
        requestAnimationFrame(update);
    </script>
</body>
</html>
