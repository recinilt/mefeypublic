<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Video Studio Pro - Cinematic Masterpiece</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #020617;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .video-canvas {
            aspect-ratio: 16 / 9;
            background: #000;
            position: relative;
            overflow: hidden;
            border-radius: 2rem;
            box-shadow: 0 0 100px -20px rgba(59, 130, 246, 0.4);
        }

        .slide-item {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Tarayıcı önizlemesinde basıklığı önler */
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            transform-origin: center center;
        }

        /* Video FX Animasyonları */
        .slide-item.active { opacity: 1; }
        
        .fx-zoom-in.active { animation: zoomIn 20s linear forwards; }
        .fx-zoom-out.active { animation: zoomOut 20s linear forwards; }
        .fx-pan-left.active { animation: panLeft 20s linear forwards; }
        .fx-pan-right.active { animation: panRight 20s linear forwards; }
        .fx-tilt-cw.active { animation: tiltCW 20s linear forwards; }
        .fx-tilt-ccw.active { animation: tiltCCW 20s linear forwards; }
        .fx-floating.active { animation: floating 20s ease-in-out infinite; }
        .fx-pulse.active { animation: pulse 20s ease-in-out infinite; }

        @keyframes zoomIn { 0% { transform: scale(1); } 100% { transform: scale(1.3); } }
        @keyframes zoomOut { 0% { transform: scale(1.3); } 100% { transform: scale(1); } }
        @keyframes panLeft { 0% { transform: scale(1.2) translateX(5%); } 100% { transform: scale(1.2) translateX(-5%); } }
        @keyframes panRight { 0% { transform: scale(1.2) translateX(-5%); } 100% { transform: scale(1.2) translateX(5%); } }
        @keyframes tiltCW { 0% { transform: scale(1.2) rotate(0deg); } 100% { transform: scale(1.2) rotate(3deg); } }
        @keyframes tiltCCW { 0% { transform: scale(1.2) rotate(0deg); } 100% { transform: scale(1.2) rotate(-3deg); } }
        @keyframes floating { 0% { transform: scale(1.1) translateY(0); } 50% { transform: scale(1.1) translateY(-2%); } 100% { transform: scale(1.1) translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1.05); } 50% { transform: scale(1.15); } 100% { transform: scale(1.05); } }

        .style-btn {
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.05);
            background: rgba(255,255,255,0.02);
            font-size: 10px;
            font-weight: 800;
            text-align: center;
        }

        .style-btn.selected {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.2);
        }

        .loader-ring {
            border: 3px solid #1e293b;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .progress-bar {
            height: 6px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #a855f7);
            width: 0%;
        }

        .subtitle-box {
            text-shadow: 0 4px 15px rgba(0,0,0,1);
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
        }

        .scene-card {
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .scene-card:hover {
            transform: translateY(-5px);
            border-color: rgba(59, 130, 246, 0.5);
        }

        #exportCanvas { display: none; }
        
        .mode-toggle {
            display: flex;
            background: rgba(0,0,0,0.3);
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
        }
        .mode-btn {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 800;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .mode-btn.active {
            background: #3b82f6;
            color: white;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>

        const VIDEO_FX = ["fx-zoom-in", "fx-zoom-out", "fx-pan-left", "fx-pan-right", "fx-tilt-cw", "fx-tilt-ccw", "fx-floating", "fx-pulse"];

        let scenes = [];
        let selectedStyle = ART_STYLES[0];
        let productionMode = "image"; 
        let audioDuration = 0;
        let isPlaying = false;
        let activeIdx = -1;
        let referenceImageBase64 = null;

        const el = {
            audio: document.getElementById('audioPlayer'),
            audioInput: document.getElementById('audioInput'),
            refInput: document.getElementById('refImageInput'),
            refPreview: document.getElementById('refPreview'),
            lyrics: document.getElementById('lyricsInput'),
            styles: document.getElementById('styleGrid'),
            mood: document.getElementById('moodInput'),
            grid: document.getElementById('scenesGrid'),
            play: document.getElementById('playBtn'),
            logs: document.getElementById('statusLogs'),
            time: document.getElementById('timeDisplay'),
            progress: document.getElementById('progressBar'),
            subtitle: document.getElementById('subtitleText'),
            layers: document.getElementById('imageLayer'),
            reset: document.getElementById('resetBtn'),
            generateAll: document.getElementById('generateAllBtn'),
            exportBtn: document.getElementById('exportBtn'),
            scCount: document.getElementById('scCount'),
            renderStatus: document.getElementById('renderStatus'),
            exportCanvas: document.getElementById('exportCanvas'),
            modeImage: document.getElementById('modeImage'),
            modeVideo: document.getElementById('modeVideo'),
            modeVideoAI: document.getElementById('modeVideoAI')
        };

        function initStyles() {
            el.styles.innerHTML = '';
            ART_STYLES.forEach(s => {
                const b = document.createElement('div');
                b.className = `style-btn p-2 rounded-xl ${s.id === selectedStyle.id ? 'selected' : ''}`;
                b.innerText = s.name;
                b.onclick = () => {
                    document.querySelectorAll('.style-btn').forEach(x => x.classList.remove('selected'));
                    b.classList.add('selected');
                    selectedStyle = s;
                };
                el.styles.appendChild(b);
            });
        }

        function setMode(mode) {
            productionMode = mode;
            [el.modeImage, el.modeVideo, el.modeVideoAI].forEach(b => b.classList.remove('active'));
            if(mode === 'image') el.modeImage.classList.add('active');
            if(mode === 'video') el.modeVideo.classList.add('active');
            if(mode === 'videoAI') el.modeVideoAI.classList.add('active');
            log(`Mod seçildi: ${mode.toUpperCase()}`);
        }

        el.modeImage.onclick = () => setMode('image');
        el.modeVideo.onclick = () => setMode('video');
        el.modeVideoAI.onclick = () => setMode('videoAI');

        function log(msg, type = 'info') {
            document.getElementById('statusConsole').classList.remove('hidden');
            const d = document.createElement('div');
            d.innerHTML = `<span class="opacity-30 mr-2">${new Date().toLocaleTimeString()}</span> <span class="${type === 'err' ? 'text-red-400 font-bold' : 'text-blue-400'}">${msg}</span>`;
            el.logs.appendChild(d);
            el.logs.scrollTop = el.logs.scrollHeight;
        }

        async function apiCall(url, body, retries = 3) {
            const delays = [1000, 2000, 4000];
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(`${url}?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({ error: { message: `HTTP ${res.status}` } }));
                        throw new Error(err.error?.message || `HTTP ${res.status}`);
                    }
                    return await res.json();
                } catch (e) {
                    if (i === retries - 1) throw e;
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }
        }

        el.audioInput.onchange = (e) => {
            const f = e.target.files[0];
            if (!f) return;
            
            const checkAndSetDuration = () => {
                if (el.audio.duration && el.audio.duration !== Infinity && !isNaN(el.audio.duration)) {
                    audioDuration = el.audio.duration;
                    el.time.innerText = `00:00 / ${fmt(audioDuration)}`;
                    log("Müzik Hazır: " + fmt(audioDuration));
                    return true;
                }
                return false;
            };

            el.audio.onloadedmetadata = checkAndSetDuration;
            el.audio.oncanplaythrough = checkAndSetDuration;
            el.audio.ondurationchange = checkAndSetDuration;
            
            const url = URL.createObjectURL(f);
            el.audio.src = url;
            el.audio.load();

            let attempts = 0;
            const pollDuration = setInterval(() => {
                attempts++;
                if (checkAndSetDuration() || attempts > 50) clearInterval(pollDuration);
            }, 100);
        };

        el.refInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => { 
                referenceImageBase64 = event.target.result.split(',')[1]; 
                el.refPreview.innerHTML = `<img src="${event.target.result}" class="w-full h-full object-cover rounded-lg">`; 
            };
            reader.readAsDataURL(file);
        };

        function fmt(s) { 
            if(!s || isNaN(s)) return "00:00";
            const m = Math.floor(s/60); 
            const sec = Math.floor(s%60); 
            return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; 
        }

        document.getElementById('planBtn').onclick = async () => {
            const txt = el.lyrics.value.trim();
            const mood = el.mood.value.trim();
            
            if (audioDuration === 0 && el.audio.duration > 0 && el.audio.duration !== Infinity) {
                audioDuration = el.audio.duration;
                el.time.innerText = `00:00 / ${fmt(audioDuration)}`;
            }
            
            if (!txt || audioDuration === 0) return log("Müzik ve sözleri girin!", "err");

            log("Senaryo kurgulanıyor...");
            const lines = txt.split('\n').filter(l => l.includes('[') && l.includes(']'));
            const parsed = [];

            lines.forEach((l, index) => {
                const match = l.match(/(.*?)\[(\d+)-(\d+)\]/);
                if (match) {
                    let caption = match[1].trim();
                    let showSubtitle = true;
                    if (caption.startsWith('(') && caption.endsWith(')')) {
                        showSubtitle = false;
                        caption = caption.slice(1, -1);
                    }
                    parsed.push({ id: index, caption: caption, start: parseFloat(match[2]), end: parseFloat(match[3]), showSubtitle: showSubtitle });
                }
            });

            try {
                const systemPrompt = `Sen bir klip yönetmenisin. Her satır için 5-6 CÜMLELİK edebi bir PARAGRAF PROMPT oluştur.
                KURALLAR:
                1. GENİŞ AÇI: ASLA yakın çekim yapma. Hep "Extreme wide angle panorama" kurgula.
                2. SEMBOLİZM: Sözlerdeki metaforları devasa manzaralara dök.
                3. STİL: "${selectedStyle.name}" stilini işle.
                4. MOOD: "${mood || 'Epic'}" ruh halini ekle.
                ÇIKTI: JSON objesi döndür. Key: index, Value: 5-6 cümlelik İngilizce prompt.`;

                const data = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', {
                    contents: [{ parts: [{ text: "Senaryoyu oluştur." }] }],
                    systemInstruction: { parts: [{ text: systemPrompt + "\nSözler: " + parsed.map(p => `${p.id}: ${p.caption}`).join(' | ') }] },
                    generationConfig: { responseMimeType: "application/json" }
                });

                const prompts = JSON.parse(data.candidates[0].content.parts[0].text);
                scenes = parsed.map(p => ({ 
                    ...p, 
                    v_prompt: prompts[p.id] || p.caption, 
                    source: null, 
                    type: productionMode,
                    fx: VIDEO_FX[Math.floor(Math.random() * VIDEO_FX.length)]
                }));
                renderGrid();
                el.generateAll.classList.remove('hidden');
                log("Senaryo planlaması tamamlandı.");
            } catch (e) { log("Planlama hatası: " + e.message, "err"); }
        };

        function renderGrid() {
            el.grid.innerHTML = '';
            el.scCount.innerText = `${scenes.length}`;
            scenes.forEach((s) => {
                const c = document.createElement('div');
                c.className = "scene-card bg-slate-950 rounded-2xl border border-white/5 overflow-hidden";
                c.onclick = () => regenerateScene(s.id);
                c.innerHTML = `
                    <div id="thumb-${s.id}" class="aspect-video bg-black flex items-center justify-center text-[8px] text-slate-700 p-2 text-center">
                        ${s.source ? (s.type === 'videoAI' ? `<video src="${s.source}" class="w-full h-full object-cover" muted loop autoplay></video>` : `<img src="${s.source}" class="w-full h-full object-cover">`) : '🎨 Hazır'}
                    </div>
                    <div class="p-3 bg-black/20 text-[9px]">
                        <div class="font-black ${s.showSubtitle ? 'text-blue-400' : 'text-purple-400'} mb-1">${s.start}-${s.end}s ${!s.showSubtitle ? '(Sözsüz)' : ''}</div>
                        <div class="text-slate-300 truncate font-semibold">${s.caption}</div>
                    </div>
                `;
                el.grid.appendChild(c);
            });
        }

        async function generateSingleScene(id) {
            const scene = scenes.find(s => s.id === id);
            const thumb = document.getElementById(`thumb-${id}`);
            thumb.innerHTML = '<div class="loader-ring"></div>';
            
            try {
                let finalSource;
                if (scene.type === "videoAI") {
                    const vPrompt = `MANDATORY: Generate a high quality 5-second cinematic video clip in the EXACT STYLE OF ${selectedStyle.name}. Extreme wide angle panorama. Scenario: ${scene.v_prompt}`;
                    const vData = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', {
                        contents: [{ parts: [
                            { text: vPrompt }, 
                            referenceImageBase64 ? { inlineData: { mimeType: "image/png", data: referenceImageBase64 } } : null
                        ].filter(p => p !== null)}],
                        generationConfig: { responseModalities: ['VIDEO'] }
                    });
                    const vPart = vData.candidates?.[0]?.content?.parts?.find(p => p.inlineData && p.inlineData.mimeType.startsWith('video/'));
                    if (!vPart) throw new Error("Video üretilemedi.");
                    finalSource = `data:${vPart.inlineData.mimeType};base64,${vPart.inlineData.data}`;
                } else if (referenceImageBase64) {
                    const i2iData = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent', {
                        contents: [{ parts: [
                            { text: `A professional concept art masterpiece in the EXACT STYLE OF ${selectedStyle.name}. Extreme wide angle panorama landscape. The person from the reference image is integrated as a small artistic figure. Paragraf: ${scene.v_prompt}` }, 
                            { inlineData: { mimeType: "image/png", data: referenceImageBase64 } }
                        ]}],
                        generationConfig: { responseModalities: ['IMAGE'] }
                    });
                    const imgBase64 = i2iData.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                    finalSource = `data:image/png;base64,${imgBase64}`;
                } else {
                    const t2iData = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict', {
                        instances: { prompt: `${selectedStyle.prompt}, Extreme wide angle cinematic view, panoramic landscape. ${scene.v_prompt}` },
                        parameters: { sampleCount: 1 }
                    });
                    finalSource = `data:image/png;base64,${t2iData.predictions[0].bytesBase64Encoded}`;
                }
                
                scene.source = finalSource;
                scene.fx = VIDEO_FX[Math.floor(Math.random() * VIDEO_FX.length)];
                thumb.innerHTML = scene.type === 'videoAI' ? `<video src="${finalSource}" class="w-full h-full object-cover" muted loop autoplay></video>` : `<img src="${finalSource}" class="w-full h-full object-cover">`;
                buildVideoLayers();
            } catch (e) { thumb.innerHTML = '<span class="text-red-500 font-bold text-[10px]">HATA</span>'; log("Hata: " + e.message, "err"); }
        }

        async function regenerateScene(id) {
            const scene = scenes.find(s => s.id === id);
            log(`Sahne ${id} güncelleniyor...`);
            try {
                const data = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', {
                    contents: [{ parts: [{ text: `Lyric: ${scene.caption}. Öncekinden farklı yeni bir 5-6 cümlelik GENİŞ AÇILI prompt yaz. Stil: ${selectedStyle.name}.` }] }]
                });
                const newPrompt = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (newPrompt) { scene.v_prompt = newPrompt; await generateSingleScene(id); }
            } catch (e) { await generateSingleScene(id); }
        }

        el.generateAll.onclick = async () => {
            el.generateAll.disabled = true;
            for (let i = 0; i < scenes.length; i++) { await generateSingleScene(scenes[i].id); }
            log("Prodüksiyon tamamlandı!", "success");
            el.generateAll.disabled = false; el.play.disabled = false; el.exportBtn.classList.remove('hidden');
        };

        function buildVideoLayers() {
            el.layers.innerHTML = '';
            scenes.sort((a,b) => a.start - b.start).forEach(s => {
                if (s.source) {
                    let element;
                    if(s.type === 'videoAI') {
                        element = document.createElement('video');
                        element.muted = true;
                        element.loop = true;
                        element.playsInline = true;
                    } else {
                        element = document.createElement('img');
                    }
                    element.src = s.source;
                    element.className = `slide-item ${s.type === 'video' ? s.fx : ''}`;
                    element.id = `v-item-${s.id}`;
                    el.layers.appendChild(element);
                }
            });
        }

        el.play.onclick = () => {
            if (isPlaying) { el.audio.pause(); document.getElementById('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>'; }
            else { el.audio.play(); document.getElementById('playIcon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; }
            isPlaying = !isPlaying;
        };

        el.audio.ontimeupdate = () => {
            const now = el.audio.currentTime;
            el.progress.style.width = `${(now / audioDuration) * 100}%`;
            el.time.innerText = `${fmt(now)} / ${fmt(audioDuration)}`;
            const activeScene = scenes.find(s => now >= s.start && now < s.end);
            if (activeScene && activeIdx !== activeScene.id) { activeIdx = activeScene.id; updateVisuals(activeIdx); }
        };

        function updateVisuals(id) {
            scenes.forEach(s => {
                const item = document.getElementById(`v-item-${s.id}`);
                if (item) {
                    if (s.id === id) {
                        item.classList.add('active');
                        if(s.type === 'videoAI') {
                            item.currentTime = (el.audio.currentTime - s.start) % (item.duration || 5);
                            item.play().catch(() => {});
                        }
                    } else {
                        const sceneId = s.id;
                        setTimeout(() => {
                            if (activeIdx !== sceneId) {
                                item.classList.remove('active');
                                if(s.type === 'videoAI') item.pause();
                            }
                        }, 1500); 
                    }
                }
            });
            const current = scenes.find(s => s.id === id);
            if (current && current.showSubtitle) { el.subtitle.innerText = current.caption; el.subtitle.style.opacity = 1; } 
            else { el.subtitle.style.opacity = 0; }
        }

        function drawCoverImage(ctx, item, x, y, w, h) {
            const imgW = item.naturalWidth || item.videoWidth || 1280;
            const imgH = item.naturalHeight || item.videoHeight || 720;
            const imgRatio = imgW / imgH;
            const targetRatio = w / h;
            
            let drawW, drawH;
            
            if (imgRatio > targetRatio) {
                drawH = h;
                drawW = h * imgRatio;
            } else {
                drawW = w;
                drawH = w / imgRatio;
            }
            
            ctx.drawImage(item, -drawW / 2, -drawH / 2, drawW, drawH);
        }

        el.exportBtn.onclick = async () => {
            log("Video kaydediliyor... En boy oranı optimize ediliyor.");
            const ctx = el.exportCanvas.getContext('2d');
            const stream = el.exportCanvas.captureStream(30);
            const audioCtx = new AudioContext();
            const sourceNode = audioCtx.createMediaElementSource(el.audio);
            const dest = audioCtx.createMediaStreamDestination();
            sourceNode.connect(dest); sourceNode.connect(audioCtx.destination);
            const recorder = new MediaRecorder(new MediaStream([...stream.getVideoTracks(), ...dest.stream.getAudioTracks()]), { mimeType: 'video/webm' });
            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/mp4' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `AI_Clip_Pro_HD_${Date.now()}.mp4`;
                a.click();
                log("Video indirildi!");
            };
            el.audio.currentTime = 0; recorder.start(); el.audio.play();
            const loop = () => {
                const now = el.audio.currentTime;
                const scene = scenes.find(s => now >= s.start && now < s.end);
                
                ctx.fillStyle = '#000'; 
                ctx.fillRect(0, 0, 1280, 720);
                
                if (scene && scene.source) {
                    const item = document.getElementById(`v-item-${scene.id}`);
                    if (item) {
                        const elapsed = now - scene.start;
                        const total = scene.end - scene.start;
                        const progress = elapsed / total;
                        
                        ctx.save();
                        
                        let scale = 1; let tx = 0; let ty = 0; let rot = 0;
                        
                        if (scene.type === 'video') {
                            if(scene.fx === 'fx-zoom-in') scale = 1 + progress * 0.3;
                            if(scene.fx === 'fx-zoom-out') scale = 1.3 - progress * 0.3;
                            if(scene.fx === 'fx-pan-left') { scale = 1.2; tx = 128 - (progress * 256); }
                            if(scene.fx === 'fx-pan-right') { scale = 1.2; tx = -128 + (progress * 256); }
                            if(scene.fx === 'fx-tilt-cw') { scale = 1.2; rot = progress * 0.05; }
                            if(scene.fx === 'fx-tilt-ccw') { scale = 1.2; rot = -progress * 0.05; }
                            if(scene.fx === 'fx-floating') { scale = 1.1; ty = Math.sin(progress * Math.PI * 2) * 20; }
                            if(scene.fx === 'fx-pulse') scale = 1.1 + Math.sin(progress * Math.PI * 2) * 0.05;
                            
                            ctx.translate(640 + tx, 360 + ty);
                            ctx.rotate(rot);
                            ctx.scale(scale, scale);
                            drawCoverImage(ctx, item, 0, 0, 1280, 720);
                        } else if(scene.type === 'videoAI') {
                            const vDur = item.duration || 5;
                            item.currentTime = elapsed % vDur;
                            ctx.translate(640, 360);
                            drawCoverImage(ctx, item, 0, 0, 1280, 720);
                        } else {
                            ctx.translate(640, 360);
                            drawCoverImage(ctx, item, 0, 0, 1280, 720);
                        }
                        
                        ctx.restore();
                        
                        if (scene.showSubtitle) {
                            ctx.fillStyle = 'rgba(0,0,0,0.6)'; 
                            ctx.fillRect(0, 600, 1280, 120);
                            ctx.fillStyle = '#FFF'; 
                            ctx.font = 'bold 36px Outfit'; 
                            ctx.textAlign = 'center';
                            ctx.fillText(scene.caption, 640, 670);
                        }
                    }
                }
                
                if (now < audioDuration && recorder.state === "recording") requestAnimationFrame(loop);
                else { if (recorder.state === "recording") recorder.stop(); el.audio.pause(); }
            };
            loop();
        };

        el.reset.onclick = () => { location.reload(); };
        initStyles();
    </script>
</body>
</html>
