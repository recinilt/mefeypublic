<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Splitter - Metin Böl</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .input-section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .presets-section {
            margin-bottom: 25px;
        }

        .presets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .preset-btn {
            padding: 12px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            position: relative;
        }

        .preset-btn:hover {
            background: #667eea;
            color: white;
        }

        .preset-btn.active {
            background: #667eea;
            color: white;
        }

        .preset-btn .delete-preset {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            font-size: 12px;
            display: none;
        }

        .preset-btn:hover .delete-preset {
            display: block;
        }

        .custom-preset {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .custom-preset input {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .custom-preset input:focus {
            outline: none;
            border-color: #667eea;
        }

        .custom-preset button {
            padding: 10px 20px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .custom-preset button:hover {
            background: #229954;
        }

        .options-section {
            margin-bottom: 25px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-item input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .option-item label {
            margin: 0;
            cursor: pointer;
            font-weight: 500;
        }

        .split-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 30px;
        }

        .split-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .split-btn:active {
            transform: translateY(0);
        }

        .results-section {
            display: none;
        }

        .results-section.show {
            display: block;
        }

        .result-item {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .result-number {
            font-weight: 700;
            color: #667eea;
            font-size: 16px;
        }

        .result-stats {
            font-size: 12px;
            color: #888;
        }

        .result-text {
            background: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
        }

        .copy-btn {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .copy-btn:hover {
            background: #5568d3;
        }

        .copy-btn.copied {
            background: #27ae60;
        }

        .info-box {
            background: #e8f4f8;
            border-left: 4px solid #3498db;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #2c3e50;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .presets-grid {
                grid-template-columns: 1fr;
            }

            .custom-preset {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Text Splitter</h1>

        <div class="info-box">
            <strong>Nasıl Kullanılır?</strong> Uzun metninizi yapıştırın, bir preset seçin veya özel karakter limiti belirleyin, bölme yöntemini seçip "Böl" butonuna tıklayın. Her bölüm otomatik olarak (001/XXX) formatında numaralandırılacak ve 10 karakter ayrılacaktır.
        </div>

        <div class="input-section">
            <label for="textInput">Metninizi Buraya Yapıştırın:</label>
            <textarea id="textInput" placeholder="Uzun metninizi buraya yapıştırın..."></textarea>
        </div>

        <div class="presets-section">
            <label>Platform Presetleri:</label>
            <div class="presets-grid" id="presetsGrid">
                <button class="preset-btn" data-limit="1000" data-name="Instagram DM">
                    Instagram DM<br><small>(1000 karakter)</small>
                </button>
                <button class="preset-btn" data-limit="280" data-name="Twitter/X">
                    Twitter/X<br><small>(280 karakter)</small>
                </button>
                <button class="preset-btn" data-limit="2200" data-name="Instagram Caption">
                    Instagram Caption<br><small>(2200 karakter)</small>
                </button>
                <button class="preset-btn" data-limit="500" data-name="Özel (500)">
                    Özel (500)<br><small>(500 karakter)</small>
                </button>
            </div>

            <div class="custom-preset">
                <input type="number" id="customLimit" placeholder="Karakter limiti (ör: 500)" min="10" max="100000">
                <input type="text" id="customName" placeholder="Preset adı (ör: WhatsApp)">
                <button onclick="addCustomPreset()">➕ Özel Ekle</button>
            </div>
        </div>

        <div class="options-section">
            <label>Bölme Yöntemi:</label>
            <div class="options-grid">
                <div class="option-item">
                    <input type="radio" id="splitWord" name="splitMethod" value="word" checked>
                    <label for="splitWord">Kelimelerden Ayır</label>
                </div>
                <div class="option-item">
                    <input type="radio" id="splitChar" name="splitMethod" value="char">
                    <label for="splitChar">Karakterlerden Ayır</label>
                </div>
                <div class="option-item">
                    <input type="radio" id="splitSentence" name="splitMethod" value="sentence">
                    <label for="splitSentence">Cümlelerden Ayır</label>
                </div>
                <div class="option-item">
                    <input type="radio" id="splitParagraph" name="splitMethod" value="paragraph">
                    <label for="splitParagraph">Paragraflardan Ayır</label>
                </div>
            </div>
        </div>

        <button class="split-btn" onclick="splitText()">🔪 Metni Böl</button>

        <div class="results-section" id="resultsSection">
            <label>Bölünmüş Metin Parçaları:</label>
            <div id="resultsContainer"></div>
        </div>
    </div>

    <script>
        let selectedLimit = 1000;
        let customPresets = JSON.parse(localStorage.getItem('customPresets') || '[]');

        // Load custom presets on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadCustomPresets();
        });

        // Preset selection
        document.getElementById('presetsGrid').addEventListener('click', (e) => {
            const btn = e.target.closest('.preset-btn');
            if (!btn) return;

            if (e.target.classList.contains('delete-preset')) {
                deleteCustomPreset(btn);
                return;
            }

            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedLimit = parseInt(btn.dataset.limit);
        });

        function addCustomPreset() {
            const limit = parseInt(document.getElementById('customLimit').value);
            const name = document.getElementById('customName').value.trim();

            if (!limit || limit < 10) {
                alert('Lütfen geçerli bir karakter limiti girin (minimum 10)');
                return;
            }

            if (!name) {
                alert('Lütfen preset için bir isim girin');
                return;
            }

            const preset = { limit, name, custom: true };
            customPresets.push(preset);
            localStorage.setItem('customPresets', JSON.stringify(customPresets));

            document.getElementById('customLimit').value = '';
            document.getElementById('customName').value = '';

            loadCustomPresets();
        }

        function loadCustomPresets() {
            const grid = document.getElementById('presetsGrid');
            
            // Remove old custom presets
            grid.querySelectorAll('[data-custom="true"]').forEach(el => el.remove());

            // Add custom presets
            customPresets.forEach((preset, index) => {
                const btn = document.createElement('button');
                btn.className = 'preset-btn';
                btn.dataset.limit = preset.limit;
                btn.dataset.name = preset.name;
                btn.dataset.custom = 'true';
                btn.innerHTML = `
                    ${preset.name}<br><small>(${preset.limit} karakter)</small>
                    <span class="delete-preset" onclick="event.stopPropagation()">×</span>
                `;
                grid.appendChild(btn);
            });
        }

        function deleteCustomPreset(btn) {
            const name = btn.dataset.name;
            customPresets = customPresets.filter(p => p.name !== name);
            localStorage.setItem('customPresets', JSON.stringify(customPresets));
            btn.remove();
        }

        function splitText() {
            const text = document.getElementById('textInput').value.trim();
            
            if (!text) {
                alert('Lütfen bir metin girin');
                return;
            }

            const method = document.querySelector('input[name="splitMethod"]:checked').value;
            const maxChars = selectedLimit - 10; // Reserve 10 chars for numbering

            let chunks = [];

            switch(method) {
                case 'word':
                    chunks = splitByWords(text, maxChars);
                    break;
                case 'char':
                    chunks = splitByCharacters(text, maxChars);
                    break;
                case 'sentence':
                    chunks = splitBySentences(text, maxChars);
                    break;
                case 'paragraph':
                    chunks = splitByParagraphs(text, maxChars);
                    break;
            }

            displayResults(chunks);
        }

        function splitByWords(text, maxChars) {
            const words = text.split(/\s+/);
            const chunks = [];
            let currentChunk = '';

            for (const word of words) {
                const testChunk = currentChunk ? currentChunk + ' ' + word : word;
                
                if (testChunk.length <= maxChars) {
                    currentChunk = testChunk;
                } else {
                    if (currentChunk) {
                        chunks.push(currentChunk);
                    }
                    currentChunk = word;
                    
                    // If single word exceeds limit, force split
                    if (word.length > maxChars) {
                        chunks.push(word.substring(0, maxChars));
                        currentChunk = word.substring(maxChars);
                    }
                }
            }

            if (currentChunk) {
                chunks.push(currentChunk);
            }

            return chunks;
        }

        function splitByCharacters(text, maxChars) {
            const chunks = [];
            for (let i = 0; i < text.length; i += maxChars) {
                chunks.push(text.substring(i, i + maxChars));
            }
            return chunks;
        }

        function splitBySentences(text, maxChars) {
            const sentences = text.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [text];
            const chunks = [];
            let currentChunk = '';

            for (const sentence of sentences) {
                const testChunk = currentChunk ? currentChunk + ' ' + sentence : sentence;
                
                if (testChunk.length <= maxChars) {
                    currentChunk = testChunk;
                } else {
                    if (currentChunk) {
                        chunks.push(currentChunk);
                    }
                    
                    // If single sentence exceeds limit, split by words
                    if (sentence.length > maxChars) {
                        chunks.push(...splitByWords(sentence, maxChars));
                        currentChunk = '';
                    } else {
                        currentChunk = sentence;
                    }
                }
            }

            if (currentChunk) {
                chunks.push(currentChunk);
            }

            return chunks;
        }

        function splitByParagraphs(text, maxChars) {
            const paragraphs = text.split(/\n\n+/);
            const chunks = [];
            let currentChunk = '';

            for (const para of paragraphs) {
                const testChunk = currentChunk ? currentChunk + '\n\n' + para : para;
                
                if (testChunk.length <= maxChars) {
                    currentChunk = testChunk;
                } else {
                    if (currentChunk) {
                        chunks.push(currentChunk);
                    }
                    
                    // If single paragraph exceeds limit, split by sentences
                    if (para.length > maxChars) {
                        chunks.push(...splitBySentences(para, maxChars));
                        currentChunk = '';
                    } else {
                        currentChunk = para;
                    }
                }
            }

            if (currentChunk) {
                chunks.push(currentChunk);
            }

            return chunks;
        }

        function displayResults(chunks) {
            const container = document.getElementById('resultsContainer');
            const resultsSection = document.getElementById('resultsSection');
            
            container.innerHTML = '';
            
            const totalChunks = chunks.length;
            const digitCount = totalChunks.toString().length;

            chunks.forEach((chunk, index) => {
                const num = (index + 1).toString().padStart(digitCount, '0');
                const total = totalChunks.toString().padStart(digitCount, '0');
                const prefix = `(${num}/${total}) `;
                const fullText = prefix + chunk;

                const item = document.createElement('div');
                item.className = 'result-item';
                item.innerHTML = `
                    <div class="result-header">
                        <span class="result-number">${prefix}</span>
                        <span class="result-stats">${fullText.length} karakter</span>
                    </div>
                    <div class="result-text">${fullText}</div>
                    <button class="copy-btn" onclick="copyToClipboard(this, '${escapeHtml(fullText)}')">📋 Kopyala</button>
                `;
                container.appendChild(item);
            });

            resultsSection.classList.add('show');
            resultsSection.scrollIntoView({ behavior: 'smooth' });
        }

        function copyToClipboard(btn, text) {
            // Unescape the text
            text = text.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#039;/g, "'");
            
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.textContent;
                btn.textContent = '✅ Kopyalandı!';
                btn.classList.add('copied');
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                alert('Kopyalama başarısız oldu');
            });
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Set first preset as active by default
        document.querySelector('.preset-btn').classList.add('active');
    </script>
</body>
</html>
