<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobil Uyumlu Sesli Okuyucu</title>
    <style>
        :root {
            --bg-color: #11111b;
            --container-bg: #1e1e2e;
            --text-color: #cdd6f4;
            --accent-color: #89b4fa;
            --btn-bg: #313244;
            --btn-hover: #45475a;
            --stop-color: #f38ba8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--container-bg);
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        h1 {
            margin: 0;
            color: var(--accent-color);
            font-size: 1.5rem;
            text-align: center;
        }

        /* Metin Alanı */
        textarea {
            width: 100%;
            height: 250px; /* Mobilde daha fazla alan */
            background-color: #181825;
            color: #fff;
            border: 2px solid #313244;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.1rem;
            line-height: 1.5;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        /* Kontrol Grupları */
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .voice-section {
            width: 100%;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: var(--btn-bg);
            color: white;
            border: 1px solid transparent;
            font-size: 1rem;
            appearance: none; /* Mobilde varsayılan stili kaldır */
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .speed-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--btn-bg);
            padding: 5px;
            border-radius: 12px;
        }

        /* Buton Stilleri */
        button {
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            touch-action: manipulation; /* Dokunmatik gecikmesini önler */
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-play { background-color: var(--accent-color); color: #11111b; }
        .btn-stop { background-color: var(--stop-color); color: #11111b; }
        
        .btn-speed {
            background-color: transparent;
            color: var(--accent-color);
            font-size: 1.5rem;
            width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-speed:active { background-color: rgba(255,255,255,0.1); }

        .current-speed-label {
            font-family: monospace;
            font-size: 1.1rem;
            color: #fff;
        }

        /* Overlay (Hız Göstergesi) */
        .speed-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: var(--accent-color);
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 2rem;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            transition: opacity 0.3s;
            backdrop-filter: blur(5px);
        }

        /* Bilgi metni */
        .info {
            text-align: center;
            font-size: 0.8rem;
            color: #6c7086;
            margin-top: 5px;
        }

        /* Mobil Düzenlemeler */
        @media (min-width: 600px) {
            .controls-wrapper {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
            }
            .voice-section { flex: 100%; }
            .action-buttons { flex: 1; }
            .speed-controls { flex: 0 0 160px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sesli Okuyucu</h1>
        
        <textarea id="text-input" placeholder="Metnini buraya yapıştır...">Merhaba! Ben senin mobil uyumlu okuma asistanınım. Aşağıdaki kontrollerle hızı değiştirebilirsin. Tarayıcıyı kapatsan bile hız ayarını hatırlarım.</textarea>
        
        <div class="controls-wrapper">
            <!-- Ses Seçimi -->
            <div class="voice-section">
                <select id="voice-select">
                    <option>Sesler yükleniyor...</option>
                </select>
            </div>

            <!-- Oynat / Durdur -->
            <div class="action-buttons">
                <button id="play-btn" class="btn-play">▶ Oku / Duraklat</button>
                <button id="stop-btn" class="btn-stop">■ Durdur</button>
            </div>

            <!-- Hız Kontrolleri -->
            <div class="speed-controls">
                <button id="slow-down-btn" class="btn-speed">−</button>
                <span id="speed-display-static" class="current-speed-label">1.0x</span>
                <button id="speed-up-btn" class="btn-speed">+</button>
            </div>
        </div>

        <div class="info">
            Klavye: <b>Boşluk</b> (Durdur), <b>↑</b> (Hızlan), <b>↓</b> (Yavaşla)
        </div>
    </div>

    <!-- Ekranda beliren büyük hız göstergesi -->
    <div id="speed-overlay" class="speed-overlay">1.0x</div>

    <script>
        const synth = window.speechSynthesis;
        const textInput = document.getElementById('text-input');
        const voiceSelect = document.getElementById('voice-select');
        const playBtn = document.getElementById('play-btn');
        const stopBtn = document.getElementById('stop-btn');
        const speedUpBtn = document.getElementById('speed-up-btn');
        const slowDownBtn = document.getElementById('slow-down-btn');
        const speedOverlay = document.getElementById('speed-overlay');
        const speedDisplayStatic = document.getElementById('speed-display-static');

        // LocalStorage'dan hızı çek, yoksa 1.0 yap
        let savedRate = localStorage.getItem('tts_speed');
        let currentRate = savedRate ? parseFloat(savedRate) : 1.0;
        
        // İlk açılışta hız göstergesini güncelle
        speedDisplayStatic.textContent = currentRate.toFixed(1) + "x";

        let voices = [];
        let isSpeaking = false;
        let isPaused = false;
        let utterance = null;
        let charIndex = 0; 

        // 1. Sesleri Yükle
        function populateVoices() {
            voices = synth.getVoices();
            if(voices.length === 0) return;
            
            voiceSelect.innerHTML = '';

            // Türkçe sesleri öncele, sonra İngilizce
            voices.sort((a, b) => {
                const aLang = a.lang.toLowerCase();
                const bLang = b.lang.toLowerCase();
                // TR en üstte
                if (aLang.includes('tr') && !bLang.includes('tr')) return -1;
                if (!aLang.includes('tr') && bLang.includes('tr')) return 1;
                return 0;
            });

            voices.forEach((voice) => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`; // Sadece isim temiz görünür
                option.setAttribute('data-name', voice.name);
                voiceSelect.appendChild(option);
            });
        }

        populateVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }

        // 2. Okuma Fonksiyonu
        function speak(startIndex = 0) {
            if (synth.speaking) synth.cancel();

            const text = textInput.value;
            const textToSpeak = text.substring(startIndex); 

            if (textToSpeak.trim() === '') return;

            utterance = new SpeechSynthesisUtterance(textToSpeak);
            
            // Seçili sesi ayarla
            if (voiceSelect.selectedOptions.length > 0) {
                const selectedOption = voiceSelect.selectedOptions[0].getAttribute('data-name');
                const selectedVoice = voices.find(voice => voice.name === selectedOption);
                if (selectedVoice) utterance.voice = selectedVoice;
            }

            utterance.rate = currentRate;

            // Hata ayıklama ve takip için
            utterance.onboundary = (event) => {
                charIndex = startIndex + event.charIndex; 
            };

            utterance.onend = () => {
                isSpeaking = false;
                isPaused = false;
                charIndex = 0;
                playBtn.textContent = "▶ Oku";
            };

            // Mobilde sesin başlaması için kullanıcı etkileşimi gerekebilir
            synth.speak(utterance);
            
            isSpeaking = true;
            isPaused = false;
            playBtn.textContent = "⏸ Duraklat";
        }

        // 3. Kontrol Fonksiyonları
        function togglePlay() {
            if (synth.speaking && !isPaused) {
                synth.pause();
                isPaused = true;
                playBtn.textContent = "▶ Devam Et";
            } else if (isPaused) {
                synth.resume();
                isPaused = false;
                playBtn.textContent = "⏸ Duraklat";
            } else {
                speak(0); 
            }
        }

        function stopSpeech() {
            synth.cancel();
            isSpeaking = false;
            isPaused = false;
            charIndex = 0;
            playBtn.textContent = "▶ Oku";
        }

        // Hız Değiştirme ve Kaydetme
        function changeSpeed(amount) {
            currentRate = Math.max(0.5, Math.min(3.0, currentRate + amount));
            currentRate = Math.round(currentRate * 10) / 10; 

            // LocalStorage'a kaydet
            localStorage.setItem('tts_speed', currentRate);

            showSpeedFeedback();

            // Eğer konuşuyorsa anlık güncelle (Hot-swap)
            if (synth.speaking && !isPaused) {
                synth.cancel();
                speak(charIndex);
            }
        }

        // Görsel Geri Bildirim
        let overlayTimeout;
        function showSpeedFeedback() {
            // Küçük göstergeyi güncelle
            speedDisplayStatic.textContent = currentRate.toFixed(1) + "x";

            // Büyük overlay'i göster
            speedOverlay.innerText = `${currentRate.toFixed(1)}x`;
            speedOverlay.style.opacity = '1';
            
            clearTimeout(overlayTimeout);
            overlayTimeout = setTimeout(() => {
                speedOverlay.style.opacity = '0';
            }, 800);
        }

        // 4. Olay Dinleyicileri
        playBtn.addEventListener('click', togglePlay);
        stopBtn.addEventListener('click', stopSpeech);
        
        // Ekran butonları için
        speedUpBtn.addEventListener('click', () => changeSpeed(0.1));
        slowDownBtn.addEventListener('click', () => changeSpeed(-0.1));

        // Klavye Kontrolleri
        document.addEventListener('keydown', (e) => {
            if (document.activeElement === textInput) return;

            if (e.code === 'Space') {
                e.preventDefault(); 
                togglePlay();
            } else if (e.code === 'ArrowUp') {
                e.preventDefault();
                changeSpeed(0.1);
            } else if (e.code === 'ArrowDown') {
                e.preventDefault();
                changeSpeed(-0.1);
            }
        });
    </script>
</body>
</html>
