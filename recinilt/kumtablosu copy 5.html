        // ========== ANA AMBIENT KONTROL ==========
        function playAmbient() {
            if (!audioContext || !soundEnabled) return;
            stopAmbient();
            
            // Tema bazlı ambient ses seç
            switch(currentTheme) {
                case 'volcanic':
                    currentAmbientType = 'fire';
                    playFireAmbient();
                    break;
                case 'arctic':
                    currentAmbientType = 'wind';
                    playWindAmbient();
                    break;
                case 'aurora':
                    currentAmbientType = 'wind';
                    playWindAmbient();
                    break;
                default:
                    currentAmbientType = 'ocean';
                    playOceanAmbient();
            }
        }

        function stopAmbient() {
            if (rainInterval) {
                clearInterval(rainInterval);
                rainInterval = null;
            }
            
            ambientNodes.forEach(node => {
                try {
                    if (node.sources) {
                        node.sources.forEach(s => s.stop());
                    }
                    if (node.gain) {
                        node.gain.disconnect();
                    }
                } catch(e) {}
            });
            ambientNodes = [];
        }

        // ========== KUM ÇARPIŞMA SESLERİ ==========
        function playCollisionSound(velocity, density) {
            if (!audioContext || !soundEnabled) return;
            
            // Hız bazlı throttle - yavaş çarpışmalar ses çıkarmaz
            if (velocity < 0.08) return;
            
            const now = Date.now();
            // Daha kısa throttle
            if (now - lastCollisionTime < 3) {
                collisionCount++;
                if (collisionCount > 8) return; // Daha fazla eşzamanlı ses
            } else {
                collisionCount = 0;
            }
            lastCollisionTime = now;
            
            // Granular synthesis - kum tanesi karakteri
            const duration = 0.02 + Math.random() * 0.03;
            
            // Noise burst
            const buffer = audioContext.createBuffer(1, audioContext.sampleRate * duration, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) {
                // Exponential decay
                const envelope = Math.exp(-i / (data.length * 0.2));
                data[i] = (Math.random() * 2 - 1) * envelope;
            }
            
            const noise = audioContext.createBufferSource();
            noise.buffer = buffer;
            
            // Bandpass filtre - kum karakteri
            const filter = audioContext.createBiquadFilter();
            filter.type = 'bandpass';
            // Yoğunluğa göre frekans - ağır kumlar daha düşük
            const baseFreq = 2000 + (1 - density) * 4000;
            filter.frequency.setValueAtTime(baseFreq + Math.random() * 1000, audioContext.currentTime);
            filter.Q.setValueAtTime(2 + Math.random() * 3, audioContext.currentTime);
            
            const gain = audioContext.createGain();
            // Hıza göre ses seviyesi
            const vol = Math.min(velocity * 0.3, 0.15) * collisionVolume;
            gain.gain.setValueAtTime(vol, audioContext.currentTime);
            
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);
            noise.start();
        }

        // Toplu çarpışma sesi (birden fazla tane aynı anda)
        let bulkCollisionThrottle = 0;
        function playBulkCollisionSound(count, avgVelocity) {
            if (!audioContext || !soundEnabled || count < 3 || avgVelocity < 0.05) return;
            
            const now = Date.now();
            if (now - bulkCollisionThrottle < 15) return;
            bulkCollisionThrottle = now;
            
            // Daha uzun, zengin gürültü
            const duration = 0.05 + (count / 100) * 0.1;
            const buffer = audioContext.createBuffer(1, audioContext.sampleRate * duration, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < data.length; i++) {
                const envelope = Math.exp(-i / (data.length * 0.4));
                data[i] = (Math.random() * 2 - 1) * envelope;
            }
            
            const noise = audioContext.createBufferSource();
            noise.buffer = buffer;
            
            const filter = audioContext.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1500 + Math.random() * 500, audioContext.currentTime);
            filter.Q.setValueAtTime(1, audioContext.currentTime);
            
            const gain = audioContext.createGain();
            const vol = Math.min(count / 50, 0.3) * avgVelocity * collisionVolume;
            gain.gain.setValueAtTime(vol, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
            
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);
            noise.start();
        }

        // Eski fonksiyon - uyumluluk için
        function playDropSound() {
            playCollisionSound(0.3, 0.5);
        }
        
        // Zemine çarpma sesi - yumuşak, küt ses
        let floorHitThrottle = 0;
        function playFloorHitSound(velocity, density) {
            if (!audioContext || !soundEnabled) return;
            
            const now = Date.now();
            if (now - floorHitThrottle < 5) return; // Çok kısa throttle
            floorHitThrottle = now;
            
            const duration = 0.03 + velocity * 0.02;
            const buffer = audioContext.createBuffer(1, audioContext.sampleRate * duration, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < data.length; i++) {
                const envelope = Math.exp(-i / (data.length * 0.15));
                data[i] = (Math.random() * 2 - 1) * envelope;
            }
            
            const noise = audioContext.createBufferSource();
            noise.buffer = buffer;
            
            const filter = audioContext.createBiquadFilter();
            filter.type = 'lowpass';
            // Düşük frekans - küt ses
            const freq = 800 + (1 - density) * 1500;
            filter.frequency.setValueAtTime(freq, audioContext.currentTime);
            filter.Q.setValueAtTime(1, audioContext.currentTime);
            
            const gain = audioContext.createGain();
            const vol = Math.min(velocity * 1.5, 0.25) * collisionVolume;
            gain.gain.setValueAtTime(vol, audioContext.currentTime);
            
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);
            noise.start();
        }
        
        // Duvara çarpma sesi - daha keskin
        let wallHitThrottle = 0;
        function playWallHitSound(velocity, density) {
            if (!audioContext || !soundEnabled) return;
            
            const now = Date.now();
            if (now - wallHitThrottle < 8) return;
            wallHitThrottle = now;
            
            const duration = 0.02 + velocity * 0.015;
            const buffer = audioContext.createBuffer(1, audioContext.sampleRate * duration, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < data.length; i++) {
                const envelope = Math.exp(-i / (data.length * 0.1));
                data[i] = (Math.random() * 2 - 1) * envelope;
            }
            
            const noise = audioContext.createBufferSource();
            noise.buffer = buffer;
            
            const filter = audioContext.createBiquadFilter();
            filter.type = 'bandpass';
            const freq = 1500 + (1 - density) * 2500;
            filter.frequency.setValueAtTime(freq, audioContext.currentTime);
            filter.Q.setValueAtTime(2, audioContext.currentTime);
            
            const gain = audioContext.createGain();
            const vol = Math.min(velocity * 1.2, 0.2) * collisionVolume;
            gain.gain.setValueAtTime(vol, audioContext.currentTime);
            
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);
            noise.start();
        }
        
        // Üçgen engele çarpma sesi - cam/metal tınısı
        let obstacleHitThrottle = 0;
        function playObstacleHitSound(velocity, density) {
            if (!audioContext || !soundEnabled) return;
            
            const now = Date.now();
            if (now - obstacleHitThrottle < 6) return;
            obstacleHitThrottle = now;
            
            const duration = 0.04 + velocity * 0.03;
            const buffer = audioContext.createBuffer(1, audioContext.sampleRate * duration, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < data.length; i++) {
                const envelope = Math.exp(-i / (data.length * 0.2));
                // Biraz tonal karakter ekle
                const tone = Math.sin(i * 0.15) * 0.3;
                data[i] = ((Math.random() * 2 - 1) * 0.7 + tone) * envelope;
            }
            
            const noise = audioContext.createBufferSource();
            noise.buffer = buffer;
            
            const filter = audioContext.createBiquadFilter();
            filter.type = 'bandpass';
            // Yüksek frekans - cam/kristal tınısı
            const freq = 2500 + (1 - density) * 3000;
            filter.frequency.setValueAtTime(freq, audioContext.currentTime);
            filter.Q.setValueAtTime(4, audioContext.currentTime);
            
            const gain = audioContext.createGain();
            const vol = Math.min(velocity * 1.8, 0.3) * collisionVolume;
            gain.gain.setValueAtTime(vol, audioContext.currentTime);
            
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);
            noise.start();
        }
        
        function playFlipSound() {
            if (!audioContext || !soundEnabled) return;
            
            // Çevirme sesi - swoosh efekti (geliştirilmiş)
            const duration = 0.4;
            const buffer = audioContext.createBuffer(1, audioContext.sampleRate * duration, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < data.length; i++) {
                const t = i / data.length;
                // Sweep efekti
                const envelope = Math.sin(t * Math.PI) * 0.8;
                data[i] = (Math.random() * 2 - 1) * envelope;
            }
            
            const noise = audioContext.createBufferSource();
            noise.buffer = buffer;
            
            const filter = audioContext.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(800, audioContext.currentTime);
            filter.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + duration);
            filter.Q.setValueAtTime(3, audioContext.currentTime);
            
            const gain = audioContext.createGain();
            gain.gain.setValueAtTime(0.2, audioContext.currentTime);
            
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);
            noise.start();
        }

        // ============ YARDIMCI FONKSİYONLAR ============
        function initColorLegend() {
            const legend = document.getElementById('colorLegend');
            legend.innerHTML = '';
            sandColors.forEach((c) => {
                const dot = document.createElement('div');
                dot.className = 'color-dot';
                dot.style.background = c.color;
                dot.title = `${c.name}: ${c.density.toFixed(2)}`;
                legend.appendChild(dot);
            });
        }

        function resize() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            width = rect.width;
            height = rect.height;
            
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            
            ctx.scale(dpr, dpr);
            createAirBubbles();
        }

        function calculateParticleCount(fillPercent) {
            const totalArea = width * height;
            const targetFillArea = totalArea * (fillPercent / 100);
            const effectiveParticleArea = Math.PI * sandBaseSize * sandBaseSize * SPACING_MULTIPLIER * SPACING_MULTIPLIER;
            return Math.floor(targetFillArea / effectiveParticleArea);
        }

        function getTrianglePoints() {
            const gapWidth = width * gapWidthRatio;
            const gapCenter = width * 0.5;
            const gapLeft = gapCenter - gapWidth / 2;
            const gapRight = gapCenter + gapWidth / 2;
            
            return {
                left: [
                    { x: 0, y: 0 },
                    { x: 0, y: height },
                    { x: gapLeft, y: height * 0.5 }
                ],
                right: [
                    { x: width, y: 0 },
                    { x: width, y: height },
                    { x: gapRight, y: height * 0.5 }
                ],
                gapLeft, gapRight, gapCenter, gapWidth
            };
        }

        function createAirBubbles() {
            airBubbles = [];
            const { gapCenter, gapWidth } = getTrianglePoints();
            
            for (let i = 0; i < airBubbleCount; i++) {
                const radius = airBaseSize * 0.7 + Math.random() * airBaseSize * 0.6;
                airBubbles.push({
                    x: gapCenter + (Math.random() - 0.5) * (gapWidth - radius * 2) * 0.8,
                    y: height * 0.2 + Math.random() * height * 0.6,
                    radius: radius,
                    wobble: Math.random() * Math.PI * 2,
                    wobbleSpeed: 0.004 + Math.random() * 0.006,
                    vy: 0
                });
            }
        }

        function getColorIndex() {
            const random = Math.random();
            let cumulative = 0;
            for (let i = 0; i < sandColors.length; i++) {
                cumulative += sandColors[i].distribution;
                if (random <= cumulative) return i;
            }
            return sandColors.length - 1;
        }

        function isInsideTriangle(px, py, points) {
            const [p1, p2, p3] = points;
            const sign = (px, py, x1, y1, x2, y2) => 
                (px - x2) * (y1 - y2) - (x1 - x2) * (py - y2);
            
            const d1 = sign(px, py, p1.x, p1.y, p2.x, p2.y);
            const d2 = sign(px, py, p2.x, p2.y, p3.x, p3.y);
            const d3 = sign(px, py, p3.x, p3.y, p1.x, p1.y);
            
            return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
        }

        function closestPointOnSegment(px, py, p1, p2) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const len2 = dx * dx + dy * dy;
            if (len2 === 0) return { x: p1.x, y: p1.y };
            let t = Math.max(0, Math.min(1, ((px - p1.x) * dx + (py - p1.y) * dy) / len2));
            return { x: p1.x + t * dx, y: p1.y + t * dy };
        }

        // ============ PARTICLE SINIFI ============
        class Particle {
            constructor(x, y, isGlitter = false) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.radius = sandBaseSize * (0.85 + Math.random() * 0.3);
                this.colorIndex = getColorIndex();
                this.color = sandColors[this.colorIndex].color;
                this.density = sandColors[this.colorIndex].density;
                this.collisionRadius = this.radius * SPACING_MULTIPLIER / 2;
                
                // Glitter özellikleri
                this.isGlitter = isGlitter;
                this.glitterPhase = Math.random() * Math.PI * 2;
                this.glitterSpeed = 0.05 + Math.random() * 0.1;
            }

            update() {
                // 360° modunda yerçekimi sürekli döner
                let effectiveTiltAngle = tiltAngle;
                if (autoRotate) {
                    // Dönen çerçeveye göre yerçekimi yönü değişir
                    // rotationAngle derece cinsinden, yerçekimi her zaman "aşağı" (ekranın altına doğru)
                    // ama çerçeve döndüğü için kumlar sürekli hareket eder
                    effectiveTiltAngle = -rotationAngle; // Negatif çünkü çerçeve tersine döner
                }
                
                const tiltRad = effectiveTiltAngle * Math.PI / 180;
                const gravityX = Math.sin(tiltRad) * baseGravity * 0.8;
                const gravityY = Math.cos(tiltRad) * baseGravity;
                
                // Yerçekimi (yoğunluğa göre - Stokes)
                const effectiveGravityY = gravityY * this.density * speedMultiplier;
                const effectiveGravityX = gravityX * this.density * speedMultiplier;
                
                this.vy += effectiveGravityY;
                this.vx += effectiveGravityX;
                
                // Rastgele hareket
                this.vx += (Math.random() - 0.5) * 0.001 * speedMultiplier;
                
                // Viskozite
                const viscosity = viscosityBase - (1 - this.density) * 0.008;
                this.vx *= viscosity;
                this.vy *= viscosity;
                
                // Max hız
                const maxSpeed = 0.6 * speedMultiplier * (0.5 + this.density * 0.5);
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > maxSpeed) {
                    this.vx = (this.vx / speed) * maxSpeed;
                    this.vy = (this.vy / speed) * maxSpeed;
                }
                
                // Önceki hızı kaydet (çarpışma sesi için)
                const prevVx = this.vx;
                const prevVy = this.vy;
                
                this.x += this.vx;
                this.y += this.vy;
                
                this.handleObstacleCollisions();
                this.handleBubbleInteraction();
                
                // Kenarlar - SES EKLENDİ
                if (this.x < this.collisionRadius) {
                    this.x = this.collisionRadius;
                    const impactVel = Math.abs(prevVx);
                    if (impactVel > 0.05) playWallHitSound(impactVel, this.density);
                    this.vx *= -0.15;
                }
                if (this.x > width - this.collisionRadius) {
                    this.x = width - this.collisionRadius;
                    const impactVel = Math.abs(prevVx);
                    if (impactVel > 0.05) playWallHitSound(impactVel, this.density);
                    this.vx *= -0.15;
                }
                if (this.y > height - this.collisionRadius) {
                    this.y = height - this.collisionRadius;
                    const impactVel = Math.abs(prevVy);
                    if (impactVel > 0.03) playFloorHitSound(impactVel, this.density);
                    this.vy *= -0.08;
                    this.vx *= 0.6;
                }
                if (this.y < this.collisionRadius) {
                    this.y = this.collisionRadius;
                    const impactVel = Math.abs(prevVy);
                    if (impactVel > 0.05) playWallHitSound(impactVel, this.density);
                    this.vy *= -0.15;
                }
                
                // Glitter animasyonu
                if (this.isGlitter) {
                    this.glitterPhase += this.glitterSpeed;
                }
            }

            handleObstacleCollisions() {
                const tri = getTrianglePoints();
                if (isInsideTriangle(this.x, this.y, tri.left)) {
                    this.pushOutOfTriangle(tri.left);
                }
                if (isInsideTriangle(this.x, this.y, tri.right)) {
                    this.pushOutOfTriangle(tri.right);
                }
            }

            pushOutOfTriangle(points) {
                let minDist = Infinity;
                let closestPoint = null;
                let normalX = 0, normalY = 0;
                
                for (let i = 0; i < 3; i++) {
                    const p1 = points[i];
                    const p2 = points[(i + 1) % 3];
                    const closest = closestPointOnSegment(this.x, this.y, p1, p2);
                    const dx = this.x - closest.x;
                    const dy = this.y - closest.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < minDist) {
                        minDist = dist;
                        closestPoint = closest;
                        const edgeDx = p2.x - p1.x;
                        const edgeDy = p2.y - p1.y;
                        const len = Math.sqrt(edgeDx * edgeDx + edgeDy * edgeDy);
                        normalX = -edgeDy / len;
                        normalY = edgeDx / len;
                    }
                }
                
                const centerX = (points[0].x + points[1].x + points[2].x) / 3;
                const centerY = (points[0].y + points[1].y + points[2].y) / 3;
                if (normalX * (centerX - closestPoint.x) + normalY * (centerY - closestPoint.y) > 0) {
                    normalX = -normalX;
                    normalY = -normalY;
                }
                
                // Çarpışma hızını hesapla - SES İÇİN
                const impactVel = Math.abs(this.vx * normalX + this.vy * normalY);
                if (impactVel > 0.03) {
                    playObstacleHitSound(impactVel, this.density);
                }
                
                this.x = closestPoint.x + normalX * (this.collisionRadius + 0.5);
                this.y = closestPoint.y + normalY * (this.collisionRadius + 0.5);
                
                const dotProduct = this.vx * normalX + this.vy * normalY;
                this.vx -= 1.8 * dotProduct * normalX;
                this.vy -= 1.8 * dotProduct * normalY;
                this.vx *= 0.4;
                this.vy *= 0.4;
            }

            handleBubbleInteraction() {
                for (const bubble of airBubbles) {
                    const dx = this.x - bubble.x;
                    const dy = this.y - bubble.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = bubble.radius + this.collisionRadius + 2;
                    
                    if (dist < minDist && dist > 0) {
                        const overlap = minDist - dist;
                        const nx = dx / dist;
                        const ny = dy / dist;
                        
                        this.x += nx * overlap * 0.95;
                        this.y += ny * overlap * 0.5;
                        this.vx += nx * 0.015;
                        this.vy *= 0.75 + this.density * 0.15;
                    }
                }
            }

            getDrawCoords() {
                if (visualFlipped) {
                    return { x: this.x, y: height - this.y };
                }
                return { x: this.x, y: this.y };
            }

            draw() {
                const coords = this.getDrawCoords();
                ctx.beginPath();
                ctx.arc(coords.x, coords.y, this.radius, 0, Math.PI * 2);
                
                if (this.isGlitter) {
                    const glitterAlpha = 0.5 + 0.5 * Math.sin(this.glitterPhase);
                    ctx.fillStyle = colorThemes[currentTheme].glitter;
                    ctx.globalAlpha = glitterAlpha;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    
                    // Parlama efekti
                    if (glitterAlpha > 0.8) {
                        ctx.beginPath();
                        ctx.arc(coords.x, coords.y, this.radius * 1.5, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${(glitterAlpha - 0.8) * 0.5})`;
                        ctx.fill();
                    }
                } else {
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
            }
        }

        // ============ PARÇACIK OLUŞTURMA ============
        function initParticles() {
            particles = [];
            
            const { gapLeft, gapRight, gapWidth } = getTrianglePoints();
            const numParticles = calculateParticleCount(sandFillPercent);
            const numGlitter = Math.floor(numParticles * glitterPercent / 100);
            
            for (let i = 0; i < numParticles; i++) {
                let x, y;
                let attempts = 0;
                
                do {
                    const rand = Math.random();
                    if (rand < 0.75) {
                        x = gapLeft + Math.random() * gapWidth;
                    } else if (rand < 0.875) {
                        x = 3 + Math.random() * 12;
                    } else {
                        x = width - 15 + Math.random() * 12;
                    }
                    y = height * 0.55 + Math.random() * height * 0.43;
                    attempts++;
                } while (
                    (isInsideTriangle(x, y, getTrianglePoints().left) || 
                     isInsideTriangle(x, y, getTrianglePoints().right)) && 
                    attempts < 100
                );
                
                if (attempts < 100) {
                    const isGlitter = i < numGlitter;
                    particles.push(new Particle(x, y, isGlitter));
                }
            }
            
            flowStartTime = Date.now();
            totalSandFallen = 0;
            updateStats();
        }

        // ============ ÇİZİM FONKSİYONLARI ============
        function drawBackground() {
            // Tema arka planı
            const theme = colorThemes[currentTheme];
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            
            if (visualFlipped) {
                gradient.addColorStop(0, theme.bg.includes('#') ? '#0e1c2a' : '#0a1420');
                gradient.addColorStop(1, theme.bg.includes('#') ? '#0a1420' : '#0e1c2a');
            } else {
                gradient.addColorStop(0, '#0a1420');
                gradient.addColorStop(1, '#0e1c2a');
            }
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            
            // Animasyonlu arka plan
            if (currentBackground !== 'none') {
                drawAnimatedBackground();
            }
        }

        function drawAnimatedBackground() {
            const time = Date.now() * 0.001;
            ctx.globalAlpha = 0.15;
            
            if (currentBackground === 'aurora') {
                // Aurora efekti
                for (let i = 0; i < 3; i++) {
                    const gradient = ctx.createLinearGradient(0, 0, width, height * 0.5);
                    gradient.addColorStop(0, 'transparent');
                    gradient.addColorStop(0.3 + Math.sin(time + i) * 0.2, `hsla(${120 + i * 30 + time * 10}, 70%, 50%, 0.3)`);
                    gradient.addColorStop(0.7, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, width, height * 0.6);
                }
            } else if (currentBackground === 'sunset') {
                const gradient = ctx.createLinearGradient(0, 0, 0, height * 0.7);
                gradient.addColorStop(0, `hsla(${20 + Math.sin(time * 0.5) * 10}, 80%, 50%, 0.3)`);
                gradient.addColorStop(0.5, `hsla(${40 + Math.sin(time * 0.3) * 10}, 70%, 40%, 0.2)`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);
            } else if (currentBackground === 'stars') {
                for (let i = 0; i < 30; i++) {
                    const x = (i * 73) % width;
                    const y = (i * 47) % (height * 0.6);
                    const twinkle = 0.3 + 0.7 * Math.sin(time * 2 + i);
                    ctx.beginPath();
                    ctx.arc(x, y, 1, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${twinkle * 0.5})`;
                    ctx.fill();
                }
            } else if (currentBackground === 'mountains') {
                ctx.fillStyle = 'rgba(30, 40, 50, 0.3)';
                ctx.beginPath();
                ctx.moveTo(0, height * 0.5);
                for (let x = 0; x <= width; x += 20) {
                    const y = height * 0.3 + Math.sin(x * 0.02 + time * 0.2) * 30 + Math.sin(x * 0.05) * 20;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(width, height);
                ctx.lineTo(0, height);
                ctx.fill();
            }
            
            ctx.globalAlpha = 1;
        }

        function drawObstacles() {
            const tri = getTrianglePoints();
            const gradient = ctx.createLinearGradient(0, 0, width, 0);
            gradient.addColorStop(0, '#080c12');
            gradient.addColorStop(0.5, '#0b1018');
            gradient.addColorStop(1, '#080c12');
            
            ctx.fillStyle = gradient;
            
            const drawTriangle = (points) => {
                ctx.beginPath();
                const transformedPoints = points.map(p => 
                    visualFlipped ? { x: p.x, y: height - p.y } : p
                );
                ctx.moveTo(transformedPoints[0].x, transformedPoints[0].y);
                transformedPoints.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = 'rgba(60, 80, 100, 0.2)';
                ctx.lineWidth = 1;
                ctx.stroke();
            };
            
            drawTriangle(tri.left);
            drawTriangle(tri.right);
        }

        function drawAirBubbles() {
            const { gapLeft, gapRight } = getTrianglePoints();
            
            for (const bubble of airBubbles) {
                bubble.wobble += bubble.wobbleSpeed;
                const wobbleX = Math.sin(bubble.wobble) * 2;
                const wobbleY = Math.cos(bubble.wobble * 0.7) * 1.5;
                
                // Yükselme
                const targetY = bubble.radius + 15;
                bubble.vy += (targetY - bubble.y) * 0.00005 * airSpeedMultiplier;
                bubble.vy *= 0.995;
                bubble.y += bubble.vy;
                
                // Sınırlar
                bubble.y = Math.max(bubble.radius + 8, Math.min(height - bubble.radius - 8, bubble.y));
                bubble.x = Math.max(gapLeft + bubble.radius + 3, Math.min(gapRight - bubble.radius - 3, bubble.x));
                
                let drawX = bubble.x + wobbleX;
                let drawY = visualFlipped ? height - (bubble.y + wobbleY) : bubble.y + wobbleY;
                
                // Kabarcık çizimi
                const bubbleGradient = ctx.createRadialGradient(
                    drawX - bubble.radius * 0.25, drawY - bubble.radius * 0.25, 0,
                    drawX, drawY, bubble.radius
                );
                bubbleGradient.addColorStop(0, 'rgba(140, 180, 220, 0.12)');
                bubbleGradient.addColorStop(0.5, 'rgba(90, 130, 170, 0.06)');
                bubbleGradient.addColorStop(1, 'rgba(50, 90, 130, 0.02)');
                
                ctx.beginPath();
                ctx.arc(drawX, drawY, bubble.radius, 0, Math.PI * 2);
                ctx.fillStyle = bubbleGradient;
                ctx.fill();
                ctx.strokeStyle = 'rgba(120, 160, 200, 0.15)';
                ctx.lineWidth = 0.5;
                ctx.stroke();
                
                // Yansıma
                ctx.beginPath();
                ctx.arc(drawX - bubble.radius * 0.3, drawY - bubble.radius * 0.3, bubble.radius * 0.12, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.fill();
            }
        }

        // ============ ÇARPIŞMA YÖNETİMİ ============
        let collisionStats = { count: 0, totalVelocity: 0 };
        
        function handleParticleCollisions() {
            const cellSize = sandBaseSize * SPACING_MULTIPLIER;
            const grid = new Map();
            
            // Bu frame'deki çarpışmaları sıfırla
            collisionStats.count = 0;
            collisionStats.totalVelocity = 0;
            
            for (const p of particles) {
                const key = Math.floor(p.x / cellSize) + ',' + Math.floor(p.y / cellSize);
                if (!grid.has(key)) grid.set(key, []);
                grid.get(key).push(p);
            }
            
            for (const [key, cell] of grid) {
                const [cx, cy] = key.split(',').map(Number);
                
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        const neighborCell = grid.get((cx + dx) + ',' + (cy + dy));
                        if (!neighborCell) continue;
                        
                        for (const p1 of cell) {
                            for (const p2 of neighborCell) {
                                if (p1 === p2) continue;
                                
                                const ddx = p2.x - p1.x;
                                const ddy = p2.y - p1.y;
                                const dist = Math.sqrt(ddx * ddx + ddy * ddy);
                                const minDist = p1.collisionRadius + p2.collisionRadius;
                                
                                if (dist < minDist && dist > 0.01) {
                                    const overlap = minDist - dist;
                                    const nx = ddx / dist;
                                    const ny = ddy / dist;
                                    
                                    p1.x -= nx * overlap * 0.5;
                                    p1.y -= ny * overlap * 0.5;
                                    p2.x += nx * overlap * 0.5;
                                    p2.y += ny * overlap * 0.5;
                                    
                                    const relVelDot = (p1.vx - p2.vx) * nx + (p1.vy - p2.vy) * ny;
                                    if (relVelDot > 0) {
                                        const impulse = relVelDot * frictionCoeff;
                                        p1.vx -= impulse * nx;
                                        p1.vy -= impulse * ny;
                                        p2.vx += impulse * nx;
                                        p2.vy += impulse * ny;
                                        
                                        // Çarpışma sesi için veri topla
                                        collisionStats.count++;
                                        collisionStats.totalVelocity += relVelDot;
                                        
                                        // Bireysel çarpışma sesleri - daha sık
                                        if (relVelDot > 0.12 && Math.random() > 0.7) {
                                            playCollisionSound(relVelDot, (p1.density + p2.density) / 2);
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
            
            // Toplu çarpışma sesi - daha düşük eşik
            if (collisionStats.count > 5) {
                const avgVel = collisionStats.totalVelocity / collisionStats.count;
                playBulkCollisionSound(collisionStats.count, avgVel);
            }
        }

        // ============ GÜNCELLEME & STATS ============
        function updateStats() {
            // Akış süresi hesaplama
            const elapsed = (Date.now() - flowStartTime) / 1000;
            const sandAtBottom = particles.filter(p => p.y > height * 0.8).length;
            const progress = (sandAtBottom / particles.length) * 100;
            
            document.getElementById('progressFill').style.width = progress + '%';
            
            let estimatedTime = '--';
            if (progress > 5 && progress < 95) {
                const remainingPercent = 100 - progress;
                const rate = progress / elapsed;
                const remaining = remainingPercent / rate;
                if (remaining < 3600) {
                    const mins = Math.floor(remaining / 60);
                    const secs = Math.floor(remaining % 60);
                    estimatedTime = `${mins}:${secs.toString().padStart(2, '0')}`;
                }
            } else if (progress >= 95) {
                estimatedTime = 'Tamamlandı';
            }
            
            document.getElementById('flowTime').textContent = `Tahmini: ${estimatedTime}`;
            document.getElementById('stats').innerHTML = 
                `Kum: ${particles.length.toLocaleString()} | Glitter: ${Math.floor(particles.length * glitterPercent / 100)} | FPS: ${fps}`;
        }

        // ============ ANA DÖNGÜ ============
        let rotationSpeed = 0.05; // Çok yavaş varsayılan (derece/frame)
        
        function update(timestamp) {
            if (!lastTime) lastTime = timestamp;
            lastTime = timestamp;
            
            frameCount++;
            if (timestamp - lastFpsUpdate > 1000) {
                fps = frameCount;
                frameCount = 0;
                lastFpsUpdate = timestamp;
                updateStats();
            }

            // Otomatik döndürme - yerçekimi sürekli "aşağıda" kalır
            if (autoRotate) {
                rotationAngle += rotationSpeed;
                if (rotationAngle >= 360) rotationAngle -= 360;
                if (rotationAngle < 0) rotationAngle += 360;
                frame.style.transform = `rotate(${rotationAngle}deg)`;
            }

            if (!isPaused) {
                for (const p of particles) {
                    p.update();
                }
                
                for (let i = 0; i < 4; i++) {
                    handleParticleCollisions();
                }
            }

            drawBackground();
            drawObstacles();
            drawAirBubbles();
            
            // Parçacıkları sırala ve çiz
            const sortedParticles = [...particles].sort((a, b) => {
                const ay = visualFlipped ? height - a.y : a.y;
                const by = visualFlipped ? height - b.y : b.y;
                return ay - by;
            });
            
            for (const p of sortedParticles) {
                p.draw();
            }

            requestAnimationFrame(update);
        }

        // ============ KONTROL FONKSİYONLARI ============
        function flipFrame() {
            frame.classList.add('flipping');
            playFlipSound();
            
            setTimeout(() => {
                visualFlipped = !visualFlipped;
                flowStartTime = Date.now();
                
                for (const p of particles) {
                    p.y = height - p.y;
                    p.vy = -p.vy * 0.2;
                    p.vx *= 0.4;
                }
                
                for (const bubble of airBubbles) {
                    bubble.y = height - bubble.y;
                    bubble.vy = 0;
                }
            }, 400);
            
            setTimeout(() => frame.classList.remove('flipping'), 800);
        }

        function resetSand() {
            visualFlipped = false;
            frame.style.transform = '';
            rotationAngle = 0;
            initParticles();
            createAirBubbles();
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pauseBtn').textContent = isPaused ? 'Devam' : 'Duraklat';
            document.getElementById('pauseBtn').classList.toggle('active', isPaused);
        }

        function shakeSand() {
            for (const p of particles) {
                p.vx += (Math.random() - 0.5) * 0.8;
                p.vy += (Math.random() - 0.5) * 0.8;
            }
            for (const bubble of airBubbles) {
                bubble.vy += (Math.random() - 0.5) * 0.3;
                bubble.x += (Math.random() - 0.5) * 4;
            }
        }

        function toggleAutoRotate() {
            autoRotate = !autoRotate;
            document.getElementById('rotateBtn').classList.toggle('active', autoRotate);
            document.getElementById('rotateBtn').textContent = autoRotate ? '⏹️ Dur' : '360°';
            if (!autoRotate) {
                // Döndürmeyi durdurduğunda yavaşça normale dön
                frame.style.transition = 'transform 0.5s ease-out';
                frame.style.transform = '';
                rotationAngle = 0;
                setTimeout(() => {
                    frame.style.transition = 'transform 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
                }, 500);
            } else {
                frame.style.transition = 'none'; // Dönerken geçiş efekti olmasın
            }
        }

        function toggleSound() {
            // iOS ve diğer tarayıcılar için AudioContext başlat
            initAudio();
            
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
            document.getElementById('soundBtn').classList.toggle('active', soundEnabled);
            
            if (soundEnabled) {
                // Kullanıcı etkileşimi sonrası ses başlat (iOS için gerekli)
                if (audioContext) {
                    // iOS için sessiz bir ses çal
                    const silentBuffer = audioContext.createBuffer(1, 1, 22050);
                    const source = audioContext.createBufferSource();
                    source.buffer = silentBuffer;
                    source.connect(audioContext.destination);
                    source.start(0);
                    
                    if (audioContext.state === 'suspended') {
                        audioContext.resume().then(() => {
                            playAmbient();
                        });
                    } else {
                        playAmbient();
                    }
                }
            } else {
                stopAmbient();
            }
        }

        function takeScreenshot() {
            const link = document.createElement('a');
            link.download = `sand-art-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        // ============ AYAR FONKSİYONLARI ============
        function setTheme(theme) {
            currentTheme = theme;
            sandColors = colorThemes[theme].colors;
            document.getElementById('themeTitle').textContent = colorThemes[theme].name;
            
            // LED rengi güncelle
            ledGlow.style.boxShadow = `0 0 ${ledIntensity}px ${ledIntensity/2}px ${colorThemes[theme].led}`;
            
            initColorLegend();
            resetSand();
            
            // Ses açıksa yeni tema sesini başlat
            if (soundEnabled) {
                playAmbient();
            }
        }

        function setShape(shape) {
            currentShape = shape;
            frame.className = 'frame ' + shape;
            setTimeout(() => {
                resize();
                resetSand();
            }, 100);
        }

        function setBackground(bg) {
            currentBackground = bg;
        }

        function setSandPercent(value) {
            sandFillPercent = parseInt(value);
            document.getElementById('sandPercentLabel').textContent = value + '%';
            resetSand();
        }

        function setSandSize(value) {
            sandBaseSize = parseFloat(value);
            document.getElementById('sandSizeLabel').textContent = value;
            resetSand();
        }

        function setSpeed(value) {
            speedMultiplier = parseFloat(value);
            document.getElementById('speedLabel').textContent = value + 'x';
        }

        function setGlitter(value) {
            glitterPercent = parseInt(value);
            document.getElementById('glitterLabel').textContent = value + '%';
            resetSand();
        }

        function setAirBubbles(count) {
            airBubbleCount = parseInt(count);
            document.getElementById('airCountLabel').textContent = count;
            createAirBubbles();
        }

        function setAirSpeed(value) {
            airSpeedMultiplier = parseFloat(value);
            document.getElementById('airSpeedLabel').textContent = value;
        }

        function setAirSize(value) {
            airBaseSize = parseInt(value);
            document.getElementById('airSizeLabel').textContent = value;
            createAirBubbles();
        }

        function setLED(value) {
            ledIntensity = parseInt(value);
            document.getElementById('ledLabel').textContent = value + '%';
            
            if (ledIntensity > 0) {
                ledGlow.classList.add('active');
                ledGlow.style.boxShadow = `0 0 ${ledIntensity}px ${ledIntensity/2}px ${colorThemes[currentTheme].led}`;
            } else {
                ledGlow.classList.remove('active');
            }
        }

        function setViscosity(value) {
            viscosityBase = parseFloat(value);
            document.getElementById('viscosityLabel').textContent = value;
        }

        function setFriction(value) {
            frictionCoeff = parseFloat(value);
            document.getElementById('frictionLabel').textContent = value;
        }

        function setTilt(value) {
            tiltAngle = parseInt(value);
            document.getElementById('tiltLabel').textContent = value + '°';
        }

        function setRotationSpeed(value) {
            rotationSpeed = parseFloat(value);
            document.getElementById('rotSpeedLabel').textContent = value;
        }

        // ============ BAŞLATMA ============
        window.addEventListener('resize', () => {
            resize();
            resetSand();
        });

        // Tıklama etkileşimi
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            let clickX = e.clientX - rect.left;
            let clickY = e.clientY - rect.top;
            
            if (visualFlipped) clickY = height - clickY;
            
            for (const p of particles) {
                const dx = p.x - clickX;
                const dy = p.y - clickY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 40) {
                    const force = (40 - dist) / 40 * 0.7;
                    p.vx += (dx / dist) * force;
                    p.vy += (dy / dist) * force;
                }
            }
        });

        // Sürükleme etkileşimi
        let isDragging = false;
        let lastDragX, lastDragY;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastDragX = e.clientX;
            lastDragY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const rect = canvas.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            let mouseY = e.clientY - rect.top;
            
            if (visualFlipped) mouseY = height - mouseY;
            
            const dragForceX = (e.clientX - lastDragX) * 0.02;
            const dragForceY = (e.clientY - lastDragY) * 0.02;
            
            for (const p of particles) {
                const dx = p.x - mouseX;
                const dy = p.y - mouseY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 50) {
                    p.vx += dragForceX * (1 - dist / 50);
                    p.vy += dragForceY * (1 - dist / 50);
                }
            }
            
            lastDragX = e.clientX;
            lastDragY = e.clientY;
        });

        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mouseleave', () => isDragging = false);

        // ============ MOBİL TOUCH DESTEĞİ ============
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isDragging = true;
            const touch = e.touches[0];
            lastDragX = touch.clientX;
            lastDragY = touch.clientY;
            
            // Dokunma ile kumu ittir
            const rect = canvas.getBoundingClientRect();
            let touchX = touch.clientX - rect.left;
            let touchY = touch.clientY - rect.top;
            if (visualFlipped) touchY = height - touchY;
            
            for (const p of particles) {
                const dx = p.x - touchX;
                const dy = p.y - touchY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 50) {
                    const force = (50 - dist) / 50 * 0.8;
                    p.vx += (dx / dist) * force;
                    p.vy += (dy / dist) * force;
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!isDragging) return;
            
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            let touchX = touch.clientX - rect.left;
            let touchY = touch.clientY - rect.top;
            if (visualFlipped) touchY = height - touchY;
            
            const dragForceX = (touch.clientX - lastDragX) * 0.025;
            const dragForceY = (touch.clientY - lastDragY) * 0.025;
            
            for (const p of particles) {
                const dx = p.x - touchX;
                const dy = p.y - touchY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 60) {
                    p.vx += dragForceX * (1 - dist / 60);
                    p.vy += dragForceY * (1 - dist / 60);
                }
            }
            
            lastDragX = touch.clientX;
            lastDragY = touch.clientY;
        }, { passive: false });

        canvas.addEventListener('touchend', () => isDragging = false);
        canvas.addEventListener('touchcancel', () => isDragging = false);

        // Çift dokunma ile çevir
        let lastTapTime = 0;
        canvas.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTapTime < 300) {
                flipFrame();
            }
            lastTapTime = now;
        });

        // Cihaz eğimi (mobil)
        if (window.DeviceOrientationEvent) {
            // iOS 13+ için izin iste
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                document.body.addEventListener('click', () => {
                    DeviceOrientationEvent.requestPermission()
                        .then(permission => {
                            if (permission === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation);
                            }
                        });
                }, { once: true });
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }
        
        function handleOrientation(e) {
            if (e.gamma !== null && !autoRotate) {
                // Eğim açısını kum fiziğine uygula
                tiltAngle = Math.max(-30, Math.min(30, e.gamma));
            }
        }

        // Mobil performans optimizasyonu
        function isMobile() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }
        
        if (isMobile()) {
            // Mobilde varsayılan kum yüzdesini düşür
            sandFillPercent = Math.min(sandFillPercent, 18);
            document.querySelector('input[onchange*="setSandPercent"]').value = sandFillPercent;
            document.getElementById('sandPercentLabel').textContent = sandFillPercent + '%';
        }

        // Başlat
        initColorLegend();
        resize();
        initParticles();
        requestAnimationFrame(update);
        toggleSound(); // Varsayılan olarak ses açık
    </script>
</body>
</html>
