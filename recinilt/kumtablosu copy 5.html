<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Kum Tablosu | Moving Sand Art Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #08080c;
            --frame-wood: #1a1512;
            --gold-accent: #c9a962;
            --text-muted: #6b6b7b;
        }

        body {
            min-height: 100vh;
            background: var(--bg-deep);
            background-image: 
                radial-gradient(ellipse at 20% 30%, rgba(30, 25, 40, 0.5) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(25, 35, 45, 0.4) 0%, transparent 50%);
            font-family: 'Cormorant Garamond', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
        }

        .title-section {
            text-align: center;
            margin-bottom: 10px;
        }

        .title {
            font-size: clamp(1.1rem, 2.5vw, 1.6rem);
            font-weight: 300;
            color: #e8e4df;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .subtitle {
            font-family: 'Space Mono', monospace;
            font-size: 0.5rem;
            color: var(--gold-accent);
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        .frame-container {
            position: relative;
            perspective: 1000px;
        }

        .frame {
            position: relative;
            background: linear-gradient(145deg, var(--frame-wood), #0d0b09);
            border-radius: 6px;
            padding: 10px;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.6),
                0 0 1px rgba(201, 169, 98, 0.2),
                inset 0 1px 0 rgba(45, 37, 32, 0.5);
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .frame.rectangle { width: min(580px, 92vw); height: min(400px, 62vw); }
        .frame.circle { width: min(420px, 85vw); height: min(420px, 85vw); border-radius: 50%; padding: 15px; }
        .frame.oval { width: min(520px, 90vw); height: min(360px, 58vw); border-radius: 50%; padding: 12px; }
        .frame.square { width: min(400px, 80vw); height: min(400px, 80vw); }

        .frame.flipping { transform: rotateX(180deg); }

        .frame::before {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px solid rgba(201, 169, 98, 0.12);
            border-radius: inherit;
            pointer-events: none;
        }

        .glass-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: inherit;
            overflow: hidden;
            box-shadow: 
                inset 0 0 30px rgba(0,0,0,0.5),
                inset 0 0 60px rgba(0,15,30,0.3);
        }

        .glass-reflection {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                130deg,
                rgba(255,255,255,0.03) 0%,
                transparent 35%,
                transparent 65%,
                rgba(255,255,255,0.015) 100%
            );
            pointer-events: none;
            z-index: 100;
            border-radius: inherit;
        }

        /* LED Glow Effect */
        .led-glow {
            position: absolute;
            inset: -3px;
            border-radius: inherit;
            pointer-events: none;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .led-glow.active {
            opacity: 1;
        }

        #sandCanvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: inherit;
        }

        /* Background image layer */
        .bg-image {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.3;
            pointer-events: none;
            border-radius: inherit;
        }

        .controls {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            font-family: 'Space Mono', monospace;
            font-size: 0.42rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 6px 10px;
            background: transparent;
            border: 1px solid rgba(201, 169, 98, 0.25);
            color: var(--gold-accent);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            border-color: var(--gold-accent);
            box-shadow: 0 0 12px rgba(201, 169, 98, 0.15);
            background: rgba(201, 169, 98, 0.05);
        }

        .btn.primary { background: rgba(201, 169, 98, 0.08); }
        .btn.active { background: rgba(201, 169, 98, 0.2); border-color: var(--gold-accent); }

        .settings-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
            max-width: 650px;
        }

        .settings-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .setting-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .setting-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.38rem;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .slider-control {
            -webkit-appearance: none;
            width: 45px;
            height: 2px;
            background: rgba(201, 169, 98, 0.2);
            border-radius: 2px;
            outline: none;
        }

        .slider-control::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 8px;
            height: 8px;
            background: var(--gold-accent);
            border-radius: 50%;
            cursor: pointer;
        }

        select.theme-select {
            font-family: 'Space Mono', monospace;
            font-size: 0.38rem;
            padding: 3px 6px;
            background: rgba(20, 20, 25, 0.9);
            border: 1px solid rgba(201, 169, 98, 0.3);
            color: var(--gold-accent);
            border-radius: 3px;
            cursor: pointer;
        }

        .color-legend {
            display: flex;
            gap: 2px;
            align-items: center;
        }

        .color-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.3);
            cursor: help;
        }

        .stats {
            font-family: 'Space Mono', monospace;
            font-size: 0.4rem;
            color: rgba(201, 169, 98, 0.5);
            margin-top: 6px;
            letter-spacing: 0.05em;
            text-align: center;
        }

        .progress-bar {
            width: 100px;
            height: 3px;
            background: rgba(201, 169, 98, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 4px;
        }

        .progress-fill {
            height: 100%;
            background: var(--gold-accent);
            transition: width 0.3s;
        }

        /* Collapsible sections */
        .section-toggle {
            font-family: 'Space Mono', monospace;
            font-size: 0.4rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
            border: 1px solid rgba(201, 169, 98, 0.15);
            border-radius: 3px;
            margin: 4px;
            transition: all 0.3s;
        }

        .section-toggle:hover {
            border-color: rgba(201, 169, 98, 0.4);
            color: var(--gold-accent);
        }

        .collapsible {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .collapsible.open {
            max-height: 200px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes glitter {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @keyframes aurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Mobil Uyumluluk */
        @media (max-width: 600px) {
            body {
                padding: 5px;
            }
            
            .title {
                font-size: 1rem;
                letter-spacing: 0.15em;
            }
            
            .subtitle {
                font-size: 0.4rem;
            }
            
            .frame {
                padding: 6px;
            }
            
            .frame.rectangle { 
                width: 95vw; 
                height: 65vw; 
            }
            
            .frame.circle { 
                width: 90vw; 
                height: 90vw; 
            }
            
            .controls {
                gap: 4px;
            }
            
            .btn {
                font-size: 0.38rem;
                padding: 8px 8px;
                min-width: 44px;
                min-height: 44px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .settings-row {
                gap: 4px;
                padding: 0 5px;
            }
            
            .setting-group {
                gap: 2px;
                flex: 1 1 45%;
                min-width: 0;
            }
            
            .setting-label {
                font-size: 0.32rem;
            }
            
            .slider-control {
                width: 40px;
                height: 4px;
            }
            
            .slider-control::-webkit-slider-thumb {
                width: 14px;
                height: 14px;
            }
            
            select.theme-select {
                font-size: 0.35rem;
                padding: 6px 4px;
                min-height: 30px;
            }
            
            .stats {
                font-size: 0.35rem;
            }
            
            .color-dot {
                width: 10px;
                height: 10px;
            }
        }

        /* Çok küçük ekranlar */
        @media (max-width: 400px) {
            .title-section {
                margin-bottom: 5px;
            }
            
            .title {
                font-size: 0.9rem;
            }
            
            .frame.rectangle { 
                width: 98vw; 
                height: 70vw; 
            }
            
            .setting-group {
                flex: 1 1 100%;
            }
            
            .settings-row {
                flex-direction: column;
                align-items: stretch;
            }
        }

        /* Touch cihazlar için hover efektlerini kaldır */
        @media (hover: none) {
            .btn:hover {
                border-color: rgba(201, 169, 98, 0.25);
                box-shadow: none;
                background: transparent;
            }
            
            .btn.active:hover,
            .btn.primary:hover {
                background: rgba(201, 169, 98, 0.08);
            }
        }

        /* Yatay mod (landscape) */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                padding: 5px;
            }
            
            .title-section {
                display: none;
            }
            
            .frame.rectangle { 
                width: min(90vh, 85vw); 
                height: min(60vh, 55vw); 
            }
            
            .settings-row {
                flex-wrap: nowrap;
                overflow-x: auto;
                justify-content: flex-start;
                padding-bottom: 5px;
            }
            
            .setting-group {
                flex: 0 0 auto;
            }
        }
    </style>
</head>
<body>
    <div class="title-section">
        <h1 class="title">Moving Sand Art</h1>
        <p class="subtitle" id="themeTitle">Ocean Pacific</p>
    </div>

    <div class="frame-container">
        <div class="frame rectangle" id="frame">
            <div class="led-glow" id="ledGlow"></div>
            <div class="glass-container" id="glassContainer">
                <div class="bg-image" id="bgImage"></div>
                <canvas id="sandCanvas"></canvas>
                <div class="glass-reflection"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn primary" onclick="flipFrame()">↻ Çevir</button>
        <button class="btn" onclick="resetSand()">Sıfırla</button>
        <button class="btn" id="pauseBtn" onclick="togglePause()">Duraklat</button>
        <button class="btn" onclick="shakeSand()">Salla</button>
        <button class="btn" id="rotateBtn" onclick="toggleAutoRotate()">360°</button>
        <button class="btn" id="soundBtn" onclick="toggleSound()">🔇</button>
        <button class="btn" onclick="takeScreenshot()">📷</button>
    </div>

    <!-- Tema & Şekil -->
    <div class="settings-row">
        <div class="setting-group">
            <span class="setting-label">Tema:</span>
            <select class="theme-select" id="themeSelect" onchange="setTheme(this.value)">
                <option value="ocean">Ocean Pacific</option>
                <option value="aurora">Aurora Borealis</option>
                <option value="sunset">Sunset</option>
                <option value="arctic">Arctic Ice</option>
                <option value="desert">Desert</option>
                <option value="volcanic">Volcanic</option>
            </select>
        </div>
        <div class="setting-group">
            <span class="setting-label">Şekil:</span>
            <select class="theme-select" onchange="setShape(this.value)">
                <option value="rectangle">Dikdörtgen</option>
                <option value="circle">Daire</option>
                <option value="oval">Oval</option>
                <option value="square">Kare</option>
            </select>
        </div>
        <div class="setting-group">
            <span class="setting-label">Arka Plan:</span>
            <select class="theme-select" onchange="setBackground(this.value)">
                <option value="none">Yok</option>
                <option value="aurora">Aurora</option>
                <option value="sunset">Gün Batımı</option>
                <option value="stars">Yıldızlar</option>
                <option value="mountains">Dağlar</option>
            </select>
        </div>
        <div class="setting-group">
            <span class="setting-label">360° Hız:</span>
            <input type="range" class="slider-control" min="0.01" max="0.5" step="0.01" value="0.05" onchange="setRotationSpeed(this.value)">
            <span class="setting-label" id="rotSpeedLabel">0.05</span>
        </div>
    </div>

    <!-- Kum Ayarları -->
    <div class="settings-row">
        <div class="setting-group">
            <span class="setting-label">Kum%:</span>
            <input type="range" class="slider-control" min="5" max="45" value="22" onchange="setSandPercent(this.value)">
            <span class="setting-label" id="sandPercentLabel">22%</span>
        </div>
        <div class="setting-group">
            <span class="setting-label">Boyut:</span>
            <input type="range" class="slider-control" min="0.5" max="2.5" step="0.1" value="1.0" onchange="setSandSize(this.value)">
            <span class="setting-label" id="sandSizeLabel">1.0</span>
        </div>
        <div class="setting-group">
            <span class="setting-label">Hız:</span>
            <input type="range" class="slider-control" min="0.1" max="1.5" step="0.05" value="0.5" onchange="setSpeed(this.value)">
            <span class="setting-label" id="speedLabel">0.5x</span>
        </div>
        <div class="setting-group">
            <span class="setting-label">Glitter:</span>
            <input type="range" class="slider-control" min="0" max="30" value="10" onchange="setGlitter(this.value)">
            <span class="setting-label" id="glitterLabel">10%</span>
        </div>
    </div>

    <!-- Hava & Işık Ayarları -->
    <div class="settings-row">
        <div class="setting-group">
            <span class="setting-label">Hava:</span>
            <input type="range" class="slider-control" min="0" max="10" value="5" onchange="setAirBubbles(this.value)">
            <span class="setting-label" id="airCountLabel">5</span>
        </div>
        <div class="setting-group">
            <span class="setting-label">H.Hız:</span>
            <input type="range" class="slider-control" min="0.005" max="0.2" step="0.005" value="0.025" onchange="setAirSpeed(this.value)">
            <span class="setting-label" id="airSpeedLabel">0.025</span>
        </div>
        <div class="setting-group">
            <span class="setting-label">H.Boy:</span>
            <input type="range" class="slider-control" min="10" max="35" value="16" onchange="setAirSize(this.value)">
            <span class="setting-label" id="airSizeLabel">16</span>
        </div>
        <div class="setting-group">
            <span class="setting-label">LED:</span>
            <input type="range" class="slider-control" min="0" max="100" value="0" onchange="setLED(this.value)">
            <span class="setting-label" id="ledLabel">0%</span>
        </div>
    </div>

    <!-- Fizik Ayarları -->
    <div class="settings-row">
        <div class="setting-group">
            <span class="setting-label">Viskoz:</span>
            <input type="range" class="slider-control" min="0.95" max="0.999" step="0.001" value="0.992" onchange="setViscosity(this.value)">
            <span class="setting-label" id="viscosityLabel">0.992</span>
        </div>
        <div class="setting-group">
            <span class="setting-label">Sürtün:</span>
            <input type="range" class="slider-control" min="0.01" max="0.15" step="0.01" value="0.06" onchange="setFriction(this.value)">
            <span class="setting-label" id="frictionLabel">0.06</span>
        </div>
        <div class="setting-group">
            <span class="setting-label">Eğim:</span>
            <input type="range" class="slider-control" min="-30" max="30" value="0" onchange="setTilt(this.value)">
            <span class="setting-label" id="tiltLabel">0°</span>
        </div>
        <div class="setting-group">
            <span class="setting-label">Renkler:</span>
            <div class="color-legend" id="colorLegend"></div>
        </div>
    </div>

    <div class="stats" id="stats">Kum: 0 | FPS: 0</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
    <div class="stats" id="flowTime">Tahmini Süre: --</div>

                    { color: '#ff6040', name: 'Ateş', density: 0.25, distribution: 0.18 }
                ],
                glitter: '#ff4400',
                led: 'rgba(255, 60, 20, 0.6)',
                bg: 'linear-gradient(180deg, #0a0505 0%, #150808 50%, #1a0a0a 100%)'
            }
        };

        let sandColors = colorThemes.ocean.colors;

        // ============ GELİŞMİŞ SES SİSTEMİ ============
        let audioContext = null;
        let masterGain = null;
        let ambientNodes = [];
        let collisionSoundPool = [];
        let lastCollisionTime = 0;
        let collisionCount = 0;
        let rainInterval = null;
        let currentAmbientType = 'ocean'; // ocean, rain, fire, wind
        
        // Ses ayarları
        let ambientVolume = 0.25;
        let collisionVolume = 0.4;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioContext.createGain();
                masterGain.gain.setValueAtTime(0.5, audioContext.currentTime);
                masterGain.connect(audioContext.destination);
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        // Pink Noise Buffer oluştur (kulağa daha hoş)
        function createPinkNoiseBuffer(duration = 2) {
            const bufferSize = audioContext.sampleRate * duration;
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + white * 0.0555179;
                b1 = 0.99332 * b1 + white * 0.0750759;
                b2 = 0.96900 * b2 + white * 0.1538520;
                b3 = 0.86650 * b3 + white * 0.3104856;
                b4 = 0.55000 * b4 + white * 0.5329522;
                b5 = -0.7616 * b5 - white * 0.0168980;
                data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
                b6 = white * 0.115926;
            }
            return buffer;
        }

        // Brown Noise Buffer (şelale/derin su sesi)
        function createBrownNoiseBuffer(duration = 2) {
            const bufferSize = audioContext.sampleRate * duration;
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            
            let lastOut = 0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                data[i] = (lastOut + (0.02 * white)) / 1.02;
                lastOut = data[i];
                data[i] *= 3.5;
            }
            return buffer;
        }

        // White Noise Buffer
        function createWhiteNoiseBuffer(duration = 2) {
            const bufferSize = audioContext.sampleRate * duration;
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            return buffer;
        }

        // ========== AMBIENT SES TİPLERİ ==========
        
        // Okyanus/Su Sesi
        function playOceanAmbient() {
            const ambientGain = audioContext.createGain();
            ambientGain.gain.setValueAtTime(ambientVolume, audioContext.currentTime);
            ambientGain.connect(masterGain);
            
            // Brown noise - derin su sesi
            const brownNoise = audioContext.createBufferSource();
            brownNoise.buffer = createBrownNoiseBuffer(3);
            brownNoise.loop = true;
            
            const brownFilter = audioContext.createBiquadFilter();
            brownFilter.type = 'lowpass';
            brownFilter.frequency.setValueAtTime(300, audioContext.currentTime);
            
            // LFO ile dalga efekti
            const lfo = audioContext.createOscillator();
            const lfoGain = audioContext.createGain();
            lfo.frequency.setValueAtTime(0.15, audioContext.currentTime);
            lfoGain.gain.setValueAtTime(100, audioContext.currentTime);
            lfo.connect(lfoGain);
            lfoGain.connect(brownFilter.frequency);
            lfo.start();
            
            const brownGain = audioContext.createGain();
            brownGain.gain.setValueAtTime(0.6, audioContext.currentTime);
            
            brownNoise.connect(brownFilter);
            brownFilter.connect(brownGain);
            brownGain.connect(ambientGain);
            brownNoise.start();
            
            // Pink noise - yüzey köpüğü
            const pinkNoise = audioContext.createBufferSource();
            pinkNoise.buffer = createPinkNoiseBuffer(3);
            pinkNoise.loop = true;
            
            const pinkFilter = audioContext.createBiquadFilter();
            pinkFilter.type = 'bandpass';
            pinkFilter.frequency.setValueAtTime(800, audioContext.currentTime);
            pinkFilter.Q.setValueAtTime(0.5, audioContext.currentTime);
            
            const pinkGain = audioContext.createGain();
            pinkGain.gain.setValueAtTime(0.15, audioContext.currentTime);
            
            pinkNoise.connect(pinkFilter);
            pinkFilter.connect(pinkGain);
            pinkGain.connect(ambientGain);
            pinkNoise.start();
            
            ambientNodes.push({ 
                sources: [brownNoise, pinkNoise, lfo], 
                gain: ambientGain 
            });
        }

        // Yağmur Sesi
        function playRainAmbient() {
            const ambientGain = audioContext.createGain();
            ambientGain.gain.setValueAtTime(ambientVolume, audioContext.currentTime);
            ambientGain.connect(masterGain);
            
            // Arka plan yağmur gürültüsü
            const rainNoise = audioContext.createBufferSource();
            rainNoise.buffer = createPinkNoiseBuffer(3);
            rainNoise.loop = true;
            
            const rainFilter = audioContext.createBiquadFilter();
            rainFilter.type = 'highpass';
            rainFilter.frequency.setValueAtTime(2000, audioContext.currentTime);
            
            const rainGain = audioContext.createGain();
            rainGain.gain.setValueAtTime(0.3, audioContext.currentTime);
            
            rainNoise.connect(rainFilter);
            rainFilter.connect(rainGain);
            rainGain.connect(ambientGain);
            rainNoise.start();
            
            // Düşük frekans gök gürültüsü
            const thunderNoise = audioContext.createBufferSource();
            thunderNoise.buffer = createBrownNoiseBuffer(3);
            thunderNoise.loop = true;
            
            const thunderFilter = audioContext.createBiquadFilter();
            thunderFilter.type = 'lowpass';
            thunderFilter.frequency.setValueAtTime(150, audioContext.currentTime);
            
            const thunderGain = audioContext.createGain();
            thunderGain.gain.setValueAtTime(0.2, audioContext.currentTime);
            
            thunderNoise.connect(thunderFilter);
            thunderFilter.connect(thunderGain);
            thunderGain.connect(ambientGain);
            thunderNoise.start();
            
            ambientNodes.push({ 
                sources: [rainNoise, thunderNoise], 
                gain: ambientGain 
            });
            
            // Yağmur damlaları
            rainInterval = setInterval(() => {
                if (soundEnabled && Math.random() > 0.3) {
                    playRainDrop();
                }
            }, 50);
        }

        function playRainDrop() {
            if (!audioContext || !soundEnabled) return;
            
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();
            
            osc.type = 'sine';
            const freq = 3000 + Math.random() * 3000;
            osc.frequency.setValueAtTime(freq, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.3, audioContext.currentTime + 0.03);
            
            filter.type = 'highpass';
            filter.frequency.setValueAtTime(1000, audioContext.currentTime);
            
            gain.gain.setValueAtTime(0.02 + Math.random() * 0.03, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.05);
            
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioContext.currentTime + 0.06);
        }

        // Ateş Sesi (Volcanic tema için)
        function playFireAmbient() {
            const ambientGain = audioContext.createGain();
            ambientGain.gain.setValueAtTime(ambientVolume, audioContext.currentTime);
            ambientGain.connect(masterGain);
            
            // Ana ateş gürültüsü - filtrelenmiş beyaz gürültü
            const fireNoise = audioContext.createBufferSource();
            fireNoise.buffer = createWhiteNoiseBuffer(3);
            fireNoise.loop = true;
            
            // Bandpass filtre - ateş karakteri
            const fireFilter = audioContext.createBiquadFilter();
            fireFilter.type = 'bandpass';
            fireFilter.frequency.setValueAtTime(600, audioContext.currentTime);
            fireFilter.Q.setValueAtTime(1.5, audioContext.currentTime);
            
            // LFO ile çıtırdama efekti
            const lfo1 = audioContext.createOscillator();
            const lfoGain1 = audioContext.createGain();
            lfo1.frequency.setValueAtTime(8 + Math.random() * 4, audioContext.currentTime);
            lfoGain1.gain.setValueAtTime(200, audioContext.currentTime);
            lfo1.connect(lfoGain1);
            lfoGain1.connect(fireFilter.frequency);
            lfo1.start();
            
            const fireGain = audioContext.createGain();
            fireGain.gain.setValueAtTime(0.35, audioContext.currentTime);
            
            fireNoise.connect(fireFilter);
            fireFilter.connect(fireGain);
            fireGain.connect(ambientGain);
            fireNoise.start();
            
            // Düşük frekans alev uğultusu
            const rumbleNoise = audioContext.createBufferSource();
            rumbleNoise.buffer = createBrownNoiseBuffer(3);
            rumbleNoise.loop = true;
            
            const rumbleFilter = audioContext.createBiquadFilter();
            rumbleFilter.type = 'lowpass';
            rumbleFilter.frequency.setValueAtTime(200, audioContext.currentTime);
            
            const rumbleGain = audioContext.createGain();
            rumbleGain.gain.setValueAtTime(0.25, audioContext.currentTime);
            
            rumbleNoise.connect(rumbleFilter);
            rumbleFilter.connect(rumbleGain);
            rumbleGain.connect(ambientGain);
            rumbleNoise.start();
            
            ambientNodes.push({ 
                sources: [fireNoise, rumbleNoise, lfo1], 
                gain: ambientGain 
            });
            
            // Rastgele çıtırtı sesleri
            rainInterval = setInterval(() => {
                if (soundEnabled && Math.random() > 0.5) {
                    playCrackle();
                }
            }, 80);
        }

        function playCrackle() {
            if (!audioContext || !soundEnabled) return;
            
            const noise = audioContext.createBufferSource();
            const buffer = audioContext.createBuffer(1, audioContext.sampleRate * 0.05, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (data.length * 0.3));
            }
            noise.buffer = buffer;
            
            const filter = audioContext.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.setValueAtTime(2000 + Math.random() * 2000, audioContext.currentTime);
            
            const gain = audioContext.createGain();
            gain.gain.setValueAtTime(0.1 + Math.random() * 0.15, audioContext.currentTime);
            
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);
            noise.start();
        }

        // Rüzgar Sesi (Arctic tema için)
        function playWindAmbient() {
            const ambientGain = audioContext.createGain();
            ambientGain.gain.setValueAtTime(ambientVolume, audioContext.currentTime);
            ambientGain.connect(masterGain);
            
            // Ana rüzgar - pink noise + bandpass
            const windNoise = audioContext.createBufferSource();
            windNoise.buffer = createPinkNoiseBuffer(3);
            windNoise.loop = true;
            
            const windFilter = audioContext.createBiquadFilter();
            windFilter.type = 'bandpass';
            windFilter.frequency.setValueAtTime(400, audioContext.currentTime);
            windFilter.Q.setValueAtTime(2, audioContext.currentTime);
            
            // Yavaş LFO - rüzgar esintisi
            const lfo = audioContext.createOscillator();
            const lfoGain = audioContext.createGain();
            lfo.frequency.setValueAtTime(0.1, audioContext.currentTime);
            lfoGain.gain.setValueAtTime(300, audioContext.currentTime);
            lfo.connect(lfoGain);
            lfoGain.connect(windFilter.frequency);
            lfo.start();
            
            const windGain = audioContext.createGain();
            windGain.gain.setValueAtTime(0.4, audioContext.currentTime);
            
            windNoise.connect(windFilter);
            windFilter.connect(windGain);
            windGain.connect(ambientGain);
            windNoise.start();
            
            // Yüksek frekans ıslık
            const whistleNoise = audioContext.createBufferSource();
            whistleNoise.buffer = createWhiteNoiseBuffer(3);
            whistleNoise.loop = true;
            
            const whistleFilter = audioContext.createBiquadFilter();
            whistleFilter.type = 'bandpass';
            whistleFilter.frequency.setValueAtTime(2000, audioContext.currentTime);
            whistleFilter.Q.setValueAtTime(10, audioContext.currentTime);
            
            const whistleGain = audioContext.createGain();
            whistleGain.gain.setValueAtTime(0.08, audioContext.currentTime);
            
            whistleNoise.connect(whistleFilter);
            whistleFilter.connect(whistleGain);
            whistleGain.connect(ambientGain);
            whistleNoise.start();
            
            ambientNodes.push({ 
                sources: [windNoise, whistleNoise, lfo],
