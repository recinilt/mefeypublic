<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Sinema - Sosyal İzleme</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        /* 2D UI Overlay */
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }
        
        #ui-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .ui-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #667eea;
            margin-top: 0;
            font-size: 2em;
            text-align: center;
        }
        
        h2 {
            color: #444;
            font-size: 1.3em;
            margin-top: 30px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border 0.3s;
            font-family: inherit;
        }
        
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin: 5px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .room-item {
            background: #f8f9fa;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .room-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .room-item.private {
            border-left-color: #f5576c;
        }
        
        .room-name {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
        }
        
        .room-info {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
        
        .lock-icon {
            float: right;
            color: #f5576c;
        }
        
        #vr-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 15px;
            display: none;
        }
        
        #vr-controls.visible {
            display: block;
        }
        
        #vr-controls button {
            margin: 0 5px;
            font-size: 14px;
            padding: 10px 20px;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        
        .status-indicator.connected {
            background: #4caf50;
        }
        
        .status-indicator.disconnected {
            background: #f44336;
        }
        
        #room-info-display {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            z-index: 100;
            display: none;
        }
        
        #room-info-display.visible {
            display: block;
        }
        
        .checkbox-container {
            display: flex;
            align-items: center;
            margin: 15px 0;
        }
        
        .checkbox-container input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
        }
        
        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 12px;
            margin: 15px 0;
            border-radius: 5px;
            font-size: 0.9em;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>

<!-- 2D UI Overlay -->
<div id="ui-overlay">
    <div class="ui-container">
        <h1>🎬 VR Sosyal Sinema</h1>
        
        <!-- Ana Menü -->
        <div id="main-menu">
            <h2>Hoş Geldiniz</h2>
            <button onclick="showCreateRoom()">➕ Yeni Oda Oluştur</button>
            <button onclick="showRoomList()" class="secondary">🚪 Odalara Gözat</button>
        </div>
        
        <!-- Oda Oluşturma -->
        <div id="create-room" style="display: none;">
            <h2>Yeni Oda Oluştur</h2>
            <input type="text" id="room-name-input" placeholder="Oda Adı (örn: Aksiyon Filmleri)" />
            
            <div class="info-box">
                💡 <strong>İpucu:</strong> Google Drive, pCloud veya Koofr'dan videonuzu yükleyin ve herkese açık paylaşım linkini buraya yapıştırın.
            </div>
            
            <textarea id="video-url-input" placeholder="Video URL (GDrive/pCloud/Koofr herkese açık paylaşım linki)"></textarea>
            
            <div class="checkbox-container">
                <input type="checkbox" id="private-room-check" />
                <label for="private-room-check">🔒 Özel Oda (Şifre Korumalı)</label>
            </div>
            
            <input type="password" id="room-password-input" placeholder="Oda Şifresi (opsiyonel)" style="display: none;" />
            
            <label for="screen-size">Ekran Boyutu:</label>
            <select id="screen-size">
                <option value="normal">Normal (16m)</option>
                <option value="large" selected>Büyük (24m)</option>
                <option value="xlarge">Çok Büyük (32m)</option>
                <option value="imax">IMAX (40m)</option>
            </select>
            
            <br><br>
            <button onclick="createRoom()">🎬 Oda Oluştur ve Başlat</button>
            <button onclick="showMainMenu()" class="secondary">◀ Geri</button>
        </div>
        
        <!-- Oda Listesi -->
        <div id="room-list" style="display: none;">
            <h2>Aktif Odalar</h2>
            <div id="rooms-container">
                <div class="loading">⏳ Odalar yükleniyor...</div>
            </div>
            <br>
            <button onclick="refreshRooms()" class="secondary">🔄 Yenile</button>
            <button onclick="showMainMenu()" class="secondary">◀ Geri</button>
        </div>
        
        <!-- Şifre Girişi -->
        <div id="password-prompt" style="display: none;">
            <h2>🔒 Şifreli Oda</h2>
            <p id="password-room-name"></p>
            <input type="password" id="room-password-join" placeholder="Oda Şifresi" />
            <br><br>
            <button onclick="joinWithPassword()">Giriş Yap</button>
            <button onclick="showRoomList()" class="secondary">◀ Geri</button>
        </div>
    </div>
</div>

<!-- VR Kontrolleri -->
<div id="vr-controls">
    <button onclick="togglePlayPause()">⏯ Play/Pause</button>
    <button onclick="leaveRoom()">🚪 Odadan Çık</button>
</div>

<!-- Oda Bilgisi -->
<div id="room-info-display">
    <div><span class="status-indicator connected"></span> <span id="room-title">Oda</span></div>
    <div style="font-size: 0.8em; margin-top: 5px;">👥 <span id="viewers-count">0</span> İzleyici</div>
</div>

<!-- VR Sahnesi -->
<a-scene id="vr-scene" loading-screen="enabled: false">
    <!-- Ortam -->
    <a-sky color="#000000"></a-sky>
    
    <!-- Sinema Ekranı -->
    <a-video
        id="cinema-screen"
        src=""
        width="24"
        height="13.5"
        position="0 2 -15"
        visible="false"
    ></a-video>
    
    <!-- Zemin -->
    <a-plane 
        position="0 0 0" 
        rotation="-90 0 0" 
        width="100" 
        height="100" 
        color="#1a1a1a"
    ></a-plane>
    
    <!-- Işıklandırma -->
    <a-light type="ambient" color="#444"></a-light>
    <a-light type="point" position="0 5 0" intensity="0.5"></a-light>
    
    <!-- Kamera -->
    <a-entity id="camera-rig" position="0 1.6 0">
        <a-camera></a-camera>
    </a-entity>
</a-scene>

<script>
// ============================================
// FİREBASE YAPLANDIRMASI
// ============================================
const firebaseConfig = {
    apiKey: "AIzaSyC60idSLdAiqAjPWAOMaM3g8LAKPGEUwH8",
    authDomain: "vr-sinema.firebaseapp.com",
    databaseURL: "https://vr-sinema-default-rtdb.firebaseio.com",
    projectId: "vr-sinema",
    storageBucket: "vr-sinema.firebasestorage.app",
    messagingSenderId: "724648238300",
    appId: "1:724648238300:web:dceba8c536e8a5ffd96819"
};

// Firebase başlatma
firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const auth = firebase.auth();

// Anonim giriş
let authReady = false;
auth.signInAnonymously()
    .then(() => {
        console.log('✓ Anonim giriş başarılı:', auth.currentUser.uid);
        authReady = true;
    })
    .catch((error) => {
        console.error('❌ Giriş hatası:', error);
        alert('Firebase bağlantı hatası! Lütfen sayfayı yenileyin.\n\nHata: ' + error.message);
    });

// ============================================
// GLOBAL DEĞİŞKENLER
// ============================================
let currentRoomId = null;
let currentRoomData = null;
let isRoomOwner = false;
let videoElement = null;
let syncTimeout = null;
let roomRef = null;
let selectedRoomForPassword = null;

// ============================================
// UI FONKSİYONLARI
// ============================================
function showMainMenu() {
    document.getElementById('main-menu').style.display = 'block';
    document.getElementById('create-room').style.display = 'none';
    document.getElementById('room-list').style.display = 'none';
    document.getElementById('password-prompt').style.display = 'none';
}

function showCreateRoom() {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('create-room').style.display = 'block';
    
    // Şifre alanı kontrolü
    document.getElementById('private-room-check').addEventListener('change', function() {
        document.getElementById('room-password-input').style.display = 
            this.checked ? 'block' : 'none';
    });
}

function showRoomList() {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('room-list').style.display = 'block';
    loadRooms();
}

function refreshRooms() {
    loadRooms();
}

function showPasswordPrompt(roomId, roomName) {
    selectedRoomForPassword = roomId;
    document.getElementById('password-room-name').textContent = `Oda: ${roomName}`;
    document.getElementById('room-list').style.display = 'none';
    document.getElementById('password-prompt').style.display = 'block';
}

// ============================================
// ODA YÖNETİMİ
// ============================================
function createRoom() {
    if (!authReady) {
        alert('Lütfen bekleyin, Firebase bağlantısı kuruluyor...');
        return;
    }
    
    const roomName = document.getElementById('room-name-input').value.trim();
    const videoUrl = document.getElementById('video-url-input').value.trim();
    const isPrivate = document.getElementById('private-room-check').checked;
    const password = document.getElementById('room-password-input').value;
    const screenSize = document.getElementById('screen-size').value;
    
    if (!roomName || !videoUrl) {
        alert('Lütfen oda adı ve video URL giriniz!');
        return;
    }
    
    // Video URL'sini düzenle (GDrive için)
    let processedUrl = videoUrl;
    if (videoUrl.includes('drive.google.com')) {
        const fileId = extractGDriveFileId(videoUrl);
        if (fileId) {
            processedUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;
        }
    }
    
    // pCloud için
    if (videoUrl.includes('pcloud.com') && !videoUrl.includes('/download')) {
        processedUrl = videoUrl.replace('/publink/show', '/download');
    }
    
    // Yeni oda oluştur
    const newRoomRef = database.ref('rooms').push();
    const roomId = newRoomRef.key;
    
    const roomData = {
        name: roomName,
        videoUrl: processedUrl,
        isPrivate: isPrivate,
        password: isPrivate ? btoa(password) : null,
        screenSize: screenSize,
        owner: auth.currentUser.uid,
        createdAt: firebase.database.ServerValue.TIMESTAMP,
        videoState: {
            isPlaying: false,
            currentTime: 0,
            lastUpdate: Date.now()
        },
        viewers: 1
    };
    
    newRoomRef.set(roomData).then(() => {
        isRoomOwner = true;
        joinRoom(roomId, roomData);
    }).catch(error => {
        console.error('Oda oluşturma hatası:', error);
        alert('Oda oluşturulurken hata: ' + error.message);
    });
}

function loadRooms() {
    const roomsContainer = document.getElementById('rooms-container');
    roomsContainer.innerHTML = '<div class="loading">⏳ Odalar yükleniyor...</div>';
    
    database.ref('rooms').orderByChild('createdAt').once('value', (snapshot) => {
        roomsContainer.innerHTML = '';
        
        if (!snapshot.exists()) {
            roomsContainer.innerHTML = '<p style="text-align: center; color: #666;">Henüz aktif oda yok. İlk odayı siz oluşturun! 🎬</p>';
            return;
        }
        
        const rooms = [];
        snapshot.forEach((childSnapshot) => {
            rooms.push({
                id: childSnapshot.key,
                data: childSnapshot.val()
            });
        });
        
        // Ters sırada göster (en yeni üstte)
        rooms.reverse().forEach(room => {
            const roomDiv = document.createElement('div');
            roomDiv.className = 'room-item' + (room.data.isPrivate ? ' private' : '');
            roomDiv.innerHTML = `
                ${room.data.isPrivate ? '<span class="lock-icon">🔒</span>' : ''}
                <div class="room-name">${escapeHtml(room.data.name)}</div>
                <div class="room-info">👥 ${room.data.viewers || 1} izleyici</div>
            `;
            roomDiv.onclick = () => selectRoom(room.id, room.data);
            roomsContainer.appendChild(roomDiv);
        });
    }).catch(error => {
        console.error('Oda listesi yükleme hatası:', error);
        roomsContainer.innerHTML = '<p style="color: red;">Odalar yüklenirken hata oluştu. Lütfen sayfayı yenileyin.</p>';
    });
}

function selectRoom(roomId, roomData) {
    if (roomData.isPrivate) {
        showPasswordPrompt(roomId, roomData.name);
    } else {
        joinRoom(roomId, roomData);
    }
}

function joinWithPassword() {
    const password = document.getElementById('room-password-join').value;
    
    database.ref(`rooms/${selectedRoomForPassword}`).once('value', (snapshot) => {
        const roomData = snapshot.val();
        
        if (!roomData) {
            alert('Oda bulunamadı!');
            return;
        }
        
        if (btoa(password) === roomData.password) {
            joinRoom(selectedRoomForPassword, roomData);
        } else {
            alert('Yanlış şifre!');
        }
    });
}

function joinRoom(roomId, roomData) {
    currentRoomId = roomId;
    currentRoomData = roomData;
    roomRef = database.ref(`rooms/${roomId}`);
    
    // Oda sahibi kontrolü
    isRoomOwner = (roomData.owner === auth.currentUser.uid);
    
    // İzleyici sayısını artır
    roomRef.child('viewers').transaction((current) => {
        return (current || 0) + 1;
    });
    
    // UI'yi gizle, VR sahnesini göster
    document.getElementById('ui-overlay').classList.add('hidden');
    document.getElementById('vr-controls').classList.add('visible');
    document.getElementById('room-info-display').classList.add('visible');
    
    // Oda bilgilerini göster
    document.getElementById('room-title').textContent = roomData.name;
    updateViewerCount();
    
    // Video'yu ayarla
    setupVideo(roomData.videoUrl, roomData.screenSize);
    
    // Senkronizasyonu başlat
    listenToRoomUpdates();
    
    // Sayfa kapatılınca temizlik
    window.addEventListener('beforeunload', () => {
        leaveRoom();
    });
}

function leaveRoom() {
    if (currentRoomId && roomRef) {
        // İzleyici sayısını azalt
        roomRef.child('viewers').transaction((current) => {
            return Math.max((current || 1) - 1, 0);
        });
        
        // Oda sahibiyse ve izleyici kalmadıysa odayı sil
        if (isRoomOwner) {
            setTimeout(() => {
                roomRef.child('viewers').once('value', (snapshot) => {
                    if (snapshot.val() <= 0) {
                        roomRef.remove();
                    }
                });
            }, 1000);
        }
        
        // Listener'ı kaldır
        roomRef.off();
    }
    
    // Sayfayı yenile
    location.reload();
}

// ============================================
// VİDEO YÖNETİMİ
// ============================================
function setupVideo(videoUrl, screenSize) {
    const scene = document.querySelector('a-scene');
    const screen = document.getElementById('cinema-screen');
    
    // Ekran boyutlarını ayarla
    const sizes = {
        normal: { width: 16, height: 9 },
        large: { width: 24, height: 13.5 },
        xlarge: { width: 32, height: 18 },
        imax: { width: 40, height: 22.5 }
    };
    
    const size = sizes[screenSize] || sizes.large;
    screen.setAttribute('width', size.width);
    screen.setAttribute('height', size.height);
    
    // Video asset'i oluştur
    let assets = document.querySelector('a-assets');
    if (!assets) {
        assets = document.createElement('a-assets');
        scene.appendChild(assets);
    }
    
    const videoAsset = document.createElement('video');
    videoAsset.id = 'video-src';
    videoAsset.crossOrigin = 'anonymous';
    videoAsset.src = videoUrl;
    videoAsset.preload = 'auto';
    videoAsset.loop = false;
    videoAsset.playsInline = true;
    
    assets.appendChild(videoAsset);
    videoElement = videoAsset;
    
    // Ekrana bağla
    screen.setAttribute('src', '#video-src');
    screen.setAttribute('visible', 'true');
    
    // Video event listener'ları
    videoElement.addEventListener('loadedmetadata', () => {
        console.log('✓ Video yüklendi:', videoElement.duration, 'saniye');
    });
    
    videoElement.addEventListener('error', (e) => {
        console.error('❌ Video yükleme hatası:', e);
        alert('Video yüklenemedi!\n\nSebebi:\n- URL yanlış olabilir\n- Video herkese açık olmayabilir\n- CORS sorunu olabilir\n\nLütfen başka bir link deneyin.');
    });
}

function togglePlayPause() {
    if (!isRoomOwner) {
        alert('⚠️ Sadece oda sahibi video kontrolü yapabilir!');
        return;
    }
    
    if (!videoElement) {
        alert('Video henüz yüklenmedi!');
        return;
    }
    
    if (videoElement.paused) {
        videoElement.play().catch(err => {
            console.error('Play hatası:', err);
            alert('Video oynatılamadı. Tarayıcı izni gerekebilir.');
        });
        updateRoomState(true, videoElement.currentTime);
    } else {
        videoElement.pause();
        updateRoomState(false, videoElement.currentTime);
    }
}

function updateRoomState(isPlaying, currentTime) {
    if (roomRef) {
        roomRef.child('videoState').update({
            isPlaying: isPlaying,
            currentTime: currentTime,
            lastUpdate: Date.now()
        });
    }
}

function listenToRoomUpdates() {
    if (!roomRef) return;
    
    // Video durumu değişikliklerini dinle
    roomRef.child('videoState').on('value', (snapshot) => {
        if (!videoElement) return;
        
        const state = snapshot.val();
        if (!state) return;
        
        // Senkronizasyon threshold (0.5 saniye)
        const timeDiff = Math.abs(videoElement.currentTime - state.currentTime);
        
        if (state.isPlaying && videoElement.paused) {
            videoElement.currentTime = state.currentTime;
            videoElement.play().catch(err => console.log('Auto-play engellendi:', err));
        } else if (!state.isPlaying && !videoElement.paused) {
            videoElement.pause();
            videoElement.currentTime = state.currentTime;
        } else if (timeDiff > 0.5) {
            videoElement.currentTime = state.currentTime;
        }
    });
    
    // İzleyici sayısını güncelle
    roomRef.child('viewers').on('value', () => {
        updateViewerCount();
    });
    
    // Oda sahibiyse periyodik olarak durumu güncelle
    if (isRoomOwner) {
        setInterval(() => {
            if (videoElement && !videoElement.paused) {
                updateRoomState(true, videoElement.currentTime);
            }
        }, 2000);
    }
}

function updateViewerCount() {
    if (roomRef) {
        roomRef.child('viewers').once('value', (snapshot) => {
            document.getElementById('viewers-count').textContent = snapshot.val() || 0;
        });
    }
}

// ============================================
// YARDIMCI FONKSİYONLAR
// ============================================
function extractGDriveFileId(url) {
    const patterns = [
        /\/file\/d\/([a-zA-Z0-9_-]+)/,
        /id=([a-zA-Z0-9_-]+)/,
        /\/d\/([a-zA-Z0-9_-]+)/
    ];
    
    for (let pattern of patterns) {
        const match = url.match(pattern);
        if (match) return match[1];
    }
    return null;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ============================================
// BAŞLATMA
// ============================================
console.log('🎬 VR Sosyal Sinema başlatıldı!');
console.log('📍 Site URL: https://recinilt.github.io/mefeypublic/recinilt/vr-sinema.html');
console.log('Firebase bağlantısı:', firebase.app().name ? 'Başarılı ✓' : 'Başarısız ✗');

// VR sahnesini başlangıçta yükle
document.addEventListener('DOMContentLoaded', () => {
    const scene = document.querySelector('a-scene');
    scene.addEventListener('loaded', () => {
        console.log('✓ VR sahnesi yüklendi');
    });
});
</script>

</body>
</html>
