<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Video Studio Pro - Reference Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #020617;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .video-canvas {
            aspect-ratio: 16 / 9;
            background: #000;
            position: relative;
            overflow: hidden;
            border-radius: 2rem;
            box-shadow: 0 0 100px -20px rgba(59, 130, 246, 0.4);
        }

        .slide-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease-in-out, transform 15s linear;
        }

        .slide-img.active {
            opacity: 1;
            transform: scale(1.1);
        }

        .style-btn {
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.05);
            background: rgba(255,255,255,0.02);
            text-transform: uppercase;
            font-size: 10px;
            font-weight: 800;
        }

        .style-btn.selected {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.2);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }

        .loader-ring {
            border: 3px solid #1e293b;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .progress-bar {
            height: 6px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #a855f7);
            width: 0%;
            transition: width 0.1s linear;
        }

        .subtitle-box {
            text-shadow: 0 4px 15px rgba(0,0,0,1);
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }

        #refPreview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.75rem;
        }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-7xl mx-auto">
        <header class="mb-12 flex flex-col md:flex-row justify-between items-center gap-6">
            <div>
                <h1 class="text-5xl font-black tracking-tight bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500 bg-clip-text text-transparent">
                    Music Video AI Studio Pro
                </h1>
                <p class="text-slate-400 mt-2 font-medium">Reference & Mood Edition: Kişiselleştirilmiş Klip</p>
            </div>
            <div id="apiStatus" class="glass px-6 py-3 rounded-full flex items-center gap-3 border-blue-500/20">
                <div class="w-2 h-2 bg-blue-500 rounded-full animate-ping"></div>
                <span class="text-xs font-bold uppercase tracking-widest text-blue-400">AI Bağlantısı Aktif</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            
            <!-- Kontrol Paneli -->
            <div class="lg:col-span-4 space-y-6">
                <!-- 01. Ses Dosyası -->
                <div class="glass p-6 rounded-[2rem]">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mb-3 block">01. Ses Dosyası</label>
                    <input type="file" id="audioInput" accept="audio/*" class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer" />
                    <audio id="audioPlayer" class="hidden"></audio>
                </div>

                <!-- 02. Referans Resim (YENİ) -->
                <div class="glass p-6 rounded-[2rem] border border-blue-500/20">
                    <label class="text-[10px] font-black text-blue-400 uppercase tracking-[0.2em] mb-3 block">02. Referans Resim (Opsiyonel)</label>
                    <div class="flex gap-4 items-center">
                        <div id="refPreview" class="w-16 h-16 bg-slate-900 rounded-xl border border-slate-800 flex items-center justify-center text-[20px] shrink-0">
                            📷
                        </div>
                        <div class="flex-1">
                            <input type="file" id="refImageInput" accept="image/*" class="block w-full text-[10px] text-slate-500 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-[10px] file:bg-slate-800 file:text-slate-300 cursor-pointer" />
                            <p class="text-[9px] text-slate-500 mt-1 italic">Kendi fotoğrafınızı veya stil örneği yükleyin.</p>
                        </div>
                    </div>
                </div>

                <!-- 03. Görsel Stil -->
                <div class="glass p-6 rounded-[2rem]">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mb-3 block">03. Görsel Stil</label>
                    <div id="styleGrid" class="grid grid-cols-3 gap-2 max-h-40 overflow-y-auto pr-2"></div>
                </div>

                <!-- 04. Duygu / Ruh Hali -->
                <div class="glass p-6 rounded-[2rem]">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mb-3 block">04. Duygu / Ruh Hali</label>
                    <input type="text" id="moodInput" class="w-full bg-slate-950/50 border border-slate-800 rounded-xl p-3 text-xs focus:ring-2 focus:ring-blue-500/40 outline-none text-white" 
                        placeholder="Örn: Mutlu, epik, karanlık..." />
                </div>

                <!-- 05. Sözler ve Zamanlama -->
                <div class="glass p-6 rounded-[2rem]">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mb-3 block">05. Sözler [Zaman Aralığı]</label>
                    <textarea id="lyricsInput" rows="6" class="w-full bg-slate-950/50 border border-slate-800 rounded-2xl p-4 text-xs font-mono focus:ring-2 focus:ring-blue-500/40 outline-none text-blue-100" 
                        placeholder="Metin[0-14]&#10;Koşturdum[14-20]"></textarea>
                    
                    <div class="grid grid-cols-2 gap-3 mt-4">
                        <button id="planBtn" class="bg-white text-slate-950 font-black py-3 rounded-xl hover:bg-blue-50 transition-all uppercase text-[10px]">
                            Sahneleri Planla
                        </button>
                        <button id="resetBtn" class="bg-slate-800 text-slate-400 font-bold py-3 rounded-xl hover:bg-red-900/20 hover:text-red-400 transition-all uppercase text-[10px]">
                            Sıfırla
                        </button>
                    </div>
                </div>

                <div id="statusConsole" class="hidden glass p-4 rounded-2xl border-blue-500/10">
                    <div id="statusLogs" class="space-y-1 text-[9px] font-mono text-slate-400 max-h-32 overflow-y-auto"></div>
                </div>
            </div>

            <!-- Sağ Panel: Video & Galeri -->
            <div class="lg:col-span-8 space-y-8">
                <div class="video-canvas group" id="videoArea">
                    <div id="imageLayer" class="absolute inset-0">
                        <div class="h-full flex flex-col items-center justify-center text-slate-700">
                            <p class="text-sm font-semibold">Senaryo ve görseller burada senkronize olacak.</p>
                        </div>
                    </div>
                    
                    <div class="subtitle-box absolute bottom-0 left-0 right-0 p-16 text-center pointer-events-none">
                        <h2 id="subtitleText" class="text-2xl md:text-3xl font-black text-white opacity-0 transition-all duration-500"></h2>
                    </div>

                    <div class="absolute bottom-8 left-8 right-8 flex items-center gap-6 opacity-0 group-hover:opacity-100 transition-all duration-300 bg-black/60 backdrop-blur-xl p-5 rounded-3xl border border-white/5">
                        <button id="playBtn" disabled class="w-14 h-14 bg-white text-black rounded-full flex items-center justify-center hover:scale-105 transition-all">
                            <svg id="playIcon" class="w-6 h-6 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <div class="flex-1">
                            <div class="progress-bar mb-3">
                                <div id="progressBar" class="progress-fill"></div>
                            </div>
                            <div class="flex justify-between text-[10px] font-black text-slate-400 uppercase">
                                <span id="timeDisplay">00:00 / 00:00</span>
                                <span id="renderStatus">Hazır Değil</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="glass p-8 rounded-[2.5rem]">
                    <div class="flex justify-between items-center mb-8">
                        <h3 class="text-xl font-bold">Sahne Galerisi <span id="scCount" class="text-blue-500 text-xs font-black ml-2 px-3 py-1 bg-blue-500/10 rounded-full"></span></h3>
                        <button id="generateAllBtn" class="hidden bg-blue-600 hover:bg-blue-500 text-white px-8 py-3 rounded-2xl text-[11px] font-black transition-all uppercase tracking-widest shadow-xl shadow-blue-500/20">
                            Görselleri Çiz (AI)
                        </button>
                    </div>
                    <div id="scenesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="gemini.js"></script>
    <script>
        //const apiKey = ""; 
        
        const ART_STYLES = [
            { id: "realistic", name: "Gerçekçi", prompt: "Hyper-realistic cinematic photography, highly detailed, 8k" },
            { id: "watercolor", name: "Suluboya", prompt: "Artistic watercolor painting, vibrant colors" },
            { id: "oil", name: "Yağlı Boya", prompt: "Classical oil painting, heavy brushstrokes, rich textures" },
            { id: "cyber", name: "Cyberpunk", prompt: "Neon cyberpunk city, futuristic atmosphere" },
            { id: "anime", name: "Anime", prompt: "High-quality anime art, vibrant, crisp lines" },
            { id: "ghibli", name: "Ghibli", prompt: "Studio Ghibli aesthetic, nostalgic, hand-painted" },
            { id: "pixel", name: "Pixel Art", prompt: "Detailed 16-bit pixel art, retro gaming" },
            { id: "sketch", name: "Karakalem", prompt: "Detailed charcoal sketch, crosshatching" },
            { id: "3d", name: "3D Stylized", prompt: "Cute 3D Pixar style render, soft lighting" },
            { id: "gothic", name: "Gotik", prompt: "Dark gothic aesthetic, mysterious atmosphere" },
            { id: "surreal", name: "Sürreal", prompt: "Dreamlike surrealist art, abstract" },
            { id: "steampunk", name: "Steampunk", prompt: "Victorian steampunk machinery, brass, gears" },
            { id: "vapor", name: "Vaporwave", prompt: "90s digital aesthetic, lo-fi colors" },
            { id: "pop", name: "Pop Art", prompt: "Bold Andy Warhol style, vibrant flat colors" },
            { id: "minimal", name: "Minimalist", prompt: "Clean minimalist design, simple shapes" },
            { id: "ink", name: "Mürekkep", prompt: "Traditional Japanese ink wash painting" },
            { id: "renaissance", name: "Rönesans", prompt: "Classical Renaissance painting style" },
            { id: "noir", name: "Noir", prompt: "Cinematic film noir, black and white" },
            { id: "fantasy", name: "Fantasy", prompt: "Epic fantasy, majestic magic, golden hour" }
        ];

        let scenes = [];
        let selectedStyle = ART_STYLES[0];
        let audioDuration = 0;
        let isPlaying = false;
        let activeIdx = -1;
        let referenceImageBase64 = null;

        const el = {
            audio: document.getElementById('audioPlayer'),
            audioInput: document.getElementById('audioInput'),
            refInput: document.getElementById('refImageInput'),
            refPreview: document.getElementById('refPreview'),
            lyrics: document.getElementById('lyricsInput'),
            styles: document.getElementById('styleGrid'),
            mood: document.getElementById('moodInput'),
            grid: document.getElementById('scenesGrid'),
            play: document.getElementById('playBtn'),
            logs: document.getElementById('statusLogs'),
            time: document.getElementById('timeDisplay'),
            progress: document.getElementById('progressBar'),
            subtitle: document.getElementById('subtitleText'),
            layers: document.getElementById('imageLayer'),
            reset: document.getElementById('resetBtn'),
            generateAll: document.getElementById('generateAllBtn'),
            scCount: document.getElementById('scCount'),
            renderStatus: document.getElementById('renderStatus')
        };

        function initStyles() {
            el.styles.innerHTML = '';
            ART_STYLES.forEach(s => {
                const b = document.createElement('div');
                b.className = `style-btn p-3 rounded-xl text-center flex items-center justify-center ${s.id === selectedStyle.id ? 'selected' : ''}`;
                b.innerText = s.name;
                b.onclick = () => {
                    document.querySelectorAll('.style-btn').forEach(x => x.classList.remove('selected'));
                    b.classList.add('selected');
                    selectedStyle = s;
                };
                el.styles.appendChild(b);
            });
        }

        function log(msg, type = 'info') {
            document.getElementById('statusConsole').classList.remove('hidden');
            const d = document.createElement('div');
            d.innerHTML = `<span class="opacity-20 mr-2">${new Date().toLocaleTimeString()}</span> <span class="${type === 'err' ? 'text-red-400' : 'text-blue-400'}">${msg}</span>`;
            el.logs.appendChild(d);
            el.logs.scrollTop = el.logs.scrollHeight;
        }

        // --- API CALL HELPERS ---
        async function apiCall(url, body, retries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(`${url}?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    if (!res.ok) {
                        const err = await res.json();
                        throw new Error(err.error?.message || `HTTP ${res.status}`);
                    }
                    return await res.json();
                } catch (e) {
                    if (i === retries - 1) throw e;
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }
        }

        // --- FILE HANDLERS ---
        el.audioInput.onchange = (e) => {
            const f = e.target.files[0];
            if (!f) return;
            el.audio.src = URL.createObjectURL(f);
            el.audio.onloadedmetadata = () => {
                audioDuration = el.audio.duration;
                el.time.innerText = `00:00 / ${fmt(audioDuration)}`;
                log(`Müzik hazır: ${Math.round(audioDuration)}s.`);
            };
        };

        el.refInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const base64 = event.target.result.split(',')[1];
                referenceImageBase64 = base64;
                el.refPreview.innerHTML = `<img src="${event.target.result}">`;
                log("Referans resim başarıyla yüklendi.");
            };
            reader.readAsDataURL(file);
        };

        function fmt(s) {
            const m = Math.floor(s/60);
            const sec = Math.floor(s%60);
            return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }

        // --- PLANNING ---
        document.getElementById('planBtn').onclick = async () => {
            const txt = el.lyrics.value.trim();
            const mood = el.mood.value.trim();
            if (!txt || audioDuration === 0) return log("Eksik veri: Müzik ve sözleri girin.", "err");

            log("Metin ayrıştırılıyor...");
            const lines = txt.split('\n').filter(l => l.includes('[') && l.includes(']'));
            const parsed = [];

            lines.forEach((l, index) => {
                const match = l.match(/(.*?)\[(\d+)-(\d+)\]/);
                if (match) {
                    parsed.push({
                        id: index,
                        caption: match[1].trim(),
                        start: parseInt(match[2]),
                        end: parseInt(match[3]),
                        v_prompt: ""
                    });
                }
            });

            if (parsed.length === 0) return log("Hatalı format. Örn: Metin[0-14]", "err");

            log(`${parsed.length} sahne planlanıyor...`);
            try {
                const systemPrompt = `Music video director. Generate detailed cinematic image prompts for style: "${selectedStyle.name}". 
                Overall mood: "${mood || 'vibrant'}". 
                ${referenceImageBase64 ? 'CRITICAL: The reference image provided is the basis for character and style. Keep all scenes consistent with the reference image.' : ''}
                Return a JSON object where keys are indices (0, 1, 2...) and values are English prompts.
                Lyrics: ${parsed.map(p => `${p.id}: ${p.caption}`).join(' | ')}`;

                const data = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', {
                    contents: [{ parts: [{ text: "Generate scene prompts based on lyrics." }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: { responseMimeType: "application/json" }
                });

                const aiResponse = JSON.parse(data.candidates[0].content.parts[0].text);
                
                scenes = parsed.map(p => ({
                    ...p,
                    v_prompt: `${selectedStyle.prompt}, ${aiResponse[p.id] || p.caption}, Atmosphere: ${mood || 'vibrant'}`
                }));

                renderGrid();
                el.generateAll.classList.remove('hidden');
                log("Senaryo planlandı.");
            } catch (e) {
                log("Hata: " + e.message, "err");
            }
        };

        function renderGrid() {
            el.grid.innerHTML = '';
            el.scCount.innerText = `${scenes.length}`;
            scenes.forEach((s) => {
                const c = document.createElement('div');
                c.className = "bg-slate-950 rounded-2xl border border-white/5 overflow-hidden";
                c.innerHTML = `
                    <div id="thumb-${s.id}" class="aspect-video bg-black flex items-center justify-center text-[8px] text-slate-700 p-2 text-center italic">
                        Yükleniyor...
                    </div>
                    <div class="p-3 bg-black/20 text-[9px]">
                        <div class="font-black text-blue-400 mb-1">${s.start}-${s.end}s</div>
                        <div class="text-slate-500 truncate">${s.caption}</div>
                    </div>
                `;
                el.grid.appendChild(c);
            });
        }

        // --- GENERATION (IMAGE-TO-IMAGE SUPPORT) ---
        el.generateAll.onclick = async () => {
            el.generateAll.disabled = true;
            el.generateAll.innerText = "ÜRETİLİYOR...";
            log(`AI sanatçısı çalışıyor... ${referenceImageBase64 ? '(Referans Resim Kullanılıyor)' : '(Imagen 4.0)'}`);

            for (let i = 0; i < scenes.length; i++) {
                const scene = scenes[i];
                const t = document.getElementById(`thumb-${scene.id}`);
                t.innerHTML = '<div class="loader-ring"></div>';
                
                try {
                    let resultImage;

                    if (referenceImageBase64) {
                        // Image-to-Image Workflow (Gemini Image Preview)
                        const i2iData = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent', {
                            contents: [{
                                parts: [
                                    { text: scene.v_prompt },
                                    { inlineData: { mimeType: "image/png", data: referenceImageBase64 } }
                                ]
                            }],
                            generationConfig: { responseModalities: ['TEXT', 'IMAGE'] }
                        });
                        const base64 = i2iData.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                        if (!base64) throw new Error("Image could not be generated from reference.");
                        resultImage = `data:image/png;base64,${base64}`;
                    } else {
                        // Standard Text-to-Image (Imagen 4.0)
                        const t2iData = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict', {
                            instances: { prompt: scene.v_prompt },
                            parameters: { sampleCount: 1 }
                        });
                        resultImage = `data:image/png;base64,${t2iData.predictions[0].bytesBase64Encoded}`;
                    }

                    scene.img = resultImage;
                    t.innerHTML = `<img src="${resultImage}" class="w-full h-full object-cover">`;
                } catch (e) {
                    t.innerHTML = '<span class="text-red-500 font-bold text-[8px]">HATA</span>';
                    log(`Sahne ${scene.id} hatası: ` + e.message, "err");
                }
            }

            log("Tüm görseller hazır!", "success");
            el.generateAll.innerText = "ÜRETİM TAMAM";
            el.play.disabled = false;
            el.renderStatus.innerText = "Oynatmaya Hazır";
            buildVideo();
        };

        function buildVideo() {
            el.layers.innerHTML = '';
            scenes.sort((a,b) => a.start - b.start).forEach(s => {
                if (s.img) {
                    const img = document.createElement('img');
                    img.src = s.img;
                    img.className = 'slide-img';
                    img.id = `v-img-${s.id}`;
                    el.layers.appendChild(img);
                }
            });
        }

        // --- PLAYBACK ---
        el.play.onclick = () => {
            if (isPlaying) {
                el.audio.pause();
                document.getElementById('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
            } else {
                el.audio.play();
                document.getElementById('playIcon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            }
            isPlaying = !isPlaying;
        };

        el.audio.ontimeupdate = () => {
            const now = el.audio.currentTime;
            el.progress.style.width = `${(now / audioDuration) * 100}%`;
            el.time.innerText = `${fmt(now)} / ${fmt(audioDuration)}`;
            const activeScene = scenes.find(s => now >= s.start && now < s.end);
            if (activeScene && activeIdx !== activeScene.id) {
                activeIdx = activeScene.id;
                updateVisuals(activeIdx);
            }
        };

        function updateVisuals(id) {
            scenes.forEach(s => {
                const img = document.getElementById(`v-img-${s.id}`);
                if (img) img.classList.toggle('active', s.id === id);
            });
            const current = scenes.find(s => s.id === id);
            if (current) {
                el.subtitle.innerText = current.caption;
                el.subtitle.style.opacity = 1;
            } else {
                el.subtitle.style.opacity = 0;
            }
        }

        el.audio.onended = () => {
            isPlaying = false;
            document.getElementById('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
            el.subtitle.style.opacity = 0;
        };

        el.reset.onclick = () => {
            scenes = []; activeIdx = -1; isPlaying = false; audioDuration = 0;
            referenceImageBase64 = null;
            el.audioInput.value = ""; el.audio.pause(); el.audio.src = "";
            el.lyrics.value = ""; el.mood.value = ""; el.refInput.value = "";
            el.refPreview.innerHTML = "📷";
            el.grid.innerHTML = "";
            el.layers.innerHTML = '<div class="h-full flex flex-col items-center justify-center text-slate-700"><p class="text-sm font-semibold">Senaryo ve görseller burada senkronize olacak.</p></div>';
            el.subtitle.style.opacity = 0; el.time.innerText = "00:00 / 00:00"; el.progress.style.width = "0%";
            el.play.disabled = true; el.generateAll.classList.add('hidden');
            el.renderStatus.innerText = "Sistem Beklemede";
            initStyles();
            log("Çalışma alanı sıfırlandı.");
        };

        initStyles();
    </script>
</body>
</html>
