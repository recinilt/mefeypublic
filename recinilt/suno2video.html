<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Video Studio Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #050a15;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .video-canvas {
            aspect-ratio: 16 / 9;
            background: #000;
            position: relative;
            overflow: hidden;
            border-radius: 1.5rem;
            box-shadow: 0 0 80px -20px rgba(37, 99, 235, 0.4);
        }

        .slide-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s ease-in-out, transform 12s linear;
            transform: scale(1);
        }

        .slide-img.active {
            opacity: 1;
            transform: scale(1.15);
        }

        .style-btn {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .style-btn.selected {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.2);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        .loader-ring {
            border: 2px solid #1e293b;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .progress-container {
            height: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            width: 0%;
            transition: width 0.1s linear;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #050a15; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }

        .subtitle-box {
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        }
    </style>
</head>
<body class="p-4 md:p-10 lg:p-16">

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-12 gap-6">
            <div>
                <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
                    AI Music Video Studio
                </h1>
                <p class="text-slate-500 mt-2 font-medium">Saniyeli Sözler & Profesyonel Sahne Yönetimi</p>
            </div>
            <div class="flex gap-4">
                <div class="glass px-4 py-2 rounded-2xl flex items-center gap-3">
                    <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
                    <span class="text-xs font-bold text-slate-300 uppercase tracking-widest">AI Engine: Online</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            
            <!-- Kontrol Paneli -->
            <div class="lg:col-span-4 space-y-6">
                <!-- Audio -->
                <div class="glass p-6 rounded-3xl">
                    <label class="text-xs font-bold text-slate-400 uppercase mb-4 block">1. Müzik Dosyası</label>
                    <input type="file" id="audioInput" accept="audio/*" class="block w-full text-xs text-slate-500 file:mr-4 file:py-2.5 file:px-5 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer" />
                    <audio id="audioPlayer" class="hidden"></audio>
                </div>

                <!-- Styles -->
                <div class="glass p-6 rounded-3xl">
                    <label class="text-xs font-bold text-slate-400 uppercase mb-4 block">2. Sanat Stili (30+ Seçenek)</label>
                    <div id="styleGrid" class="grid grid-cols-3 gap-2 max-h-56 overflow-y-auto pr-2">
                        <!-- Styles load here -->
                    </div>
                </div>

                <!-- Lyrics with Range [start-end] -->
                <div class="glass p-6 rounded-3xl">
                    <label class="text-xs font-bold text-slate-400 uppercase mb-4 block">3. Saniyeli Sözler [baş-bit]</label>
                    <textarea id="lyricsInput" rows="10" class="w-full bg-slate-900/50 border border-slate-800 rounded-2xl p-4 text-xs font-mono focus:ring-2 focus:ring-blue-500/40 outline-none text-blue-100" 
                        placeholder="Örnek Format:&#10;Tekamül Sırrı[0-14]&#10;Koşturdum, koşturdum.[14-20]"></textarea>
                    
                    <button id="planBtn" class="w-full mt-4 bg-white text-slate-950 font-bold py-4 rounded-2xl hover:bg-blue-50 transition-all shadow-xl shadow-blue-500/10">
                        Sahneleri Planla
                    </button>
                </div>

                <div id="statusConsole" class="hidden glass p-4 rounded-2xl border-blue-500/20">
                    <div id="statusLogs" class="space-y-1.5 text-[10px] font-mono text-slate-400"></div>
                </div>
            </div>

            <!-- Video Alanı -->
            <div class="lg:col-span-8 space-y-8">
                <div class="video-canvas group" id="videoArea">
                    <div id="imageLayer" class="absolute inset-0">
                        <div class="h-full flex flex-col items-center justify-center text-slate-600">
                            <svg class="w-12 h-12 mb-4 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            <p class="text-sm italic">Müzik ve sözleri ekleyip hazırlığa başlayın.</p>
                        </div>
                    </div>
                    
                    <div class="subtitle-box absolute bottom-0 left-0 right-0 p-12 text-center pointer-events-none">
                        <h2 id="subtitleText" class="text-2xl md:text-3xl font-bold tracking-tight text-white drop-shadow-lg opacity-0 transition-opacity duration-300"></h2>
                    </div>

                    <div class="absolute bottom-6 left-6 right-6 flex items-center gap-6 opacity-0 group-hover:opacity-100 transition-opacity bg-black/40 backdrop-blur-md p-4 rounded-2xl border border-white/5">
                        <button id="playBtn" disabled class="w-12 h-12 flex-shrink-0 bg-blue-600 text-white rounded-full flex items-center justify-center hover:bg-blue-500 disabled:opacity-20 transition-all">
                            <svg id="playIcon" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <div class="flex-1">
                            <div class="progress-container mb-2">
                                <div id="progressBar" class="progress-bar"></div>
                            </div>
                            <div class="flex justify-between text-[10px] font-bold tracking-widest text-slate-400 uppercase">
                                <span id="timeDisplay">00:00 / 00:00</span>
                                <span id="renderStatus">Bekleniyor</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="glass p-8 rounded-3xl">
                    <div class="flex justify-between items-center mb-8">
                        <h3 class="text-lg font-bold">Sahne Galerisi</h3>
                        <button id="generateAllBtn" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2 rounded-xl text-xs font-bold transition-all shadow-lg shadow-indigo-500/20">
                            Tüm Görselleri AI ile Oluştur
                        </button>
                    </div>
                    <div id="scenesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                        <!-- Scene items -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const apiKey = ""; // Canvas Environment provides this
        
        const ART_STYLES = [
            { id: "realistic", name: "Gerçekçi", prompt: "Hyper-realistic cinematic, 8k, highly detailed, professional photography" },
            { id: "watercolor", name: "Suluboya", prompt: "Dreamy watercolor painting, soft textures, artistic bleed" },
            { id: "oil", name: "Yağlı Boya", prompt: "Impressionist oil painting, thick strokes, vibrant colors, canvas texture" },
            { id: "cyber", name: "Cyberpunk", prompt: "Neon futuristic city, cyberpunk aesthetic, synthwave colors" },
            { id: "anime", name: "Anime", prompt: "High-quality modern anime art style, vibrant, crisp lines" },
            { id: "ghibli", name: "Ghibli", prompt: "Studio Ghibli aesthetic, nostalgic, hand-painted feel" },
            { id: "pixel", name: "Pixel Art", prompt: "Detailed 16-bit pixel art, retro game aesthetic" },
            { id: "sketch", name: "Karakalem", prompt: "Detailed charcoal pencil sketch, crosshatching, artistic" },
            { id: "3d", name: "3D Disney", prompt: "Cute 3D Pixar/Disney style render, soft lighting, expressive" },
            { id: "gothic", name: "Gotik", prompt: "Dark gothic art, moody, Victorian, dramatic shadows" },
            { id: "surreal", name: "Sürreal", prompt: "Dreamlike surrealist art, abstract, imaginative" },
            { id: "steampunk", name: "Steampunk", prompt: "Mechanical steampunk, gears, brass, vintage, smoke" },
            { id: "vapor", name: "Vaporwave", prompt: "90s digital aesthetic, lo-fi, pink and cyan, glitchy" },
            { id: "pop", name: "Pop Art", prompt: "Andy Warhol style, bold colors, comic dots" },
            { id: "minimal", name: "Minimalist", prompt: "Clean flat design, minimalist composition, pastel" },
            { id: "clay", name: "Kil", prompt: "Tactile claymation style, stop-motion texture" },
            { id: "ink", name: "Sumi-e", prompt: "Traditional Japanese ink wash, zen, brush strokes" },
            { id: "lowpoly", name: "Low Poly", prompt: "Geometric low poly design, modern digital look" },
            { id: "retro", name: "Retro Future", prompt: "50s sci-fi aesthetic, space age, vintage futurism" },
            { id: "blueprint", name: "Teknik", prompt: "Technical blueprint drawing, architectural, white on blue" },
            { id: "fantasy", name: "Epic Fantasy", prompt: "High fantasy, majestic, dragons, magic, gold hour" },
            { id: "noir", name: "Film Noir", prompt: "Classic black and white noir, high contrast, moody" },
            { id: "mosaic", name: "Mozaik", prompt: "Small tile mosaic art, ancient style" },
            { id: "graffiti", name: "Graffiti", prompt: "Urban street art, spray paint, vibrant, mural" },
            { id: "glitch", name: "Glitch Art", prompt: "Digital distortion, signal interference, modern" },
            { id: "origami", name: "Origami", prompt: "Intricate paper folding, paper texture, sharp edges" },
            { id: "uikiyoe", name: "Ukiyo-e", prompt: "Japanese woodblock print style, historical" },
            { id: "abstract", name: "Soyut", prompt: "Abstract expressionism, emotional shapes and colors" },
            { id: "renaissance", name: "Rönesans", prompt: "Classical Renaissance painting, religious art vibes" },
            { id: "disco", name: "Disco", prompt: "Sparkly 70s disco, flares, glitter, dance floor" },
            { id: "neon_line", name: "Neon Çizgi", prompt: "Glowing neon outlines on dark background" }
        ];

        let scenes = [];
        let selectedStyle = ART_STYLES[0];
        let audioDuration = 0;
        let isPlaying = false;

        const el = {
            audio: document.getElementById('audioPlayer'),
            lyrics: document.getElementById('lyricsInput'),
            styles: document.getElementById('styleGrid'),
            grid: document.getElementById('scenesGrid'),
            play: document.getElementById('playBtn'),
            logs: document.getElementById('statusLogs'),
            time: document.getElementById('timeDisplay'),
            progress: document.getElementById('progressBar'),
            subtitle: document.getElementById('subtitleText'),
            layers: document.getElementById('imageLayer')
        };

        // --- Init Stiller ---
        function initStyles() {
            ART_STYLES.forEach(s => {
                const btn = document.createElement('div');
                btn.className = `style-btn p-2 rounded-xl text-[10px] font-bold text-center flex items-center justify-center ${s.id === selectedStyle.id ? 'selected' : ''}`;
                btn.innerText = s.name;
                btn.onclick = () => {
                    document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedStyle = s;
                };
                el.styles.appendChild(btn);
            });
        }

        function log(msg, type = 'info') {
            document.getElementById('statusConsole').classList.remove('hidden');
            const d = document.createElement('div');
            d.innerHTML = `<span class="opacity-30 mr-2">${new Date().toLocaleTimeString()}</span> <span class="${type === 'err' ? 'text-red-400' : 'text-blue-400'}">${msg}</span>`;
            el.logs.appendChild(d);
            el.logs.scrollTop = el.logs.scrollHeight;
        }

        async function callAI(url, body) {
            const res = await fetch(`${url}?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.error?.message || 'API Error');
            }
            return res.json();
        }

        // --- Audio Load ---
        document.getElementById('audioInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            el.audio.src = URL.createObjectURL(file);
            el.audio.onloadedmetadata = () => {
                audioDuration = el.audio.duration;
                el.time.innerText = `00:00 / ${fmt(audioDuration)}`;
                log(`Ses dosyası hazır: ${Math.round(audioDuration)} sn.`);
            };
        };

        function fmt(s) {
            const m = Math.floor(s/60);
            const sec = Math.floor(s%60);
            return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }

        // --- Planlama ---
        document.getElementById('planBtn').onclick = async () => {
            const raw = el.lyrics.value.trim();
            if (!raw || audioDuration === 0) return log("Müzik ve sözleri eksiksiz girin!", "err");

            log("Metin formatı ayrıştırılıyor...");
            const lines = raw.split('\n').filter(l => l.trim().length > 0);
            const parsed = [];

            lines.forEach(line => {
                // Format: Metin[başlangıç-bitiş]
                const match = line.match(/(.*)\[(\d+)-(\d+)\]/);
                if (match) {
                    parsed.push({
                        caption: match[1].trim(),
                        start: parseInt(match[2]),
                        end: parseInt(match[3]),
                        v_prompt: ""
                    });
                }
            });

            if (parsed.length === 0) return log("Hatalı format! [baş-bit] bulunamadı.", "err");

            log(`${parsed.length} sahne saptandı. AI betimlemeleri üretiliyor...`);
            try {
                const prompt = `Convert these song lyrics into artistic visual prompts for AI generation in English. 
                Style context: "${selectedStyle.name}". 
                Respond ONLY with a JSON array of strings.
                Lyrics: ${parsed.map(p => p.caption).join(' | ')}`;

                const data = await callAI('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', {
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { responseMimeType: "application/json" }
                });

                const prompts = JSON.parse(data.candidates[0].content.parts[0].text);
                
                scenes = parsed.map((p, i) => ({
                    ...p,
                    v_prompt: `${selectedStyle.prompt}, ${prompts[i] || p.caption}`
                }));

                renderGrid();
                document.getElementById('generateAllBtn').classList.remove('hidden');
                log("Planlama tamamlandı. Görselleri üretebilirsiniz.");
            } catch (e) {
                log("Hata: " + e.message, "err");
            }
        };

        function renderGrid() {
            el.grid.innerHTML = '';
            scenes.forEach((s, i) => {
                const card = document.createElement('div');
                card.className = "bg-slate-900/50 rounded-2xl border border-white/5 overflow-hidden";
                card.innerHTML = `
                    <div id="thumb-${i}" class="aspect-video bg-black flex items-center justify-center text-[8px] text-slate-700 p-4 text-center">
                        Bekliyor...
                    </div>
                    <div class="p-3">
                        <div class="text-[9px] font-bold text-blue-400 mb-1">${s.start}s - ${s.end}s</div>
                        <div class="text-[9px] text-slate-400 truncate">${s.caption}</div>
                    </div>
                `;
                el.grid.appendChild(card);
            });
        }

        // --- Görsel Üretim ---
        document.getElementById('generateAllBtn').onclick = async () => {
            const btn = document.getElementById('generateAllBtn');
            btn.disabled = true;
            btn.innerText = "İşleniyor...";
            log("Imagen 4.0 ile görseller çiziliyor, lütfen bekleyin...");

            for (let i = 0; i < scenes.length; i++) {
                const thumb = document.getElementById(`thumb-${i}`);
                thumb.innerHTML = '<div class="loader-ring"></div>';
                
                try {
                    const data = await callAI('https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict', {
                        instances: { prompt: scenes[i].v_prompt },
                        parameters: { sampleCount: 1 }
                    });

                    const base64 = `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
                    scenes[i].img = base64;
                    thumb.innerHTML = `<img src="${base64}" class="w-full h-full object-cover">`;
                } catch (e) {
                    thumb.innerHTML = '<span class="text-red-500">HATA</span>';
                    console.error(e);
                }
            }

            log("Klip prodüksiyonu hazır!", "success");
            btn.innerText = "Tamamlandı";
            el.play.disabled = false;
            document.getElementById('renderStatus').innerText = "Oynatmaya Hazır";
            buildVideo();
        };

        function buildVideo() {
            el.layers.innerHTML = '';
            scenes.forEach((s, i) => {
                if (s.img) {
                    const img = document.createElement('img');
                    img.src = s.img;
                    img.className = 'slide-img';
                    img.id = `v-img-${i}`;
                    el.layers.appendChild(img);
                }
            });
        }

        // --- Playback ---
        el.play.onclick = () => {
            if (isPlaying) {
                el.audio.pause();
                document.getElementById('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
            } else {
                el.audio.play();
                document.getElementById('playIcon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            }
            isPlaying = !isPlaying;
        };

        el.audio.ontimeupdate = () => {
            const now = el.audio.currentTime;
            el.progress.style.width = `${(now / audioDuration) * 100}%`;
            el.time.innerText = `${fmt(now)} / ${fmt(audioDuration)}`;
            
            // Sahne bul (Aralık bazlı)
            const activeSceneIdx = scenes.findIndex(s => now >= s.start && now < s.end);

            if (activeIdx !== activeSceneIdx) {
                activeIdx = activeSceneIdx;
                updateVisuals(activeIdx);
            }
        };

        let activeIdx = -1;
        function updateVisuals(idx) {
            // Görsel
            document.querySelectorAll('.slide-img').forEach((img, i) => {
                img.classList.toggle('active', i === idx);
            });

            // Altyazı
            if (idx !== -1 && scenes[idx]) {
                el.subtitle.innerText = scenes[idx].caption;
                el.subtitle.style.opacity = 1;
            } else {
                el.subtitle.style.opacity = 0;
            }
        }

        el.audio.onended = () => {
            isPlaying = false;
            document.getElementById('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
            el.subtitle.style.opacity = 0;
        };

        initStyles();
    </script>
</body>
</html>
