<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Video Studio Pro - Cinematic Masterpiece</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #020617;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .video-canvas {
            aspect-ratio: 16 / 9;
            background: #000;
            position: relative;
            overflow: hidden;
            border-radius: 2rem;
            box-shadow: 0 0 100px -20px rgba(59, 130, 246, 0.4);
        }

        .slide-item {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            transform: scale(1);
        }

        /* Ken Burns (Video FX) Animasyonu */
        .slide-item.active.ken-burns {
            opacity: 1;
            animation: kenburns 15s linear infinite alternate;
        }

        .slide-item.active:not(.ken-burns) {
            opacity: 1;
        }

        @keyframes kenburns {
            0% { transform: scale(1.0); transform-origin: center center; }
            100% { transform: scale(1.2); transform-origin: top left; }
        }

        .style-btn {
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.05);
            background: rgba(255,255,255,0.02);
            font-size: 10px;
            font-weight: 800;
            text-align: center;
        }

        .style-btn.selected {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.2);
        }

        .loader-ring {
            border: 3px solid #1e293b;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .progress-bar {
            height: 6px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #a855f7);
            width: 0%;
        }

        .subtitle-box {
            text-shadow: 0 4px 15px rgba(0,0,0,1);
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
        }

        .scene-card {
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .scene-card:hover {
            transform: translateY(-5px);
            border-color: rgba(59, 130, 246, 0.5);
        }

        #exportCanvas { display: none; }
        
        .mode-toggle {
            display: flex;
            background: rgba(0,0,0,0.3);
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
        }
        .mode-btn {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 800;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .mode-btn.active {
            background: #3b82f6;
            color: white;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8 lg:p-12">

    <div class="max-w-7xl mx-auto">
        <header class="mb-10 flex flex-col md:flex-row justify-between items-center gap-6">
            <div>
                <h1 class="text-4xl md:text-5xl font-black tracking-tight bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500 bg-clip-text text-transparent">
                    Music Video Studio Pro
                </h1>
                <p class="text-slate-400 mt-2 font-medium italic uppercase tracking-widest text-[10px]">Geniş Açı, Parantez, Video & AI Senaryolu Klip</p>
            </div>
            <div id="apiStatus" class="glass px-6 py-3 rounded-full flex items-center gap-3 border-blue-500/20">
                <div class="w-2 h-2 bg-blue-500 rounded-full animate-ping"></div>
                <span class="text-xs font-bold uppercase tracking-widest text-blue-400">Yapay Zeka Aktif</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4 space-y-5">
                <div class="glass p-5 rounded-[2rem] space-y-4">
                    <div>
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 block">01. Ses & Profil Fotoğrafı</label>
                        <input type="file" id="audioInput" accept="audio/*" class="block w-full text-xs text-slate-400 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-[9px] file:font-bold file:bg-blue-600 file:text-white" />
                        <audio id="audioPlayer" crossOrigin="anonymous" class="hidden"></audio>
                    </div>
                    <div class="flex gap-3 items-center pt-2 border-t border-white/5">
                        <div id="refPreview" class="w-12 h-12 bg-slate-900 rounded-lg flex items-center justify-center text-xl shrink-0">👤</div>
                        <div class="flex-1">
                            <input type="file" id="refImageInput" accept="image/*" class="block w-full text-[10px] text-slate-500 file:py-1 file:px-2 file:bg-slate-800 file:text-slate-300 rounded" />
                        </div>
                    </div>
                </div>

                <div class="glass p-5 rounded-[2rem] space-y-4">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 block">02. Üretim Modu</label>
                    <div class="mode-toggle">
                        <button id="modeImage" class="mode-btn active">RESİM</button>
                        <button id="modeVideo" class="mode-btn">VİDEO (FX)</button>
                        <button id="modeVideoAI" class="mode-btn">VİDEO (AI)</button>
                    </div>
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 block">03. Sanat Stili</label>
                    <div id="styleGrid" class="grid grid-cols-3 gap-2 max-h-32 overflow-y-auto pr-2 custom-scroll"></div>
                    <input type="text" id="moodInput" class="w-full bg-slate-950/50 border border-slate-800 rounded-xl p-2.5 text-xs outline-none text-white" placeholder="Ruh Hali: Melankolik, Görkemli..." />
                </div>

                <div class="glass p-5 rounded-[2rem] space-y-4">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 block">04. Sözler & Zamanlama</label>
                    <textarea id="lyricsInput" rows="5" class="w-full bg-slate-950/50 border border-slate-800 rounded-2xl p-3 text-xs font-mono outline-none text-blue-100" placeholder="Metin[0-14]&#10;(Sözsüz Sahne)[14-20]"></textarea>
                    
                    <div class="flex gap-2">
                        <button id="planBtn" class="flex-1 bg-white text-slate-950 font-black py-3 rounded-xl hover:bg-blue-50 transition-all uppercase text-[10px]">Senaryoyu Yaz</button>
                        <button id="resetBtn" class="bg-slate-800 text-slate-400 font-bold px-4 rounded-xl hover:bg-red-900/10 transition-all uppercase text-[10px]">✕</button>
                    </div>
                </div>

                <div id="statusConsole" class="hidden glass p-4 rounded-2xl border-blue-500/10 max-h-40 overflow-hidden">
                    <div id="statusLogs" class="space-y-1 text-[9px] font-mono text-slate-400"></div>
                </div>
            </div>

            <div class="lg:col-span-8 space-y-6">
                <div class="video-canvas group" id="videoArea">
                    <div id="imageLayer" class="absolute inset-0">
                        <div class="h-full flex flex-col items-center justify-center text-slate-700">
                            <p class="text-sm font-semibold italic text-center px-10 leading-relaxed">Sinematik Manzara Motoru. Geniş açı ve Loop (Döngü) desteği aktif.</p>
                        </div>
                    </div>
                    
                    <div class="subtitle-box absolute bottom-0 left-0 right-0 p-12 text-center pointer-events-none">
                        <h2 id="subtitleText" class="text-xl md:text-3xl font-black text-white opacity-0 transition-all duration-500"></h2>
                    </div>

                    <div class="absolute bottom-6 left-6 right-6 flex items-center gap-5 opacity-0 group-hover:opacity-100 transition-all duration-300 bg-black/60 backdrop-blur-xl p-4 rounded-3xl border border-white/5 shadow-2xl">
                        <button id="playBtn" disabled class="w-12 h-12 bg-white text-black rounded-full flex items-center justify-center hover:scale-105 transition-all">
                            <svg id="playIcon" class="w-5 h-5 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <div class="flex-1">
                            <div class="progress-bar mb-2">
                                <div id="progressBar" class="progress-fill"></div>
                            </div>
                            <div class="flex justify-between text-[9px] font-black text-slate-400 uppercase tracking-widest">
                                <span id="timeDisplay">00:00 / 00:00</span>
                                <span id="renderStatus">Beklemede</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="glass p-8 rounded-[2.5rem]">
                    <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-8">
                        <h3 class="text-lg font-bold">Sinematik Galeri <span id="scCount" class="text-blue-500 text-xs ml-2 px-2 py-0.5 bg-blue-500/10 rounded-full"></span></h3>
                        <div class="flex gap-2">
                            <button id="generateAllBtn" class="hidden bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl text-[10px] font-black uppercase">Tümünü Üret</button>
                            <button id="exportBtn" class="hidden bg-red-600 hover:bg-red-500 text-white px-6 py-2.5 rounded-xl text-[10px] font-black uppercase">Klibi İndir (MP4)</button>
                        </div>
                    </div>
                    <div id="scenesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
                </div>
            </div>
        </div>
    </div>

    <canvas id="exportCanvas" width="1280" height="720"></canvas>
    <script src="gemini.js"></script>
    <script>
        //const apiKey = ""; 
        
        const ART_STYLES = [
            { id: "watercolor", name: "Suluboya", prompt: "A world-class traditional watercolor masterpiece. Visible heavy paper texture, wet-on-wet paint bleeding effects, artistic color blooms, intricate hand-painted details. Soft brush strokes, elegant paint splatters, atmospheric and conceptual." },
            { id: "realistic", name: "Gerçekçi", prompt: "Hyper-realistic cinematic film photography, shot on IMAX 70mm, professional color grading, sharp focus, deep panoramic depth." },
            { id: "oil", name: "Yağlı Boya", prompt: "Classical oil painting masterpiece, heavy impasto, visible thick brushwork, Renaissance lighting, rich textures." },
            { id: "cyber", name: "Cyberpunk", prompt: "Glitzy cyberpunk world, volumetric neon lighting, rainy futuristic landscapes, extreme detail." },
            { id: "ghibli", name: "Ghibli", prompt: "Studio Ghibli lush hand-drawn animation, nostalgic pastel landscapes, hand-painted nature." },
            { id: "sketch", name: "Karakalem", prompt: "Masterful charcoal and graphite sketch, messy artistic lines, heavy cross-hatching." },
            { id: "anime", name: "Anime", prompt: "High-quality modern anime art, vibrant, crisp lines, cinematic background." },
            { id: "pixel", name: "Pixel Art", prompt: "Detailed 16-bit pixel art, retro gaming aesthetic, sharp pixels." },
            { id: "gothic", name: "Gotik", prompt: "Dark gothic aesthetic, mysterious atmosphere, high contrast, dramatic." },
            { id: "surreal", name: "Sürreal", prompt: "Dreamlike surrealist art, abstract floating objects, imaginative." },
            { id: "steampunk", name: "Steampunk", prompt: "Victorian steampunk machinery, brass gears, steam, vintage clockwork." },
            { id: "vapor", name: "Vaporwave", prompt: "90s digital aesthetic, pink and cyan glitch art, retro lofi." },
            { id: "pop", name: "Pop Art", prompt: "Bold Andy Warhol style, vibrant flat colors, halftone textures." },
            { id: "minimal", name: "Minimalist", prompt: "Clean minimalist design, simple shapes, pastel palette." },
            { id: "clay", name: "Kil", prompt: "Tactile claymation style, stop-motion clay texture." },
            { id: "ink", name: "Mürekkep", prompt: "Traditional Japanese ink wash painting, brush strokes, zen." },
            { id: "lowpoly", name: "Low Poly", prompt: "Geometric low poly design, modern digital faceted look." },
            { id: "retro", name: "Retro", prompt: "1950s space age retro-futurism, vintage sci-fi aesthetic." },
            { id: "blueprint", name: "Blueprint", prompt: "Architectural blueprint, white technical lines on blue background." },
            { id: "noir", name: "Noir", prompt: "Classic film noir, high contrast, dramatic shadows, foggy mystery." },
            { id: "fantasy", name: "Fantasy", prompt: "Epic fantasy, majestic magic, golden hour, ethereal glow." },
            { id: "mosaic", name: "Mozaik", prompt: "Ancient mosaic tile art, handcrafted texture, intricate." },
            { id: "graffiti", name: "Graffiti", prompt: "Urban street art graffiti, vibrant spray paint, mural style." },
            { id: "glitch", name: "Glitch", prompt: "Digital distortion, signal interference, colorful artifacts." },
            { id: "origami", name: "Origami", prompt: "Paper folding art style, sharp creases, paper texture." },
            { id: "uikiyoe", name: "Ukiyo-e", prompt: "Classical Japanese woodblock print, historical Edo style." },
            { id: "abstract", name: "Soyut", prompt: "Expressive abstract art, emotional color fields, modern." },
            { id: "renaissance", name: "Rönesans", prompt: "Classical Renaissance painting, old master aesthetic." },
            { id: "disco", name: "Disco", prompt: "Retro 70s disco style, glitter, lens flares, dance floor." },
            { id: "neon_line", name: "Neon Çizgi", prompt: "Glowing neon outline art, vibrant lights on dark void." }
        ];


        
        let scenes = [];
        let selectedStyle = ART_STYLES[0];
        let productionMode = "image"; // image, video (Ken Burns), videoAI (AI Generated)
        let audioDuration = 0;
        let isPlaying = false;
        let activeIdx = -1;
        let referenceImageBase64 = null;

        const el = {
            audio: document.getElementById('audioPlayer'),
            audioInput: document.getElementById('audioInput'),
            refInput: document.getElementById('refImageInput'),
            refPreview: document.getElementById('refPreview'),
            lyrics: document.getElementById('lyricsInput'),
            styles: document.getElementById('styleGrid'),
            mood: document.getElementById('moodInput'),
            grid: document.getElementById('scenesGrid'),
            play: document.getElementById('playBtn'),
            logs: document.getElementById('statusLogs'),
            time: document.getElementById('timeDisplay'),
            progress: document.getElementById('progressBar'),
            subtitle: document.getElementById('subtitleText'),
            layers: document.getElementById('imageLayer'),
            reset: document.getElementById('resetBtn'),
            generateAll: document.getElementById('generateAllBtn'),
            exportBtn: document.getElementById('exportBtn'),
            scCount: document.getElementById('scCount'),
            renderStatus: document.getElementById('renderStatus'),
            exportCanvas: document.getElementById('exportCanvas'),
            modeImage: document.getElementById('modeImage'),
            modeVideo: document.getElementById('modeVideo'),
            modeVideoAI: document.getElementById('modeVideoAI')
        };

        function initStyles() {
            el.styles.innerHTML = '';
            ART_STYLES.forEach(s => {
                const b = document.createElement('div');
                b.className = `style-btn p-2 rounded-xl ${s.id === selectedStyle.id ? 'selected' : ''}`;
                b.innerText = s.name;
                b.onclick = () => {
                    document.querySelectorAll('.style-btn').forEach(x => x.classList.remove('selected'));
                    b.classList.add('selected');
                    selectedStyle = s;
                };
                el.styles.appendChild(b);
            });
        }

        function setMode(mode) {
            productionMode = mode;
            [el.modeImage, el.modeVideo, el.modeVideoAI].forEach(b => b.classList.remove('active'));
            if(mode === 'image') el.modeImage.classList.add('active');
            if(mode === 'video') el.modeVideo.classList.add('active');
            if(mode === 'videoAI') el.modeVideoAI.classList.add('active');
            log(`Mod seçildi: ${mode.toUpperCase()}`);
        }

        el.modeImage.onclick = () => setMode('image');
        el.modeVideo.onclick = () => setMode('video');
        el.modeVideoAI.onclick = () => setMode('videoAI');

        function log(msg, type = 'info') {
            document.getElementById('statusConsole').classList.remove('hidden');
            const d = document.createElement('div');
            d.innerHTML = `<span class="opacity-30 mr-2">${new Date().toLocaleTimeString()}</span> <span class="${type === 'err' ? 'text-red-400 font-bold' : 'text-blue-400'}">${msg}</span>`;
            el.logs.appendChild(d);
            el.logs.scrollTop = el.logs.scrollHeight;
        }

        async function apiCall(url, body, retries = 3) {
            const delays = [1000, 2000, 4000];
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(`${url}?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({ error: { message: `HTTP ${res.status}` } }));
                        throw new Error(err.error?.message || `HTTP ${res.status}`);
                    }
                    return await res.json();
                } catch (e) {
                    if (i === retries - 1) throw e;
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }
        }

        el.audioInput.onchange = (e) => {
            const f = e.target.files[0];
            if (!f) return;
            el.audio.src = URL.createObjectURL(f);
            el.audio.onloadedmetadata = () => { audioDuration = el.audio.duration; el.time.innerText = `00:00 / ${fmt(audioDuration)}`; log(`Müzik yüklendi.`); };
        };

        el.refInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => { 
                referenceImageBase64 = event.target.result.split(',')[1]; 
                el.refPreview.innerHTML = `<img src="${event.target.result}" class="w-full h-full object-cover rounded-lg">`; 
            };
            reader.readAsDataURL(file);
        };

        function fmt(s) { const m = Math.floor(s/60); const sec = Math.floor(s%60); return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; }

        document.getElementById('planBtn').onclick = async () => {
            const txt = el.lyrics.value.trim();
            const mood = el.mood.value.trim();
            if (!txt || audioDuration === 0) return log("Müzik ve sözleri girin!", "err");

            log("Senaryo kurgulanıyor...");
            const lines = txt.split('\n').filter(l => l.includes('[') && l.includes(']'));
            const parsed = [];

            lines.forEach((l, index) => {
                const match = l.match(/(.*?)\[(\d+)-(\d+)\]/);
                if (match) {
                    let caption = match[1].trim();
                    let showSubtitle = true;
                    if (caption.startsWith('(') && caption.endsWith(')')) {
                        showSubtitle = false;
                        caption = caption.slice(1, -1);
                    }
                    parsed.push({ id: index, caption: caption, start: parseFloat(match[2]), end: parseFloat(match[3]), showSubtitle: showSubtitle });
                }
            });

            try {
                const systemPrompt = `Sen bir klip yönetmenisin. Her satır için 5-6 CÜMLELİK edebi bir PARAGRAF PROMPT oluştur.
                KURALLAR:
                1. GENİŞ AÇI: ASLA yakın çekim yapma. Hep "Extreme wide angle panorama" kurgula.
                2. SEMBOLİZM: Sözlerdeki metaforları devasa manzaralara dök.
                3. STİL: "${selectedStyle.name}" stilini işle.
                4. MOOD: "${mood || 'Epic'}" ruh halini ekle.
                ÇIKTI: JSON objesi döndür. Key: index, Value: 5-6 cümlelik İngilizce prompt.`;

                const data = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', {
                    contents: [{ parts: [{ text: "Senaryoyu oluştur." }] }],
                    systemInstruction: { parts: [{ text: systemPrompt + "\nSözler: " + parsed.map(p => `${p.id}: ${p.caption}`).join(' | ') }] },
                    generationConfig: { responseMimeType: "application/json" }
                });

                const prompts = JSON.parse(data.candidates[0].content.parts[0].text);
                scenes = parsed.map(p => ({ ...p, v_prompt: prompts[p.id] || p.caption, source: null, type: productionMode }));
                renderGrid();
                el.generateAll.classList.remove('hidden');
                log("Senaryo planlaması tamamlandı.");
            } catch (e) { log("Planlama hatası: " + e.message, "err"); }
        };

        function renderGrid() {
            el.grid.innerHTML = '';
            el.scCount.innerText = `${scenes.length}`;
            scenes.forEach((s) => {
                const c = document.createElement('div');
                c.className = "scene-card bg-slate-950 rounded-2xl border border-white/5 overflow-hidden";
                c.onclick = () => regenerateScene(s.id);
                c.innerHTML = `
                    <div id="thumb-${s.id}" class="aspect-video bg-black flex items-center justify-center text-[8px] text-slate-700 p-2 text-center">
                        ${s.source ? (s.type.includes('video') ? `<video src="${s.source}" class="w-full h-full object-cover" muted loop autoplay></video>` : `<img src="${s.source}" class="w-full h-full object-cover">`) : '🎨 Hazır'}
                    </div>
                    <div class="p-3 bg-black/20 text-[9px]">
                        <div class="font-black ${s.showSubtitle ? 'text-blue-400' : 'text-purple-400'} mb-1">${s.start}-${s.end}s ${!s.showSubtitle ? '(Sözsüz)' : ''}</div>
                        <div class="text-slate-300 truncate">${s.caption}</div>
                    </div>
                `;
                el.grid.appendChild(c);
            });
        }

        async function generateSingleScene(id) {
            const scene = scenes.find(s => s.id === id);
            const thumb = document.getElementById(`thumb-${id}`);
            thumb.innerHTML = '<div class="loader-ring"></div>';
            
            try {
                let finalSource;
                if (scene.type === "videoAI") {
                    // GERÇEK AI VİDEO ÜRETİMİ
                    const vPrompt = `MANDATORY: Generate a high quality 5-second cinematic video clip in the EXACT STYLE OF ${selectedStyle.name}. 
                    Extreme wide angle view. The person from the reference image is the protagonist. 
                    Description: ${scene.v_prompt}`;

                    const vData = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', {
                        contents: [{ parts: [
                            { text: vPrompt }, 
                            referenceImageBase64 ? { inlineData: { mimeType: "image/png", data: referenceImageBase64 } } : null
                        ].filter(p => p !== null)}],
                        generationConfig: { responseModalities: ['VIDEO'] }
                    });
                    
                    const vPart = vData.candidates?.[0]?.content?.parts?.find(p => p.inlineData && p.inlineData.mimeType.startsWith('video/'));
                    if (!vPart) throw new Error("Video üretilemedi, model yanıt vermedi.");
                    
                    finalSource = `data:${vPart.inlineData.mimeType};base64,${vPart.inlineData.data}`;
                } else if (referenceImageBase64) {
                    // IMAGE-TO-IMAGE
                    const i2iData = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent', {
                        contents: [{ parts: [
                            { text: `A professional concept art masterpiece in the EXACT STYLE OF ${selectedStyle.name}. Extreme wide angle panorama. The person from the reference image is integrated as a small figure. NO PHOTO REALISM unless style is Realistic. Paragraf: ${scene.v_prompt}` }, 
                            { inlineData: { mimeType: "image/png", data: referenceImageBase64 } }
                        ]}],
                        generationConfig: { responseModalities: ['IMAGE'] }
                    });
                    const imgBase64 = i2iData.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                    finalSource = `data:image/png;base64,${imgBase64}`;
                } else {
                    // TEXT-TO-IMAGE
                    const t2iData = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict', {
                        instances: { prompt: `${selectedStyle.prompt}, Extreme wide angle cinematic view, deep landscape. ${scene.v_prompt}` },
                        parameters: { sampleCount: 1 }
                    });
                    finalSource = `data:image/png;base64,${t2iData.predictions[0].bytesBase64Encoded}`;
                }
                
                scene.source = finalSource;
                if(scene.type === 'videoAI') {
                    thumb.innerHTML = `<video src="${finalSource}" class="w-full h-full object-cover" muted loop autoplay></video>`;
                } else {
                    thumb.innerHTML = `<img src="${finalSource}" class="w-full h-full object-cover">`;
                }
                buildVideoLayers();
            } catch (e) { thumb.innerHTML = '<span class="text-red-500">HATA</span>'; log("Üretim hatası: " + e.message, "err"); }
        }

        async function regenerateScene(id) {
            const scene = scenes.find(s => s.id === id);
            log(`Sahne ${id} güncelleniyor...`);
            try {
                const data = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', {
                    contents: [{ parts: [{ text: `Lyric: ${scene.caption}. Öncekinden farklı, yeni bir epik konsept oluştur. 5-6 cümlelik GENİŞ AÇILI prompt yaz. Stil: ${selectedStyle.name}.` }] }]
                });
                const newPrompt = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (newPrompt) { scene.v_prompt = newPrompt; await generateSingleScene(id); }
            } catch (e) { await generateSingleScene(id); }
        }

        el.generateAll.onclick = async () => {
            el.generateAll.disabled = true;
            for (let i = 0; i < scenes.length; i++) { await generateSingleScene(scenes[i].id); }
            log("Prodüksiyon tamamlandı!", "success");
            el.generateAll.disabled = false; el.play.disabled = false; el.exportBtn.classList.remove('hidden');
        };

        function buildVideoLayers() {
            el.layers.innerHTML = '';
            scenes.sort((a,b) => a.start - b.start).forEach(s => {
                if (s.source) {
                    let element;
                    if(s.type === 'videoAI') {
                        element = document.createElement('video');
                        element.muted = true;
                        element.loop = true;
                        element.playsInline = true;
                    } else {
                        element = document.createElement('img');
                    }
                    element.src = s.source;
                    element.className = `slide-item ${s.type === 'video' ? 'ken-burns' : ''}`;
                    element.id = `v-item-${s.id}`;
                    el.layers.appendChild(element);
                }
            });
        }

        el.play.onclick = () => {
            if (isPlaying) { el.audio.pause(); document.getElementById('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>'; }
            else { el.audio.play(); document.getElementById('playIcon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; }
            isPlaying = !isPlaying;
        };

        el.audio.ontimeupdate = () => {
            const now = el.audio.currentTime;
            el.progress.style.width = `${(now / audioDuration) * 100}%`;
            el.time.innerText = `${fmt(now)} / ${fmt(audioDuration)}`;
            const activeScene = scenes.find(s => now >= s.start && now < s.end);
            if (activeScene && activeIdx !== activeScene.id) { activeIdx = activeScene.id; updateVisuals(activeIdx); }
        };

        function updateVisuals(id) {
            scenes.forEach(s => {
                const item = document.getElementById(`v-item-${s.id}`);
                if (item) {
                    item.classList.toggle('active', s.id === id);
                    if(s.type === 'videoAI' && s.id === id) {
                        item.currentTime = (el.audio.currentTime - s.start) % (item.duration || 5);
                        item.play().catch(() => {});
                    } else if(s.type === 'videoAI') {
                        item.pause();
                    }
                }
            });
            const current = scenes.find(s => s.id === id);
            if (current && current.showSubtitle) { el.subtitle.innerText = current.caption; el.subtitle.style.opacity = 1; } 
            else { el.subtitle.style.opacity = 0; }
        }

        el.exportBtn.onclick = async () => {
            log("Video kaydediliyor... Loop ve Efektler işleniyor.");
            const ctx = el.exportCanvas.getContext('2d');
            const stream = el.exportCanvas.captureStream(30);
            const audioCtx = new AudioContext();
            const sourceNode = audioCtx.createMediaElementSource(el.audio);
            const dest = audioCtx.createMediaStreamDestination();
            sourceNode.connect(dest); sourceNode.connect(audioCtx.destination);
            const recorder = new MediaRecorder(new MediaStream([...stream.getVideoTracks(), ...dest.stream.getAudioTracks()]), { mimeType: 'video/webm' });
            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/mp4' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `AI_Clip_Pro_${Date.now()}.mp4`;
                a.click();
                log("Video indirildi!");
            };
            el.audio.currentTime = 0; recorder.start(); el.audio.play();
            const loop = () => {
                const now = el.audio.currentTime;
                const scene = scenes.find(s => now >= s.start && now < s.end);
                ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1280, 720);
                if (scene && scene.source) {
                    const item = document.getElementById(`v-item-${scene.id}`);
                    if (item) {
                        let scale = 1;
                        let offset = 0;
                        if (scene.type === 'video') {
                            const elapsed = now - scene.start;
                            scale = 1 + (elapsed / (scene.end - scene.start)) * 0.2;
                            offset = (elapsed / (scene.end - scene.start)) * -50;
                        }
                        
                        ctx.save();
                        ctx.translate(offset, offset);
                        ctx.scale(scale, scale);
                        
                        if(scene.type === 'videoAI') {
                            // Video Loop Mantığı
                            const videoDuration = item.duration || 5;
                            item.currentTime = (now - scene.start) % videoDuration;
                        }
                        
                        ctx.drawImage(item, 0, 0, 1280, 720);
                        ctx.restore();
                        
                        if (scene.showSubtitle) {
                            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 600, 1280, 120);
                            ctx.fillStyle = '#FFF'; ctx.font = 'bold 36px Outfit'; ctx.textAlign = 'center';
                            ctx.fillText(scene.caption, 640, 670);
                        }
                    }
                }
                if (now < audioDuration && recorder.state === "recording") requestAnimationFrame(loop);
                else { if (recorder.state === "recording") recorder.stop(); el.audio.pause(); }
            };
            loop();
        };

        el.reset.onclick = () => { location.reload(); };
        initStyles();
    </script>
</body>
</html>
