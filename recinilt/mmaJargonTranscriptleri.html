<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makale Listesi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .article-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .article-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .article-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: left 0.3s ease;
        }

        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }

        .article-card:hover::before {
            left: 0;
        }

        .article-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .article-path {
            font-size: 0.9rem;
            color: #7f8c8d;
            font-family: 'Courier New', monospace;
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 8px;
            word-break: break-all;
        }

        .article-count {
            text-align: center;
            margin-bottom: 30px;
            color: #666;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .content {
                padding: 20px;
            }
            
            .article-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Makale Kütüphanesi</h1>
            <p>İkinci katman makalelerinizi keşfedin</p>
        </div>
        <div class="content">
            <div class="article-count" id="articleCount"></div>
            <div id="articles" class="article-grid"></div>
        </div>
    </div>

    <script>
        // Makale dosya listesi
        const articles = [
            '012-_Kavramlar_012_Jargon_ve_Kavram_S_zl___Hakk_nda_transkript.txt',
            '013-_Kavramlar_013_Nitelikli_Benlik_Fark_ndal___transkript.txt',
            '014-_Kavramlar_014_En_Dipteki_Temel_Motor_2_G_d__ve___g_d_leri_transkript.txt',
            '015-_Kavramlar_015__artland_r_Im___Zihin_rev2_transkript.txt',
            '016-_Kavramlar_016_Sapiensin___Tip_Benli_i_transkript.txt',
            '017-_Kavramlar_017_Bilin__ve_Fark_ndal_k_transkript.txt',
            '018-_Kavramlar_018_Bilgi__nan__Sezgi_transkript.txt',
            '019-_Kavramlar_019_Anlaml__Bilin_li_Fark_ndal_k_transkript.txt',
            '020-_Kavramlar_020_Anlaml__Bilin_li_Fark_ndal_kl__Agnostik_H_l_transkript.txt',
            '021-_Kavramlar_021__an_E_risi__l__s__transkript.txt',
            '022-_Kavramlar_022__Alg_da_ve_Yarg_da_G_recelik__l__s__transkript.txt',
            '023-_Kavramlar_023__Diyalektik_Zevc_UzayZamanMaddeEnerji__l__s__transkript.txt',
            '024-_Kavramlar_024__Duygu_Durumu_H_l_Makam_transkript.txt',
            '025-_Kavramlar_025__HazHuzurMutluluk_H_li_transkript.txt',
            '026-_Kavramlar_026___deolojik_Cinnet_transkript.txt',
            '027-_Kavramlar_027___zg_mluluk__zg_mlu_transkript.txt',
            '028-_Kavramlar_028__Sevgi_ve___k_transkript.txt',
            '029-_Kavramlar_029__Selam_ve_Esenlik_transkript.txt',
            '030-_Kavramlar_030__Merhamet_ve__efkat_transkript.txt',
            '031-_Kavramlar_031__Ak_l_Zihin_Zihin_Durumlar__transkript.txt',
            '032-_Kavramlar_032___eli_ki_ve_Paradox_transkript.txt',
            '033-_Kavramlar_033_B_t_n_Varolu__Tanr__Z_hirH__B_t_nH__tanr_lar_Melekler__eytanlar__blis_transkript.txt',
            '034-_Kavramlar_034__Varolu__Hi_lik_Yokluk_Varl_k_transkript.txt',
            '035-_Kavramlar_035__Kapsayarak_A_mak_transkript.txt',
            '036-_Kavramlar_036___spatlamak_Temellendirmek_transkript.txt',
            '037-_Kavramlar_037__Realite_Hakikat_Ger_eklik_transkript.txt',
            '038-_Kavramlar_038__Kapanmayan_Yar_k_transkript.txt',
            '039-_Kavramlar_039__B_y_k_EKS_K_The_ARZU_transkript.txt',
            '040- Kavramlar_040  Qanitiin Teslimiyet_transkript.txt',
            '041- Kavramlar_041  _lim _rif ___k_transkript.txt'
        ];

        function createDisplayName(fileName) {
            // .txt uzantısını kaldır ve dosya adını temizle
            return fileName
                .replace('.txt', '')
                .replace(/[-_]/g, ' ')
                .replace(/(\d+)/g, ' $1')
                .replace(/\s+/g, ' ')
                .trim()
                .toUpperCase();
        }

        function openArticle(fileName) {
            const filePath = `mmaJargonTranscriptleri/${fileName}`;
            window.open(filePath, '_blank');
        }

        function loadArticles() {
            const articlesEl = document.getElementById('articles');
            const countEl = document.getElementById('articleCount');
            
            // Makale sayısını göster
            countEl.textContent = `${articles.length} makale bulundu`;
            
            // Her makale için kart oluştur
            articles.forEach(fileName => {
                const articleCard = document.createElement('div');
                articleCard.className = 'article-card';
                articleCard.onclick = () => openArticle(fileName);
                
                const displayName = createDisplayName(fileName);
                
                articleCard.innerHTML = `
                    <div class="article-title">${displayName}</div>
                    <div class="article-path">${fileName}</div>
                `;
                
                articlesEl.appendChild(articleCard);
            });
        }
        
        // Sayfa yüklendiğinde makaleleri yükle
        window.addEventListener('load', loadArticles);
    </script>
</body>
</html>
