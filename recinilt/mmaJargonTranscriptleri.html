<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makale Listesi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .article-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .article-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .article-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: left 0.3s ease;
        }

        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }

        .article-card:hover::before {
            left: 0;
        }

        .article-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .article-path {
            font-size: 0.9rem;
            color: #7f8c8d;
            font-family: 'Courier New', monospace;
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 8px;
            word-break: break-all;
        }

        .article-count {
            text-align: center;
            margin-bottom: 30px;
            color: #666;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .content {
                padding: 20px;
            }
            
            .article-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Makale Kütüphanesi</h1>
            <p>İkinci katman makalelerinizi keşfedin</p>
        </div>
        <div class="content">
            <div class="article-count" id="articleCount"></div>
            <div id="articles" class="article-grid"></div>
        </div>
    </div>

    <script>
        // Makale dosya listesi
        const articles = [
            
            "01-hakkinda.txt",
            "02-nitelikBenlikFarkindaligi.txt",
            "03-enDipteki2TemelMotorGudut.txt",
            "04-sartlandirilmisZihin.txt",
            "05-sapienisinTipBelingi.txt",
            "06-bilincVeFarkindalik.txt",
            "07-bilgininSecgisi.txt",
            "08-anlamliBilincinFarkindaligi.txt",
            "09-anlamliBilincinFarkindalikliHal.txt",
            "10-canErgisiOlucusu.txt",
            "11-algidaVeYargidaGorecelilik.txt",
            "12-diyalektikZevcUzayZamanMaddeEnerjiOlucusu.txt",
            "13-duyguDurumuHalMakrosu.txt",
            "14-hazHuzurMutlulukHali.txt",
            "15-ideolojikCinnet.txt",
            "16-ozgumulukOzgumluk.txt",
            "17-sevgiVeAsk.txt",
            "18-selamVeEsenlik.txt",
            "19-merhametVeSefkat.txt",
            "20-akilZihinDurumlari.txt",
            "21-celiskiveParadoxs.txt",
            "22-butunVarolusTanzirihButunHatunlarMeleklerSeytanlarBiliss.txt",
            "23-varolusHilikYoklukVar.txt",
            "24-kapsayarakAsmak.txt",
            "25-ispatalamakTemellendirmek.txt",
            "26-realiteHakikatGerceklik.txt",
            "27-kapanmayanYarikut.txt",
            "28-buyukEksikTheArzu.txt",
            "29-QanitinTeslimiyeti.txt",
            "30-alimArifAsik.txt"
            ];

        function createDisplayName(fileName) {
            // .txt uzantısını kaldır ve dosya adını temizle
            return fileName
                .replace('.txt', '')
                .replace(/[-_]/g, ' ')
                .replace(/(\d+)/g, ' $1')
                .replace(/\s+/g, ' ')
                .trim()
                .toUpperCase();
        }

        function openArticle(fileName) {
            const filePath = `mmaJargonTranscriptleri/${fileName}`;
            window.open(filePath, '_blank');
        }

        function loadArticles() {
            const articlesEl = document.getElementById('articles');
            const countEl = document.getElementById('articleCount');
            
            // Makale sayısını göster
            countEl.textContent = `${articles.length} makale bulundu`;
            
            // Her makale için kart oluştur
            articles.forEach(fileName => {
                const articleCard = document.createElement('div');
                articleCard.className = 'article-card';
                articleCard.onclick = () => openArticle(fileName);
                
                const displayName = createDisplayName(fileName);
                
                articleCard.innerHTML = `
                    <div class="article-title">${displayName}</div>
                    <div class="article-path">${fileName}</div>
                `;
                
                articlesEl.appendChild(articleCard);
            });
        }
        
        // Sayfa yüklendiğinde makaleleri yükle
        window.addEventListener('load', loadArticles);
    </script>
</body>
</html>
