<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çarkıfelek</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
            overflow: hidden;
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
        }

        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .tab-content {
            display: none;
            padding: 30px;
        }

        .tab-content.active {
            display: block;
        }

        .wheel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .wheel-wrapper {
            position: relative;
            width: 400px;
            height: 400px;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .arrow {
            position: absolute;
            top: 50%;
            right: -20px;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            border-right: 40px solid #ff4757;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3));
            z-index: 10;
        }

        .power-slider {
            width: 100%;
            max-width: 400px;
        }

        .power-label {
            text-align: center;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
        }

        .power-value {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            border: none;
        }

        .spin-btn {
            padding: 15px 50px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .settings-section {
            margin-bottom: 30px;
        }

        .settings-section h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .preset-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .preset-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .preset-btn:hover {
            background: #667eea;
            color: white;
        }

        .preset-btn.active {
            background: #667eea;
            color: white;
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .item-input-group input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .item-input-group input[type="number"] {
            width: 80px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .remove-btn {
            padding: 10px 15px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .remove-btn:hover {
            background: #ff3838;
        }

        .add-btn {
            padding: 12px 24px;
            background: #2ed573;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .add-btn:hover {
            background: #26de81;
        }

        .save-preset {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .save-preset input {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
        }

        .save-preset button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .result-display {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .result-display.blink {
            animation: blinkAnimation 0.5s ease-in-out infinite;
        }

        @keyframes blinkAnimation {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(1.05);
            }
        }

        @media (max-width: 600px) {
            .wheel-wrapper {
                width: 300px;
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('wheel')">Çarkıfelek</button>
            <button class="tab" onclick="switchTab('settings')">Ayarlar</button>
        </div>

        <div id="wheelTab" class="tab-content active">
            <div class="wheel-container">
                <div class="wheel-wrapper">
                    <div class="arrow"></div>
                    <canvas id="wheelCanvas"></canvas>
                </div>

                <div class="power-slider">
                    <div class="power-label">Çevirme Gücü</div>
                    <div class="power-value" id="powerValue">0.75</div>
                    <input type="range" id="powerSlider" min="0.5" max="1" step="0.01" value="0.75">
                </div>

                <button class="spin-btn" id="spinBtn" onclick="spinWheel()">ÇEVİR</button>

                <div class="result-display" id="result" style="display: none;"></div>
                
                <div style="text-align: center; margin-top: 15px; color: #666; font-size: 14px;" id="multiplierInfo"></div>
            </div>
        </div>

        <div id="settingsTab" class="tab-content">
            <div class="settings-section">
                <h3>Hazır Presetler</h3>
                <div class="preset-buttons" id="presetButtons"></div>
            </div>

            <div class="settings-section">
                <h3>Çarkıfelek Öğeleri</h3>
                <div class="items-list" id="itemsList"></div>
                <button class="add-btn" onclick="addItem()">+ Yeni Öğe Ekle</button>
            </div>

            <div class="settings-section">
                <h3>Preset Kaydet</h3>
                <div class="save-preset">
                    <input type="text" id="presetName" placeholder="Preset adı...">
                    <button onclick="saveCustomPreset()">Kaydet</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const defaultPresets = {
            'Ev İşleri': [
                { name: 'Bulaşık Yıkama', count: 2 },
                { name: 'Süpürme', count: 2 },
                { name: 'Çöp Çıkarma', count: 1 },
                { name: 'Çamaşır Yıkama', count: 1 },
                { name: 'Ütü Yapma', count: 1 },
                { name: 'Mutfak Temizliği', count: 2 },
                { name: 'Banyo Temizliği', count: 1 }
            ],
            'Duygu Durumları': [
                { name: '😊 Mutlu', count: 3 },
                { name: '😎 Özgüvenli', count: 2 },
                { name: '💪 Enerjik', count: 2 },
                { name: '😌 Sakin', count: 2 },
                { name: '🤗 Sevgi Dolu', count: 2 },
                { name: '✨ İlhamlı', count: 1 }
            ],
            'Öğün Seçimi': [
                { name: '🍕 Pizza', count: 1 },
                { name: '🍔 Burger', count: 1 },
                { name: '🍜 Çorba', count: 1 },
                { name: '🥗 Salata', count: 1 },
                { name: '🍝 Makarna', count: 1 },
                { name: '🌮 Taco', count: 1 },
                { name: '🍱 Sushi', count: 1 },
                { name: '🥘 Ev Yemeği', count: 2 }
            ]
        };

        let currentItems = [];
        let isSpinning = false;
        let currentRotation = 0;
        let animationId = null;
        let powerSliderAnimation = null;
        let wheelItems = []; // Çarkıfelekteki öğelerin sırası

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const powerSlider = document.getElementById('powerSlider');
        const powerValue = document.getElementById('powerValue');

        canvas.width = 400;
        canvas.height = 400;

        function loadSettings() {
            const saved = localStorage.getItem('wheelSettings');
            if (saved) {
                currentItems = JSON.parse(saved);
            } else {
                currentItems = defaultPresets['Ev İşleri'];
                saveSettings();
            }
        }

        function saveSettings() {
            localStorage.setItem('wheelSettings', JSON.stringify(currentItems));
        }

        function loadCustomPresets() {
            const saved = localStorage.getItem('customPresets');
            return saved ? JSON.parse(saved) : {};
        }

        function saveCustomPresets(presets) {
            localStorage.setItem('customPresets', JSON.stringify(presets));
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tab === 'wheel') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('wheelTab').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('settingsTab').classList.add('active');
                renderSettings();
            }
        }

        function renderPresets() {
            const container = document.getElementById('presetButtons');
            container.innerHTML = '';
            
            const allPresets = { ...defaultPresets, ...loadCustomPresets() };
            
            Object.keys(allPresets).forEach(name => {
                const btn = document.createElement('button');
                btn.className = 'preset-btn';
                btn.textContent = name;
                btn.onclick = () => loadPreset(name, allPresets[name]);
                container.appendChild(btn);
            });
        }

        function loadPreset(name, items) {
            currentItems = JSON.parse(JSON.stringify(items));
            saveSettings();
            renderSettings();
            wheelItems = drawWheel();
            document.getElementById('result').textContent = `${name} yüklendi!`;
        }

        function renderSettings() {
            renderPresets();
            const container = document.getElementById('itemsList');
            container.innerHTML = '';
            
            currentItems.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'item-input-group';
                div.innerHTML = `
                    <input type="text" value="${item.name}" onchange="updateItem(${index}, 'name', this.value)">
                    <input type="number" min="1" value="${item.count}" onchange="updateItem(${index}, 'count', this.value)">
                    <button class="remove-btn" onclick="removeItem(${index})">Sil</button>
                `;
                container.appendChild(div);
            });
        }

        function updateItem(index, field, value) {
            if (field === 'name') {
                currentItems[index].name = value;
            } else {
                currentItems[index].count = parseInt(value) || 1;
            }
            saveSettings();
            wheelItems = drawWheel();
        }

        function addItem() {
            currentItems.push({ name: 'Yeni Öğe', count: 1 });
            saveSettings();
            renderSettings();
            wheelItems = drawWheel();
        }

        function removeItem(index) {
            currentItems.splice(index, 1);
            saveSettings();
            renderSettings();
            wheelItems = drawWheel();
        }

        function saveCustomPreset() {
            const name = document.getElementById('presetName').value.trim();
            if (!name) {
                alert('Lütfen bir preset adı girin!');
                return;
            }
            
            const customPresets = loadCustomPresets();
            customPresets[name] = JSON.parse(JSON.stringify(currentItems));
            saveCustomPresets(customPresets);
            
            document.getElementById('presetName').value = '';
            renderPresets();
            alert(`"${name}" preset'i kaydedildi!`);
        }

        function getColorForItem(itemName) {
            const colors = [
                '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8',
                '#F7DC6F', '#BB8FCE', '#85C1E2', '#F8B739', '#52B788'
            ];
            
            const uniqueItems = [...new Set(currentItems.map(item => item.name))];
            const index = uniqueItems.indexOf(itemName);
            return colors[index % colors.length];
        }

        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 180;

            const expandedItems = [];
            currentItems.forEach(item => {
                for (let i = 0; i < item.count; i++) {
                    expandedItems.push(item.name);
                }
            });

            if (expandedItems.length === 0) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }

            // Öğeleri karıştır (shuffle)
            for (let i = expandedItems.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [expandedItems[i], expandedItems[j]] = [expandedItems[j], expandedItems[i]];
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(currentRotation);

            const anglePerSlice = (2 * Math.PI) / expandedItems.length;

            expandedItems.forEach((item, i) => {
                const startAngle = i * anglePerSlice;
                const endAngle = startAngle + anglePerSlice;

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = getColorForItem(item);
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.rotate(startAngle + anglePerSlice / 2);
                ctx.textAlign = 'center';
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Arial';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 3;
                ctx.fillText(item, radius * 0.65, 0);
                ctx.restore();
            });

            ctx.restore();

            ctx.beginPath();
            ctx.arc(centerX, centerY, 20, 0, 2 * Math.PI);
            ctx.fillStyle = '#333';
            ctx.fill();
            
            return expandedItems;
        }

        function animatePowerSlider() {
            let direction = 1;
            let value = 0.75;
            const speed = 0.003;

            function animate() {
                value += direction * speed;
                
                if (value >= 1) {
                    value = 1;
                    direction = -1;
                } else if (value <= 0.5) {
                    value = 0.5;
                    direction = 1;
                }

                powerSlider.value = value;
                powerValue.textContent = value.toFixed(2);

                powerSliderAnimation = requestAnimationFrame(animate);
            }

            animate();
        }

        function stopPowerSliderAnimation() {
            if (powerSliderAnimation) {
                cancelAnimationFrame(powerSliderAnimation);
                powerSliderAnimation = null;
            }
        }

        powerSlider.addEventListener('input', (e) => {
            powerValue.textContent = parseFloat(e.target.value).toFixed(2);
        });

        function spinWheel() {
            if (isSpinning) return;
            
            // Yeni bir çevirme başlamadan önce öğeleri yeniden karıştır
            wheelItems = drawWheel();

            if (wheelItems.length === 0) {
                alert('Lütfen önce öğe ekleyin!');
                return;
            }

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('result').textContent = '';

            const basePower = parseFloat(powerSlider.value);
            const randomMultiplier = 0.5 + Math.random() * 0.49; // 0.50 ile 0.99 arası
            const finalPower = basePower * randomMultiplier;
            
            // Şans faktörünü göster
            document.getElementById('multiplierInfo').textContent = 
                `Çevirme Gücü: ${basePower.toFixed(2)} × Şans Faktörü: ${randomMultiplier.toFixed(2)} = ${finalPower.toFixed(2)}`;

            const minSpins = 3;
            const maxSpins = 6;
            const spins = minSpins + Math.random() * (maxSpins - minSpins);
            const totalRotation = spins * 2 * Math.PI * finalPower;

            const duration = 3000 + Math.random() * 2000;
            const startTime = Date.now();
            const startRotation = currentRotation;

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const easeOut = 1 - Math.pow(1 - progress, 2);
                
                currentRotation = startRotation + totalRotation * easeOut;
                
                // Animasyon sırasında çizimi güncelle ama öğeleri karıştırma
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const radius = 180;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(currentRotation);

                const anglePerSlice = (2 * Math.PI) / wheelItems.length;

                wheelItems.forEach((item, i) => {
                    const startAngle = i * anglePerSlice;
                    const endAngle = startAngle + anglePerSlice;

                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.arc(0, 0, radius, startAngle, endAngle);
                    ctx.closePath();
                    ctx.fillStyle = getColorForItem(item);
                    ctx.fill();
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    ctx.save();
                    ctx.rotate(startAngle + anglePerSlice / 2);
                    ctx.textAlign = 'center';
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 16px Arial';
                    ctx.shadowColor = 'rgba(0,0,0,0.5)';
                    ctx.shadowBlur = 3;
                    ctx.fillText(item, radius * 0.65, 0);
                    ctx.restore();
                });

                ctx.restore();

                ctx.beginPath();
                ctx.arc(centerX, centerY, 20, 0, 2 * Math.PI);
                ctx.fillStyle = '#333';
                ctx.fill();

                if (progress < 1) {
                    animationId = requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    document.getElementById('spinBtn').disabled = false;
                    
                    // İbrenin gösterdiği öğeyi bul (sağ tarafta - 0 derece açıda)
                    const normalizedRotation = currentRotation % (2 * Math.PI);
                    const anglePerSlice = (2 * Math.PI) / wheelItems.length;
                    // İbre sağda olduğu için direkt 0 derecede olan dilimi bul
                    const selectedIndex = Math.floor(((2 * Math.PI - normalizedRotation) + anglePerSlice / 2) / anglePerSlice) % wheelItems.length;
                    
                    const resultDiv = document.getElementById('result');
                    resultDiv.textContent = `🎉 ${wheelItems[selectedIndex]}`;
                    resultDiv.classList.add('blink');
                    
                    setTimeout(() => {
                        resultDiv.classList.remove('blink');
                    }, 3000);
                }
            }

            animate();
        }

        loadSettings();
        wheelItems = drawWheel();
        renderSettings();
        animatePowerSlider();
    </script>
</body>
</html>
