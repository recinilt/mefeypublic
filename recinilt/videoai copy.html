<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #020617;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .video-canvas-container {
            width: 100%;
            display: flex;
            justify-content: center;
            background: #000;
            border-radius: 2rem;
            box-shadow: 0 0 100px -20px rgba(59, 130, 246, 0.4);
            overflow: hidden;
            position: relative;
        }

        .video-canvas {
            aspect-ratio: 16 / 9;
            width: 100%;
            max-height: 70vh;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .slide-item {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            transform-origin: center center;
        }

        .slide-item.active { opacity: 1; }
        
        .fx-zoom-in.active { animation: zoomIn 20s linear forwards; }
        .fx-zoom-out.active { animation: zoomOut 20s linear forwards; }
        .fx-pan-left.active { animation: panLeft 20s linear forwards; }
        .fx-pan-right.active { animation: panRight 20s linear forwards; }
        .fx-tilt-cw.active { animation: tiltCW 20s linear forwards; }
        .fx-tilt-ccw.active { animation: tiltCCW 20s linear forwards; }
        .fx-floating.active { animation: floating 20s ease-in-out infinite; }
        .fx-pulse.active { animation: pulse 20s ease-in-out infinite; }

        @keyframes zoomIn { 0% { transform: scale(1); } 100% { transform: scale(1.3); } }
        @keyframes zoomOut { 0% { transform: scale(1.3); } 100% { transform: scale(1); } }
        @keyframes panLeft { 0% { transform: scale(1.2) translateX(5%); } 100% { transform: scale(1.2) translateX(-5%); } }
        @keyframes panRight { 0% { transform: scale(1.2) translateX(-5%); } 100% { transform: scale(1.2) translateX(5%); } }
        @keyframes tiltCW { 0% { transform: scale(1.2) rotate(0deg); } 100% { transform: scale(1.2) rotate(3deg); } }
        @keyframes tiltCCW { 0% { transform: scale(1.2) rotate(0deg); } 100% { transform: scale(1.2) rotate(-3deg); } }
        @keyframes floating { 0% { transform: scale(1.1) translateY(0); } 50% { transform: scale(1.1) translateY(-2%); } 100% { transform: scale(1.1) translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1.05); } 50% { transform: scale(1.15); } 100% { transform: scale(1.05); } }

        .style-btn, .ratio-btn {
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.05);
            background: rgba(255,255,255,0.02);
            font-size: 10px;
            font-weight: 800;
            text-align: center;
        }

        .style-btn.selected, .ratio-btn.selected {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.2);
        }

        .loader-ring {
            border: 3px solid #1e293b;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .progress-bar {
            height: 6px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #a855f7);
            width: 0%;
        }

        .subtitle-box {
            text-shadow: 0 4px 15px rgba(0,0,0,1);
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
        }

        .scene-card {
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .scene-card:hover {
            transform: translateY(-5px);
            border-color: rgba(59, 130, 246, 0.5);
        }

        #exportCanvas { display: none; }
        
        .mode-toggle {
            display: flex;
            background: rgba(0,0,0,0.3);
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
        }
        .mode-btn {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 800;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .mode-btn.active {
            background: #3b82f6;
            color: white;
        }
        
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-backdrop.open {
            opacity: 1;
            pointer-events: all;
        }
        .modal-content {
            transform: scale(0.95);
            transition: transform 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-backdrop.open .modal-content {
            transform: scale(1);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>

        async function apiCall(url, body, retries = 3) {
            const delays = [1000, 2000, 4000];
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(`${url}?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({ error: { message: `HTTP ${res.status}` } }));
                        throw new Error(err.error?.message || `HTTP ${res.status}`);
                    }
                    return await res.json();
                } catch (e) {
                    if (i === retries - 1) throw e;
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }
        }

        async function replicateImageToVideo(imageBase64, prompt, duration = 5) {
            if (!replicateApiKey) {
                throw new Error("Replicate API Key girilmedi!");
            }

            log("Replicate: Video üretimi başlatılıyor...");

            const imageUrl = `data:image/jpeg;base64,${imageBase64}`;
            
            const prediction = await fetch("https://api.replicate.com/v1/predictions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${replicateApiKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    version: "3e3a1b2b57ea5e0f4c88f0c1d1e7a3a3e3a1b2b57ea5e0f4c88f0c1d1e7a3a3",
                    input: {
                        image: imageUrl,
                        prompt: prompt,
                        duration: duration,
                        fps: 30,
                        aspect_ratio: currentRatio.apiRatio
                    }
                })
            });

            if (!prediction.ok) {
                throw new Error("Replicate API başlatma hatası");
            }

            let result = await prediction.json();
            log(`Replicate: Prediction ID ${result.id}`);

            while (result.status === "starting" || result.status === "processing") {
                await new Promise(r => setTimeout(r, 2000));
                const statusRes = await fetch(`https://api.replicate.com/v1/predictions/${result.id}`, {
                    headers: { "Authorization": `Bearer ${replicateApiKey}` }
                });
                result = await statusRes.json();
                log(`Replicate: ${result.status}...`);
            }

            if (result.status === "succeeded" && result.output) {
                log("Replicate: Video hazır!");
                return result.output;
            } else {
                throw new Error(`Replicate hatası: ${result.error || result.status}`);
            }
        }

                    log("Müzik Hazır: " + fmt(audioDuration));
                    return true;
                }
                return false;
            };

            el.audio.onloadedmetadata = checkAndSetDuration;
            el.audio.oncanplaythrough = checkAndSetDuration;
            el.audio.ondurationchange = checkAndSetDuration;

            const url = URL.createObjectURL(f);
            el.audio.src = url;
            el.audio.load();

        document.getElementById('planBtn').onclick = async () => {
            let txt = el.lyrics.value.trim();

            if (el.audioInput.files.length === 0) return log("Lütfen bir ses dosyası (MP3/WAV) seçin!", "err");
            if (!txt) return log("Lütfen şarkı sözlerini ve zamanlamaları girin!", "err");
            
            if (!audioDuration || audioDuration === 0) {
                if (el.audio.duration && !isNaN(el.audio.duration) && el.audio.duration !== Infinity && el.audio.duration > 0) {
                     audioDuration = el.audio.duration;
                     el.time.innerText = `00:00 / ${fmt(audioDuration)}`;
                } else {
                    log("Bilgi: Ses süresi mobilde 'Oynat'a basınca güncellenecek. İşlem devam ediyor...", "info");
                    audioDuration = 200;
                }
            }

            log("Senaryo kurgulanıyor...");
            
            let characterDesc = "";
            if (referenceImageBase64) {
                 log("Referans resim DERİNLEMESİNE analiz ediliyor...");
                 try {
                     const descRes = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', {
                         contents: [{
                             parts: [
                                 { text: "Analyze this image and describe ONLY the character's PHYSICAL ATTRIBUTES (face, eyes, hair, age, ethnicity, body shape, beard/glasses, scars). DO NOT DESCRIBE CLOTHING. I want to change their clothes later. I need a pixel-perfect textual description of their FACE and BODY to recreate this exact person." },
                                 { inlineData: { mimeType: "image/jpeg", data: referenceImageBase64 } }
                             ]
                         }]
                     });
                     characterDesc = descRes.candidates[0].content.parts[0].text;
                     log(`Karakter Analizi Tamam: ${characterDesc.substring(0, 40)}...`);
                 } catch (e) {
                     log("Referans resim analizi başarısız oldu, atlanıyor.", "err");
                 }
            }

            let masterPrompt = "";
            const masterMatch = txt.match(/\{([\s\S]*?)\}/);
            if (masterMatch) {
                masterPrompt = masterMatch[1].trim();
                txt = txt.replace(masterMatch[0], "");
                log(`Master Prompt Algılandı: ${masterPrompt}`);
            }

            const parsed = [];
            const lines = txt.split('\n').map(l => l.trim());
            let i = 0;

            function parseSRTTime(timeStr) {
                const parts = timeStr.split(':');
                const secondsParts = parts[2].split(',');
                return parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseInt(secondsParts[0]) + parseInt(secondsParts[1]) / 1000;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line) { i++; continue; }

                const customMatch = line.match(/(.*?)\[(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)\]/);
                if (customMatch && !line.includes('-->')) {
                    const rawText = customMatch[1].trim();
                    const start = parseFloat(customMatch[2]);
                    const end = parseFloat(customMatch[3]);
                    let caption = rawText;
                    let visualContext = "";
                    let showSubtitle = true;
                    const visualMatch = rawText.match(/\((.*?)\)/);
                    if (visualMatch) {
                        visualContext = visualMatch[1].trim();
                        caption = rawText.replace(visualMatch[0], "").trim();
                    } else { visualContext = caption; }
                    if (rawText.startsWith('(') && rawText.endsWith(')')) { showSubtitle = false; caption = ""; }
                    parsed.push({ id: parsed.length, caption: caption, visualContext: visualContext, start: start, end: end, showSubtitle: showSubtitle && caption.length > 0 });
                    i++;
                    continue;
                }

                const srtMatch = line.match(/(\d{2}:\d{2}:\d{2},\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2},\d{3})/);
                if (srtMatch) {
                    const start = parseSRTTime(srtMatch[1]);
                    let end = parseSRTTime(srtMatch[2]);
                    let textLines = [];
                    i++; 
                    while (i < lines.length) {
                        const nextLine = lines[i];
                        if (nextLine === "") { break; }
                        if (/^\d+$/.test(nextLine) && (i + 1 < lines.length && lines[i+1].includes('-->'))) { break; }
                        if (nextLine.includes('-->')) { break; }
                        if (/\[\d+(?:\.\d+)?\s*-\s*\d+(?:\.\d+)?\]/.test(nextLine)) { break; }
                        textLines.push(nextLine);
                        i++;
                    }
                    const rawText = textLines.join(' ').trim();
                    let caption = rawText;
                    let visualContext = "";
                    let showSubtitle = true;
                    const visualMatch = rawText.match(/\((.*?)\)/);
                    if (visualMatch) {
                        visualContext = visualMatch[1].trim();
                        caption = rawText.replace(visualMatch[0], "").trim();
                    } else { visualContext = rawText || "Cinematic scene"; }
                    if (rawText.startsWith('(') && rawText.endsWith(')')) { showSubtitle = false; caption = ""; }
                    if (!rawText) showSubtitle = false;
                    parsed.push({ id: parsed.length, caption: caption, visualContext: visualContext, start: start, end: end, showSubtitle: showSubtitle && caption.length > 0 });
                    continue; 
                }
                if (/^\d+$/.test(line)) { i++; continue; }
                i++;
            }

            parsed.sort((a, b) => a.start - b.start);
            for (let k = 0; k < parsed.length - 1; k++) {
                const current = parsed[k];
                const next = parsed[k+1];
                if (current.end < next.start) {
                    log(`Sahne ${k+1} süresi uzatıldı: ${fmt(current.end)} -> ${fmt(next.start)} (Gap Filling)`, 'info');
                    current.end = next.start;
                }
            }

            try {
                const systemPrompt = `Sen bir klip yönetmenisin. Her satır için 5-6 CÜMLELİK edebi bir PARAGRAF PROMPT oluştur.
KURALLAR:
1. KAMERA AÇISI: ASLA portre veya yakın çekim (close-up) yazma. HER SAHNE için "Extreme wide angle shot, establishing shot, camera far away, full body visible" ifadelerini kullan.
2. SEMBOLİZM: Aşağıda verilen "Visual Instruction" kısmını devasa manzaralara dök.
3. STİL: "${selectedStyle.name}" stilini işle.
4. MOOD: "${mood || 'Epic'}" ruh halini ekle.
${masterPrompt ? `5. GLOBAL KURAL (MASTER PROMPT): "${masterPrompt}". Bu kuralı ve temayı HER sahneye mutlaka uygula.` : ''}
${characterDesc ? `6. KARAKTER REFERANSI (FİZİKSEL ÖZELLİKLERİ KORU): "${characterDesc}". Karakterin yüzünü ve vücudunu koru AMA KIYAFETİNİ SENARYOYA GÖRE DEĞİŞTİR.` : ''}

ÇIKTI: JSON objesi döndür. Key: index, Value: 5-6 cümlelik İngilizce prompt.`;

                const inputList = parsed.map(p => `ID ${p.id}: Visual Instruction: "${p.visualContext}"`).join(' | ');

                const data = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', {
                    contents: [{ parts: [{ text: "Senaryoyu oluştur." }] }],
                    systemInstruction: { parts: [{ text: systemPrompt + "\nDATA:\n" + inputList }] },
                    generationConfig: { responseMimeType: "application/json" }
                });

                const jsonStr = data.candidates[0].content.parts[0].text;
                const result = JSON.parse(jsonStr);

                scenes = parsed.map(p => ({
                    ...p,
                    prompt: result[p.id] || result[String(p.id)] || `${selectedStyle.prompt}, ${p.visualContext}, ${mood}, ${characterDesc}`,
                    image: null
                }));

                log(`Senaryo hazır: ${scenes.length} sahne.`);
                renderSceneGrid();

            } catch (err) {
                log("Senaryo hatası: " + err.message, "err");
            }
        };

        async function generateSceneImage(idx, promptText, isImageToImage = false) {
            const box = document.getElementById('modalPreviewBox');
            if(currentModalSceneId === idx) box.innerHTML = `<div class="loader-ring"></div>`;
            log(`Sahne ${idx+1} üretiliyor (${currentRatio.label})...`);

            try {
                let imageUrl;
                
                // VIDEO (AI) MODE - REPLICATE API
                if (productionMode === 'videoAI') {
                    if (!replicateApiKey) {
                        log("Replicate API Key girilmedi! Lütfen API anahtarınızı girin.", "err");
                        if(currentModalSceneId === idx) box.innerHTML = `<span class="text-red-500 text-xs">API Key Gerekli</span>`;
                        return;
                    }

                    // First generate image with Gemini
                    log(`Sahne ${idx+1}: Önce görsel oluşturuluyor...`);
                    let baseImageB64;
                    
                    if (referenceImageBase64) {
                        const res = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent', {
                            contents: [{
                                parts: [
                                    { text: `Cinematic, Extreme Wide Angle, Full Body Shot. Aspect Ratio ${currentRatio.apiRatio}. ${promptText}. The character has the physical identity of the reference image (face, hair, body), BUT MUST WEAR THE CLOTHING DESCRIBED IN THE PROMPT. Ignore the clothing in the reference image.` },
                                    { inlineData: { mimeType: "image/jpeg", data: referenceImageBase64 } }
                                ]
                            }],
                            generationConfig: { responseModalities: ['IMAGE'] }
                        });
                        
                        baseImageB64 = res.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                        if (!baseImageB64) {
                            throw new Error("Referans görselden üretim başarısız.");
                        }
                    } else {
                        const res = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict', {
                            instances: [{ prompt: promptText + ", 8k resolution, cinematic lighting, photorealistic" }],
                            parameters: { sampleCount: 1, aspectRatio: currentRatio.apiRatio }
                        });
                        baseImageB64 = res.predictions[0].bytesBase64Encoded;
                    }

                    // Now convert to video with Replicate
                    log(`Sahne ${idx+1}: Video dönüşümü başlatılıyor...`);
                    const sceneDuration = Math.min(5, scenes[idx].end - scenes[idx].start);
                    imageUrl = await replicateImageToVideo(baseImageB64, promptText, sceneDuration);
                    
                } else if (referenceImageBase64) {
                    const res = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent', {
                        contents: [{
                            parts: [
                                { text: `Cinematic, Extreme Wide Angle, Full Body Shot. Aspect Ratio ${currentRatio.apiRatio}. ${promptText}. The character has the physical identity of the reference image (face, hair, body), BUT MUST WEAR THE CLOTHING DESCRIBED IN THE PROMPT. Ignore the clothing in the reference image.` },
                                { inlineData: { mimeType: "image/jpeg", data: referenceImageBase64 } }
                            ]
                        }],
                        generationConfig: { responseModalities: ['IMAGE'] }
                    });
                    
                    const base64 = res.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                    if (base64) {
                        imageUrl = `data:image/jpeg;base64,${base64}`;
                    } else {
                        throw new Error("No image generated from reference.");
                    }

                } else {
                    if (productionMode === 'video' || productionMode === 'image') {
                        const res = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict', {
                            instances: [{ prompt: promptText + " " + selectedStyle.prompt }],
                            parameters: { sampleCount: 1, aspectRatio: currentRatio.apiRatio }
                        });
                        imageUrl = `data:image/jpeg;base64,${res.predictions[0].bytesBase64Encoded}`;
                    }
                }

                scenes[idx].image = imageUrl;
                scenes[idx].prompt = promptText;
                
                if (!scenes[idx].fx) scenes[idx].fx = VIDEO_FX[Math.floor(Math.random() * VIDEO_FX.length)];

                renderSceneGrid();
                if(currentModalSceneId === idx) openModal(idx);
                log(`Sahne ${idx+1} tamamlandı.`, "success");

            } catch (err) {
                log(`Hata (Sahne ${idx+1}): ${err.message}`, "err");
                if(currentModalSceneId === idx) box.innerHTML = `<span class="text-red-500 text-xs">Hata: ${err.message}</span>`;
            }
        }

        el.play.onclick = () => {
            if (isPlaying) {
                el.audio.pause();
                isPlaying = false;
                el.play.innerHTML = `<svg class="w-5 h-5 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
            } else {
                el.audio.play();
                isPlaying = true;
                el.play.innerHTML = `<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
                renderLoop();
            }
        };

        function renderLoop() {
            if (!isPlaying) return;
            const now = el.audio.currentTime;
            el.time.innerText = `${fmt(now)} / ${fmt(audioDuration)}`;
            el.progress.style.width = `${(now / audioDuration) * 100}%`;

            const currentScene = scenes.find(s => now >= s.start && now < s.end);
            
            if (currentScene) {
                if (activeIdx !== currentScene.id) {
                    activeIdx = currentScene.id;
                    el.layers.innerHTML = '';
                    
                    if (currentScene.image && (currentScene.image.startsWith('data:video') || currentScene.image.startsWith('http'))) {
                        const video = document.createElement('video');
                        video.src = currentScene.image;
                        video.autoplay = true;
                        video.muted = true;
                        video.loop = true;
                        video.playsInline = true;
                        video.className = `slide-item active`;
                        el.layers.appendChild(video);
                    } else if (currentScene.image) {
                        const slide = document.createElement('img');
                        slide.src = currentScene.image;
                        slide.className = `slide-item active ${currentScene.fx}`;
                        el.layers.appendChild(slide);
                    }
                    
                    if (currentScene.showSubtitle) {
                        el.subtitle.innerText = currentScene.caption;
                        el.subtitle.style.opacity = 1;
                    } else {
                        el.subtitle.style.opacity = 0;
                    }
                }
            }

            if (!el.audio.paused && !el.audio.ended) {
                requestAnimationFrame(renderLoop);
            } else {
                isPlaying = false;
                el.play.innerHTML = `<svg class="w-5 h-5 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
            }
        }

        el.exportBtn.onclick = async () => {
            const w = currentRatio.width;
            const h = currentRatio.height;

            el.renderStatus.innerText = `Görseller Hazırlanıyor (${w}x${h})...`;
            
            el.exportCanvas.width = w;
            el.exportCanvas.height = h;
            el.exportCanvas.style.display = 'block';
            
            el.audio.pause();
            el.audio.currentTime = 0;
            
            const imageCache = {};
            const videoCache = {};
            
            for (const s of scenes) {
                if (s.image) {
                    try {
                        if (s.image.startsWith('data:video') || s.image.startsWith('http')) {
                            const video = document.createElement('video');
                            video.crossOrigin = "anonymous";
                            video.src = s.image;
                            video.muted = true;
                            video.playsInline = true;
                            await new Promise((resolve) => {
                                video.onloadeddata = resolve;
                                video.onerror = resolve;
                            });
                            videoCache[s.id] = video;
                        } else {
                            const img = new Image();
                            img.crossOrigin = "anonymous";
                            img.src = s.image;
                            await new Promise((resolve, reject) => {
                                img.onload = resolve;
                                img.onerror = resolve; 
                            });
                            imageCache[s.id] = img;
                        }
                    } catch (e) {
                        console.error("Media load error", e);
                    }
                }
            }
            
            log("Görseller önbelleğe alındı, kayıt başlıyor...", "info");
            el.renderStatus.innerText = "Render Yapılıyor...";

            const ctx = el.exportCanvas.getContext('2d');
            const stream = el.exportCanvas.captureStream(30); 
            
            const audioContext = new AudioContext();
            const source = audioContext.createMediaElementSource(el.audio);
            const dest = audioContext.createMediaStreamDestination();
            source.connect(dest);
            source.connect(audioContext.destination);
            
            const tracks = [...stream.getVideoTracks(), ...dest.stream.getAudioTracks()];
            const combinedStream = new MediaStream(tracks);
            
            const recorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm; codecs=vp9' });
            const chunks = [];
            
            recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `video_${currentRatio.label.replace(/[^a-z0-9]/gi, '_')}_${Date.now()}.webm`;
                a.click();
                el.renderStatus.innerText = "Tamamlandı!";
                el.exportCanvas.style.display = 'none';
                log("Video indirildi.", "success");
                
                source.disconnect();
                audioContext.close();
            };
            
            recorder.start();
            el.audio.play();

            function drawCoverImage(ctx, img, x, y, width, height) {
                const imgRatio = img.width / img.height;
                const winRatio = width / height;
                let drawW, drawH, drawX, drawY;

                if (imgRatio > winRatio) {
                    drawH = height;
                    drawW = height * imgRatio;
                    drawX = x + (width - drawW) / 2;
                    drawY = y;
                } else {
                    drawW = width;
                    drawH = width / imgRatio;
                    drawX = x;
                    drawY = y + (height - drawH) / 2;
                }
                ctx.drawImage(img, drawX, drawY, drawW, drawH);
            }

            const loop = () => {
                const now = el.audio.currentTime;
                
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w, h);

                const scene = scenes.find(s => now >= s.start && now < s.end);
                
                if (scene) {
                    const img = imageCache[scene.id];
                    const video = videoCache[scene.id];
                    
                    if (video) {
                        if (video.paused) video.play().catch(() => {});
                        drawCoverImage(ctx, video, 0, 0, w, h);
                    } else if (img) {
                        const duration = scene.end - scene.start;
                        const elapsed = Math.max(0, now - scene.start);
                        const progress = Math.min(1, elapsed / duration);
                        const scale = 1 + (progress * 0.15); 
                        
                        ctx.save();
                        ctx.translate(w / 2, h / 2);
                        ctx.scale(scale, scale);
                        ctx.translate(-w / 2, -h / 2);
                        
                        drawCoverImage(ctx, img, 0, 0, w, h);
                        ctx.restore();
                    }
                    
                    if (scene.showSubtitle) {
                        ctx.fillStyle = 'rgba(0,0,0,0.5)';
                        ctx.fillRect(0, h - 120, w, 120);
                        
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 36px Outfit, Arial, sans-serif'; 
                        ctx.textAlign = 'center';
                        ctx.shadowColor = "black";
                        ctx.shadowBlur = 7;
                        ctx.fillText(scene.caption, w / 2, h - 50);
                    }
                }
                
                if (!el.audio.paused && !el.audio.ended && recorder.state === "recording") {
                    requestAnimationFrame(loop);
                } else {
                    if (recorder.state === "recording") recorder.stop();
                    el.audio.pause();
                }
            };
            loop();
        };

        el.reset.onclick = () => { location.reload(); };

        window.addEventListener('load', () => {
            initUI();
            log("Sistem hazır.", "success");
        });
    </script>
</body>
</html>
