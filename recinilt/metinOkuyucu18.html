<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelişmiş Metin Okuyucu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            transition: all 0.3s ease;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            color: #4a5568;
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .header p {
            color: #718096;
            font-size: 1.1em;
            margin-bottom: 25px;
        }
        
        .file-upload {
            position: relative;
            display: inline-block;
            margin: 10px;
        }
        
        .file-input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        
        .upload-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .theme-btn {
            background: #f7fafc;
            color: #4a5568;
            border: 2px solid #e2e8f0;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            margin-left: 15px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        
        .theme-btn:hover {
            background: #edf2f7;
            transform: translateY(-1px);
        }
        
        .files-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .section-title {
            color: #4a5568;
            font-size: 1.5em;
            margin-bottom: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .file-card {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .file-card:hover {
            background: #edf2f7;
            border-color: #667eea;
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .file-info h3 {
            color: #4a5568;
            font-size: 1.1em;
            margin-bottom: 5px;
        }
        
        .file-meta {
            color: #718096;
            font-size: 0.9em;
        }
        
        .file-actions {
            display: flex;
            gap: 10px;
        }
        
        .delete-btn {
            background: #fed7d7;
            color: #c53030;
            border: 1px solid #feb2b2;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        
        .delete-btn:hover {
            background: #feb2b2;
            color: #822727;
        }
        
        .reader-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #f5f5dc;
            z-index: 1000;
            display: none;
            flex-direction: column;
        }
        
        .reader-header {
            background: rgba(245, 245, 220, 0.95);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .reader-title {
            color: #2c2c2c;
            font-weight: 600;
            font-size: 1em;
            flex: 1;
            min-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .reader-controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .control-btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: background 0.2s ease;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        
        .control-btn:hover {
            background: #1976D2;
        }
        
        .close-btn {
            background: #ff4444;
            color: white;
        }
        
        .close-btn:hover {
            background: #cc0000;
        }
        
        .highlight-btn {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        
        .highlight-btn:hover {
            background: #ffc400;
            transform: translateY(-1px);
        }
        
        .progress-bar {
            height: 3px;
            background: #ddd;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .reader-content {
            flex: 1;
            padding: 20px;
            background: #f5f5dc;
            color: #2c2c2c;
            overflow-y: auto;
            font-size: 16px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
            user-select: text;
            -webkit-user-select: text;
            -webkit-touch-callout: default;
        }
        /* Highlight stilleri */
        
        .highlight {
            background: linear-gradient(120deg, #ffd700 0%, #ffed4e 100%);
            padding: 2px 4px;
            border-radius: 3px;
            box-shadow: 0 2px 4px rgba(255, 215, 0, 0.3);
            transition: all 0.2s ease;
        }
        
        .dark-theme .highlight {
            background: linear-gradient(120deg, #ffd700 0%, #ffed4e 100%);
            color: #000;
        }
        
        .highlights-panel {
            position: fixed;
            right: -320px;
            top: 0;
            width: 300px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.1);
            z-index: 1001;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        
        .highlights-panel.open {
            right: 0;
        }
        
        .highlights-header {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .highlights-title {
            font-size: 1em;
            font-weight: 600;
            color: #2d3748;
        }
        
        .close-highlights {
            background: #e2e8f0;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .highlights-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        
        .highlight-item {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .highlight-item:hover {
            background: #edf2f7;
            border-color: #667eea;
            transform: translateY(-1px);
        }
        
        .highlight-text {
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 8px;
            color: #2d3748;
        }
        
        .highlight-position {
            font-size: 11px;
            color: #718096;
        }
        
        .empty-highlights {
            text-align: center;
            color: #718096;
            padding: 30px 15px;
            font-style: italic;
            font-size: 13px;
        }
        /* Koyu tema için okuyucu stilleri */
        
        .dark-theme .reader-modal {
            background: #1a1a1a;
        }
        
        .dark-theme .reader-header {
            background: rgba(26, 26, 26, 0.95);
            border-bottom-color: #333;
        }
        
        .dark-theme .reader-title {
            color: #e0e0e0;
        }
        
        .dark-theme .reader-content {
            background: #1a1a1a;
            color: #e0e0e0;
        }
        
        .dark-theme .progress-bar {
            background: #333;
        }
        
        .dark-theme .highlight-btn {
            background: #ffd700;
            color: #000;
        }
        
        .dark-theme .highlights-panel {
            background: rgba(45, 55, 72, 0.95);
            color: #e2e8f0;
        }
        
        .dark-theme .highlights-header {
            border-bottom-color: #4a5568;
        }
        
        .dark-theme .highlights-title {
            color: #e2e8f0;
        }
        
        .dark-theme .highlight-item {
            background: #2d3748;
            border-color: #4a5568;
        }
        
        .dark-theme .highlight-item:hover {
            background: #4a5568;
            border-color: #667eea;
        }
        
        .dark-theme .highlight-text {
            color: #e2e8f0;
        }
        
        .dark-theme .highlight-position {
            color: #a0aec0;
        }
        
        .dark-theme .empty-highlights {
            color: #a0aec0;
        }
        
        .empty-state {
            text-align: center;
            color: #718096;
            padding: 40px 20px;
            font-style: italic;
        }
        
        .dark-theme {
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
        }
        
        .dark-theme .header,
        .dark-theme .files-section {
            background: rgba(45, 55, 72, 0.95);
            color: #e2e8f0;
        }
        
        .dark-theme .section-title,
        .dark-theme .file-info h3 {
            color: #e2e8f0;
        }
        
        .dark-theme .file-card {
            background: #2d3748;
            border-color: #4a5568;
            color: #e2e8f0;
        }
        
        .dark-theme .file-card:hover {
            background: #4a5568;
            border-color: #667eea;
        }
        
        .dark-theme .theme-btn {
            background: #4a5568;
            color: #e2e8f0;
            border-color: #2d3748;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            .header {
                padding: 20px;
            }
            .header h1 {
                font-size: 2em;
            }
            .upload-btn,
            .theme-btn {
                padding: 12px 20px;
                font-size: 14px;
            }
            .file-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
                padding: 15px;
            }
            .reader-content {
                padding: 15px;
                font-size: 15px;
            }
            .reader-controls {
                gap: 5px;
            }
            .control-btn,
            .highlight-btn {
                padding: 5px 10px;
                font-size: 11px;
                min-height: 32px;
            }
            .reader-header {
                padding: 10px 12px;
            }
            .highlights-panel {
                width: 280px;
                right: -300px;
            }
            .highlights-panel.open {
                right: 0;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            .header {
                padding: 15px;
            }
            .header h1 {
                font-size: 1.5em;
            }
            .reader-content {
                padding: 12px;
                font-size: 14px;
            }
            .control-btn,
            .highlight-btn {
                padding: 4px 8px;
                font-size: 10px;
                min-height: 28px;
            }
            .reader-header {
                padding: 8px 10px;
            }
            .highlights-panel {
                width: 260px;
                right: -280px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>📚 Metin Okuyucu</h1>
            <p>Dosyalarınızı okuyun ve kaldığınız yerden devam edin</p>

            <div class="file-upload">
                <input type="file" class="file-input" id="fileInput" accept=".txt,.pdf,.doc,.docx" multiple>
                <button class="upload-btn">
                    📁 <span>Dosya Seçin</span>
                </button>
            </div>

            <button class="theme-btn" id="themeToggle">🌙 Koyu Tema</button>
        </div>

        <div class="files-section">
            <h2 class="section-title">📖 Dosyalarım</h2>
            <div id="filesList"></div>
        </div>
    </div>

    <div class="reader-modal" id="readerModal">
        <div class="reader-header">
            <div class="reader-title" id="readerTitle">Dosya Adı</div>
            <div class="reader-controls">
                <button class="control-btn" onclick="adjustFontSize(-2)">A-</button>
                <button class="control-btn" onclick="adjustFontSize(2)">A+</button>
                <button class="highlight-btn" id="highlightBtn">✨ Vurgula</button>
                <button class="control-btn" id="highlightsListBtn">📋 Listele</button>
                <button class="control-btn close-btn" onclick="closeReader()">✕ Kapat</button>
            </div>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="reader-content" id="readerContent"></div>
    </div>

    <div class="highlights-panel" id="highlightsPanel">
        <div class="highlights-header">
            <div class="highlights-title">✨ Vurgulanan Yerler</div>
            <button class="close-highlights" onclick="closeHighlightsPanel()">✕</button>
        </div>
        <div class="highlights-list" id="highlightsList"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script>
        class TextReader {
            constructor() {
                this.currentFile = null;
                this.files = this.loadFiles();
                this.fontSize = parseInt(localStorage.getItem('reader_fontSize') || '18');
                this.isDark = localStorage.getItem('reader_theme') === 'dark';
                this.CHUNK_SIZE = 50000;
                this.isSelecting = false;
                this.selectedText = null;
                this.selectedRange = null;
                this.touchStartTime = 0;
                this.longPressTimer = null;
                this.isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

                this.init();
            }

            init() {
                this.setupEventListeners();
                this.renderFilesList();
                this.applyTheme();
                this.applyFontSize();
            }

            setupEventListeners() {
                const fileInput = document.getElementById('fileInput');
                const themeToggle = document.getElementById('themeToggle');
                const readerContent = document.getElementById('readerContent');
                const highlightBtn = document.getElementById('highlightBtn');
                const highlightsListBtn = document.getElementById('highlightsListBtn');
                const highlightsPanel = document.getElementById('highlightsPanel');

                fileInput.addEventListener('change', (e) => this.handleFiles(e.target.files));
                themeToggle.addEventListener('click', () => this.toggleTheme());

                // Scroll progress
                let scrollTimeout;
                readerContent.addEventListener('scroll', () => {
                    if (scrollTimeout) clearTimeout(scrollTimeout);
                    scrollTimeout = setTimeout(() => {
                        this.updateProgress();
                    }, 200);
                });

                // Text selection events
                if (this.isMobile) {
                    // Mobil için touch event'leri
                    readerContent.addEventListener('touchstart', (e) => this.handleTouchStart(e));
                    readerContent.addEventListener('touchend', (e) => this.handleTouchEnd(e));
                    readerContent.addEventListener('touchmove', () => this.handleTouchMove());

                    // Mobilde kopyala butonuna tıklanma event'i
                    document.addEventListener('copy', (e) => {
                        setTimeout(() => {
                            this.handleTextSelection();
                        }, 100);
                    });
                } else {
                    // Desktop için mouse event'leri
                    readerContent.addEventListener('mouseup', () => this.handleTextSelection());
                    readerContent.addEventListener('selectstart', () => {
                        this.touchStartTime = Date.now();
                    });
                }

                // Highlight button
                highlightBtn.addEventListener('click', () => this.highlightSelectedText());

                // Highlights list button
                highlightsListBtn.addEventListener('click', () => this.showHighlightsPanel());

                // ESC to close
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        if (highlightsPanel.classList.contains('open')) {
                            this.closeHighlightsPanel();
                        } else if (this.isReaderOpen()) {
                            this.closeReader();
                        }
                    }
                });

                // Close highlights panel when clicking outside
                document.addEventListener('click', (e) => {
                    if (highlightsPanel.classList.contains('open') &&
                        !highlightsPanel.contains(e.target) &&
                        !highlightsListBtn.contains(e.target)) {
                        this.closeHighlightsPanel();
                    }
                });
            }

            handleTouchStart(e) {
                this.touchStartTime = Date.now();
                clearTimeout(this.longPressTimer);
                this.longPressTimer = setTimeout(() => {
                    this.handleTextSelection();
                }, 500); // 500ms long press
            }

            handleTouchMove() {
                clearTimeout(this.longPressTimer);
            }

            handleTouchEnd(e) {
                clearTimeout(this.longPressTimer);
                const touchDuration = Date.now() - this.touchStartTime;

                // Kısa dokunuşlarda da seçim kontrolü
                if (touchDuration < 1000) {
                    setTimeout(() => {
                        this.handleTextSelection();
                    }, 100);
                }
            }

            handleTextSelection() {
                const selection = window.getSelection();
                if (selection.toString().trim().length > 0) {
                    this.selectedText = selection.toString();
                    this.selectedRange = selection.getRangeAt(0);
                    this.isSelecting = true;
                    console.log('Metin seçildi:', this.selectedText);
                } else {
                    this.isSelecting = false;
                    this.selectedText = null;
                    this.selectedRange = null;
                }
            }

            highlightSelectedText() {
                console.log('Vurgula butonuna tıklandı');
                console.log('Seçim durumu:', this.isSelecting);
                console.log('Seçili metin:', this.selectedText);

                if (!this.isSelecting || !this.selectedText || !this.selectedRange) {
                    // Mobilde kopyala butonu için otomatik seçim kontrolü
                    this.handleTextSelection();
                    if (!this.isSelecting || !this.selectedText) {
                        alert('Lütfen vurgulamak istediğiniz metni seçin.');
                        return;
                    }
                }

                try {
                    console.log('Vurgulama yapılıyor...');
                    // Create highlight element
                    const highlight = document.createElement('span');
                    highlight.className = 'highlight';
                    highlight.textContent = this.selectedText;

                    // Replace selected text with highlight
                    this.selectedRange.deleteContents();
                    this.selectedRange.insertNode(highlight);

                    // Save highlight to file data
                    const highlightData = {
                        id: this.generateHighlightId(),
                        text: this.selectedText,
                        position: this.getScrollPosition(),
                        timestamp: Date.now(),
                        elementId: highlight.id
                    };

                    // Add highlight to current file
                    if (!this.currentFile.highlights) {
                        this.currentFile.highlights = [];
                    }
                    this.currentFile.highlights.push(highlightData);
                    this.saveFiles();

                    // Clear selection
                    window.getSelection().removeAllRanges();
                    this.isSelecting = false;
                    this.selectedText = null;
                    this.selectedRange = null;

                    console.log('Vurgulama tamamlandı');

                } catch (error) {
                    console.error('Vurgulama hatası:', error);
                    alert('Vurgulama yapılırken bir hata oluştu.');
                }
            }

            showHighlightsPanel() {
                if (!this.currentFile || !this.currentFile.highlights || this.currentFile.highlights.length === 0) {
                    alert('Henüz vurgulanmış bir metin yok.');
                    return;
                }

                this.renderHighlightsList();
                document.getElementById('highlightsPanel').classList.add('open');
            }

            closeHighlightsPanel() {
                document.getElementById('highlightsPanel').classList.remove('open');
            }

            renderHighlightsList() {
                const container = document.getElementById('highlightsList');
                const highlights = this.currentFile.highlights || [];

                if (highlights.length === 0) {
                    container.innerHTML = '<div class="empty-highlights">Henüz vurgulanmış metin yok.</div>';
                    return;
                }

                // Sort by position (reading order)
                const sortedHighlights = [...highlights].sort((a, b) => a.position - b.position);

                container.innerHTML = sortedHighlights.map(highlight => `
                    <div class="highlight-item" onclick="reader.scrollToHighlight(${highlight.position})">
                        <div class="highlight-text">"${this.escapeHtml(highlight.text.substring(0, 100))}${highlight.text.length > 100 ? '...' : ''}"</div>
                        <div class="highlight-position">Okuma ilerlemesi: %${Math.round(highlight.position)}</div>
                    </div>
                `).join('');
            }

            scrollToHighlight(position) {
                const content = document.getElementById('readerContent');
                const scrollHeight = content.scrollHeight - content.clientHeight;
                content.scrollTop = (position / 100) * scrollHeight;
                this.closeHighlightsPanel();
            }

            async handleFiles(fileList) {
                for (let file of fileList) {
                    try {
                        const content = await this.readFile(file);
                        const fileData = {
                            id: this.generateId(),
                            name: file.name,
                            size: file.size,
                            type: file.type,
                            dateAdded: Date.now(),
                            lastRead: Date.now(),
                            position: 0,
                            fontSize: 18,
                            highlights: []
                        };

                        await this.storeFileContent(fileData.id, content);

                        this.files.unshift(fileData);
                        if (this.files.length > 10) {
                            const removed = this.files.pop();
                            this.removeFileContent(removed.id);
                        }

                        this.saveFiles();
                        this.renderFilesList();
                    } catch (error) {
                        console.error('Dosya okuma hatası:', error);
                        alert('Dosya okunamadı: ' + file.name);
                    }
                }
            }

            async readFile(file) {
                const extension = file.name.split('.').pop().toLowerCase();

                switch (extension) {
                    case 'txt':
                        return await this.readTextFile(file);
                    case 'pdf':
                        return await this.readPDFFile(file);
                    case 'doc':
                    case 'docx':
                        return await this.readWordFile(file);
                    default:
                        throw new Error('Desteklenmeyen dosya türü');
                }
            }

            readTextFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = () => reject(new Error('Dosya okunamadı'));
                    reader.readAsText(file, 'UTF-8');
                });
            }

            async readPDFFile(file) {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                let text = '';

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(' ');
                    text += pageText + '\n\n';
                }

                return text;
            }

            async readWordFile(file) {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.extractRawText({
                    arrayBuffer
                });
                return result.value;
            }

            async storeFileContent(fileId, content) {
                const chunks = this.chunkContent(content);

                localStorage.setItem(`file_${fileId}_chunks`, chunks.length.toString());

                for (let i = 0; i < chunks.length; i++) {
                    const key = `file_${fileId}_chunk_${i}`;
                    try {
                        localStorage.setItem(key, chunks[i]);
                    } catch (error) {
                        this.cleanupStorage();
                        localStorage.setItem(key, chunks[i]);
                    }
                }
            }

            chunkContent(content) {
                const chunks = [];
                for (let i = 0; i < content.length; i += this.CHUNK_SIZE) {
                    chunks.push(content.substring(i, i + this.CHUNK_SIZE));
                }
                return chunks;
            }

            async getFileContent(fileId) {
                const chunkCount = parseInt(localStorage.getItem(`file_${fileId}_chunks`) || '0');
                let content = '';

                for (let i = 0; i < chunkCount; i++) {
                    const chunk = localStorage.getItem(`file_${fileId}_chunk_${i}`) || '';
                    content += chunk;
                }

                return content;
            }

            removeFileContent(fileId) {
                const chunkCount = parseInt(localStorage.getItem(`file_${fileId}_chunks`) || '0');

                for (let i = 0; i < chunkCount; i++) {
                    localStorage.removeItem(`file_${fileId}_chunk_${i}`);
                }

                localStorage.removeItem(`file_${fileId}_chunks`);
            }

            cleanupStorage() {
                if (this.files.length > 5) {
                    const toRemove = this.files.slice(-2);
                    toRemove.forEach(file => {
                        this.removeFileContent(file.id);
                    });
                    this.files = this.files.slice(0, -2);
                }
            }

            async openFile(fileId) {
                const file = this.files.find(f => f.id === fileId);
                if (!file) return;

                try {
                    const content = await this.getFileContent(fileId);
                    this.currentFile = file;

                    file.lastRead = Date.now();
                    this.saveFiles();

                    document.getElementById('readerTitle').textContent = file.name;
                    document.getElementById('readerContent').textContent = content;
                    document.getElementById('readerModal').style.display = 'flex';

                    const readerModal = document.getElementById('readerModal');
                    if (this.isDark) {
                        readerModal.classList.add('dark-theme');
                    } else {
                        readerModal.classList.remove('dark-theme');
                    }

                    this.fontSize = file.fontSize || 18;
                    this.applyFontSize();

                    setTimeout(() => {
                        this.restorePosition(file.position);
                        this.updateProgress();
                        this.applyHighlights();
                    }, 100);

                } catch (error) {
                    console.error('Dosya açma hatası:', error);
                    alert('Dosya açılamadı');
                }
            }

            applyHighlights() {
                if (!this.currentFile.highlights || this.currentFile.highlights.length === 0) {
                    return;
                }

                const content = document.getElementById('readerContent');
                const text = content.textContent;

                // Remove existing highlights
                content.innerHTML = '';

                // Rebuild content with highlights
                let lastIndex = 0;
                const sortedHighlights = [...this.currentFile.highlights].sort((a, b) => a.position - b.position);

                for (let highlight of sortedHighlights) {
                    // This is a simplified approach - in a real app, you'd need more sophisticated text matching
                    const startIndex = text.indexOf(highlight.text, lastIndex);
                    if (startIndex !== -1) {
                        // Add text before highlight
                        if (startIndex > lastIndex) {
                            content.appendChild(document.createTextNode(text.substring(lastIndex, startIndex)));
                        }

                        // Add highlighted text
                        const highlightElement = document.createElement('span');
                        highlightElement.className = 'highlight';
                        highlightElement.textContent = highlight.text;
                        content.appendChild(highlightElement);

                        lastIndex = startIndex + highlight.text.length;
                    }
                }

                // Add remaining text
                if (lastIndex < text.length) {
                    content.appendChild(document.createTextNode(text.substring(lastIndex)));
                }
            }

            closeReader() {
                if (this.currentFile) {
                    this.currentFile.position = this.getScrollPosition();
                    this.currentFile.fontSize = this.fontSize;
                    this.saveFiles();
                }

                document.getElementById('readerModal').style.display = 'none';
                this.closeHighlightsPanel();
                this.currentFile = null;
                this.renderFilesList();
            }

            deleteFile(fileId) {
                if (confirm('Bu dosyayı silmek istediğinizden emin misiniz?')) {
                    this.removeFileContent(fileId);
                    this.files = this.files.filter(f => f.id !== fileId);
                    this.saveFiles();
                    this.renderFilesList();
                }
            }

            getScrollPosition() {
                const content = document.getElementById('readerContent');
                const scrollTop = content.scrollTop;
                const scrollHeight = content.scrollHeight - content.clientHeight;
                return scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
            }

            restorePosition(position) {
                const content = document.getElementById('readerContent');
                const scrollHeight = content.scrollHeight - content.clientHeight;
                content.scrollTop = (position / 100) * scrollHeight;
            }

            updateProgress() {
                const progress = this.getScrollPosition();
                document.getElementById('progressFill').style.width = progress + '%';
            }

            adjustFontSize(change) {
                const currentPosition = this.getScrollPosition();
                this.fontSize = Math.max(12, Math.min(32, this.fontSize + change));
                this.applyFontSize();

                setTimeout(() => {
                    this.restorePosition(currentPosition);
                    this.updateProgress();
                }, 10);

                localStorage.setItem('reader_fontSize', this.fontSize.toString());
            }

            applyFontSize() {
                document.getElementById('readerContent').style.fontSize = this.fontSize + 'px';
            }

            toggleTheme() {
                this.isDark = !this.isDark;
                localStorage.setItem('reader_theme', this.isDark ? 'dark' : 'light');
                this.applyTheme();

                if (this.isReaderOpen()) {
                    const readerModal = document.getElementById('readerModal');
                    if (this.isDark) {
                        readerModal.classList.add('dark-theme');
                    } else {
                        readerModal.classList.remove('dark-theme');
                    }
                }
            }

            applyTheme() {
                const body = document.body;
                const themeBtn = document.getElementById('themeToggle');

                if (this.isDark) {
                    body.classList.add('dark-theme');
                    themeBtn.innerHTML = '☀️ Açık Tema';
                } else {
                    body.classList.remove('dark-theme');
                    themeBtn.innerHTML = '🌙 Koyu Tema';
                }
            }

            renderFilesList() {
                    const container = document.getElementById('filesList');

                    if (this.files.length === 0) {
                        container.innerHTML = '<div class="empty-state">Henüz dosya yok. Yukarıdan dosya seçin.</div>';
                        return;
                    }

                    container.innerHTML = this.files.map(file => `
                    <div class="file-card" onclick="reader.openFile('${file.id}')">
                        <div class="file-info">
                            <h3>${this.escapeHtml(file.name)}</h3>
                            <div class="file-meta">
                                ${this.formatFileSize(file.size)} • 
                                ${new Date(file.lastRead).toLocaleDateString('tr-TR')} • 
                                %${Math.round(file.position)} okundu
                                ${file.highlights && file.highlights.length > 0 ? ` • ✨ ${file.highlights.length} vurgu` : ''}
                            </div>
                        </div>
                        <div class="file-actions">
                            <button class="delete-btn" onclick="event.stopPropagation(); reader.deleteFile('${file.id}')">
                                🗑️ Sil
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            formatFileSize(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
            }

            generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substr(2);
            }

            generateHighlightId() {
                return 'hl_' + Date.now().toString(36) + Math.random().toString(36).substr(2);
            }

            loadFiles() {
                const stored = localStorage.getItem('reader_files');
                return stored ? JSON.parse(stored) : [];
            }

            saveFiles() {
                localStorage.setItem('reader_files', JSON.stringify(this.files));
            }

            isReaderOpen() {
                return document.getElementById('readerModal').style.display === 'flex';
            }
        }

        // Global functions
        let reader;

        function adjustFontSize(change) {
            reader.adjustFontSize(change);
        }

        function closeReader() {
            reader.closeReader();
        }

        function closeHighlightsPanel() {
            reader.closeHighlightsPanel();
        }

        // Initialize app
        document.addEventListener('DOMContentLoaded', () => {
            reader = new TextReader();
        });
    </script>
</body>
