<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonsuz Çember Fraktalı - Özelleştirilebilir</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            image-rendering: crisp-edges;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border: 1px solid #ff0000;
            font-size: 14px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        input[type=range] {
            cursor: pointer;
            accent-color: #ff0000;
        }
        span.value {
            font-weight: bold;
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="info">
            DERİNLİK: <span id="depth-val" class="value">0</span><br>
            ÖLÇEK: <span id="zoom-val" class="value">1.0</span>
        </div>
        <hr style="border: 0; border-top: 1px solid #ff0000; width: 100%;">
        <div class="control-group">
            <label>AKTİF KATMAN: <span id="layer-val" class="value">3</span></label>
            <input type="range" id="layer-slider" min="1" max="5" value="3">
        </div>
        <div style="font-size: 10px; color: #888; margin-top: 5px;">
            Yakınlaşmak için tekerleği kaydırın
        </div>
    </div>
    <canvas id="fractalCanvas"></canvas>

    <script>
        const canvas = document.getElementById('fractalCanvas');
        const ctx = canvas.getContext('2d');
        const depthDisplay = document.getElementById('depth-val');
        const zoomDisplay = document.getElementById('zoom-val');
        const layerSlider = document.getElementById('layer-slider');
        const layerDisplay = document.getElementById('layer-val');

        let width, height;
        let scale = 1.0;
        let baseDepth = 0;
        let maxLayers = 3;
        
        // Çember dizilim oranı artık 5.0
        const FRACTAL_RATIO = 5.0; 

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        // Katman sayısını güncelle
        layerSlider.addEventListener('input', (e) => {
            maxLayers = parseInt(e.target.value);
            layerDisplay.innerText = maxLayers;
        });

        // Fare tekerleği ile sonsuz zoom
        window.addEventListener('wheel', (e) => {
            const delta = e.deltaY > 0 ? 0.97 : 1.03;
            scale *= delta;

            // SONSUZ DÖNGÜ MANTIĞI:
            if (scale > FRACTAL_RATIO) {
                scale /= FRACTAL_RATIO;
                baseDepth++;
            } else if (scale < 1.0) {
                scale *= FRACTAL_RATIO;
                baseDepth--;
            }
            
            depthDisplay.innerText = baseDepth;
            zoomDisplay.innerText = scale.toFixed(2);
        });

        /**
         * Fraktal Çember Çizimi
         * @param {number} x - Merkez X
         * @param {number} y - Merkez Y
         * @param {number} r - Yarıçap
         * @param {number} currentDepth - Derinlik
         */
        function drawCircles(x, y, r, currentDepth) {
            const sR = r * scale;

            // Görünürlük kontrolü
            if (sR < 0.2 || sR > width * 3) return;

            // Çizim
            ctx.beginPath();
            ctx.arc(x, y, sR, 0, Math.PI * 2);
            ctx.strokeStyle = '#ff0000';
            
            // Katman derinliğine göre incelen çizgiler (Görsel netlik için)
            ctx.lineWidth = Math.max(0.3, 1.5 - (currentDepth * 0.3));
            ctx.stroke();

            // Kullanıcının seçtiği katman sayısına kadar in
            if (currentDepth < maxLayers - 1) {
                const nextR = r / FRACTAL_RATIO;
                const distance = r - nextR;

                // 8'li dizilim (5 ölçeğinde daha geniş alan olduğu için daha çok çember sığar)
                const count = 8;
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    const nextX = x + Math.cos(angle) * distance * scale;
                    const nextY = y + Math.sin(angle) * distance * scale;
                    drawCircles(nextX, nextY, nextR, currentDepth + 1);
                }
                
                // Merkez çemberi
                drawCircles(x, y, nextR, currentDepth + 1);
            }
        }

        function animate() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.translate(width / 2, height / 2);

            const initialRadius = Math.min(width, height) * 0.48;
            drawCircles(0, 0, initialRadius, 0);

            ctx.restore();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
