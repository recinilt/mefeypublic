        * {

            padding: 0;

        }

            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            color: #333;
        }
        
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(252, 182, 159, 0.4);
        }
        
        .section {
            margin-bottom: 40px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }
        
        .section-header {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 20px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .section-header h2 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 5px;
        }
        
        .section-header p {
            color: #666;
            font-size: 0.9rem;
        }
        
        .section-content {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 30px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #555;
            font-size: 1.1rem;
        }
        
        .comparison-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 20px;
        }
        
        .old-new-container {
            border: 2px solid #ddd;
            border-radius: 15px;
            padding: 20px;
            background: #f8f9fa;
        }
        
        .old-new-container h4 {
            margin-bottom: 15px;
            color: #333;
            font-size: 1.2rem;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
        }
        
        .old-new-container.old {
            border-left: 6px solid #dc3545;
        }
        
        .old-new-container.old h4 {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
        }
        
        .old-new-container.new {
            border-left: 6px solid #28a745;
        }
        
        .old-new-container.new h4 {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }
        
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
            border: 1px solid #e0e0e0;
            background: white;
        }
        
        .checkbox-item:hover {
            background-color: #f0f8ff;
            border-color: #667eea;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .checkbox-item input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.3);
            accent-color: #667eea;
        }
        
        .checkbox-item label {
            font-weight: 400 !important;
            margin-bottom: 0 !important;
            font-size: 0.95rem;
            cursor: pointer;
            flex: 1;
        }
        
        textarea, input[type="text"], select {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            resize: vertical;
            font-family: inherit;
        }
        
        textarea:focus, input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
            transform: translateY(-1px);
        }
        
        textarea {
            min-height: 120px;
        }
        
        .custom-input {
            margin-top: 15px;
        }
        
        .file-input {
            margin-bottom: 15px;
        }
        
        #importInput {
            display: none;
        }
        
        .file-label {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .file-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }
        
        .add-option-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .add-option-btn:hover {
            background: #5a6268;
            transform: translateY(-1px);
        }
        
        .new-option-input {
            margin-top: 10px;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            .comparison-container {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .content {
                padding: 20px;
            }
            
            .checkbox-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>

        <div class="content">
            <div class="progress-bar">

            </div>
            
            <div class="controls">

                <button class="btn btn-secondary" onclick="clearForm()">🗑️ Formu Temizle</button>
                <button class="btn btn-secondary" onclick="saveToLocalStorage()">💾 Kaydet</button>

            </div>

            <form id="karakterForm">

            </form>
        </div>
    </div>

        // Form oluşturma fonksiyonu
        function createForm() {
            const container = document.getElementById('sections-container');
            
            Object.entries(formData).forEach(([sectionName, sectionData]) => {
                // Section oluştur
                const section = document.createElement('div');
                section.className = 'section';
                section.innerHTML = `
                    <div class="section-header">
                        <h2>${sectionData.emoji} ${sectionName}</h2>
                        <p>${sectionData.description}</p>
                    </div>
                    <div class="section-content">
                        ${Object.entries(sectionData.fields).map(([fieldName, fieldData]) => `
                            <div class="form-group">
                                <label>${fieldName}:</label>
                                <div class="comparison-container">
                                    <div class="old-new-container old">
                                        <h4>Eski Yaklaşım</h4>
                                        <div class="checkbox-grid" id="${sectionName}_${fieldName}_eski_grid">
                                            ${fieldData.options.map((option, index) => `
                                                <div class="checkbox-item">
                                                    <input type="checkbox" 
                                                           id="${sectionName}_${fieldName}_eski_${index}" 
                                                           name="${sectionName}_${fieldName}_eski" 
                                                           value="${option}">
                                                    <label for="${sectionName}_${fieldName}_eski_${index}">${option}</label>
                                                </div>
                                            `).join('')}
                                        </div>
                                        <button type="button" class="add-option-btn" onclick="addNewOption('${sectionName}_${fieldName}_eski_grid', '${sectionName}_${fieldName}_eski')">
                                            ➕ Yeni Seçenek Ekle
                                        </button>
                                        <textarea name="${sectionName}_${fieldName}_eski_custom" 
                                                  placeholder="Diğer görüşlerinizi buraya yazabilirsiniz..." 
                                                  class="custom-input"></textarea>
                                    </div>
                                    <div class="old-new-container new">
                                        <h4>Yeni Yaklaşım</h4>
                                        <div class="checkbox-grid" id="${sectionName}_${fieldName}_yeni_grid">
                                            ${fieldData.options.map((option, index) => `
                                                <div class="checkbox-item">
                                                    <input type="checkbox" 
                                                           id="${sectionName}_${fieldName}_yeni_${index}" 
                                                           name="${sectionName}_${fieldName}_yeni" 
                                                           value="${option}">
                                                    <label for="${sectionName}_${fieldName}_yeni_${index}">${option}</label>
                                                </div>
                                            `).join('')}
                                        </div>
                                        <button type="button" class="add-option-btn" onclick="addNewOption('${sectionName}_${fieldName}_yeni_grid', '${sectionName}_${fieldName}_yeni')">
                                            ➕ Yeni Seçenek Ekle
                                        </button>
                                        <textarea name="${sectionName}_${fieldName}_yeni_custom" 
                                                  placeholder="Yeni yaklaşımınızı buraya yazabilirsiniz..." 
                                                  class="custom-input"></textarea>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(section);
            });
        }

        // Yeni seçenek ekleme fonksiyonu
        function addNewOption(gridId, fieldName) {
            const grid = document.getElementById(gridId);
            const optionText = prompt("Yeni seçeneği yazın:");
            
            if (optionText && optionText.trim()) {
                const timestamp = Date.now();
                const checkboxDiv = document.createElement('div');
                checkboxDiv.className = 'checkbox-item';
                checkboxDiv.innerHTML = `
                    <input type="checkbox" 
                           id="${fieldName}_custom_${timestamp}" 
                           name="${fieldName}" 
                           value="${optionText.trim()}">
                    <label for="${fieldName}_custom_${timestamp}">${optionText.trim()}</label>
                `;
                
                // Son seçenekten önce ekle (add button'dan önce)
                grid.appendChild(checkboxDiv);
            }
        }

        // Form verilerini toplama
        function collectFormData() {
            const form = document.getElementById('karakterForm');
            const formData = new FormData(form);
            const data = {};
            
            // Checkbox'ları topla
            const checkboxes = form.querySelectorAll('input[type="checkbox"]:checked');
            checkboxes.forEach(checkbox => {
                if (!data[checkbox.name]) {
                    data[checkbox.name] = [];
                }
                data[checkbox.name].push(checkbox.value);
            });
            
            // Text area'ları topla
            const textareas = form.querySelectorAll('textarea');
            textareas.forEach(textarea => {
                if (textarea.value.trim()) {
                    data[textarea.name] = textarea.value.trim();
                }
            });
            
            return data;
        }

        // Excel'e aktarma
        function exportToExcel() {
            const data = collectFormData();
            const wb = XLSX.utils.book_new();
            
            // Her kategori için ayrı sheet
            Object.entries(formData).forEach(([sectionName, sectionData]) => {
                const sheetData = [];
                
                Object.entries(sectionData.fields).forEach(([fieldName, fieldData]) => {
                    const eskiKey = `${sectionName}_${fieldName}_eski`;
                    const yeniKey = `${sectionName}_${fieldName}_yeni`;
                    const eskiCustomKey = `${sectionName}_${fieldName}_eski_custom`;
                    const yeniCustomKey = `${sectionName}_${fieldName}_yeni_custom`;
                    
                    sheetData.push({
                        'Alan': fieldName,
                        'Eski Seçimler': data[eskiKey] ? data[eskiKey].join(', ') : '',
                        'Eski Özel Notlar': data[eskiCustomKey] || '',
                        'Yeni Seçimler': data[yeniKey] ? data[yeniKey].join(', ') : '',
                        'Yeni Özel Notlar': data[yeniCustomKey] || ''
                    });
                });
                
                const ws = XLSX.utils.json_to_sheet(sheetData);
                XLSX.utils.book_append_sheet(wb, ws, sectionName.substring(0, 30));
            });
            
            // Genel özet sheet
            const summaryData = [];
            Object.entries(data).forEach(([key, value]) => {
                summaryData.push({
                    'Alan': key,
                    'Değer': Array.isArray(value) ? value.join(', ') : value
                });
            });
            
            const summaryWs = XLSX.utils.json_to_sheet(summaryData);
            XLSX.utils.book_append_sheet(wb, summaryWs, 'Genel Özet');
            
            // Dosyayı kaydet
            const today = new Date().toISOString().split('T')[0];
            XLSX.writeFile(wb, `karakter_benlik_analizi_${today}.xlsx`);
        }

        // Excel'den içe aktarma
        document.getElementById('importInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    // Genel özet sheet'i oku
                    if (workbook.SheetNames.includes('Genel Özet')) {
                        const worksheet = workbook.Sheets['Genel Özet'];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet);
                        
                        // Form verilerini doldur
                        jsonData.forEach(row => {
                            const fieldName = row['Alan'];
                            const value = row['Değer'];
                            
                            if (fieldName && value) {
                                // Checkbox'ları işle
                                if (value.includes(',')) {
                                    const values = value.split(',').map(v => v.trim());
                                    values.forEach(val => {
                                        const checkbox = document.querySelector(`input[name="${fieldName}"][value="${val}"]`);
                                        if (checkbox) checkbox.checked = true;
                                    });
                                } else {
                                    // Tek değer için checkbox veya textarea
                                    const checkbox = document.querySelector(`input[name="${fieldName}"][value="${value}"]`);
                                    if (checkbox) {
                                        checkbox.checked = true;
                                    } else {
                                        // Textarea olabilir
                                        const textarea = document.querySelector(`textarea[name="${fieldName}"]`);
                                        if (textarea) textarea.value = value;
                                    }
                                }
                            }
                        });
                        
                        alert('Excel dosyası başarıyla içe aktarıldı!');
                        updateProgress();
                    }
                } catch (error) {
                    alert('Excel dosyası okunurken hata oluştu: ' + error.message);
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // Formu temizleme
        function clearForm() {
            if (confirm('Tüm form verilerini silmek istediğinizden emin misiniz?')) {
                document.getElementById('karakterForm').reset();
                updateProgress();
            }
        }

        // Local Storage'a kaydetme
        function saveToLocalStorage() {
            const data = collectFormData();
            localStorage.setItem('karakterBenlikData', JSON.stringify(data));
            alert('Veriler yerel depolamaya kaydedildi!');
        }

        // Local Storage'dan yükleme
        function loadFromLocalStorage() {
            const savedData = localStorage.getItem('karakterBenlikData');
            if (savedData) {
                try {
                    const data = JSON.parse(savedData);
                    
                    // Form verilerini doldur
                    Object.entries(data).forEach(([fieldName, value]) => {
                        if (Array.isArray(value)) {
                            // Checkbox'lar için
                            value.forEach(val => {
                                const checkbox = document.querySelector(`input[name="${fieldName}"][value="${val}"]`);
                                if (checkbox) checkbox.checked = true;
                            });
                        } else {
                            // Textarea'lar için
                            const textarea = document.querySelector(`textarea[name="${fieldName}"]`);
                            if (textarea) textarea.value = value;
                        }
                    });
                    
                    alert('Veriler yerel depolamadan yüklendi!');
                    updateProgress();
                } catch (error) {
                    alert('Veriler yüklenirken hata oluştu: ' + error.message);
                }
            } else {
                alert('Kaydedilmiş veri bulunamadı!');
            }
        }

        // İlerleme çubuğunu güncelleme
        function updateProgress() {
            const form = document.getElementById('karakterForm');
            const totalFields = form.querySelectorAll('input[type="checkbox"], textarea').length;
            const filledFields = form.querySelectorAll('input[type="checkbox"]:checked, textarea:not([value=""])').length;
            
            const progress = (filledFields / totalFields) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        // Form değişikliklerini izleme
        document.addEventListener('change', updateProgress);
        document.addEventListener('input', updateProgress);

        // Sayfa yüklendiğinde formu oluştur
        document.addEventListener('DOMContentLoaded', function() {
            createForm();
            updateProgress();
        });
    </script>
