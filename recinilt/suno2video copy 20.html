<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Video Studio Pro - Cinematic Masterpiece</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #020617;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .video-canvas-container {
            width: 100%;
            display: flex;
            justify-content: center;
            background: #000;
            border-radius: 2rem;
            box-shadow: 0 0 100px -20px rgba(59, 130, 246, 0.4);
            overflow: hidden;
            position: relative;
        }

        .video-canvas {
            /* Default 16/9, changed via JS */
            aspect-ratio: 16 / 9;
            width: 100%;
            max-height: 70vh; /* Prevent excessive height on mobile for 9:16 */
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .slide-item {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            transform-origin: center center;
        }

        /* Video FX Animasyonları */
        .slide-item.active { opacity: 1; }
        
        .fx-zoom-in.active { animation: zoomIn 20s linear forwards; }
        .fx-zoom-out.active { animation: zoomOut 20s linear forwards; }
        .fx-pan-left.active { animation: panLeft 20s linear forwards; }
        .fx-pan-right.active { animation: panRight 20s linear forwards; }
        .fx-tilt-cw.active { animation: tiltCW 20s linear forwards; }
        .fx-tilt-ccw.active { animation: tiltCCW 20s linear forwards; }
        .fx-floating.active { animation: floating 20s ease-in-out infinite; }
        .fx-pulse.active { animation: pulse 20s ease-in-out infinite; }

        @keyframes zoomIn { 0% { transform: scale(1); } 100% { transform: scale(1.3); } }
        @keyframes zoomOut { 0% { transform: scale(1.3); } 100% { transform: scale(1); } }
        @keyframes panLeft { 0% { transform: scale(1.2) translateX(5%); } 100% { transform: scale(1.2) translateX(-5%); } }
        @keyframes panRight { 0% { transform: scale(1.2) translateX(-5%); } 100% { transform: scale(1.2) translateX(5%); } }
        @keyframes tiltCW { 0% { transform: scale(1.2) rotate(0deg); } 100% { transform: scale(1.2) rotate(3deg); } }
        @keyframes tiltCCW { 0% { transform: scale(1.2) rotate(0deg); } 100% { transform: scale(1.2) rotate(-3deg); } }
        @keyframes floating { 0% { transform: scale(1.1) translateY(0); } 50% { transform: scale(1.1) translateY(-2%); } 100% { transform: scale(1.1) translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1.05); } 50% { transform: scale(1.15); } 100% { transform: scale(1.05); } }

        .style-btn, .ratio-btn {
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.05);
            background: rgba(255,255,255,0.02);
            font-size: 10px;
            font-weight: 800;
            text-align: center;
        }

        .style-btn.selected, .ratio-btn.selected {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.2);
        }

        .loader-ring {
            border: 3px solid #1e293b;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .progress-bar {
            height: 6px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #a855f7);
            width: 0%;
        }

        .subtitle-box {
            text-shadow: 0 4px 15px rgba(0,0,0,1);
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
        }

        .scene-card {
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .scene-card:hover {
            transform: translateY(-5px);
            border-color: rgba(59, 130, 246, 0.5);
        }

        #exportCanvas { display: none; }
        
        .mode-toggle {
            display: flex;
            background: rgba(0,0,0,0.3);
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
        }
        .mode-btn {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 800;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .mode-btn.active {
            background: #3b82f6;
            color: white;
        }
        
        /* Modal Styles */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-backdrop.open {
            opacity: 1;
            pointer-events: all;
        }
        .modal-content {
            transform: scale(0.95);
            transition: transform 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-backdrop.open .modal-content {
            transform: scale(1);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8 lg:p-12">

    <div class="max-w-7xl mx-auto">
        <header class="mb-10 flex flex-col md:flex-row justify-between items-center gap-6">
            <div>
                <h1 class="text-4xl md:text-5xl font-black tracking-tight bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500 bg-clip-text text-transparent">
                    Music Video Studio Pro
                </h1>
                <p class="text-slate-400 mt-2 font-medium italic uppercase tracking-widest text-[10px]">Geniş Açı, FX, Loop & Senaryolu Prodüksiyon</p>
            </div>
            <div id="apiStatus" class="glass px-6 py-3 rounded-full flex items-center gap-3 border-blue-500/20">
                <div class="w-2 h-2 bg-blue-500 rounded-full animate-ping"></div>
                <span class="text-xs font-bold uppercase tracking-widest text-blue-400">Sinematik Motor Hazır</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4 space-y-5">
                <div class="glass p-5 rounded-[2rem] space-y-4">
                    <div>
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 block">01. Ses & Profil Fotoğrafı</label>
                        <input type="file" id="audioInput" accept="audio/mp3,audio/mpeg,audio/wav,audio/ogg,audio/*" class="block w-full text-xs text-slate-400 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-[9px] file:font-bold file:bg-blue-600 file:text-white" />
                        <audio id="audioPlayer" crossOrigin="anonymous" preload="auto" playsinline class="hidden"></audio>
                    </div>
                    <div class="flex gap-3 items-center pt-2 border-t border-white/5">
                        <div id="refPreview" class="w-12 h-12 bg-slate-900 rounded-lg flex items-center justify-center text-xl shrink-0">👤</div>
                        <div class="flex-1">
                            <input type="file" id="refImageInput" accept="image/*" class="block w-full text-[10px] text-slate-500 file:py-1 file:px-2 file:bg-slate-800 file:text-slate-300 rounded" />
                        </div>
                    </div>
                </div>

                <!-- Aspect Ratio Selector -->
                <div class="glass p-5 rounded-[2rem] space-y-4">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 block">02. Video Formatı</label>
                    <div id="ratioGrid" class="grid grid-cols-4 gap-2">
                        <!-- Filled by JS -->
                    </div>
                </div>

                <div class="glass p-5 rounded-[2rem] space-y-4">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 block">03. Üretim Modu & Stil</label>
                    <div class="mode-toggle mb-3">
                        <button id="modeImage" class="mode-btn active">RESİM</button>
                        <button id="modeVideo" class="mode-btn">VİDEO (FX)</button>
                        <button id="modeVideoAI" class="mode-btn">VİDEO (AI)</button>
                    </div>
                    <div id="styleGrid" class="grid grid-cols-3 gap-2 max-h-40 overflow-y-auto pr-2 custom-scroll mb-2"></div>
                    <input type="text" id="moodInput" class="w-full bg-slate-950/50 border border-slate-800 rounded-xl p-2.5 text-xs outline-none text-white" placeholder="Ruh Hali: Melankolik, Görkemli..." />
                </div>

                <div class="glass p-5 rounded-[2rem] space-y-4">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 block">04. Sözler & Zamanlama</label>
                    <textarea id="lyricsInput" rows="5" class="w-full bg-slate-950/50 border border-slate-800 rounded-2xl p-3 text-xs font-mono outline-none text-blue-100" placeholder="{Global Kural: Okyanus}
1
00:00:00,000 --> 00:00:05,000
Örnek (Görsel İçerik)"></textarea>
                    
                    <div class="flex gap-2">
                        <button id="planBtn" class="flex-1 bg-white text-slate-950 font-black py-3 rounded-xl hover:bg-blue-50 transition-all uppercase text-[10px]">Senaryoyu Yaz</button>
                        <button id="resetBtn" class="bg-slate-800 text-slate-400 font-bold px-4 rounded-xl hover:bg-red-900/10 transition-all uppercase text-[10px]">✕</button>
                    </div>
                </div>

                <div id="statusConsole" class="hidden glass p-4 rounded-2xl border-blue-500/10 max-h-40 overflow-hidden">
                    <div id="statusLogs" class="space-y-1 text-[9px] font-mono text-slate-400"></div>
                </div>
            </div>

            <div class="lg:col-span-8 space-y-6">
                <!-- Video Area Container -->
                <div class="video-canvas-container group" id="videoContainer">
                    <div class="video-canvas" id="videoArea">
                        <div id="imageLayer" class="absolute inset-0">
                            <div class="h-full flex flex-col items-center justify-center text-slate-700">
                                <p class="text-sm font-semibold italic text-center px-10">AI Video Studio Pro Hazır. Tüm oranlar MP4 kaydında korunacaktır.</p>
                            </div>
                        </div>
                        
                        <div class="subtitle-box absolute bottom-0 left-0 right-0 p-12 text-center pointer-events-none">
                            <h2 id="subtitleText" class="text-xl md:text-3xl font-black text-white opacity-0 transition-all duration-500"></h2>
                        </div>
                    </div>
                    
                    <!-- Controls Overlay (Absolute to container) -->
                    <div class="absolute bottom-6 left-6 right-6 flex items-center gap-5 opacity-0 group-hover:opacity-100 transition-all duration-300 bg-black/60 backdrop-blur-xl p-4 rounded-3xl border border-white/5 shadow-2xl z-20">
                        <button id="playBtn" disabled class="w-12 h-12 bg-white text-black rounded-full flex items-center justify-center hover:scale-105 transition-all">
                            <svg id="playIcon" class="w-5 h-5 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <div class="flex-1">
                            <div class="progress-bar mb-2">
                                <div id="progressBar" class="progress-fill"></div>
                            </div>
                            <div class="flex justify-between text-[9px] font-black text-slate-400 uppercase tracking-widest">
                                <span id="timeDisplay">00:00 / 00:00</span>
                                <span id="renderStatus">Beklemede</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="glass p-8 rounded-[2.5rem]">
                    <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-8">
                        <h3 class="text-lg font-bold">Sinematik Galeri <span id="scCount" class="text-blue-500 text-xs ml-2 px-2 py-0.5 bg-blue-500/10 rounded-full"></span></h3>
                        <div class="flex gap-2">
                            <button id="generateAllBtn" class="hidden bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl text-[10px] font-black uppercase">Üretimi Başlat</button>
                            <button id="exportBtn" class="hidden bg-red-600 hover:bg-red-500 text-white px-6 py-2.5 rounded-xl text-[10px] font-black uppercase">İndir (MP4)</button>
                        </div>
                    </div>
                    <div id="scenesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scene Editor Modal -->
    <div id="sceneModal" class="modal-backdrop">
        <div class="modal-content glass w-full max-w-4xl p-6 rounded-3xl m-4 relative flex flex-col gap-6">
            <button id="closeModal" class="absolute top-4 right-4 bg-slate-800/50 hover:bg-red-500/50 text-white p-2 rounded-full transition-all">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Preview Area -->
                <div class="space-y-2">
                    <div id="modalPreviewBox" class="bg-black rounded-xl overflow-hidden border border-white/10 flex items-center justify-center relative shadow-2xl" style="aspect-ratio: 16/9;">
                        <!-- Image/Video will be injected here -->
                    </div>
                    <div id="modalDimensions" class="text-center text-[10px] font-mono text-slate-500 tracking-widest uppercase">
                        <!-- Dimensions will be injected here -->
                    </div>
                </div>

                <!-- Controls Area -->
                <div class="flex flex-col gap-4">
                    <div>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Prompt (Senaryo)</h3>
                        <textarea id="modalPrompt" rows="6" class="w-full bg-slate-950/50 border border-slate-800 rounded-xl p-3 text-xs text-slate-300 outline-none focus:border-blue-500 transition-colors custom-scroll"></textarea>
                        <!-- NEW BUTTON: Run with Current Prompt -->
                        <button id="modalRunPromptBtn" class="mt-3 w-full bg-emerald-600 hover:bg-emerald-500 text-white p-2.5 rounded-xl text-[10px] font-bold transition-all flex items-center justify-center gap-2 uppercase tracking-wider">
                            <span>⚡</span> Bu Prompt İle Üret
                        </button>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mt-auto">
                        <button id="modalRegenBtn" class="bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2">
                            <span>🎲</span> Yeni Fikir & Üret
                        </button>
                        <button id="modalUploadBtn" class="bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2">
                            <span>📁</span> Resim Yükle
                        </button>
                        <input type="file" id="modalFileInput" accept="image/*" class="hidden">
                    </div>
                    
                    <button id="modalRegenImageOnlyBtn" class="hidden w-full bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-xl text-xs font-bold transition-all items-center justify-center gap-2">
                        <span>🎨</span> Sadece Görüntüyü Yenile
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Canvas is dynamic now, defined in JS -->
    <canvas id="exportCanvas" style="display:none;"></canvas>
    
    <script>
        //gemini.je'ten alınan API anahtarı:
        const apiKey = ""; 

        // Aspect Ratio Definitions
        const ASPECT_RATIOS = {
            "16:9": { width: 1280, height: 720, label: "16:9", apiRatio: "16:9" },
            "9:16": { width: 720, height: 1280, label: "9:16", apiRatio: "9:16" },
            "1:1": { width: 1080, height: 1080, label: "1:1", apiRatio: "1:1" },
            "4:3": { width: 1024, height: 768, label: "4:3", apiRatio: "4:3" }
        };

        const ART_STYLES = [
            { id: 'cinematic', name: 'Cinematic', prompt: 'Cinematic shot, 8k resolution, photorealistic, dramatic lighting, depth of field, movie scene' },
            { id: 'anime', name: 'Anime', prompt: 'Anime style, Studio Ghibli, vibrant colors, detailed background, 2D animation style' },
            { id: 'cyberpunk', name: 'Cyberpunk', prompt: 'Cyberpunk city, neon lights, futuristic, high tech, rain, night time, blade runner style' },
            { id: 'oil', name: 'Oil Painting', prompt: 'Oil painting style, textured brushstrokes, artistic, van gogh style, masterpiece' },
            { id: 'watercolor', name: 'Watercolor', prompt: 'Watercolor painting, soft colors, artistic, dreamy, paper texture' },
            { id: 'fantasy', name: 'Dark Fantasy', prompt: 'Dark fantasy, lord of the rings style, magical, mystical, detailed, epic' },
            { id: 'scifi', name: 'Sci-Fi', prompt: 'Science fiction, space station, futuristic, alien planet, high detail, star wars style' },
            { id: 'bw', name: 'Noir', prompt: 'Black and white photography, film noir, high contrast, dramatic shadows, classic movie' }
        ];

        const VIDEO_FX = ["fx-zoom-in", "fx-zoom-out", "fx-pan-left", "fx-pan-right", "fx-tilt-cw", "fx-tilt-ccw", "fx-floating", "fx-pulse"];

        let scenes = [];
        let selectedStyle = ART_STYLES[0];
        let currentRatio = ASPECT_RATIOS["16:9"];
        let productionMode = "image"; 
        let audioDuration = 0;
        let isPlaying = false;
        let activeIdx = -1;
        let referenceImageBase64 = null;
        let currentModalSceneId = null;

        const el = {
            audio: document.getElementById('audioPlayer'),
            audioInput: document.getElementById('audioInput'),
            refInput: document.getElementById('refImageInput'),
            refPreview: document.getElementById('refPreview'),
            lyrics: document.getElementById('lyricsInput'),
            styles: document.getElementById('styleGrid'),
            ratioGrid: document.getElementById('ratioGrid'),
            mood: document.getElementById('moodInput'),
            grid: document.getElementById('scenesGrid'),
            play: document.getElementById('playBtn'),
            logs: document.getElementById('statusLogs'),
            time: document.getElementById('timeDisplay'),
            progress: document.getElementById('progressBar'),
            subtitle: document.getElementById('subtitleText'),
            layers: document.getElementById('imageLayer'),
            reset: document.getElementById('resetBtn'),
            generateAll: document.getElementById('generateAllBtn'),
            exportBtn: document.getElementById('exportBtn'),
            scCount: document.getElementById('scCount'),
            renderStatus: document.getElementById('renderStatus'),
            exportCanvas: document.getElementById('exportCanvas'),
            videoArea: document.getElementById('videoArea'),
            modeImage: document.getElementById('modeImage'),
            modeVideo: document.getElementById('modeVideo'),
            modeVideoAI: document.getElementById('modeVideoAI'),
            
            // Modal Elements
            modal: document.getElementById('sceneModal'),
            modalClose: document.getElementById('closeModal'),
            modalPreview: document.getElementById('modalPreviewBox'),
            modalPrompt: document.getElementById('modalPrompt'),
            modalRegenBtn: document.getElementById('modalRegenBtn'),
            modalRunPromptBtn: document.getElementById('modalRunPromptBtn'),
            modalUploadBtn: document.getElementById('modalUploadBtn'),
            modalFileInput: document.getElementById('modalFileInput'),
            modalDimensions: document.getElementById('modalDimensions'),
            modalRegenImageOnlyBtn: document.getElementById('modalRegenImageOnlyBtn')
        };

        function initUI() {
            // Init Styles
            el.styles.innerHTML = '';
            ART_STYLES.forEach(s => {
                const b = document.createElement('div');
                b.className = `style-btn p-2 rounded-xl ${s.id === selectedStyle.id ? 'selected' : ''}`;
                b.innerText = s.name;
                b.onclick = () => {
                    document.querySelectorAll('.style-btn').forEach(x => x.classList.remove('selected'));
                    b.classList.add('selected');
                    selectedStyle = s;
                };
                el.styles.appendChild(b);
            });

            // Init Ratios
            el.ratioGrid.innerHTML = '';
            Object.keys(ASPECT_RATIOS).forEach(key => {
                const r = ASPECT_RATIOS[key];
                const b = document.createElement('div');
                b.className = `ratio-btn p-2 rounded-xl ${r.apiRatio === currentRatio.apiRatio ? 'selected' : ''}`;
                b.innerText = r.label;
                b.onclick = () => {
                    document.querySelectorAll('.ratio-btn').forEach(x => x.classList.remove('selected'));
                    b.classList.add('selected');
                    setAspectRatio(key);
                };
                el.ratioGrid.appendChild(b);
            });
        }

        function setAspectRatio(key) {
            currentRatio = ASPECT_RATIOS[key];
            // Update Preview CSS
            el.videoArea.style.aspectRatio = key.replace(':', '/');
            // Update Modal Preview CSS
            el.modalPreview.style.aspectRatio = key.replace(':', '/');
            log(`Video Formatı Değişti: ${currentRatio.label} (${currentRatio.width}x${currentRatio.height})`);
        }

        function setMode(mode) {
            productionMode = mode;
            [el.modeImage, el.modeVideo, el.modeVideoAI].forEach(b => b.classList.remove('active'));
            if(mode === 'image') el.modeImage.classList.add('active');
            if(mode === 'video') el.modeVideo.classList.add('active');
            if(mode === 'videoAI') el.modeVideoAI.classList.add('active');
            log(`Mod seçildi: ${mode.toUpperCase()}`);
        }

        el.modeImage.onclick = () => setMode('image');
        el.modeVideo.onclick = () => setMode('video');
        el.modeVideoAI.onclick = () => setMode('videoAI');

        function log(msg, type = 'info') {
            document.getElementById('statusConsole').classList.remove('hidden');
            const d = document.createElement('div');
            d.innerHTML = `<span class="opacity-30 mr-2">${new Date().toLocaleTimeString()}</span> <span class="${type === 'err' ? 'text-red-400 font-bold' : 'text-blue-400'}">${msg}</span>`;
            el.logs.appendChild(d);
            el.logs.scrollTop = el.logs.scrollHeight;
        }

        async function apiCall(url, body, retries = 3) {
            const delays = [1000, 2000, 4000];
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(`${url}?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({ error: { message: `HTTP ${res.status}` } }));
                        throw new Error(err.error?.message || `HTTP ${res.status}`);
                    }
                    return await res.json();
                } catch (e) {
                    if (i === retries - 1) throw e;
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }
        }

        el.audioInput.onchange = (e) => {
            const f = e.target.files[0];
            if (!f) return;
            
            const checkAndSetDuration = () => {
                if (el.audio.duration && el.audio.duration !== Infinity && !isNaN(el.audio.duration) && el.audio.duration > 0) {
                    audioDuration = el.audio.duration;
                    el.time.innerText = `00:00 / ${fmt(audioDuration)}`;
                    log("Müzik Hazır: " + fmt(audioDuration));
                    return true;
                }
                return false;
            };

            el.audio.onloadedmetadata = checkAndSetDuration;
            el.audio.oncanplaythrough = checkAndSetDuration;
            el.audio.ondurationchange = checkAndSetDuration;

            const url = URL.createObjectURL(f);
            el.audio.src = url;
            el.audio.load();

            let attempts = 0;
            const pollDuration = setInterval(() => {
                attempts++;
                if (checkAndSetDuration() || attempts > 50) clearInterval(pollDuration);
            }, 100);
        };

        el.refInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                referenceImageBase64 = event.target.result.split(',')[1];
                el.refPreview.innerHTML = `<img src="${event.target.result}" class="w-full h-full object-cover rounded-lg">`;
            };
            reader.readAsDataURL(file);
        };

        function fmt(s) {
            if(!s || isNaN(s)) return "00:00";
            const m = Math.floor(s/60);
            const sec = Math.floor(s%60);
            return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }

        // --- PARSING & PLANNING LOGIC ---
        document.getElementById('planBtn').onclick = async () => {
            let txt = el.lyrics.value.trim();
            const mood = el.mood.value.trim();

            if (el.audioInput.files.length === 0) return log("Lütfen bir ses dosyası (MP3/WAV) seçin!", "err");
            if (!txt) return log("Lütfen şarkı sözlerini ve zamanlamaları girin!", "err");
            
            if (!audioDuration || audioDuration === 0) {
                if (el.audio.duration && !isNaN(el.audio.duration) && el.audio.duration !== Infinity && el.audio.duration > 0) {
                     audioDuration = el.audio.duration;
                     el.time.innerText = `00:00 / ${fmt(audioDuration)}`;
                } else {
                    log("Bilgi: Ses süresi mobilde 'Oynat'a basınca güncellenecek. İşlem devam ediyor...", "info");
                    audioDuration = 200;
                }
            }

            log("Senaryo kurgulanıyor...");
            
            // DEEP REFERENCE IMAGE ANALYSIS
            let characterDesc = "";
            if (referenceImageBase64) {
                 log("Referans resim DERİNLEMESİNE analiz ediliyor...");
                 try {
                     const descRes = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', {
                         contents: [{
                             parts: [
                                 { text: "Analyze this image and describe ONLY the character's PHYSICAL ATTRIBUTES (face, eyes, hair, age, ethnicity, body shape, beard/glasses, scars). DO NOT DESCRIBE CLOTHING. I want to change their clothes later. I need a pixel-perfect textual description of their FACE and BODY to recreate this exact person." },
                                 { inlineData: { mimeType: "image/jpeg", data: referenceImageBase64 } }
                             ]
                         }]
                     });
                     characterDesc = descRes.candidates[0].content.parts[0].text;
                     log(`Karakter Analizi Tamam: ${characterDesc.substring(0, 40)}...`);
                 } catch (e) {
                     log("Referans resim analizi başarısız oldu, atlanıyor.", "err");
                 }
            }

            // EXTRACT MASTER PROMPT
            let masterPrompt = "";
            const masterMatch = txt.match(/\{([\s\S]*?)\}/);
            if (masterMatch) {
                masterPrompt = masterMatch[1].trim();
                txt = txt.replace(masterMatch[0], "");
                log(`Master Prompt Algılandı: ${masterPrompt}`);
            }

            // PARSE LINES (Hybrid: Custom + SRT)
            const parsed = [];
            const lines = txt.split('\n').map(l => l.trim());
            let i = 0;

            function parseSRTTime(timeStr) {
                const parts = timeStr.split(':');
                const secondsParts = parts[2].split(',');
                return parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseInt(secondsParts[0]) + parseInt(secondsParts[1]) / 1000;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line) { i++; continue; }

                const customMatch = line.match(/(.*?)\[(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)\]/);
                if (customMatch && !line.includes('-->')) {
                    const rawText = customMatch[1].trim();
                    const start = parseFloat(customMatch[2]);
                    const end = parseFloat(customMatch[3]);
                    let caption = rawText;
                    let visualContext = "";
                    let showSubtitle = true;
                    const visualMatch = rawText.match(/\((.*?)\)/);
                    if (visualMatch) {
                        visualContext = visualMatch[1].trim();
                        caption = rawText.replace(visualMatch[0], "").trim();
                    } else { visualContext = caption; }
                    if (rawText.startsWith('(') && rawText.endsWith(')')) { showSubtitle = false; caption = ""; }
                    parsed.push({ id: parsed.length, caption: caption, visualContext: visualContext, start: start, end: end, showSubtitle: showSubtitle && caption.length > 0 });
                    i++;
                    continue;
                }

                const srtMatch = line.match(/(\d{2}:\d{2}:\d{2},\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2},\d{3})/);
                if (srtMatch) {
                    const start = parseSRTTime(srtMatch[1]);
                    let end = parseSRTTime(srtMatch[2]);
                    let textLines = [];
                    i++; 
                    while (i < lines.length) {
                        const nextLine = lines[i];
                        if (nextLine === "") { break; }
                        if (/^\d+$/.test(nextLine) && (i + 1 < lines.length && lines[i+1].includes('-->'))) { break; }
                        if (nextLine.includes('-->')) { break; }
                        if (/\[\d+(?:\.\d+)?\s*-\s*\d+(?:\.\d+)?\]/.test(nextLine)) { break; }
                        textLines.push(nextLine);
                        i++;
                    }
                    const rawText = textLines.join(' ').trim();
                    let caption = rawText;
                    let visualContext = "";
                    let showSubtitle = true;
                    const visualMatch = rawText.match(/\((.*?)\)/);
                    if (visualMatch) {
                        visualContext = visualMatch[1].trim();
                        caption = rawText.replace(visualMatch[0], "").trim();
                    } else { visualContext = rawText || "Cinematic scene"; }
                    if (rawText.startsWith('(') && rawText.endsWith(')')) { showSubtitle = false; caption = ""; }
                    if (!rawText) showSubtitle = false;
                    parsed.push({ id: parsed.length, caption: caption, visualContext: visualContext, start: start, end: end, showSubtitle: showSubtitle && caption.length > 0 });
                    continue; 
                }
                if (/^\d+$/.test(line)) { i++; continue; }
                i++;
            }

            // AUTO-EXTEND DURATION (GAP FILLING)
            parsed.sort((a, b) => a.start - b.start);
            for (let k = 0; k < parsed.length - 1; k++) {
                const current = parsed[k];
                const next = parsed[k+1];
                if (current.end < next.start) {
                    log(`Sahne ${k+1} süresi uzatıldı: ${fmt(current.end)} -> ${fmt(next.start)} (Gap Filling)`, 'info');
                    current.end = next.start;
                }
            }

            try {
                const systemPrompt = `Sen bir klip yönetmenisin. Her satır için 5-6 CÜMLELİK edebi bir PARAGRAF PROMPT oluştur.
KURALLAR:
1. KAMERA AÇISI: ASLA portre veya yakın çekim (close-up) yazma. HER SAHNE için "Extreme wide angle shot, establishing shot, camera far away, full body visible" ifadelerini kullan.
2. SEMBOLİZM: Aşağıda verilen "Visual Instruction" kısmını devasa manzaralara dök.
3. STİL: "${selectedStyle.name}" stilini işle.
4. MOOD: "${mood || 'Epic'}" ruh halini ekle.
${masterPrompt ? `5. GLOBAL KURAL (MASTER PROMPT): "${masterPrompt}". Bu kuralı ve temayı HER sahneye mutlaka uygula.` : ''}
${characterDesc ? `6. KARAKTER REFERANSI (FİZİKSEL ÖZELLİKLERİ KORU): "${characterDesc}". Karakterin yüzünü ve vücudunu koru AMA KIYAFETİNİ SENARYOYA GÖRE DEĞİŞTİR.` : ''}

ÇIKTI: JSON objesi döndür. Key: index, Value: 5-6 cümlelik İngilizce prompt.`;

                const inputList = parsed.map(p => `ID ${p.id}: Visual Instruction: "${p.visualContext}"`).join(' | ');

                const data = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', {
                    contents: [{ parts: [{ text: "Senaryoyu oluştur." }] }],
                    systemInstruction: { parts: [{ text: systemPrompt + "\nDATA:\n" + inputList }] },
                    generationConfig: { responseMimeType: "application/json" }
                });

                const jsonStr = data.candidates[0].content.parts[0].text;
                const result = JSON.parse(jsonStr);

                scenes = parsed.map(p => ({
                    ...p,
                    prompt: result[p.id] || result[String(p.id)] || `${selectedStyle.prompt}, ${p.visualContext}, ${mood}, ${characterDesc}`,
                    image: null
                }));

                log(`Senaryo hazır: ${scenes.length} sahne.`);
                renderSceneGrid();

            } catch (err) {
                log("Senaryo hatası: " + err.message, "err");
            }
        };

        function renderSceneGrid() {
            el.grid.innerHTML = '';
            el.scCount.innerText = scenes.length;
            el.generateAll.classList.remove('hidden');
            
            scenes.forEach((scene, idx) => {
                const card = document.createElement('div');
                card.className = 'scene-card glass rounded-2xl overflow-hidden relative group';
                
                let mediaHtml = scene.image 
                    ? `<img src="${scene.image}" class="w-full h-32 object-cover">`
                    : `<div class="w-full h-32 bg-slate-900 flex items-center justify-center text-slate-600 text-[10px] font-black uppercase tracking-widest">Sahne ${idx+1}</div>`;

                card.innerHTML = `
                    ${mediaHtml}
                    <div class="p-3">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[9px] font-black text-blue-400">#${idx+1}</span>
                            <span class="text-[9px] font-mono text-slate-500">${fmt(scene.start)} - ${fmt(scene.end)}</span>
                        </div>
                        <p class="text-[10px] text-slate-300 line-clamp-2 leading-relaxed">${scene.caption || '(Sadece Görsel)'}</p>
                    </div>
                `;

                card.onclick = () => openModal(idx);
                el.grid.appendChild(card);
            });
        }

        async function openModal(idx) {
            currentModalSceneId = idx;
            const scene = scenes[idx];
            el.modal.classList.add('open');
            el.modalPrompt.value = scene.prompt;
            
            el.modalDimensions.innerText = `${currentRatio.label} • ${currentRatio.width}x${currentRatio.height}px • ${selectedStyle.name}`;
            
            if (scene.image) {
                if (scene.image.startsWith('data:video')) {
                     el.modalPreview.innerHTML = `<video src="${scene.image}" autoplay loop muted playsinline class="w-full h-full object-cover"></video>`;
                } else {
                     el.modalPreview.innerHTML = `<img src="${scene.image}" class="w-full h-full object-cover">`;
                }
                el.modalRegenImageOnlyBtn.classList.remove('hidden');
            } else {
                el.modalPreview.innerHTML = `<div class="text-slate-600 text-xs">Görsel Yok</div>`;
                el.modalRegenImageOnlyBtn.classList.add('hidden');
            }

            el.modalRunPromptBtn.onclick = () => generateSceneImage(idx, el.modalPrompt.value);
            el.modalRegenBtn.onclick = async () => {
                el.modalPreview.innerHTML = `<div class="loader-ring"></div>`;
                try {
                     const promptRes = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', {
                        contents: [{ parts: [{ text: `Rewrite this image prompt to be more creative and detailed for a music video scene: "${scene.visualContext}"` }] }]
                    });
                    const newPrompt = promptRes.candidates[0].content.parts[0].text;
                    el.modalPrompt.value = newPrompt;
                    await generateSceneImage(idx, newPrompt);
                } catch(e) {
                    log("Prompt yenileme hatası", "err");
                }
            };
            
            el.modalUploadBtn.onclick = () => el.modalFileInput.click();
            el.modalFileInput.onchange = (e) => {
                 const f = e.target.files[0];
                 if(f) {
                     const reader = new FileReader();
                     reader.onload = (ev) => {
                         scenes[idx].image = ev.target.result;
                         renderSceneGrid();
                         openModal(idx);
                     };
                     reader.readAsDataURL(f);
                 }
            };

            el.modalRegenImageOnlyBtn.onclick = () => generateSceneImage(idx, el.modalPrompt.value, true);
        }

        el.modalClose.onclick = () => el.modal.classList.remove('open');

        el.generateAll.onclick = async () => {
            el.generateAll.innerText = "Üretiliyor...";
            el.generateAll.disabled = true;
            for (let i = 0; i < scenes.length; i++) {
                if (!scenes[i].image) {
                    await generateSceneImage(i, scenes[i].prompt);
                }
            }
            el.generateAll.innerText = "Tümünü Yenile";
            el.generateAll.disabled = false;
            el.exportBtn.classList.remove('hidden');
            log("Tüm sahneler hazır! Oynatabilirsin.", "success");
            el.play.disabled = false;
            el.play.click();
        };

        async function generateSceneImage(idx, promptText, isImageToImage = false) {
            const box = document.getElementById('modalPreviewBox');
            if(currentModalSceneId === idx) box.innerHTML = `<div class="loader-ring"></div>`;
            log(`Sahne ${idx+1} üretiliyor (${currentRatio.label})...`);

            try {
                let imageUrl;
                
                // --- FORCE REFERENCE IMAGE USAGE ---
                if (referenceImageBase64) {
                     const res = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent', {
                        contents: [{
                            parts: [
                                { text: `Cinematic, Extreme Wide Angle, Full Body Shot. Aspect Ratio ${currentRatio.apiRatio}. ${promptText}. The character has the physical identity of the reference image (face, hair, body), BUT MUST WEAR THE CLOTHING DESCRIBED IN THE PROMPT (e.g. Leopard Tracksuit). Ignore the clothing in the reference image.` },
                                { inlineData: { mimeType: "image/jpeg", data: referenceImageBase64 } }
                            ]
                        }],
                        generationConfig: { responseModalities: ['IMAGE'] }
                    });
                    
                    const base64 = res.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                    if (base64) {
                        imageUrl = `data:image/jpeg;base64,${base64}`;
                    } else {
                        throw new Error("No image generated from reference.");
                    }

                } else {
                    // --- FALLBACK TO STANDARD IMAGEN ---
                    if (productionMode === 'videoAI') {
                        const res = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict', {
                            instances: [{ prompt: promptText + ", 8k resolution, cinematic lighting, photorealistic" }],
                            parameters: { sampleCount: 1, aspectRatio: currentRatio.apiRatio }
                        });
                         imageUrl = `data:image/jpeg;base64,${res.predictions[0].bytesBase64Encoded}`;
                    } else if (productionMode === 'video' || productionMode === 'image') {
                        const res = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict', {
                            instances: [{ prompt: promptText + " " + selectedStyle.prompt }],
                            parameters: { sampleCount: 1, aspectRatio: currentRatio.apiRatio }
                        });
                        imageUrl = `data:image/jpeg;base64,${res.predictions[0].bytesBase64Encoded}`;
                    }
                }

                scenes[idx].image = imageUrl;
                scenes[idx].prompt = promptText;
                
                if (!scenes[idx].fx) scenes[idx].fx = VIDEO_FX[Math.floor(Math.random() * VIDEO_FX.length)];

                renderSceneGrid();
                if(currentModalSceneId === idx) openModal(idx);
                log(`Sahne ${idx+1} tamamlandı.`, "success");

            } catch (err) {
                log(`Hata (Sahne ${idx+1}): ${err.message}`, "err");
                if(currentModalSceneId === idx) box.innerHTML = `<span class="text-red-500 text-xs">Hata</span>`;
            }
        }

        // --- PLAYER LOGIC ---
        el.play.onclick = () => {
            if (isPlaying) {
                el.audio.pause();
                isPlaying = false;
                el.play.innerHTML = `<svg class="w-5 h-5 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
            } else {
                el.audio.play();
                isPlaying = true;
                el.play.innerHTML = `<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
                renderLoop();
            }
        };

        function renderLoop() {
            if (!isPlaying) return;
            const now = el.audio.currentTime;
            el.time.innerText = `${fmt(now)} / ${fmt(audioDuration)}`;
            el.progress.style.width = `${(now / audioDuration) * 100}%`;

            const currentScene = scenes.find(s => now >= s.start && now < s.end);
            
            if (currentScene) {
                if (activeIdx !== currentScene.id) {
                    activeIdx = currentScene.id;
                    el.layers.innerHTML = '';
                    const slide = document.createElement('img');
                    slide.src = currentScene.image;
                    slide.className = `slide-item active ${currentScene.fx}`;
                    el.layers.appendChild(slide);
                    
                    if (currentScene.showSubtitle) {
                        el.subtitle.innerText = currentScene.caption;
                        el.subtitle.style.opacity = 1;
                    } else {
                        el.subtitle.style.opacity = 0;
                    }
                }
            }

            if (!el.audio.paused && !el.audio.ended) {
                requestAnimationFrame(renderLoop);
            } else {
                isPlaying = false;
                el.play.innerHTML = `<svg class="w-5 h-5 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
            }
        }

        // --- EXPORT LOGIC (Dynamic Resolution + Preloading) ---
        el.exportBtn.onclick = async () => {
            const w = currentRatio.width;
            const h = currentRatio.height;

            el.renderStatus.innerText = `Görseller Hazırlanıyor (${w}x${h})...`;
            
            // Set canvas size based on selected ratio
            el.exportCanvas.width = w;
            el.exportCanvas.height = h;
            el.exportCanvas.style.display = 'block';
            
            el.audio.pause();
            el.audio.currentTime = 0;
            
            // 1. PRELOAD IMAGES
            const imageCache = {};
            for (const s of scenes) {
                if (s.image) {
                    try {
                        const img = new Image();
                        img.crossOrigin = "anonymous";
                        img.src = s.image;
                        await new Promise((resolve, reject) => {
                            img.onload = resolve;
                            img.onerror = resolve; 
                        });
                        imageCache[s.id] = img;
                    } catch (e) {
                        console.error("Image load error", e);
                    }
                }
            }
            log("Görseller önbelleğe alındı, kayıt başlıyor...", "info");
            el.renderStatus.innerText = "Render Yapılıyor...";

            const ctx = el.exportCanvas.getContext('2d');
            const stream = el.exportCanvas.captureStream(30); 
            
            const audioContext = new AudioContext();
            const source = audioContext.createMediaElementSource(el.audio);
            const dest = audioContext.createMediaStreamDestination();
            source.connect(dest);
            source.connect(audioContext.destination);
            
            const tracks = [...stream.getVideoTracks(), ...dest.stream.getAudioTracks()];
            const combinedStream = new MediaStream(tracks);
            
            const recorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm; codecs=vp9' });
            const chunks = [];
            
            recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `video_${currentRatio.label.replace(/[^a-z0-9]/gi, '_')}_${Date.now()}.webm`;
                a.click();
                el.renderStatus.innerText = "Tamamlandı!";
                el.exportCanvas.style.display = 'none';
                log("Video indirildi.", "success");
                
                source.disconnect();
                audioContext.close();
            };
            
            recorder.start();
            el.audio.play();

            // Dynamic Image Drawing
            function drawCoverImage(ctx, img, x, y, width, height) {
                const imgRatio = img.width / img.height;
                const winRatio = width / height;
                let drawW, drawH, drawX, drawY;

                if (imgRatio > winRatio) {
                    drawH = height;
                    drawW = height * imgRatio;
                    drawX = x + (width - drawW) / 2;
                    drawY = y;
                } else {
                    drawW = width;
                    drawH = width / imgRatio;
                    drawX = x;
                    drawY = y + (height - drawH) / 2;
                }
                ctx.drawImage(img, drawX, drawY, drawW, drawH);
            }

            const loop = () => {
                const now = el.audio.currentTime;
                
                // Clear Canvas
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w, h);

                const scene = scenes.find(s => now >= s.start && now < s.end);
                
                if (scene) {
                    const item = imageCache[scene.id];
                    if (item) {
                        // Dynamic Ken Burns Zoom
                        const duration = scene.end - scene.start;
                        const elapsed = Math.max(0, now - scene.start);
                        const progress = Math.min(1, elapsed / duration);
                        const scale = 1 + (progress * 0.15); 
                        
                        ctx.save();
                        // Dynamic Center Translation
                        ctx.translate(w / 2, h / 2);
                        ctx.scale(scale, scale);
                        ctx.translate(-w / 2, -h / 2);
                        
                        drawCoverImage(ctx, item, 0, 0, w, h);
                        ctx.restore();
                        
                        // Dynamic Subtitle Positioning
                        if (scene.showSubtitle) {
                            ctx.fillStyle = 'rgba(0,0,0,0.5)';
                            ctx.fillRect(0, h - 120, w, 120); // Always at bottom
                            
                            ctx.fillStyle = '#ffffff';
                            ctx.font = 'bold 36px Outfit, Arial, sans-serif'; 
                            ctx.textAlign = 'center';
                            ctx.shadowColor = "black";
                            ctx.shadowBlur = 7;
                            ctx.fillText(scene.caption, w / 2, h - 50);
                        }
                    }
                }
                
                if (!el.audio.paused && !el.audio.ended && recorder.state === "recording") {
                    requestAnimationFrame(loop);
                } else {
                    if (recorder.state === "recording") recorder.stop();
                    el.audio.pause();
                }
            };
            loop();
        };

        el.reset.onclick = () => { location.reload(); };

        window.addEventListener('load', () => {
            initUI();
            log("Sistem hazır.", "success");
        });
    </script>
</body>
