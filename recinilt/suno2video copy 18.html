<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Video Studio Pro - Cinematic Masterpiece</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #020617;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .video-canvas {
            aspect-ratio: 16 / 9;
            background: #000;
            position: relative;
            overflow: hidden;
            border-radius: 2rem;
            box-shadow: 0 0 100px -20px rgba(59, 130, 246, 0.4);
        }

        .slide-item {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            transform-origin: center center;
        }

        /* Video FX Animasyonları */
        .slide-item.active { opacity: 1; }
        
        .fx-zoom-in.active { animation: zoomIn 20s linear forwards; }
        .fx-zoom-out.active { animation: zoomOut 20s linear forwards; }
        .fx-pan-left.active { animation: panLeft 20s linear forwards; }
        .fx-pan-right.active { animation: panRight 20s linear forwards; }
        .fx-tilt-cw.active { animation: tiltCW 20s linear forwards; }
        .fx-tilt-ccw.active { animation: tiltCCW 20s linear forwards; }
        .fx-floating.active { animation: floating 20s ease-in-out infinite; }
        .fx-pulse.active { animation: pulse 20s ease-in-out infinite; }

        @keyframes zoomIn { 0% { transform: scale(1); } 100% { transform: scale(1.3); } }
        @keyframes zoomOut { 0% { transform: scale(1.3); } 100% { transform: scale(1); } }
        @keyframes panLeft { 0% { transform: scale(1.2) translateX(5%); } 100% { transform: scale(1.2) translateX(-5%); } }
        @keyframes panRight { 0% { transform: scale(1.2) translateX(-5%); } 100% { transform: scale(1.2) translateX(5%); } }
        @keyframes tiltCW { 0% { transform: scale(1.2) rotate(0deg); } 100% { transform: scale(1.2) rotate(3deg); } }
        @keyframes tiltCCW { 0% { transform: scale(1.2) rotate(0deg); } 100% { transform: scale(1.2) rotate(-3deg); } }
        @keyframes floating { 0% { transform: scale(1.1) translateY(0); } 50% { transform: scale(1.1) translateY(-2%); } 100% { transform: scale(1.1) translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1.05); } 50% { transform: scale(1.15); } 100% { transform: scale(1.05); } }

        .style-btn {
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.05);
            background: rgba(255,255,255,0.02);
            font-size: 10px;
            font-weight: 800;
            text-align: center;
        }

        .style-btn.selected {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.2);
        }

        .loader-ring {
            border: 3px solid #1e293b;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .progress-bar {
            height: 6px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #a855f7);
            width: 0%;
        }

        .subtitle-box {
            text-shadow: 0 4px 15px rgba(0,0,0,1);
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
        }

        .scene-card {
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .scene-card:hover {
            transform: translateY(-5px);
            border-color: rgba(59, 130, 246, 0.5);
        }

        #exportCanvas { display: none; }
        
        .mode-toggle {
            display: flex;
            background: rgba(0,0,0,0.3);
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
        }
        .mode-btn {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 800;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .mode-btn.active {
            background: #3b82f6;
            color: white;
        }
        
        /* Modal Styles */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-backdrop.open {
            opacity: 1;
            pointer-events: all;
        }
        .modal-content {
            transform: scale(0.95);
            transition: transform 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-backdrop.open .modal-content {
            transform: scale(1);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8 lg:p-12">

    <div class="max-w-7xl mx-auto">
        <header class="mb-10 flex flex-col md:flex-row justify-between items-center gap-6">
            <div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

                    <div>

                        <input type="file" id="audioInput" accept="audio/mp3,audio/mpeg,audio/wav,audio/ogg,audio/*" class="block w-full text-xs text-slate-400 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-[9px] file:font-bold file:bg-blue-600 file:text-white" />

1

Örnek (Görsel İçerik)"></textarea>

            <div class="lg:col-span-8 space-y-6">

                    <div class="subtitle-box absolute bottom-0 left-0 right-0 p-12 text-center pointer-events-none">

    <!-- Scene Editor Modal -->

                <!-- Controls Area -->

                    <div>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Prompt (Senaryo)</h3>
                        <textarea id="modalPrompt" rows="6" class="w-full bg-slate-950/50 border border-slate-800 rounded-xl p-3 text-xs text-slate-300 outline-none focus:border-blue-500 transition-colors custom-scroll"></textarea>
                        <!-- NEW BUTTON: Run with Current Prompt -->

                    <div class="grid grid-cols-2 gap-3 mt-auto">

                        <button id="modalUploadBtn" class="bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2">
                            <span>📁</span> Resim Yükle
                        </button>
                        <input type="file" id="modalFileInput" accept="image/*" class="hidden">
                    </div>
                    
                    <button id="modalRegenImageOnlyBtn" class="hidden w-full bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-xl text-xs font-bold transition-all items-center justify-center gap-2">
                        <span>🎨</span> Sadece Görüntüyü Yenile
                    </button>
                </div>
            </div>
        </div>
    </div>

    <canvas id="exportCanvas" width="1280" height="720"></canvas>
    <script src="gemini.js"></script>
    <script src="suno2video.js"></script>
    <script>
        //gemini.js'ten alınan API anahtarı:
        //const apiKey = ""; 

        // Missing Constant: Art Styles is in suno2video.js
        
        const VIDEO_FX = ["fx-zoom-in", "fx-zoom-out", "fx-pan-left", "fx-pan-right", "fx-tilt-cw", "fx-tilt-ccw", "fx-floating", "fx-pulse"];

        let scenes = [];
        let selectedStyle = ART_STYLES[0];
        let productionMode = "image"; 
        let audioDuration = 0;
        let isPlaying = false;
        let activeIdx = -1;
        let referenceImageBase64 = null;
        let currentModalSceneId = null;

        const el = {
            audio: document.getElementById('audioPlayer'),
            audioInput: document.getElementById('audioInput'),
            refInput: document.getElementById('refImageInput'),
            refPreview: document.getElementById('refPreview'),
            lyrics: document.getElementById('lyricsInput'),
            styles: document.getElementById('styleGrid'),
            mood: document.getElementById('moodInput'),
            grid: document.getElementById('scenesGrid'),
            play: document.getElementById('playBtn'),
            logs: document.getElementById('statusLogs'),
            time: document.getElementById('timeDisplay'),
            progress: document.getElementById('progressBar'),
            subtitle: document.getElementById('subtitleText'),
            layers: document.getElementById('imageLayer'),
            reset: document.getElementById('resetBtn'),
            generateAll: document.getElementById('generateAllBtn'),
            exportBtn: document.getElementById('exportBtn'),
            scCount: document.getElementById('scCount'),
            renderStatus: document.getElementById('renderStatus'),
            exportCanvas: document.getElementById('exportCanvas'),
            modeImage: document.getElementById('modeImage'),
            modeVideo: document.getElementById('modeVideo'),
            modeVideoAI: document.getElementById('modeVideoAI'),
            
            // Modal Elements
            modal: document.getElementById('sceneModal'),
            modalClose: document.getElementById('closeModal'),
            modalPreview: document.getElementById('modalPreviewBox'),
            modalPrompt: document.getElementById('modalPrompt'),
            modalRegenBtn: document.getElementById('modalRegenBtn'),
            modalRunPromptBtn: document.getElementById('modalRunPromptBtn'),
            modalUploadBtn: document.getElementById('modalUploadBtn'),
            modalFileInput: document.getElementById('modalFileInput'),
            modalDimensions: document.getElementById('modalDimensions'),
            modalRegenImageOnlyBtn: document.getElementById('modalRegenImageOnlyBtn')
        };

        function initStyles() {
            el.styles.innerHTML = '';
            ART_STYLES.forEach(s => {
                const b = document.createElement('div');
                b.className = `style-btn p-2 rounded-xl ${s.id === selectedStyle.id ? 'selected' : ''}`;
                b.innerText = s.name;
                b.onclick = () => {
                    document.querySelectorAll('.style-btn').forEach(x => x.classList.remove('selected'));
                    b.classList.add('selected');
                    selectedStyle = s;
                };
                el.styles.appendChild(b);
            });
        }

        function setMode(mode) {
            productionMode = mode;
            [el.modeImage, el.modeVideo, el.modeVideoAI].forEach(b => b.classList.remove('active'));
            if(mode === 'image') el.modeImage.classList.add('active');
            if(mode === 'video') el.modeVideo.classList.add('active');
            if(mode === 'videoAI') el.modeVideoAI.classList.add('active');
            log(`Mod seçildi: ${mode.toUpperCase()}`);
        }

        el.modeImage.onclick = () => setMode('image');
        el.modeVideo.onclick = () => setMode('video');
        el.modeVideoAI.onclick = () => setMode('videoAI');

        function log(msg, type = 'info') {
            document.getElementById('statusConsole').classList.remove('hidden');
            const d = document.createElement('div');
            d.innerHTML = `<span class="opacity-30 mr-2">${new Date().toLocaleTimeString()}</span> <span class="${type === 'err' ? 'text-red-400 font-bold' : 'text-blue-400'}">${msg}</span>`;
            el.logs.appendChild(d);
            el.logs.scrollTop = el.logs.scrollHeight;
        }

        async function apiCall(url, body, retries = 3) {
            const delays = [1000, 2000, 4000];
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(`${url}?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({ error: { message: `HTTP ${res.status}` } }));
                        throw new Error(err.error?.message || `HTTP ${res.status}`);
                    }
                    return await res.json();
                } catch (e) {
                    if (i === retries - 1) throw e;
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }
        }

        el.audioInput.onchange = (e) => {
            const f = e.target.files[0];
            if (!f) return;
            
            const checkAndSetDuration = () => {
                if (el.audio.duration && el.audio.duration !== Infinity && !isNaN(el.audio.duration) && el.audio.duration > 0) {
                    audioDuration = el.audio.duration;
                    el.time.innerText = `00:00 / ${fmt(audioDuration)}`;
                    log("Müzik Hazır: " + fmt(audioDuration));
                    return true;
                }
                return false;
            };

            el.audio.onloadedmetadata = checkAndSetDuration;
            el.audio.oncanplaythrough = checkAndSetDuration;
            el.audio.ondurationchange = checkAndSetDuration;

            const url = URL.createObjectURL(f);
            el.audio.src = url;
            el.audio.load();

            let attempts = 0;
            const pollDuration = setInterval(() => {
                attempts++;
                if (checkAndSetDuration() || attempts > 50) clearInterval(pollDuration);
            }, 100);
        };

        el.refInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                referenceImageBase64 = event.target.result.split(',')[1];
                el.refPreview.innerHTML = `<img src="${event.target.result}" class="w-full h-full object-cover rounded-lg">`;
            };
            reader.readAsDataURL(file);
        };

        function fmt(s) {
            if(!s || isNaN(s)) return "00:00";
            const m = Math.floor(s/60);
            const sec = Math.floor(s%60);
            return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }

        // --- UPDATED PARSING & PLANNING LOGIC ---
        document.getElementById('planBtn').onclick = async () => {
            let txt = el.lyrics.value.trim();
            const mood = el.mood.value.trim();

            if (el.audioInput.files.length === 0) return log("Lütfen bir ses dosyası (MP3/WAV) seçin!", "err");
            if (!txt) return log("Lütfen şarkı sözlerini ve zamanlamaları girin!", "err");
            
            if (!audioDuration || audioDuration === 0) {
                if (el.audio.duration && !isNaN(el.audio.duration) && el.audio.duration !== Infinity && el.audio.duration > 0) {
                     audioDuration = el.audio.duration;
                     el.time.innerText = `00:00 / ${fmt(audioDuration)}`;
                } else {
                    log("Bilgi: Ses süresi mobilde 'Oynat'a basınca güncellenecek. İşlem devam ediyor...", "info");
                    audioDuration = 200;
                }
            }

            log("Senaryo kurgulanıyor...");

            // 1. EXTRACT MASTER PROMPT {}
            let masterPrompt = "";
            const masterMatch = txt.match(/\{([\s\S]*?)\}/);
            if (masterMatch) {
                masterPrompt = masterMatch[1].trim();
                txt = txt.replace(masterMatch[0], "");
                log(`Master Prompt Algılandı: ${masterPrompt}`);
            }

            // 2. PARSE LINES (Hybrid: Custom + SRT)
            const parsed = [];
            const lines = txt.split('\n').map(l => l.trim());
            let i = 0;

            function parseSRTTime(timeStr) {
                // Format: 00:00:03,320
                const parts = timeStr.split(':');
                const secondsParts = parts[2].split(',');
                return parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseInt(secondsParts[0]) + parseInt(secondsParts[1]) / 1000;
            }

            while (i < lines.length) {
                const line = lines[i];

                // SKIP EMPTY LINES
                if (!line) { i++; continue; }

                // DETECT CUSTOM FORMAT: "Text[0-5]"
                const customMatch = line.match(/(.*?)\[(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)\]/);
                if (customMatch && !line.includes('-->')) {
                    const rawText = customMatch[1].trim();
                    const start = parseFloat(customMatch[2]);
                    const end = parseFloat(customMatch[3]);
                    
                    let caption = rawText;
                    let visualContext = "";
                    let showSubtitle = true;

                    const visualMatch = rawText.match(/\((.*?)\)/);
                    if (visualMatch) {
                        visualContext = visualMatch[1].trim();
                        caption = rawText.replace(visualMatch[0], "").trim();
                    } else {
                        visualContext = caption;
                    }

                    if (rawText.startsWith('(') && rawText.endsWith(')')) {
                        showSubtitle = false;
                        caption = "";
                    }

                    parsed.push({
                        id: parsed.length,
                        caption: caption,
                        visualContext: visualContext,
                        start: start,
                        end: end,
                        showSubtitle: showSubtitle && caption.length > 0
                    });
                    i++;
                    continue;
                }

                // DETECT SRT TIMELINE: "00:00:03,320 --> 00:00:05,400"
                const srtMatch = line.match(/(\d{2}:\d{2}:\d{2},\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2},\d{3})/);
                if (srtMatch) {
                    const start = parseSRTTime(srtMatch[1]);
                    let end = parseSRTTime(srtMatch[2]);
                    
                    let textLines = [];
                    i++; 
                    
                    while (i < lines.length) {
                        const nextLine = lines[i];
                        if (nextLine === "") { break; }
                        if (/^\d+$/.test(nextLine) && (i + 1 < lines.length && lines[i+1].includes('-->'))) { break; }
                        if (nextLine.includes('-->')) { break; }
                        if (/\[\d+(?:\.\d+)?\s*-\s*\d+(?:\.\d+)?\]/.test(nextLine)) { break; }
                        
                        textLines.push(nextLine);
                        i++;
                    }

                    const rawText = textLines.join(' ').trim();
                    let caption = rawText;
                    let visualContext = "";
                    let showSubtitle = true;

                    const visualMatch = rawText.match(/\((.*?)\)/);
                    if (visualMatch) {
                        visualContext = visualMatch[1].trim();
                        caption = rawText.replace(visualMatch[0], "").trim();
                    } else {
                        visualContext = rawText || "Cinematic scene"; 
                    }
                    
                    if (rawText.startsWith('(') && rawText.endsWith(')')) {
                        showSubtitle = false;
                        caption = "";
                    }
                    
                    if (!rawText) showSubtitle = false;

                    parsed.push({
                        id: parsed.length,
                        caption: caption,
                        visualContext: visualContext,
                        start: start,
                        end: end,
                        showSubtitle: showSubtitle && caption.length > 0
                    });
                    continue; 
                }

                if (/^\d+$/.test(line)) {
                    i++;
                    continue;
                }

                i++;
            }

            // 3. AUTO-EXTEND DURATION (GAP FILLING)
            parsed.sort((a, b) => a.start - b.start);

            for (let k = 0; k < parsed.length - 1; k++) {
                const current = parsed[k];
                const next = parsed[k+1];
                
                // If current ends before next starts, extend it to close the gap
                if (current.end < next.start) {
                    log(`Sahne ${k+1} süresi uzatıldı: ${fmt(current.end)} -> ${fmt(next.start)} (Gap Filling)`, 'info');
                    current.end = next.start;
                }
            }

            try {
                // Modified System Prompt to include Master Prompt logic
                const systemPrompt = `Sen bir klip yönetmenisin. Her satır için 5-6 CÜMLELİK edebi bir PARAGRAF PROMPT oluştur.
KURALLAR:
1. GENİŞ AÇI: ASLA yakın çekim yapma. Hep "Extreme wide angle panorama" kurgula.
2. SEMBOLİZM: Aşağıda verilen "Visual Instruction" kısmını devasa manzaralara dök.
3. STİL: "${selectedStyle.name}" stilini işle.
4. MOOD: "${mood || 'Epic'}" ruh halini ekle.
${masterPrompt ? `5. GLOBAL KURAL (MASTER PROMPT): "${masterPrompt}". Bu kuralı ve temayı HER sahneye mutlaka uygula.` : ''}

ÇIKTI: JSON objesi döndür. Key: index, Value: 5-6 cümlelik İngilizce prompt.`;

                // Prepare input for Gemini: ID + Visual Instruction
                const inputList = parsed.map(p => `ID ${p.id}: Visual Instruction: "${p.visualContext}"`).join(' | ');

                const data = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', {
                    contents: [{ parts: [{ text: "Senaryoyu oluştur." }] }],
                    systemInstruction: { parts: [{ text: systemPrompt + "\nDATA:\n" + inputList }] },
                    generationConfig: { responseMimeType: "application/json" }
                });

                const jsonStr = data.candidates[0].content.parts[0].text;
                const result = JSON.parse(jsonStr);

                // Merge AI prompts with parsed data
                scenes = parsed.map(p => ({
                    ...p,
                    prompt: result[p.id] || result[String(p.id)] || `${selectedStyle.prompt}, ${p.visualContext}, ${mood}`,
                    image: null
                }));

                log(`Senaryo hazır: ${scenes.length} sahne.`);
                renderSceneGrid();

            } catch (err) {
                log("Senaryo hatası: " + err.message, "err");
            }
        };

        function renderSceneGrid() {
            el.grid.innerHTML = '';
            el.scCount.innerText = scenes.length;
            el.generateAll.classList.remove('hidden');
            
            scenes.forEach((scene, idx) => {
                const card = document.createElement('div');
                card.className = 'scene-card glass rounded-2xl overflow-hidden relative group';
                
                // Content
                let mediaHtml = scene.image 
                    ? `<img src="${scene.image}" class="w-full h-32 object-cover">`
                    : `<div class="w-full h-32 bg-slate-900 flex items-center justify-center text-slate-600 text-[10px] font-black uppercase tracking-widest">Sahne ${idx+1}</div>`;

                card.innerHTML = `
                    ${mediaHtml}
                    <div class="p-3">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[9px] font-black text-blue-400">#${idx+1}</span>
                            <span class="text-[9px] font-mono text-slate-500">${fmt(scene.start)} - ${fmt(scene.end)}</span>
                        </div>
                        <p class="text-[10px] text-slate-300 line-clamp-2 leading-relaxed">${scene.caption || '(Sadece Görsel)'}</p>
                    </div>
                `;

                card.onclick = () => openModal(idx);
                el.grid.appendChild(card);
            });
        }

        async function openModal(idx) {
            currentModalSceneId = idx;
            const scene = scenes[idx];
            el.modal.classList.add('open');
            el.modalPrompt.value = scene.prompt;
            
            // Set dimensions
            const w = 1280, h = 720; // 16:9 standard
            el.modalDimensions.innerText = `16:9 • ${w}x${h}px • ${selectedStyle.name}`;
            
            // Show current image if exists
            if (scene.image) {
                if (scene.image.startsWith('data:video')) {
                     el.modalPreview.innerHTML = `<video src="${scene.image}" autoplay loop muted playsinline class="w-full h-full object-cover"></video>`;
                } else {
                     el.modalPreview.innerHTML = `<img src="${scene.image}" class="w-full h-full object-cover">`;
                }
                el.modalRegenImageOnlyBtn.classList.remove('hidden');
            } else {
                el.modalPreview.innerHTML = `<div class="text-slate-600 text-xs">Görsel Yok</div>`;
                el.modalRegenImageOnlyBtn.classList.add('hidden');
            }

            // Button handlers
            el.modalRunPromptBtn.onclick = () => generateSceneImage(idx, el.modalPrompt.value);
            el.modalRegenBtn.onclick = async () => {
                // Re-dream prompt with AI
                el.modalPreview.innerHTML = `<div class="loader-ring"></div>`;
                try {
                     const promptRes = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', {
                        contents: [{ parts: [{ text: `Rewrite this image prompt to be more creative and detailed for a music video scene: "${scene.visualContext}"` }] }]
                    });
                    const newPrompt = promptRes.candidates[0].content.parts[0].text;
                    el.modalPrompt.value = newPrompt;
                    await generateSceneImage(idx, newPrompt);
                } catch(e) {
                    log("Prompt yenileme hatası", "err");
                }
            };
            
            el.modalUploadBtn.onclick = () => el.modalFileInput.click();
            el.modalFileInput.onchange = (e) => {
                 const f = e.target.files[0];
                 if(f) {
                     const reader = new FileReader();
                     reader.onload = (ev) => {
                         scenes[idx].image = ev.target.result;
                         renderSceneGrid();
                         openModal(idx);
                     };
                     reader.readAsDataURL(f);
                 }
            };

            el.modalRegenImageOnlyBtn.onclick = () => generateSceneImage(idx, el.modalPrompt.value, true);
        }

        el.modalClose.onclick = () => el.modal.classList.remove('open');

        el.generateAll.onclick = async () => {
            el.generateAll.innerText = "Üretiliyor...";
            el.generateAll.disabled = true;
            for (let i = 0; i < scenes.length; i++) {
                if (!scenes[i].image) {
                    await generateSceneImage(i, scenes[i].prompt);
                }
            }
            el.generateAll.innerText = "Tümünü Yenile";
            el.generateAll.disabled = false;
            el.exportBtn.classList.remove('hidden');
            log("Tüm sahneler hazır! Oynatabilirsin.", "success");
            el.play.disabled = false;
            el.play.click();
        };

        async function generateSceneImage(idx, promptText, isImageToImage = false) {
            const box = document.getElementById('modalPreviewBox');
            if(currentModalSceneId === idx) box.innerHTML = `<div class="loader-ring"></div>`;
            log(`Sahne ${idx+1} üretiliyor...`);

            try {
                let imageUrl;
                
                if (productionMode === 'videoAI') {
                    // Video Generation (Simulated with advanced zooming for now as real video gen is heavy)
                    // In a real app, this would call a video generation endpoint
                    // For this demo, we generate a high-quality image and apply aggressive motion
                    const res = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict', {
                        instances: [{ prompt: promptText + ", 8k resolution, cinematic lighting, photorealistic" }],
                        parameters: { sampleCount: 1, aspectRatio: "16:9" }
                    });
                     imageUrl = `data:image/jpeg;base64,${res.predictions[0].bytesBase64Encoded}`;
                } else if (productionMode === 'video' || productionMode === 'image') {
                    // Standard Image Gen
                    const res = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict', {
                        instances: [{ prompt: promptText + " " + selectedStyle.prompt }],
                        parameters: { sampleCount: 1, aspectRatio: "16:9" }
                    });
                    imageUrl = `data:image/jpeg;base64,${res.predictions[0].bytesBase64Encoded}`;
                }

                scenes[idx].image = imageUrl;
                scenes[idx].prompt = promptText;
                
                // Assign random FX if not set
                if (!scenes[idx].fx) scenes[idx].fx = VIDEO_FX[Math.floor(Math.random() * VIDEO_FX.length)];

                renderSceneGrid();
                if(currentModalSceneId === idx) openModal(idx);
                log(`Sahne ${idx+1} tamamlandı.`, "success");

            } catch (err) {
                log(`Hata (Sahne ${idx+1}): ${err.message}`, "err");
                if(currentModalSceneId === idx) box.innerHTML = `<span class="text-red-500 text-xs">Hata</span>`;
            }
        }

        // --- PLAYER LOGIC ---
        el.play.onclick = () => {
            if (isPlaying) {
                el.audio.pause();
                isPlaying = false;
                el.play.innerHTML = `<svg class="w-5 h-5 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
            } else {
                el.audio.play();
                isPlaying = true;
                el.play.innerHTML = `<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
                renderLoop();
            }
        };

        function renderLoop() {
            if (!isPlaying) return;
            const now = el.audio.currentTime;
            el.time.innerText = `${fmt(now)} / ${fmt(audioDuration)}`;
            el.progress.style.width = `${(now / audioDuration) * 100}%`;

            const currentScene = scenes.find(s => now >= s.start && now < s.end);
            
            if (currentScene) {
                // Background Layer (Image)
                if (activeIdx !== currentScene.id) {
                    activeIdx = currentScene.id;
                    
                    // Clear previous
                    el.layers.innerHTML = '';
                    
                    // Create new Slide
                    const slide = document.createElement('img');
                    slide.src = currentScene.image;
                    slide.className = `slide-item active ${currentScene.fx}`;
                    el.layers.appendChild(slide);
                    
                    // Caption
                    if (currentScene.showSubtitle) {
                        el.subtitle.innerText = currentScene.caption;
                        el.subtitle.style.opacity = 1;
                    } else {
                        el.subtitle.style.opacity = 0;
                    }
                }
            } else {
                // No scene matched (gap?) - Should not happen with gap filling logic
                // But if it does, keep last frame or show black
            }

            if (!el.audio.paused && !el.audio.ended) {
                requestAnimationFrame(renderLoop);
            } else {
                isPlaying = false;
                el.play.innerHTML = `<svg class="w-5 h-5 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
            }
        }

        // --- EXPORT LOGIC (Client-Side Recording) ---
        el.exportBtn.onclick = async () => {
            el.renderStatus.innerText = "Render Başlıyor...";
            el.exportCanvas.style.display = 'block';
            el.audio.pause();
            el.audio.currentTime = 0;
            
            const ctx = el.exportCanvas.getContext('2d');
            const stream = el.exportCanvas.captureStream(30);
            
            // Add Audio Track to Stream
            const audioContext = new AudioContext();
            const source = audioContext.createMediaElementSource(el.audio);
            const dest = audioContext.createMediaStreamDestination();
            source.connect(dest);
            source.connect(audioContext.destination);
            
            const tracks = [...stream.getVideoTracks(), ...dest.stream.getAudioTracks()];
            const combinedStream = new MediaStream(tracks);
            
            const recorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm; codecs=vp9' });
            const chunks = [];
            
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `music_video_${Date.now()}.webm`;
                a.click();
                el.renderStatus.innerText = "Tamamlandı!";
                el.exportCanvas.style.display = 'none';
                log("Video indirildi.", "success");
            };
            
            recorder.start();
            el.audio.play();

            // Function to load image for canvas
            const loadImage = (src) => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });

            const loop = async () => {
                const now = el.audio.currentTime;
                // Draw logic for canvas similar to DOM
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, 1280, 720);

                const scene = scenes.find(s => now >= s.start && now < s.end);
                if (scene && scene.image) {
                    // We need to simulate the CSS animation in Canvas (Simplified: Zoom In)
                    // For full fidelity, we'd need complex math. Here we just draw the image.
                    const img = await loadImage(scene.image);
                    
                    // Simple Zoom Effect calculation based on time in scene
                    const duration = scene.end - scene.start;
                    const elapsed = now - scene.start;
                    const progress = elapsed / duration;
                    const scale = 1 + (progress * 0.1); // 10% zoom
                    
                    const w = 1280 * scale;
                    const h = 720 * scale;
                    const x = (1280 - w) / 2;
                    const y = (720 - h) / 2;
                    
                    ctx.drawImage(img, x, y, w, h);
                    
                    // Subtitles
                    if (scene.showSubtitle) {
                        ctx.fillStyle = 'rgba(0,0,0,0.5)';
                        ctx.fillRect(0, 600, 1280, 120);
                        ctx.fillStyle = 'white';
                        ctx.font = 'bold 40px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText(scene.caption, 640, 670);
                    }
                }
                
                if (!el.audio.paused && !el.audio.ended) requestAnimationFrame(loop);
                else recorder.stop();
            };
            loop();
        };

        el.reset.onclick = () => { location.reload(); };

        // Ensure initStyles runs after load
        window.addEventListener('load', () => {
            initStyles();
            log("Sistem hazır.", "success");
        });
    </script>
</body>
</html>
