<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dosya İçinde Kelime Arama</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            padding: 30px;
        }

        .section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .section-title {
            font-size: 1.4em;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 2px;
        }

        .file-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.clear {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
        }

        .btn.search {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            font-size: 1.1em;
            padding: 15px 30px;
        }

        .file-list {
            background: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 10px;
            padding: 20px;
            min-height: 120px;
            max-height: 200px;
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        .file-list.has-files {
            border-color: #4facfe;
            background: rgba(79, 172, 254, 0.05);
        }

        .file-item {
            background: white;
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 8px;
            border-left: 4px solid #4facfe;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            word-break: break-all;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: white;
        }

        .form-control:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .checkbox-group:hover {
            background: #e9ecef;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            cursor: pointer;
            margin: 0;
            font-weight: normal;
        }

        .results-container {
            background: #1a1a1a;
            color: #00ff00;
            border-radius: 10px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.4;
        }

        .results-container::-webkit-scrollbar {
            width: 8px;
        }

        .results-container::-webkit-scrollbar-track {
            background: #2a2a2a;
            border-radius: 4px;
        }

        .results-container::-webkit-scrollbar-thumb {
            background: #4facfe;
            border-radius: 4px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            overflow: hidden;
            margin: 15px 0;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            display: block;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .empty-state {
            text-align: center;
            color: #6c757d;
            font-style: italic;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }

            .main-content {
                padding: 20px;
            }

            .file-buttons {
                grid-template-columns: 1fr;
            }

            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4facfe;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📁 Dosya İçinde Kelime Arama</h1>
            <p>Dosyalarınızda hızlı ve gelişmiş arama yapın</p>
        </div>

        <div class="main-content">
            <!-- Dosya Seçimi -->
            <div class="section">
                <div class="section-title">📂 Dosya/Klasör Seçimi</div>
                
                <div class="file-buttons">
                    <button class="btn" onclick="selectFiles(false)">📄 Tekli Dosya Seç</button>
                    <button class="btn" onclick="selectFiles(true)">📄 Çoklu Dosya Seç</button>
                    <button class="btn" onclick="selectFolder()">📁 Klasör Seç</button>
                    <button class="btn clear" onclick="clearSelection()">🗑️ Temizle</button>
                </div>

                <input type="file" id="fileInput" style="display: none;" />
                <input type="file" id="folderInput" style="display: none;" webkitdirectory />

                <div class="file-list" id="fileList">
                    <div class="empty-state">Henüz dosya veya klasör seçilmedi</div>
                </div>
            </div>

            <!-- Arama Kriterleri -->
            <div class="section">
                <div class="section-title">🔍 Arama Kriterleri</div>
                
                <div class="form-group">
                    <label for="searchTerm">Aranacak Kelime:</label>
                    <input type="text" id="searchTerm" class="form-control" placeholder="Aranacak kelime veya ifadeyi girin...">
                </div>

                <div class="options-grid">
                    <div class="checkbox-group">
                        <input type="checkbox" id="caseSensitive">
                        <label for="caseSensitive">🔤 Büyük/küçük harf duyarlı</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="wholeWord">
                        <label for="wholeWord">🎯 Tam kelime eşleşmesi</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="useRegex">
                        <label for="useRegex">⚙️ Regex kullan</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="extensions">Dosya Uzantıları (virgülle ayırın):</label>
                    <input type="text" id="extensions" class="form-control" value=".txt,.js,.html,.css,.py,.md,.json,.xml" placeholder=".txt,.py,.html,.css">
                </div>

                <button class="btn search" onclick="searchFiles()">🔍 Araştır</button>
            </div>

            <!-- Sonuçlar -->
            <div class="section">
                <div class="section-title">📊 Arama Sonuçları</div>
                
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <div>Dosyalar taranıyor...</div>
                </div>

                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>

                <div class="results-container" id="results">
                    Arama sonuçları burada görüntülenecek...
                </div>

                <div class="stats" id="stats" style="display: none;">
                    <div class="stat-card">
                        <span class="stat-value" id="totalFiles">0</span>
                        <span class="stat-label">Taranan Dosya</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="matchedFiles">0</span>
                        <span class="stat-label">Eşleşen Dosya</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="totalMatches">0</span>
                        <span class="stat-label">Toplam Eşleşme</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="searchTime">0</span>
                        <span class="stat-label">Süre (ms)</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedFiles = [];
        let searchResults = [];

        function selectFiles(multiple) {
            const fileInput = document.getElementById('fileInput');
            fileInput.multiple = multiple;
            fileInput.webkitdirectory = false;
            fileInput.onchange = handleFileSelection;
            fileInput.click();
        }

        function selectFolder() {
            const folderInput = document.getElementById('folderInput');
            folderInput.onchange = handleFileSelection;
            folderInput.click();
        }

        function handleFileSelection(event) {
            const files = Array.from(event.target.files);
            selectedFiles = files;
            updateFileList();
        }

        function clearSelection() {
            selectedFiles = [];
            updateFileList();
            clearResults();
        }

        function updateFileList() {
            const fileList = document.getElementById('fileList');
            
            if (selectedFiles.length === 0) {
                fileList.innerHTML = '<div class="empty-state">Henüz dosya veya klasör seçilmedi</div>';
                fileList.classList.remove('has-files');
            } else {
                fileList.classList.add('has-files');
                fileList.innerHTML = selectedFiles.map(file => 
                    `<div class="file-item">${file.webkitRelativePath || file.name}</div>`
                ).join('');
            }
        }

        function getFilteredFiles() {
            const extensions = document.getElementById('extensions').value
                .split(',')
                .map(ext => ext.trim().toLowerCase())
                .filter(ext => ext.length > 0);

            if (extensions.length === 0) {
                return selectedFiles;
            }

            return selectedFiles.filter(file => {
                const fileName = (file.webkitRelativePath || file.name).toLowerCase();
                return extensions.some(ext => fileName.endsWith(ext));
            });
        }

        async function searchInFile(file, searchTerm) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        let content = e.target.result;
                        const caseSensitive = document.getElementById('caseSensitive').checked;
                        const wholeWord = document.getElementById('wholeWord').checked;
                        const useRegex = document.getElementById('useRegex').checked;

                        let found = false;
                        let count = 0;

                        if (useRegex) {
                            try {
                                const flags = caseSensitive ? 'g' : 'gi';
                                const regex = new RegExp(searchTerm, flags);
                                const matches = content.match(regex);
                                found = matches !== null;
                                count = matches ? matches.length : 0;
                            } catch (e) {
                                resolve({ found: false, count: 0, error: 'Geçersiz regex ifadesi' });
                                return;
                            }
                        } else {
                            if (!caseSensitive) {
                                content = content.toLowerCase();
                                searchTerm = searchTerm.toLowerCase();
                            }

                            if (wholeWord) {
                                const regex = new RegExp(`\\b${escapeRegex(searchTerm)}\\b`, caseSensitive ? 'g' : 'gi');
                                const matches = content.match(regex);
                                found = matches !== null;
                                count = matches ? matches.length : 0;
                            } else {
                                const regex = new RegExp(escapeRegex(searchTerm), caseSensitive ? 'g' : 'gi');
                                const matches = content.match(regex);
                                found = matches !== null;
                                count = matches ? matches.length : 0;
                            }
                        }

                        resolve({ found, count });
                    } catch (error) {
                        resolve({ found: false, count: 0, error: error.message });
                    }
                };
                reader.onerror = function() {
                    resolve({ found: false, count: 0, error: 'Dosya okunamadı' });
                };
                reader.readAsText(file);
            });
        }

        function escapeRegex(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        async function searchFiles() {
            const searchTerm = document.getElementById('searchTerm').value.trim();
            
            if (!searchTerm) {
                alert('Lütfen aranacak kelimeyi girin!');
                return;
            }

            if (selectedFiles.length === 0) {
                alert('Lütfen dosya veya klasör seçin!');
                return;
            }

            const filesToSearch = getFilteredFiles();
            
            if (filesToSearch.length === 0) {
                alert('Belirtilen kriterlere uygun dosya bulunamadı!');
                return;
            }

            showLoading(true);
            clearResults();
            
            const startTime = Date.now();
            const results = document.getElementById('results');
            searchResults = [];
            let totalMatches = 0;

            results.textContent = `Toplam ${filesToSearch.length} dosyada arama yapılıyor...\n\n`;

            for (let i = 0; i < filesToSearch.length; i++) {
                const file = filesToSearch[i];
                const fileName = file.webkitRelativePath || file.name;
                
                updateProgress((i / filesToSearch.length) * 100);
                
                const result = await searchInFile(file, searchTerm);
                
                if (result.found) {
                    searchResults.push({
                        fileName: fileName,
                        matches: result.count
                    });
                    
                    totalMatches += result.count;
                    results.textContent += `✓ ${fileName}`;
                    if (result.count > 0) {
                        results.textContent += ` (${result.count} eşleşme)`;
                    }
                    results.textContent += '\n';
                } else if (result.error) {
                    results.textContent += `✗ ${fileName} - Hata: ${result.error}\n`;
                }

                // Her 10 dosyada bir scroll'u güncelle
                if (i % 10 === 0) {
                    results.scrollTop = results.scrollHeight;
                    await new Promise(resolve => setTimeout(resolve, 1));
                }
            }

            updateProgress(100);
            
            const endTime = Date.now();
            const searchTime = endTime - startTime;

            // Özet bilgiler
            const summary = `\n${'='.repeat(50)}\nÖZET:\nAranan kelime: '${searchTerm}'\nTaranan dosya sayısı: ${filesToSearch.length}\nEşleşen dosya sayısı: ${searchResults.length}\nToplam eşleşme sayısı: ${totalMatches}\nArama süresi: ${searchTime} ms\n`;
            results.textContent += summary;
            results.scrollTop = results.scrollHeight;

            // İstatistikleri güncelle
            updateStats(filesToSearch.length, searchResults.length, totalMatches, searchTime);
            
            showLoading(false);
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('progressBar').style.display = show ? 'block' : 'none';
        }

        function updateProgress(percentage) {
            document.getElementById('progressFill').style.width = percentage + '%';
        }

        function updateStats(total, matched, totalMatches, time) {
            document.getElementById('totalFiles').textContent = total;
            document.getElementById('matchedFiles').textContent = matched;
            document.getElementById('totalMatches').textContent = totalMatches;
            document.getElementById('searchTime').textContent = time;
            document.getElementById('stats').style.display = 'grid';
        }

        function clearResults() {
            document.getElementById('results').textContent = 'Arama sonuçları burada görüntülenecek...';
            document.getElementById('stats').style.display = 'none';
            updateProgress(0);
        }

        // Enter tuşu ile arama yapma
        document.getElementById('searchTerm').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchFiles();
            }
        });

        // Drag & Drop desteği
        const fileList = document.getElementById('fileList');
        
        fileList.addEventListener('dragover', function(e) {
            e.preventDefault();
            fileList.style.background = 'rgba(79, 172, 254, 0.1)';
            fileList.style.borderColor = '#4facfe';
        });

        fileList.addEventListener('dragleave', function(e) {
            e.preventDefault();
            if (selectedFiles.length === 0) {
                fileList.style.background = '#f8f9fa';
                fileList.style.borderColor = '#dee2e6';
            }
        });

        fileList.addEventListener('drop', function(e) {
            e.preventDefault();
            const files = Array.from(e.dataTransfer.files);
            selectedFiles = files;
            updateFileList();
        });
    </script>
</body>
</html>
