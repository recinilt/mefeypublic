<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobil Uyumlu Profesyonel Okuyucu</title>
    <style>
        :root {
            --bg-color: #11111b;
            --container-bg: #1e1e2e;
            --text-color: #cdd6f4;
            --accent-color: #89b4fa;
            --highlight-bg: rgba(137, 180, 250, 0.4);
            --highlight-color: #fff;
            --btn-bg: #313244;
            --stop-color: #f38ba8;
            --download-color: #a6e3a1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--container-bg);
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        h1 {
            margin: 0;
            color: var(--accent-color);
            font-size: 1.5rem;
            text-align: center;
        }

        .text-wrapper {
            position: relative;
            width: 100%;
            height: 300px;
        }

        textarea {
            width: 100%;
            height: 100%;
            background-color: #181825;
            color: #fff;
            border: 2px solid #313244;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.2rem;
            line-height: 1.6;
            resize: none;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        textarea:focus { border-color: var(--accent-color); }

        #read-display {
            display: none;
            width: 100%;
            height: 100%;
            background-color: #181825;
            color: #a6adc8;
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.2rem;
            line-height: 1.6;
            box-sizing: border-box;
            overflow-y: auto;
            white-space: pre-wrap;
            scroll-behavior: smooth;
        }

        .highlight {
            background-color: var(--highlight-bg);
            color: var(--highlight-color);
            border-radius: 4px;
            padding: 2px 0;
            font-weight: bold;
        }

        .sentence-active {
            color: #fff;
        }

        .controls-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .voice-section { width: 100%; }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: var(--btn-bg);
            color: white;
            border: 1px solid transparent;
            font-size: 1rem;
            appearance: none;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .speed-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--btn-bg);
            padding: 5px;
            border-radius: 12px;
        }

        button {
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            touch-action: manipulation;
        }

        button:active { transform: scale(0.96); }
        button:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
        }

        .btn-play { background-color: var(--accent-color); color: #11111b; }
        .btn-stop { background-color: var(--stop-color); color: #11111b; }
        .btn-download { 
            background-color: var(--download-color); 
            color: #11111b;
            grid-column: 1 / -1;
        }
        
        .btn-speed {
            background-color: transparent;
            color: var(--accent-color);
            font-size: 1.5rem;
            width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .current-speed-label {
            font-family: monospace;
            font-size: 1.1rem;
            color: #fff;
        }

        .speed-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: var(--accent-color);
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 2rem;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            transition: opacity 0.3s;
            backdrop-filter: blur(5px);
        }

        .progress-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: var(--accent-color);
            padding: 30px 50px;
            border-radius: 15px;
            font-size: 1.2rem;
            opacity: 0;
            pointer-events: none;
            z-index: 1001;
            transition: opacity 0.3s;
            backdrop-filter: blur(10px);
            text-align: center;
            min-width: 300px;
        }

        .progress-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #313244;
            border-radius: 5px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.3s;
        }

        .info {
            text-align: center;
            font-size: 0.8rem;
            color: #6c7086;
            margin-top: 5px;
        }
        
        .status-msg {
            font-size: 0.75rem;
            color: #a6adc8;
            margin-top: 2px;
            display: block;
            min-height: 1.2em;
        }

        @media (min-width: 600px) {
            .controls-wrapper {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
            }
            .voice-section { flex: 100%; }
            .action-buttons { flex: 1; }
            .speed-controls { flex: 0 0 160px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Uzun Metin Okuyucu</h1>
        
        <div class="text-wrapper">
            <textarea id="text-input" placeholder="Metnini buraya yapıştır...">Merhaba! Ben okurken ekranın kapanmasını engelleyen yeni sürümüm. Okuma başladığında telefonun uyku moduna geçmez, böylece kesintisiz dinleyebilirsin. Artık metni ses dosyası olarak da indirebilirsin!</textarea>
            <div id="read-display"></div>
        </div>
        
        <div class="controls-wrapper">
            <div class="voice-section">
                <select id="voice-select">
                    <option value="">Sesler yükleniyor...</option>
                </select>
                <span id="wake-status" class="status-msg"></span>
            </div>

            <div class="action-buttons">
                <button id="play-btn" class="btn-play">▶ Oku</button>
                <button id="stop-btn" class="btn-stop">⏹ Dur</button>
                <button id="download-btn" class="btn-download">🎙️ Ses Dosyası Kaydet</button>
            </div>

            <div class="speed-controls">
                <button id="slow-down" class="btn-speed">−</button>
                <span class="current-speed-label" id="speed-display">1.0x</span>
                <button id="speed-up" class="btn-speed">+</button>
            </div>
        </div>

        <p class="info">Boşluk: Oynat/Duraklat | ↑↓: Hız Ayarla</p>
    </div>

    <div id="speed-overlay" class="speed-overlay">1.0x</div>
    <div id="progress-overlay" class="progress-overlay">
        <div id="progress-title">Ses kaydı başlatılıyor...</div>
        <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div id="progress-text" style="margin-top: 10px; font-size: 0.9rem;">0%</div>
        <div style="margin-top: 15px; font-size: 0.85rem; color: #a6adc8;">
            Ses kayıt sırasında lütfen başka sekmeye geçmeyin
        </div>
    </div>

    <script>
        const textInput = document.getElementById('text-input');
        const readDisplay = document.getElementById('read-display');
        const voiceSelect = document.getElementById('voice-select');
        const playBtn = document.getElementById('play-btn');
        const stopBtn = document.getElementById('stop-btn');
        const downloadBtn = document.getElementById('download-btn');
        const speedUpBtn = document.getElementById('speed-up');
        const slowDownBtn = document.getElementById('slow-down');
        const speedDisplayStatic = document.getElementById('speed-display');
        const speedOverlay = document.getElementById('speed-overlay');
        const progressOverlay = document.getElementById('progress-overlay');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const progressTitle = document.getElementById('progress-title');

        const synth = window.speechSynthesis;
        let voices = [];
        let textChunks = [];
        let currentChunkIndex = 0;
        let isSpeaking = false;
        let isPaused = false;
        let isManualStop = false;

        let currentRate = parseFloat(localStorage.getItem('tts_speed') || '1.0');
        speedDisplayStatic.textContent = currentRate.toFixed(1) + "x";

        // Kayıt değişkenleri
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        // -------------------------------------
        // EKRAN KİLİDİ (WAKE LOCK)
        // -------------------------------------
        let wakeLock = null;
        const wakeStatus = document.getElementById('wake-status');

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeStatus.textContent = '🔓 Ekran kilidi aktif';
                    wakeLock.addEventListener('release', () => {
                        wakeStatus.textContent = '';
                    });
                } catch (err) {
                    wakeStatus.textContent = '⚠️ Ekran kilidi kullanılamıyor';
                    console.error('Wake Lock hatası:', err);
                }
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
                wakeStatus.textContent = '';
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });
        // -------------------------------------

        function populateVoices() {
            voices = synth.getVoices();
            if(voices.length === 0) return;
            voiceSelect.innerHTML = '';

            voices.sort((a, b) => {
                const aName = a.name.toLowerCase();
                const bName = b.name.toLowerCase();
                const aLang = a.lang.toLowerCase();
                const bLang = b.lang.toLowerCase();
                
                const aIsGoogleTr = aName.includes('google') && aLang.includes('tr');
                const bIsGoogleTr = bName.includes('google') && bLang.includes('tr');
                
                if (aIsGoogleTr && !bIsGoogleTr) return -1;
                if (!aIsGoogleTr && bIsGoogleTr) return 1;
                if (aLang.includes('tr') && !bLang.includes('tr')) return -1;
                if (!aLang.includes('tr') && bLang.includes('tr')) return 1;
                return 0;
            });

            voices.forEach((voice) => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`; 
                option.setAttribute('data-name', voice.name);
                option.setAttribute('data-lang', voice.lang);
                voiceSelect.appendChild(option);
            });
        }
        populateVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }

        function processText(text) {
            const rawChunks = text.match(/[^.!?\n]+[.!?\n]+|[^.!?\n]+$/g);
            textChunks = [];
            readDisplay.innerHTML = '';
            
            if (!rawChunks) return;

            let globalCharIndex = 0;
            rawChunks.forEach((chunkText, index) => {
                const cleanText = chunkText.trim();
                if(cleanText.length === 0) return;

                textChunks.push({
                    text: cleanText,
                    start: globalCharIndex,
                    originalIndex: index
                });

                const sentenceSpan = document.createElement('div');
                sentenceSpan.className = 'sentence-block';
                sentenceSpan.style.display = 'inline';
                sentenceSpan.id = `chunk-${index}`;
                
                const words = chunkText.split(/(\s+)/);
                words.forEach(word => {
                    const wordSpan = document.createElement('span');
                    wordSpan.textContent = word;
                    if(word.trim().length > 0) {
                        wordSpan.className = 'word';
                    }
                    sentenceSpan.appendChild(wordSpan);
                });

                readDisplay.appendChild(sentenceSpan);
                globalCharIndex += chunkText.length;
            });
            
            textInput.style.display = 'none';
            readDisplay.style.display = 'block';
        }

        function highlightChunk(index) {
            document.querySelectorAll('.sentence-active').forEach(el => el.classList.remove('sentence-active'));
            document.querySelectorAll('.highlight').forEach(el => el.classList.remove('highlight'));

            const sentenceEl = document.getElementById(`chunk-${index}`);
            if (sentenceEl) {
                sentenceEl.classList.add('sentence-active');
                sentenceEl.scrollIntoView({ behavior: "smooth", block: "center" });
                sentenceEl.querySelectorAll('.word').forEach(w => w.classList.add('highlight'));
            }
        }

        function resetView() {
            textInput.style.display = 'block';
            readDisplay.style.display = 'none';
            playBtn.textContent = "▶ Oku";
            currentChunkIndex = 0;
            isSpeaking = false;
            isPaused = false;
            releaseWakeLock();
        }

        function playCurrentChunk() {
            if (currentChunkIndex >= textChunks.length) {
                if (isRecording) {
                    stopRecording();
                }
                resetView();
                return;
            }

            synth.cancel();

            const chunkData = textChunks[currentChunkIndex];
            const utterance = new SpeechSynthesisUtterance(chunkData.text);
            window.currentUtterance = utterance;

            let selectedLang = 'tr-TR';
            if (voiceSelect.selectedOptions.length > 0) {
                const name = voiceSelect.selectedOptions[0].getAttribute('data-name');
                const lang = voiceSelect.selectedOptions[0].getAttribute('data-lang');
                const voice = voices.find(v => v.name === name);
                if (voice) {
                    utterance.voice = voice;
                    selectedLang = voice.lang;
                } else if (lang) selectedLang = lang;
            }
            utterance.lang = selectedLang;
            utterance.rate = currentRate;

            highlightChunk(currentChunkIndex);

            utterance.onend = () => {
                if (isManualStop) return; 
                currentChunkIndex++;
                
                // Progress güncelle (kayıt modunda)
                if (isRecording && textChunks.length > 0) {
                    const progress = Math.round((currentChunkIndex / textChunks.length) * 100);
                    progressFill.style.width = progress + '%';
                    progressText.textContent = `${progress}% (${currentChunkIndex}/${textChunks.length})`;
                }
                
                playCurrentChunk(); 
            };

            utterance.onerror = (e) => {
                if (e.error === 'interrupted' || e.error === 'canceled') return;
                console.error("Hata:", e);
                if (!isManualStop) {
                    currentChunkIndex++;
                    playCurrentChunk();
                }
            };

            synth.speak(utterance);
        }

        function startReading() {
            const text = textInput.value;
            if (!text.trim()) return;

            if (!isSpeaking && !isPaused) {
                processText(text);
                currentChunkIndex = 0;
            }
            
            isManualStop = false;
            isSpeaking = true;
            isPaused = false;
            playBtn.textContent = "⏸ Duraklat";
            
            requestWakeLock();
            
            playCurrentChunk();
        }

        function togglePlay() {
            if (voices.length === 0) populateVoices();

            if (isSpeaking && !isPaused) {
                isManualStop = true;
                synth.cancel();
                isPaused = true;
                playBtn.textContent = "▶ Devam Et";
                releaseWakeLock();
            } else {
                isManualStop = false;
                isPaused = false;
                isSpeaking = true;
                playBtn.textContent = "⏸ Duraklat";
                requestWakeLock();
                playCurrentChunk();
            }
        }

        function stopSpeech() {
            isManualStop = true;
            synth.cancel();
            if (isRecording) {
                stopRecording();
            }
            resetView();
        }

        function changeSpeed(amount) {
            currentRate = Math.max(0.5, Math.min(3.0, currentRate + amount));
            currentRate = Math.round(currentRate * 10) / 10;
            localStorage.setItem('tts_speed', currentRate);

            speedDisplayStatic.textContent = currentRate.toFixed(1) + "x";
            speedOverlay.innerText = `${currentRate.toFixed(1)}x`;
            speedOverlay.style.opacity = '1';
            setTimeout(() => { speedOverlay.style.opacity = '0'; }, 800);

            if (isSpeaking && !isPaused) {
                isManualStop = true;
                synth.cancel();
                setTimeout(() => {
                    isManualStop = false;
                    playCurrentChunk();
                }, 50);
            }
        }

        // -------------------------------------
        // SES KAYIT ÖZELLİĞİ
        // -------------------------------------
        async function startRecordingAndReading() {
            const text = textInput.value.trim();
            if (!text) {
                alert('Lütfen önce metin girin!');
                return;
            }

            if (voices.length === 0) {
                populateVoices();
            }

            try {
                // Mikrofon erişimi iste
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    } 
                });
                
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'audio/webm;codecs=opus'
                });

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        audioChunks.push(e.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `metin-okuma-${Date.now()}.webm`;
                    a.click();
                    URL.revokeObjectURL(url);
                    
                    // Stream'i kapat
                    stream.getTracks().forEach(track => track.stop());
                    
                    progressOverlay.classList.remove('show');
                    downloadBtn.disabled = false;
                    isRecording = false;
                };

                // Progress göster
                progressOverlay.classList.add('show');
                progressTitle.textContent = 'Ses kaydediliyor... (Mikrofonu açık tutun)';
                progressFill.style.width = '0%';
                progressText.textContent = '0%';
                downloadBtn.disabled = true;
                isRecording = true;

                // Kaydı başlat
                mediaRecorder.start();

                // Okumayı başlat
                if (!isSpeaking && !isPaused) {
                    processText(text);
                    currentChunkIndex = 0;
                }
                
                isManualStop = false;
                isSpeaking = true;
                isPaused = false;
                
                requestWakeLock();
                playCurrentChunk();

            } catch (error) {
                console.error('Mikrofon erişim hatası:', error);
                alert('Mikrofon erişimi gerekli! Tarayıcınızın mikrofon izni verdiğinden emin olun.\n\nNot: Ses kartınızın çıkışını girişe yönlendirmeniz veya "Stereo Mix" özelliğini aktifleştirmeniz gerekebilir.');
                downloadBtn.disabled = false;
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        playBtn.addEventListener('click', () => {
            if(!isSpeaking && !isPaused) startReading();
            else togglePlay();
        });
        
        stopBtn.addEventListener('click', stopSpeech);
        downloadBtn.addEventListener('click', startRecordingAndReading);
        speedUpBtn.addEventListener('click', () => changeSpeed(0.1));
        slowDownBtn.addEventListener('click', () => changeSpeed(-0.1));

        document.addEventListener('keydown', (e) => {
            if (document.activeElement === textInput) return;
            if (e.code === 'Space') { e.preventDefault(); 
                if(!isSpeaking && !isPaused) startReading(); else togglePlay(); 
            }
            else if (e.code === 'ArrowUp') { e.preventDefault(); changeSpeed(0.1); }
            else if (e.code === 'ArrowDown') { e.preventDefault(); changeSpeed(-0.1); }
        });
    </script>
</body>
</html>
