<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Video Studio Pro - Cinematic Masterpiece</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #020617;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .video-canvas {
            aspect-ratio: 16 / 9;
            background: #000;
            position: relative;
            overflow: hidden;
            border-radius: 2rem;
            box-shadow: 0 0 100px -20px rgba(59, 130, 246, 0.4);
        }

        .slide-item {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            transform-origin: center center;
        }

        /* Video FX Animasyonları */
        .slide-item.active { opacity: 1; }
        
        .fx-zoom-in.active { animation: zoomIn 20s linear forwards; }
        .fx-zoom-out.active { animation: zoomOut 20s linear forwards; }
        .fx-pan-left.active { animation: panLeft 20s linear forwards; }
        .fx-pan-right.active { animation: panRight 20s linear forwards; }
        .fx-tilt-cw.active { animation: tiltCW 20s linear forwards; }
        .fx-tilt-ccw.active { animation: tiltCCW 20s linear forwards; }
        .fx-floating.active { animation: floating 20s ease-in-out infinite; }
        .fx-pulse.active { animation: pulse 20s ease-in-out infinite; }

        @keyframes zoomIn { 0% { transform: scale(1); } 100% { transform: scale(1.3); } }
        @keyframes zoomOut { 0% { transform: scale(1.3); } 100% { transform: scale(1); } }
        @keyframes panLeft { 0% { transform: scale(1.2) translateX(5%); } 100% { transform: scale(1.2) translateX(-5%); } }
        @keyframes panRight { 0% { transform: scale(1.2) translateX(-5%); } 100% { transform: scale(1.2) translateX(5%); } }
        @keyframes tiltCW { 0% { transform: scale(1.2) rotate(0deg); } 100% { transform: scale(1.2) rotate(3deg); } }
        @keyframes tiltCCW { 0% { transform: scale(1.2) rotate(0deg); } 100% { transform: scale(1.2) rotate(-3deg); } }
        @keyframes floating { 0% { transform: scale(1.1) translateY(0); } 50% { transform: scale(1.1) translateY(-2%); } 100% { transform: scale(1.1) translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1.05); } 50% { transform: scale(1.15); } 100% { transform: scale(1.05); } }

        .style-btn {
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.05);
            background: rgba(255,255,255,0.02);
            font-size: 10px;
            font-weight: 800;
            text-align: center;
        }

        .style-btn.selected {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.2);
        }

        .loader-ring {
            border: 3px solid #1e293b;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .progress-bar {
            height: 6px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #a855f7);
            width: 0%;
        }

        .subtitle-box {
            text-shadow: 0 4px 15px rgba(0,0,0,1);
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
        }

        .scene-card {
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .scene-card:hover {
            transform: translateY(-5px);
            border-color: rgba(59, 130, 246, 0.5);
        }

        #exportCanvas { display: none; }
        
        .mode-toggle {
            display: flex;
            background: rgba(0,0,0,0.3);
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
        }
        .mode-btn {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 800;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .mode-btn.active {
            background: #3b82f6;
            color: white;
        }
        
        /* Modal Styles */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-backdrop.open {
            opacity: 1;
            pointer-events: all;
        }
        .modal-content {
            transform: scale(0.95);
            transition: transform 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-backdrop.open .modal-content {
            transform: scale(1);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8 lg:p-12">

    <div class="max-w-7xl mx-auto">
        <header class="mb-10 flex flex-col md:flex-row justify-between items-center gap-6">
            <div>
                <h1 class="text-4xl md:text-5xl font-black tracking-tight bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500 bg-clip-text text-transparent">
                    Music Video Studio Pro

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4 space-y-5">
                <div class="glass p-5 rounded-[2rem] space-y-4">
                    <div>
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 block">01. Ses & Profil Fotoğrafı</label>
                        <input type="file" id="audioInput" accept="audio/mp3,audio/mpeg,audio/wav,audio/ogg,audio/*" class="block w-full text-xs text-slate-400 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-[9px] file:font-bold file:bg-blue-600 file:text-white" />

                        <div class="flex-1">
                            <input type="file" id="refImageInput" accept="image/*" class="block w-full text-[10px] text-slate-500 file:py-1 file:px-2 file:bg-slate-800 file:text-slate-300 rounded" />
                        </div>

                <div class="glass p-5 rounded-[2rem] space-y-4">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 block">02. Üretim Modu</label>
                    <div class="mode-toggle">

Metin(Gizli Görsel)[0-14]
(Sadece Görsel)[14-20]"></textarea>
                    
                    <div class="flex gap-2">

                <div id="statusConsole" class="hidden glass p-4 rounded-2xl border-blue-500/10 max-h-40 overflow-hidden">
                    <div id="statusLogs" class="space-y-1 text-[9px] font-mono text-slate-400"></div>

            </div>

            <div class="lg:col-span-8 space-y-6">
                <div class="video-canvas group" id="videoArea">
                    <div id="imageLayer" class="absolute inset-0">
                        <div class="h-full flex flex-col items-center justify-center text-slate-700">
                            <p class="text-sm font-semibold italic text-center px-10">AI Video Studio Pro Hazır. Tüm oranlar MP4 kaydında korunacaktır.</p>
                        </div>
                    </div>
                    
                    <div class="subtitle-box absolute bottom-0 left-0 right-0 p-12 text-center pointer-events-none">
                        <h2 id="subtitleText" class="text-xl md:text-3xl font-black text-white opacity-0 transition-all duration-500"></h2>
                    </div>

                    <div class="absolute bottom-6 left-6 right-6 flex items-center gap-5 opacity-0 group-hover:opacity-100 transition-all duration-300 bg-black/60 backdrop-blur-xl p-4 rounded-3xl border border-white/5 shadow-2xl">

                        </button>

                        <div class="flex gap-2">

                            <button id="exportBtn" class="hidden bg-red-600 hover:bg-red-500 text-white px-6 py-2.5 rounded-xl text-[10px] font-black uppercase">İndir (MP4)</button>

                </div>
            </div>
        </div>
    </div>

    <!-- Scene Editor Modal -->
    <div id="sceneModal" class="modal-backdrop">
        <div class="modal-content glass w-full max-w-4xl p-6 rounded-3xl m-4 relative flex flex-col gap-6">
            <button id="closeModal" class="absolute top-4 right-4 bg-slate-800/50 hover:bg-red-500/50 text-white p-2 rounded-full transition-all">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Preview Area -->

                    <div id="modalPreviewBox" class="aspect-video bg-black rounded-xl overflow-hidden border border-white/10 flex items-center justify-center relative shadow-2xl">
                        <!-- Image/Video will be injected here -->
                    </div>
                    <div id="modalDimensions" class="text-center text-[10px] font-mono text-slate-500 tracking-widest uppercase">
                        <!-- Dimensions will be injected here -->
                    </div>
                </div>

                <!-- Controls Area -->
                <div class="flex flex-col gap-4">
                    <div>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Prompt (Senaryo)</h3>
                        <textarea id="modalPrompt" rows="6" class="w-full bg-slate-950/50 border border-slate-800 rounded-xl p-3 text-xs text-slate-300 outline-none focus:border-blue-500 transition-colors custom-scroll"></textarea>
                        <!-- NEW BUTTON: Run with Current Prompt -->
                        <button id="modalRunPromptBtn" class="mt-3 w-full bg-emerald-600 hover:bg-emerald-500 text-white p-2.5 rounded-xl text-[10px] font-bold transition-all flex items-center justify-center gap-2 uppercase tracking-wider">
                            <span>⚡</span> Bu Prompt İle Üret
                        </button>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mt-auto">
                        <button id="modalRegenBtn" class="bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2">
                            <span>🎲</span> Yeni Fikir & Üret
                        </button>
                        <button id="modalUploadBtn" class="bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2">
                            <span>📁</span> Resim Yükle
                        </button>
                        <input type="file" id="modalFileInput" accept="image/*" class="hidden">
                    </div>
                    
                    <button id="modalRegenImageOnlyBtn" class="hidden w-full bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-xl text-xs font-bold transition-all items-center justify-center gap-2">
                        <span>🎨</span> Sadece Görüntüyü Yenile
                    </button>
                </div>
            </div>
        </div>
    </div>

    <canvas id="exportCanvas" width="1280" height="720"></canvas>
    <script src="gemini.js"></script>
    <script src="suno2video.js"></script>
    <script>
        //gemini.je'ten alınan API anahtarı:
        //const apiKey = ""; 
        /*
        //suno2video.js dosyasından alınan değişken örneği:
        const ART_STYLES = [
            { id: "watercolor", name: "Suluboya", prompt: "A world-class traditional watercolor masterpiece. Visible heavy paper texture, wet-on-wet paint bleeding effects, artistic color blooms, intricate hand-painted details. Soft brush strokes, elegant paint splatters, atmospheric and conceptual." },
            { id: "realistic", name: "Gerçekçi", prompt: "Hyper-realistic cinematic film photography, shot on IMAX 70mm, professional color grading, sharp focus, deep panoramic depth." },
            { id: "sticker", name: "Çıkartma Sanatı", prompt: "Die-cut sticker art, thick white border, vibrant colors, clean pop aesthetic, vector look." }, ...
        ];
        */

        const VIDEO_FX = ["fx-zoom-in", "fx-zoom-out", "fx-pan-left", "fx-pan-right", "fx-tilt-cw", "fx-tilt-ccw", "fx-floating", "fx-pulse"];

        let scenes = [];
        let selectedStyle = ART_STYLES[0];
        let productionMode = "image"; 
        let audioDuration = 0;
        let isPlaying = false;
        let activeIdx = -1;
        let referenceImageBase64 = null;
        let currentModalSceneId = null;

        const el = {
            audio: document.getElementById('audioPlayer'),
            audioInput: document.getElementById('audioInput'),
            refInput: document.getElementById('refImageInput'),
            refPreview: document.getElementById('refPreview'),
            lyrics: document.getElementById('lyricsInput'),
            styles: document.getElementById('styleGrid'),
            mood: document.getElementById('moodInput'),
            grid: document.getElementById('scenesGrid'),
            play: document.getElementById('playBtn'),
            logs: document.getElementById('statusLogs'),
            time: document.getElementById('timeDisplay'),
            progress: document.getElementById('progressBar'),
            subtitle: document.getElementById('subtitleText'),
            layers: document.getElementById('imageLayer'),
            reset: document.getElementById('resetBtn'),
            generateAll: document.getElementById('generateAllBtn'),
            exportBtn: document.getElementById('exportBtn'),
            scCount: document.getElementById('scCount'),
            renderStatus: document.getElementById('renderStatus'),
            exportCanvas: document.getElementById('exportCanvas'),
            modeImage: document.getElementById('modeImage'),
            modeVideo: document.getElementById('modeVideo'),
            modeVideoAI: document.getElementById('modeVideoAI'),
            
            // Modal Elements
            modal: document.getElementById('sceneModal'),
            modalClose: document.getElementById('closeModal'),
            modalPreview: document.getElementById('modalPreviewBox'),
            modalPrompt: document.getElementById('modalPrompt'),
            modalRegenBtn: document.getElementById('modalRegenBtn'),
            modalRunPromptBtn: document.getElementById('modalRunPromptBtn'),
            modalUploadBtn: document.getElementById('modalUploadBtn'),
            modalFileInput: document.getElementById('modalFileInput'),
            modalDimensions: document.getElementById('modalDimensions'),
            modalRegenImageOnlyBtn: document.getElementById('modalRegenImageOnlyBtn')
        };

        function initStyles() {
            el.styles.innerHTML = '';
            ART_STYLES.forEach(s => {
                const b = document.createElement('div');
                b.className = `style-btn p-2 rounded-xl ${s.id === selectedStyle.id ? 'selected' : ''}`;
                b.innerText = s.name;
                b.onclick = () => {
                    document.querySelectorAll('.style-btn').forEach(x => x.classList.remove('selected'));
                    b.classList.add('selected');
                    selectedStyle = s;
                };
                el.styles.appendChild(b);
            });
        }

        function setMode(mode) {
            productionMode = mode;
            [el.modeImage, el.modeVideo, el.modeVideoAI].forEach(b => b.classList.remove('active'));
            if(mode === 'image') el.modeImage.classList.add('active');
            if(mode === 'video') el.modeVideo.classList.add('active');
            if(mode === 'videoAI') el.modeVideoAI.classList.add('active');
            log(`Mod seçildi: ${mode.toUpperCase()}`);
        }

        el.modeImage.onclick = () => setMode('image');
        el.modeVideo.onclick = () => setMode('video');
        el.modeVideoAI.onclick = () => setMode('videoAI');

        function log(msg, type = 'info') {
            document.getElementById('statusConsole').classList.remove('hidden');
            const d = document.createElement('div');
            d.innerHTML = `<span class="opacity-30 mr-2">${new Date().toLocaleTimeString()}</span> <span class="${type === 'err' ? 'text-red-400 font-bold' : 'text-blue-400'}">${msg}</span>`;
            el.logs.appendChild(d);
            el.logs.scrollTop = el.logs.scrollHeight;
        }

        async function apiCall(url, body, retries = 3) {
            const delays = [1000, 2000, 4000];
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(`${url}?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({ error: { message: `HTTP ${res.status}` } }));
                        throw new Error(err.error?.message || `HTTP ${res.status}`);
                    }
                    return await res.json();
                } catch (e) {
                    if (i === retries - 1) throw e;
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }
        }

        el.audioInput.onchange = (e) => {
            const f = e.target.files[0];
            if (!f) return;
            
            const checkAndSetDuration = () => {
                if (el.audio.duration && el.audio.duration !== Infinity && !isNaN(el.audio.duration) && el.audio.duration > 0) {
                    audioDuration = el.audio.duration;
                    el.time.innerText = `00:00 / ${fmt(audioDuration)}`;
                    log("Müzik Hazır: " + fmt(audioDuration));
                    return true;
                }
                return false;
            };

            el.audio.onloadedmetadata = checkAndSetDuration;
            el.audio.oncanplaythrough = checkAndSetDuration;
            el.audio.ondurationchange = checkAndSetDuration;
            
            const url = URL.createObjectURL(f);
            el.audio.src = url;
            el.audio.load();

            let attempts = 0;
            const pollDuration = setInterval(() => {
                attempts++;
                if (checkAndSetDuration() || attempts > 50) clearInterval(pollDuration);
            }, 100);
        };

        el.refInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => { 
                referenceImageBase64 = event.target.result.split(',')[1]; 
                el.refPreview.innerHTML = `<img src="${event.target.result}" class="w-full h-full object-cover rounded-lg">`; 
            };
            reader.readAsDataURL(file);
        };

        function fmt(s) { 
            if(!s || isNaN(s)) return "00:00";
            const m = Math.floor(s/60); 
            const sec = Math.floor(s%60); 
            return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; 
        }

        // --- UPDATED PARSING & PLANNING LOGIC ---
        document.getElementById('planBtn').onclick = async () => {
            let txt = el.lyrics.value.trim();
            const mood = el.mood.value.trim();
            
            if (el.audioInput.files.length === 0) return log("Lütfen bir ses dosyası (MP3/WAV) seçin!", "err");
            if (!txt) return log("Lütfen şarkı sözlerini ve zamanlamaları girin!", "err");

            if (!audioDuration || audioDuration === 0) {
                if (el.audio.duration && !isNaN(el.audio.duration) && el.audio.duration !== Infinity && el.audio.duration > 0) {
                    audioDuration = el.audio.duration;
                    el.time.innerText = `00:00 / ${fmt(audioDuration)}`;
                } else {
                    log("Bilgi: Ses süresi mobilde 'Oynat'a basınca güncellenecek. İşlem devam ediyor...", "info");
                    audioDuration = 200;
                }
            }

            log("Senaryo kurgulanıyor...");
            
            // 1. EXTRACT MASTER PROMPT {}
            let masterPrompt = "";
            const masterMatch = txt.match(/\{([\s\S]*?)\}/);
            if (masterMatch) {
                masterPrompt = masterMatch[1].trim();
                // Remove the master prompt from the text so it doesn't interfere with parsing
                txt = txt.replace(masterMatch[0], "");
                log(`Master Prompt Algılandı: ${masterPrompt}`);
            }

            // 2. PARSE LINES
            const lines = txt.split('\n');
            const parsed = [];

            lines.forEach((l, index) => {
                // Find timestamp [start-end]
                const timeMatch = l.match(/\[(\d+)-(\d+)\]/);
                
                if (timeMatch) {
                    const rawLine = l.replace(timeMatch[0], "").trim(); // Remove timestamp part
                    let caption = "";
                    let visualContext = "";
                    let showSubtitle = true;

                    // Check for specific visual prompt in parenthesis ()
                    const visualMatch = rawLine.match(/\((.*?)\)/);

                    if (visualMatch) {
                        // Priority: Content inside () is for the Visual Prompt
                        visualContext = visualMatch[1].trim();
                        
                        // Subtitle is the text WITHOUT the () part
                        caption = rawLine.replace(visualMatch[0], "").trim();
                    } else {
                        // No (), use full text for both
                        visualContext = rawLine;
                        caption = rawLine;
                    }

                    // Special Case: If the ORIGINAL text was JUST (...) e.g. "(Waves)" -> Subtitle should be hidden/empty
                    if (rawLine.startsWith('(') && rawLine.endsWith(')')) {
                        showSubtitle = false;
                        caption = "";
                    }

                    // Push formatted object
                    parsed.push({ 
                        id: index, 
                        caption: caption, 
                        visualContext: visualContext, // Send this to Gemini for prompt gen
                        start: parseFloat(timeMatch[1]), 
                        end: parseFloat(timeMatch[2]), 
                        showSubtitle: showSubtitle && caption.length > 0 
                    });
                }
            });

            try {
                // Modified System Prompt to include Master Prompt logic
                const systemPrompt = `Sen bir klip yönetmenisin. Her satır için 5-6 CÜMLELİK edebi bir PARAGRAF PROMPT oluştur.
                KURALLAR:
                1. GENİŞ AÇI: ASLA yakın çekim yapma. Hep "Extreme wide angle panorama" kurgula.
                2. SEMBOLİZM: Aşağıda verilen "Visual Instruction" kısmını devasa manzaralara dök.
                3. STİL: "${selectedStyle.name}" stilini işle.
                4. MOOD: "${mood || 'Epic'}" ruh halini ekle.
                ${masterPrompt ? `5. GLOBAL KURAL (MASTER PROMPT): "${masterPrompt}". Bu kuralı ve temayı HER sahneye mutlaka uygula.` : ''}
                ÇIKTI: JSON objesi döndür. Key: index, Value: 5-6 cümlelik İngilizce prompt.`;

                // Prepare input for Gemini: ID + Visual Instruction
                const inputList = parsed.map(p => `ID ${p.id}: Visual Instruction: "${p.visualContext}"`).join(' | ');

                const data = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', {
                    contents: [{ parts: [{ text: "Senaryoyu oluştur." }] }],
                    systemInstruction: { parts: [{ text: systemPrompt + "\nLİSTE: " + inputList }] },
                    generationConfig: { responseMimeType: "application/json" }
                });

                const prompts = JSON.parse(data.candidates[0].content.parts[0].text);
                
                scenes = parsed.map(p => ({ 
                    ...p, 
                    v_prompt: prompts[p.id] || p.visualContext, // Use generated prompt or fallback
                    source: null, 
                    type: productionMode,
                    fx: VIDEO_FX[Math.floor(Math.random() * VIDEO_FX.length)]
                }));

                renderGrid();
                el.generateAll.classList.remove('hidden');
                log("Senaryo planlaması tamamlandı.");
            } catch (e) { log("Planlama hatası: " + e.message, "err"); }
        };

        function renderGrid() {
            el.grid.innerHTML = '';
            el.scCount.innerText = `${scenes.length}`;
            scenes.forEach((s) => {
                const c = document.createElement('div');
                c.className = "scene-card bg-slate-950 rounded-2xl border border-white/5 overflow-hidden";
                
                c.onclick = () => openSceneModal(s.id);
                
                c.innerHTML = `
                    <div id="thumb-${s.id}" class="aspect-video bg-black flex items-center justify-center text-[8px] text-slate-700 p-2 text-center overflow-hidden">
                        ${s.source ? (s.type === 'videoAI' ? `<video src="${s.source}" class="w-full h-full object-cover" muted loop autoplay></video>` : `<img src="${s.source}" class="w-full h-full object-cover">`) : '🎨 Hazır'}
                    </div>
                    <div class="p-3 bg-black/20 text-[9px]">
                        <div class="font-black ${s.showSubtitle ? 'text-blue-400' : 'text-purple-400'} mb-1">${s.start}-${s.end}s ${!s.showSubtitle ? '(Sözsüz)' : ''}</div>
                        <div class="text-slate-300 truncate font-semibold">${s.caption || '<span class="italic opacity-50">Sadece Görsel</span>'}</div>
                    </div>
                `;
                el.grid.appendChild(c);
            });
        }

        function openSceneModal(id) {
            const scene = scenes.find(s => s.id === id);
            if(!scene) return;
            
            currentModalSceneId = id;
            el.modalPrompt.value = scene.v_prompt || "";
            el.modal.classList.add('open');
            
            updateModalPreview(scene);
        }

        function updateModalPreview(scene) {
            el.modalPreview.innerHTML = "";
            el.modalDimensions.innerHTML = "BOYUTLAR HESAPLANIYOR...";
            
            if (scene.source) {
                if (scene.type === 'videoAI') {
                    const vid = document.createElement('video');
                    vid.src = scene.source;
                    vid.className = "w-full h-full object-contain";
                    vid.controls = true;
                    vid.autoplay = true;
                    vid.loop = true;
                    
                    vid.onloadedmetadata = () => {
                        el.modalDimensions.innerHTML = `VIDEO: ${vid.videoWidth} x ${vid.videoHeight}px | SÜRE: ${vid.duration.toFixed(1)}s`;
                    };
                    
                    el.modalPreview.appendChild(vid);
                } else {
                    const img = document.createElement('img');
                    img.src = scene.source;
                    img.className = "w-full h-full object-contain";
                    
                    img.onload = () => {
                        el.modalDimensions.innerHTML = `RESİM: ${img.naturalWidth} x ${img.naturalHeight}px`;
                    };
                    
                    el.modalPreview.appendChild(img);
                }
            } else {
                el.modalPreview.innerHTML = `<span class="text-slate-600 text-xs font-bold">GÖRÜNTÜ YOK</span>`;
                el.modalDimensions.innerHTML = "-";
            }
        }

        el.modalClose.onclick = () => {
            el.modal.classList.remove('open');
            currentModalSceneId = null;
        };
        
        el.modal.onclick = (e) => {
            if(e.target === el.modal) {
                el.modal.classList.remove('open');
                currentModalSceneId = null;
            }
        };

        el.modalRunPromptBtn.onclick = async () => {
             if (currentModalSceneId === null) return;
             const scene = scenes.find(s => s.id === currentModalSceneId);
             
             const userPrompt = el.modalPrompt.value.trim();
             if(!userPrompt) return alert("Lütfen bir prompt yazın.");
             
             scene.v_prompt = userPrompt;
             
             el.modalPreview.innerHTML = '<div class="loader-ring"></div>';
             el.modalDimensions.innerText = "YENİLENİYOR...";
             
             log(`Sahne ${currentModalSceneId} için manuel prompt ile üretim başlatıldı...`);
             await generateSingleScene(currentModalSceneId);
        };

        el.modalRegenBtn.onclick = async () => {
            if (currentModalSceneId === null) return;
            const scene = scenes.find(s => s.id === currentModalSceneId);
            
            el.modalPreview.innerHTML = '<div class="loader-ring"></div>';
            el.modalDimensions.innerText = "YENİLENİYOR...";
            
            log(`Sahne ${currentModalSceneId} için yeni AI prompt üretiliyor...`);
            
            try {
                // Use visualContext instead of caption for better regeneration based on user intent
                const data = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', {
                    contents: [{ parts: [{ text: `Original Visual Intent: ${scene.visualContext}. Öncekinden farklı yeni bir 5-6 cümlelik GENİŞ AÇILI prompt yaz. Stil: ${selectedStyle.name}.` }] }]
                });
                
                const newPrompt = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (newPrompt) {
                    scene.v_prompt = newPrompt;
                    el.modalPrompt.value = newPrompt;
                }
                
                await generateSingleScene(currentModalSceneId);
                
            } catch (e) {
                log("Yenileme hatası: " + e.message, "err");
                updateModalPreview(scene);
            }
        };

        el.modalUploadBtn.onclick = () => el.modalFileInput.click();
        
        el.modalFileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file || currentModalSceneId === null) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const scene = scenes.find(s => s.id === currentModalSceneId);
                scene.source = event.target.result;
                scene.type = 'image';
                
                const thumb = document.getElementById(`thumb-${scene.id}`);
                if(thumb) thumb.innerHTML = `<img src="${scene.source}" class="w-full h-full object-cover">`;
                
                updateModalPreview(scene);
                buildVideoLayers();
                
                log("Resim manuel olarak güncellendi.");
            };
            reader.readAsDataURL(file);
            el.modalFileInput.value = '';
        };

        async function generateSingleScene(id) {
            const scene = scenes.find(s => s.id === id);
            const thumb = document.getElementById(`thumb-${id}`);
            if(thumb) thumb.innerHTML = '<div class="loader-ring"></div>';
            
            try {
                let finalSource;
                if (scene.type === "videoAI") {
                    const vPrompt = `MANDATORY: Generate a high quality 5-second cinematic video clip in the EXACT STYLE OF ${selectedStyle.name}. Extreme wide angle panorama. Scenario: ${scene.v_prompt}`;
                    const vData = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', {
                        contents: [{ parts: [
                            { text: vPrompt }, 
                            referenceImageBase64 ? { inlineData: { mimeType: "image/png", data: referenceImageBase64 } } : null
                        ].filter(p => p !== null)}],
                        generationConfig: { responseModalities: ['VIDEO'] }
                    });
                    const vPart = vData.candidates?.[0]?.content?.parts?.find(p => p.inlineData && p.inlineData.mimeType.startsWith('video/'));
                    if (!vPart) throw new Error("Video üretilemedi.");
                    finalSource = `data:${vPart.inlineData.mimeType};base64,${vPart.inlineData.data}`;
                } else if (referenceImageBase64) {
                    const i2iData = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent', {
                        contents: [{ parts: [
                            { text: `A professional concept art masterpiece in the EXACT STYLE OF ${selectedStyle.name}. Extreme wide angle panorama landscape. The person from the reference image is integrated as a small artistic figure. Paragraf: ${scene.v_prompt}` }, 
                            { inlineData: { mimeType: "image/png", data: referenceImageBase64 } }
                        ]}],
                        generationConfig: { responseModalities: ['IMAGE'] }
                    });
                    const imgBase64 = i2iData.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                    finalSource = `data:image/png;base64,${imgBase64}`;
                } else {
                    const t2iData = await apiCall('https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict', {
                        instances: { prompt: `${selectedStyle.prompt}, Extreme wide angle cinematic view, panoramic landscape. ${scene.v_prompt}` },
                        parameters: { sampleCount: 1 }
                    });
                    finalSource = `data:image/png;base64,${t2iData.predictions[0].bytesBase64Encoded}`;
                }
                
                scene.source = finalSource;
                scene.fx = VIDEO_FX[Math.floor(Math.random() * VIDEO_FX.length)];
                
                if(thumb) {
                    thumb.innerHTML = scene.type === 'videoAI' ? `<video src="${finalSource}" class="w-full h-full object-cover" muted loop autoplay></video>` : `<img src="${finalSource}" class="w-full h-full object-cover">`;
                }
                
                if (currentModalSceneId === id) {
                    updateModalPreview(scene);
                }

                buildVideoLayers();
            } catch (e) { 
                if(thumb) thumb.innerHTML = '<span class="text-red-500 font-bold text-[10px]">HATA</span>'; 
                log("Hata: " + e.message, "err"); 
                if (currentModalSceneId === id) {
                    el.modalPreview.innerHTML = '<span class="text-red-500 font-bold">Üretim Hatası</span>';
                }
            }
        }

        el.generateAll.onclick = async () => {
            el.generateAll.disabled = true;
            for (let i = 0; i < scenes.length; i++) { await generateSingleScene(scenes[i].id); }
            log("Prodüksiyon tamamlandı!", "success");
            el.generateAll.disabled = false; el.play.disabled = false; el.exportBtn.classList.remove('hidden');
        };

        function buildVideoLayers() {
            el.layers.innerHTML = '';
            scenes.sort((a,b) => a.start - b.start).forEach(s => {
                if (s.source) {
                    let element;
                    if(s.type === 'videoAI') {
                        element = document.createElement('video');
                        element.muted = true;
                        element.loop = true;
                        element.playsInline = true;
                    } else {
                        element = document.createElement('img');
                    }
                    element.src = s.source;
                    element.className = `slide-item ${s.type === 'video' ? s.fx : ''}`;
                    element.id = `v-item-${s.id}`;
                    el.layers.appendChild(element);
                }
            });
        }

        el.play.onclick = () => {
            if (audioDuration === 0 || audioDuration === 200) {
                if(el.audio.duration && !isNaN(el.audio.duration)) {
                    audioDuration = el.audio.duration;
                    el.time.innerText = `00:00 / ${fmt(audioDuration)}`;
                }
            }
            
            if (isPlaying) { el.audio.pause(); document.getElementById('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>'; }
            else { el.audio.play(); document.getElementById('playIcon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; }
            isPlaying = !isPlaying;
        };

        el.audio.ontimeupdate = () => {
            const now = el.audio.currentTime;
            el.progress.style.width = `${(now / audioDuration) * 100}%`;
            el.time.innerText = `${fmt(now)} / ${fmt(audioDuration)}`;
            const activeScene = scenes.find(s => now >= s.start && now < s.end);
            if (activeScene && activeIdx !== activeScene.id) { activeIdx = activeScene.id; updateVisuals(activeIdx); }
        };

        function updateVisuals(id) {
            scenes.forEach(s => {
                const item = document.getElementById(`v-item-${s.id}`);
                if (item) {
                    if (s.id === id) {
                        item.classList.add('active');
                        if(s.type === 'videoAI') {
                            item.currentTime = (el.audio.currentTime - s.start) % (item.duration || 5);
                            item.play().catch(() => {});
                        }
                    } else {
                        const sceneId = s.id;
                        setTimeout(() => {
                            if (activeIdx !== sceneId) {
                                item.classList.remove('active');
                                if(s.type === 'videoAI') item.pause();
                            }
                        }, 1500); 
                    }
                }
            });
            const current = scenes.find(s => s.id === id);
            if (current && current.showSubtitle) { el.subtitle.innerText = current.caption; el.subtitle.style.opacity = 1; } 
            else { el.subtitle.style.opacity = 0; }
        }

        function drawCoverImage(ctx, item, x, y, w, h) {
            const imgW = item.naturalWidth || item.videoWidth || 1280;
            const imgH = item.naturalHeight || item.videoHeight || 720;
            const imgRatio = imgW / imgH;
            const targetRatio = w / h;
            
            let drawW, drawH;
            
            if (imgRatio > targetRatio) {
                drawH = h;
                drawW = h * imgRatio;
            } else {
                drawW = w;
                drawH = w / imgRatio;
            }
            
            ctx.drawImage(item, -drawW / 2, -drawH / 2, drawW, drawH);
        }

        el.exportBtn.onclick = async () => {
            log("Video kaydediliyor... En boy oranı optimize ediliyor.");
            const ctx = el.exportCanvas.getContext('2d');
            const stream = el.exportCanvas.captureStream(30);
            const audioCtx = new AudioContext();
            const sourceNode = audioCtx.createMediaElementSource(el.audio);
            const dest = audioCtx.createMediaStreamDestination();
            sourceNode.connect(dest); sourceNode.connect(audioCtx.destination);
            const recorder = new MediaRecorder(new MediaStream([...stream.getVideoTracks(), ...dest.stream.getAudioTracks()]), { mimeType: 'video/webm' });
            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/mp4' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `AI_Clip_Pro_HD_${Date.now()}.mp4`;
                a.click();
                log("Video indirildi!");
            };
            el.audio.currentTime = 0; recorder.start(); el.audio.play();
            const loop = () => {
                const now = el.audio.currentTime;
                const scene = scenes.find(s => now >= s.start && now < s.end);
                
                ctx.fillStyle = '#000'; 
                ctx.fillRect(0, 0, 1280, 720);
                
                if (scene && scene.source) {
                    const item = document.getElementById(`v-item-${scene.id}`);
                    if (item) {
                        const elapsed = now - scene.start;
                        const total = scene.end - scene.start;
                        const progress = elapsed / total;
                        
                        ctx.save();
                        
                        let scale = 1; let tx = 0; let ty = 0; let rot = 0;
                        
                        if (scene.type === 'video') {
                            if(scene.fx === 'fx-zoom-in') scale = 1 + progress * 0.3;
                            if(scene.fx === 'fx-zoom-out') scale = 1.3 - progress * 0.3;
                            if(scene.fx === 'fx-pan-left') { scale = 1.2; tx = 128 - (progress * 256); }
                            if(scene.fx === 'fx-pan-right') { scale = 1.2; tx = -128 + (progress * 256); }
                            if(scene.fx === 'fx-tilt-cw') { scale = 1.2; rot = progress * 0.05; }
                            if(scene.fx === 'fx-tilt-ccw') { scale = 1.2; rot = -progress * 0.05; }
                            if(scene.fx === 'fx-floating') { scale = 1.1; ty = Math.sin(progress * Math.PI * 2) * 20; }
                            if(scene.fx === 'fx-pulse') scale = 1.1 + Math.sin(progress * Math.PI * 2) * 0.05;
                            
                            ctx.translate(640 + tx, 360 + ty);
                            ctx.rotate(rot);
                            ctx.scale(scale, scale);
                            drawCoverImage(ctx, item, 0, 0, 1280, 720);
                        } else if(scene.type === 'videoAI') {
                            const vDur = item.duration || 5;
                            item.currentTime = elapsed % vDur;
                            ctx.translate(640, 360);
                            drawCoverImage(ctx, item, 0, 0, 1280, 720);
                        } else {
                            ctx.translate(640, 360);
                            drawCoverImage(ctx, item, 0, 0, 1280, 720);
                        }
                        
                        ctx.restore();
                        
                        if (scene.showSubtitle) {
                            ctx.fillStyle = 'rgba(0,0,0,0.6)'; 
                            ctx.fillRect(0, 600, 1280, 120);
                            ctx.fillStyle = '#FFF'; 
                            ctx.font = 'bold 36px Outfit'; 
                            ctx.textAlign = 'center';
                            ctx.fillText(scene.caption, 640, 670);
                        }
                    }
                }
                
                if (now < audioDuration && recorder.state === "recording") requestAnimationFrame(loop);
                else { if (recorder.state === "recording") recorder.stop(); el.audio.pause(); }
            };
            loop();
        };

        el.reset.onclick = () => { location.reload(); };

        // Ensure initStyles runs after load
        window.addEventListener('load', () => {
            initStyles();
            log("Sistem hazır.", "success");
        });
    </script>
</body>
</html>
